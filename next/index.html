<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SQUAD.GG next — 시험판</title>
<!-- 🧪 [2026-07-30] React 시험판.
     본 사이트(index.html)는 건드리지 않고 이 주소에서만 돌린다. 같은 구글 시트를 읽으므로 데이터는 동일.
     빌드 도구 없이 CDN 모듈만 쓴다 — 저장소에 넣고 새로고침하면 끝(무료·무설치).
     목적: '움직임이 있는 화면'이 우리 데이터로 어떻게 보이는지 눈으로 비교하기. -->
<style>
  :root{
    --bg:#0f1116; --bg2:#151822; --card:#181c26; --line:#242a38;
    --tx:#e8ecf4; --mut:#8e97ab; --accent:#5b8cff; --gold:#ffd24a;
    --win:#4ea1ff; --lose:#ff6b81;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#1b2030 0%,var(--bg) 60%);
    color:var(--tx);font-family:"Malgun Gothic",-apple-system,system-ui,sans-serif}
  a{color:inherit}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px}

  header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 0 18px}
  .logo{font-size:22px;font-weight:900;letter-spacing:-.5px}
  .logo span{color:var(--accent)}
  .pill{font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  .search{margin-left:auto;position:relative}
  .search input{background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:12px;
    padding:10px 14px;width:260px;font-size:14px;outline:none;transition:border-color .18s,box-shadow .18s}
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,140,255,.15)}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;
    animation:up .4s cubic-bezier(.2,.9,.3,1) both}
  .kpi .k{font-size:12.5px;color:var(--mut)}
  .kpi .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}

  .grid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}
  @media (max-width:900px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;
    animation:up .45s cubic-bezier(.2,.9,.3,1) both;transition:transform .18s,box-shadow .18s,border-color .18s}
  .card:hover{transform:translateY(-2px);border-color:#2f3850;box-shadow:0 10px 26px rgba(0,0,0,.32)}
  .card h2{margin:2px 0 12px;font-size:16px;display:flex;align-items:center;gap:8px}
  .card h2 small{color:var(--mut);font-weight:400;font-size:12.5px}

  table{width:100%;border-collapse:collapse}
  th,td{padding:9px 8px;font-size:14px;text-align:left;border-bottom:1px solid var(--line)}
  th{color:var(--mut);font-size:12.5px;font-weight:600;cursor:pointer;user-select:none;white-space:nowrap}
  th:hover{color:var(--tx)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tbody tr{transition:background .12s}
  tbody tr:hover{background:rgba(255,255,255,.045)}
  .name{font-weight:600;cursor:pointer}
  .name:hover{color:var(--accent)}

  .bar{height:6px;background:#20263a;border-radius:99px;overflow:hidden;min-width:70px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#3c6fe0,#5b8cff);
    transition:width .6s cubic-bezier(.3,1,.4,1)}
  .score{display:inline-flex;align-items:baseline;gap:2px}
  .score b{color:var(--gold);font-size:16px}
  .score s{text-decoration:none;color:var(--mut);font-size:11px}

  .rowin{animation:up .34s cubic-bezier(.2,.9,.3,1) both}
  @keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .skel{height:14px;border-radius:6px;background:linear-gradient(90deg,#1c2130,#252c3f,#1c2130);
    background-size:200% 100%;animation:sh 1.1s linear infinite}
  @keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
  /* 전적 카드 */
  .back{background:none;border:1px solid var(--line);color:var(--mut);border-radius:10px;
    padding:7px 12px;font-size:13px;cursor:pointer;transition:border-color .15s,color .15s}
  .back:hover{border-color:var(--accent);color:var(--tx)}
  .phead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .pname{font-size:24px;font-weight:800}
  .tierchip{font-size:12.5px;font-weight:700;border-radius:8px;padding:3px 9px;
    background:rgba(91,140,255,.14);border:1px solid rgba(91,140,255,.4);color:#9cc0ff}
  .strip{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
  .cell{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:7px 13px;min-width:78px}
  .cell .k{font-size:11.5px;color:var(--mut)}
  .cell .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
  .champ{width:38px;height:38px;border-radius:9px;background:#20263a;object-fit:cover;flex:none}
  .mrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .mcard{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:12px;margin-bottom:7px;
    border-left:3px solid var(--line);background:var(--bg2);animation:up .3s cubic-bezier(.2,.9,.3,1) both}
  .mcard.w{border-left-color:var(--win);background:linear-gradient(90deg,rgba(78,161,255,.10),transparent 60%)}
  .mcard.l{border-left-color:var(--lose);background:linear-gradient(90deg,rgba(255,107,129,.10),transparent 60%)}
  .tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px}
  .tag.mvp{background:rgba(255,210,74,.16);color:var(--gold)}
  .tag.ace{background:rgba(78,161,255,.16);color:var(--win)}
  .tag.bad{background:rgba(255,107,129,.16);color:var(--lose)}
  /* 배너(주 챔피언 스플래시) */
  .banner{position:relative;height:190px;border-radius:18px;overflow:hidden;border:1px solid var(--line);
    background:#0c0f16;animation:up .45s cubic-bezier(.2,.9,.3,1) both}
  .banner img{width:100%;height:100%;object-fit:cover;object-position:center 22%;
    transform:scale(1.04);transition:transform 6s ease-out;opacity:.72}
  .banner:hover img{transform:scale(1.10)}
  .banner .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,12,18,.15),rgba(15,17,22,.92) 78%)}
  .banner .in{position:absolute;left:16px;right:16px;bottom:12px;display:flex;align-items:flex-end;gap:12px}
  .banner .nm{font-size:26px;font-weight:900;text-shadow:0 2px 14px rgba(0,0,0,.6)}
  .grade{position:absolute;right:14px;top:14px;width:46px;height:46px;border-radius:14px;display:grid;
    place-items:center;font-size:22px;font-weight:900;color:#0d1017;
    box-shadow:0 6px 18px rgba(0,0,0,.35);animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
  .big{margin-left:auto;text-align:right;line-height:1}
  .big b{font-size:32px;font-weight:900;font-variant-numeric:tabular-nums}
  .big s{text-decoration:none;color:var(--mut);font-size:13px}
  .trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
  .trio>div{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:11px 12px;text-align:center}
  .trio .k{font-size:12px;color:var(--mut)}
  .trio .v{font-size:20px;font-weight:800;margin-top:2px}
  .trio .s{font-size:11.5px;color:var(--mut)}
  .tagchip{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 11px;
    background:rgba(160,120,255,.16);border:1px solid rgba(160,120,255,.45);color:#cbb2ff}
  .itemrow{display:flex;gap:6px;flex-wrap:wrap}
  .itm{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#20263a}
  .resbadge{display:inline-block;font-size:11.5px;font-weight:800;border-radius:7px;padding:3px 8px;margin:0 5px 5px 0}
  .resbadge.w{background:rgba(78,161,255,.18);color:var(--win)}
  .resbadge.l{background:rgba(255,107,129,.18);color:var(--lose)}
  .note{color:var(--mut);font-size:12.5px;line-height:1.7;margin-top:14px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"><div class="wrap"><div class="card"><div class="skel" style="width:40%"></div></div></div></div>

<script type="module">
import { h, render } from "https://esm.sh/preact@10.22.0";
import { useState, useEffect, useMemo } from "https://esm.sh/preact@10.22.0/hooks";
import htm from "https://esm.sh/htm@3.1.1";
const html = htm.bind(h);

const SHEET_ID = "10j2QBdXiyL0_UGKLMDcndieXD7jeMGxVHqH3nj6gJnU";
const GID_RIFT = "1926038351";

/* 구글 시트 gviz 는 CORS 를 안 열어줘서 본 사이트도 JSONP 로 읽는다 — 같은 방식을 쓴다. */
function loadTab(gid) {
  return new Promise((res) => {
    const cb = "__nx" + Math.floor(Math.random() * 1e9);
    const s = document.createElement("script");
    const done = (rows) => { try { delete window[cb]; } catch (e) {} s.remove(); res(rows); };
    window[cb] = (r) => {
      const cols = (r.table.cols || []).map((c) => (c.label || "").trim());
      const out = (r.table.rows || []).map((row) => {
        const o = {};
        (row.c || []).forEach((c, i) => { o[cols[i]] = c == null ? "" : (c.f != null ? c.f : c.v); });
        return o;
      });
      done(out);
    };
    s.onerror = () => done([]);
    s.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${gid}&headers=1&tqx=out:json;responseHandler:${cb}`;
    document.body.appendChild(s);
    setTimeout(() => done([]), 15000);
  });
}

/* 시트 이름으로 읽기(gid 를 모르는 탭용) */
function loadNamed(tab) {
  return new Promise((res) => {
    const cb = "__nn" + Math.floor(Math.random() * 1e9);
    const s = document.createElement("script");
    const done = (rows) => { try { delete window[cb]; } catch (e) {} s.remove(); res(rows); };
    window[cb] = (r) => {
      const cols = (r.table.cols || []).map((c) => (c.label || "").trim());
      done((r.table.rows || []).map((row) => {
        const o = {}; (row.c || []).forEach((c, i) => { o[cols[i]] = c == null ? "" : (c.f != null ? c.f : c.v); }); return o;
      }));
    };
    s.onerror = () => done([]);
    s.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(tab)}&headers=1&tqx=out:json;responseHandler:${cb}`;
    document.body.appendChild(s);
    setTimeout(() => done([]), 15000);
  });
}

/* 챔피언 초상화 — 라이브 클라이언트 아트(Community Dragon). 이름→숫자ID 는 Data Dragon 에서 받는다. */
async function loadChampIcons() {
  try {
    const v = await (await fetch("https://ddragon.leagueoflegends.com/api/versions.json")).json();
    const d = await (await fetch(`https://ddragon.leagueoflegends.com/cdn/${v[0]}/data/ko_KR/champion.json`)).json();
    const m = {};
    for (const k in d.data) {
      const c = d.data[k];
      const url = `https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/champion-icons/${c.key}.png`;
      m[c.name] = url; m[c.name.replace(/\s/g, "")] = url;
      const sp = `https://ddragon.leagueoflegends.com/cdn/img/champion/splash/${c.id}_0.jpg`;
      SPLASH[c.name] = sp; SPLASH[c.name.replace(/\s/g, "")] = sp;
    }
    return m;
  } catch (e) { return {}; }
}

/* 챔피언 스플래시(배너용) — 영문 키가 필요하다. loadChampIcons 에서 함께 만든다. */
let SPLASH = {};

/* 레이더 차트 — 라이브러리 없이 SVG 다각형. axes: [{k,label,v(0~100)}] */
function Radar({ axes, size = 190 }) {
  const cx = size / 2, cy = size / 2, R = size / 2 - 26;
  const pt = (i, r) => {
    const ang = -Math.PI / 2 + (i * 2 * Math.PI) / axes.length;
    return [cx + Math.cos(ang) * r, cy + Math.sin(ang) * r];
  };
  const ring = (f) => axes.map((_, i) => pt(i, R * f).join(",")).join(" ");
  const poly = axes.map((a, i) => pt(i, R * Math.max(0.04, (a.v || 0) / 100)).join(",")).join(" ");
  return html`<svg width=${size} height=${size} viewBox=${`0 0 ${size} ${size}`}>
    ${[1, 0.75, 0.5, 0.25].map((f) => html`<polygon points=${ring(f)} fill="none" stroke="#2a3145" stroke-width="1" />`)}
    ${axes.map((_, i) => { const [x, y] = pt(i, R); return html`<line x1=${cx} y1=${cy} x2=${x} y2=${y} stroke="#232a3c" />`; })}
    <polygon points=${poly} fill="rgba(160,120,255,.28)" stroke="#a878ff" stroke-width="2"
      style="transition:all .6s cubic-bezier(.3,1,.4,1)" />
    ${axes.map((a, i) => {
      const [x, y] = pt(i, R + 14);
      return html`<text x=${x} y=${y} fill="#8e97ab" font-size="11" text-anchor="middle" dominant-baseline="middle">${a.label}</text>`;
    })}
  </svg>`;
}

const GRADES = [[90, "S", "#ffd24a"], [75, "A", "#7ee081"], [55, "B", "#5b8cff"], [35, "C", "#b6a5ff"], [0, "D", "#8e97ab"]];
const gradeOf = (sc) => GRADES.find(([m]) => sc >= m) || GRADES[GRADES.length - 1];

const short = (n) => String(n || "").split("#")[0];
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
function metrics(r) {
  const s = r["지표"]; if (!s || s === "기록 대기") return null;
  const o = {};
  String(s).split("|").forEach((t) => { const m = /^([a-z]+)(-?\d+(?:\.\d+)?)$/.exec(t.trim()); if (m) o[m[1]] = parseFloat(m[2]); });
  return o.m > 0 ? o : null;
}
function kda(v) {
  const m = /^(\d+)\s*\/\s*(\d+)\s*\/\s*(\d+)$/.exec(String(v || "").trim());
  return m ? { k: +m[1], d: +m[2], a: +m[3] } : null;
}

function aggregate(rows) {
  const seen = new Set(), P = new Map(), games = new Set();
  for (const r of rows) {
    const gid = r["게임ID"], nm = r["소환사명"];
    if (!gid || !nm) continue;
    const key = gid + "|" + (r["PUUID"] || nm);
    if (seen.has(key)) continue;
    seen.add(key); games.add(gid);
    const p = P.get(nm) || { name: nm, g: 0, w: 0, mvp: 0, bad: 0, k: 0, d: 0, a: 0, kn: 0, cs: 0, csn: 0, vs: 0, vsn: 0 };
    const res = r["결과"];
    if (res === "승리" || res === "패배") { p.g++; if (res === "승리") p.w++; }
    if (r["매치평가"] === "MVP") p.mvp++; else if (r["매치평가"] === "역적") p.bad++;
    const ko = kda(r["KDA"]); if (ko) { p.k += ko.k; p.d += ko.d; p.a += ko.a; p.kn++; }
    const mt = metrics(r);
    if (mt) { if (mt.cs) { p.cs += mt.cs / mt.m; p.csn++; } if (mt.vs != null) { p.vs += mt.vs; p.vsn++; } }
    P.set(nm, p);
  }
  const list = [...P.values()].filter((p) => p.g > 0).map((p) => ({
    ...p, wr: pct(p.w, p.g),
    ratio: p.kn ? ((p.k + p.a) / Math.max(1, p.d)) : null,
    cspm: p.csn ? p.cs / p.csn : null,
    vision: p.vsn ? p.vs / p.vsn : null,
  }));
  return { list, games: games.size };
}

const COLS = [
  { k: "name", label: "소환사", num: false },
  { k: "g", label: "판", num: true },
  { k: "wr", label: "승률", num: true },
  { k: "ratio", label: "KDA", num: true },
  { k: "cspm", label: "CS/분", num: true },
  { k: "vision", label: "시야", num: true },
  { k: "mvp", label: "MVP", num: true },
];

/* ============ 전적 카드 ============ */
function Player({ name, rows, tiers, icons, back }) {
  const mine = useMemo(() => {
    const seen = new Set(), out = [];
    for (const r of rows || []) {
      if (r["소환사명"] !== name) continue;
      const k = r["게임ID"] + "|" + (r["챔피언"] || "");
      if (seen.has(k)) continue;
      seen.add(k); out.push(r);
    }
    return out.reverse();                 // 최신순
  }, [rows, name]);

  const st = useMemo(() => {
    let w = 0, l = 0, mvp = 0, ace = 0, bad = 0, k = 0, d = 0, a = 0, kn = 0, cs = 0, csn = 0, vs = 0, vsn = 0;
    const ch = new Map(), pos = new Map();
    for (const r of mine) {
      const res = r["결과"];
      if (res === "승리") w++; else if (res === "패배") l++;
      const ev = r["매치평가"];
      if (ev === "MVP") mvp++; else if (ev === "ACE") ace++; else if (ev === "역적") bad++;
      const ko = kda(r["KDA"]); if (ko) { k += ko.k; d += ko.d; a += ko.a; kn++; }
      const mt = metrics(r);
      if (mt) { if (mt.cs) { cs += mt.cs / mt.m; csn++; } if (mt.vs != null) { vs += mt.vs; vsn++; } }
      const c = r["챔피언"] || "?";
      const e = ch.get(c) || { champ: c, g: 0, w: 0, k: 0, d: 0, a: 0, kn: 0 };
      e.g++; if (res === "승리") e.w++;
      if (ko) { e.k += ko.k; e.d += ko.d; e.a += ko.a; e.kn++; }
      ch.set(c, e);
      const ps = r["포지션"] || "?"; pos.set(ps, (pos.get(ps) || 0) + 1);
    }
    return { w, l, mvp, ace, bad, wr: pct(w, w + l),
             ratio: kn ? (k + a) / Math.max(1, d) : null,
             avg: kn ? { k: k / kn, d: d / kn, a: a / kn } : null,
             cspm: csn ? cs / csn : null, vision: vsn ? vs / vsn : null,
             most: [...ch.values()].sort((x, y) => y.g - x.g).slice(0, 6),
             pos: [...pos.entries()].sort((x, y) => y[1] - x[1]) };
  }, [mine]);

  /* 레이더·종합점수용 백분위 — 클랜 전체에서 내가 어디쯤인지. 라이브러리 없이 순위/인원. */
  const rank = useMemo(() => {
    const all = aggregate(rows || []).list.filter((p) => p.g >= 5);
    const me = all.find((p) => p.name === name);
    const pctOf = (key, val, hiGood = true) => {
      if (val == null || !all.length) return null;
      const vs = all.map((p) => p[key]).filter((v) => v != null);
      if (!vs.length) return null;
      const below = vs.filter((v) => (hiGood ? v < val : v > val)).length;
      return Math.round((below / vs.length) * 100);
    };
    if (!me) return null;
    return {
      me,
      score: Math.max(1, Math.min(100, Math.round(
        0.45 * (pctOf("wr", me.wr) ?? 50) + 0.30 * (pctOf("ratio", me.ratio) ?? 50) +
        0.15 * (pctOf("cspm", me.cspm) ?? 50) + 0.10 * (pctOf("vision", me.vision) ?? 50)))),
      axes: [
        { label: "승률", v: pctOf("wr", me.wr) ?? 0 },
        { label: "캐리", v: pctOf("mvp", me.mvp) ?? 0 },
        { label: "파밍", v: pctOf("cspm", me.cspm) ?? 0 },
        { label: "시야", v: pctOf("vision", me.vision) ?? 0 },
        { label: "생존", v: 100 - (pctOf("bad", me.bad) ?? 50) },
        { label: "꾸준함", v: pctOf("g", me.g) ?? 0 },
      ],
    };
  }, [rows, name]);

  const icon = (c) => icons[c] || icons[String(c || "").replace(/\s/g, "")] || "";
  const tag = (ev) => ev === "MVP" ? html`<span class="tag mvp">MVP</span>`
    : ev === "ACE" ? html`<span class="tag ace">ACE</span>`
    : ev === "역적" ? html`<span class="tag bad">역적</span>` : null;

  if (!mine.length) {
    return html`<div class="wrap">
      <header class="top"><button class="back" onClick=${back}>← 목록</button>
        <div class="pname">${short(name)}</div></header>
      <div class="card">기록을 찾지 못했습니다.</div></div>`;
  }

  const mainChamp = st.most.length ? st.most[0].champ : "";
  const splash = SPLASH[mainChamp] || SPLASH[String(mainChamp).replace(/\s/g, "")] || "";
  const sc = rank ? rank.score : null;
  const [g0, gLabel, gColor] = sc != null ? gradeOf(sc) : [0, "-", "#8e97ab"];
  const recent = mine.filter((r) => r["결과"] === "승리" || r["결과"] === "패배").slice(0, 10);
  const recWr = pct(recent.filter((r) => r["결과"] === "승리").length, recent.length);
  const style = (() => {                       // 플레이 성향 — 레이더 최고 축으로 이름 붙인다
    if (!rank) return "표본 부족";
    const top = [...rank.axes].sort((a, b) => b.v - a.v)[0];
    const spread = Math.max(...rank.axes.map((a) => a.v)) - Math.min(...rank.axes.map((a) => a.v));
    if (spread < 25) return "밸런스형";
    return { "승률": "승리 견인형", "캐리": "캐리형", "파밍": "성장형",
             "시야": "시야 장악형", "생존": "안정형", "꾸준함": "출근형" }[top.label] || "밸런스형";
  })();
  const items = useMemo(() => {                // 선호 아이템 — 종료 시점 인벤토리 빈도순(7/13 이후 기록만 존재)
    const m = new Map();
    for (const r of mine) for (const id of String(r["아이템"] || "").split("|")) {
      const t = id.trim(); if (/^\d{4}$/.test(t)) m.set(t, (m.get(t) || 0) + 1);
    }
    return [...m.entries()].sort((a, b) => b[1] - a[1]).slice(0, 6);
  }, [mine]);

  return html`<div class="wrap">
    <header class="top">
      <button class="back" onClick=${back}>← 목록</button>
      <span class="pill">전적 카드 시험판</span>
    </header>

    <div class="banner">
      ${splash ? html`<img src=${splash} alt=${mainChamp} loading="lazy" />` : null}
      <div class="shade"></div>
      ${sc != null ? html`<div class="grade" style=${`background:${gColor}`}>${gLabel}</div>` : null}
      <div class="in">
        <div>
          <div class="nm">${short(name)}</div>
          <div style="color:var(--mut);font-size:12.5px;margin-top:3px">
            ${tiers[short(name)] ? `내부티어 ${tiers[short(name)]}` : "내부티어 미지정"}
            · 주 라인 ${st.pos.length ? st.pos[0][0] : "-"} · ${st.w + st.l}전 ${st.w}승 ${st.l}패
          </div>
        </div>
        ${sc != null ? html`<div class="big"><b style=${`color:${gColor}`}>${sc}</b><s>/100</s></div>` : null}
      </div>
    </div>

    <div class="trio">
      <div><div class="k">내전 승률</div>
        <div class="v" style="color:${st.wr >= 50 ? "var(--win)" : "var(--lose)"}">${st.wr}%</div>
        <div class="s">${st.w}승 ${st.l}패</div></div>
      <div><div class="k">최근 승률</div>
        <div class="v" style="color:${recWr >= 50 ? "var(--win)" : "var(--lose)"}">${recent.length ? recWr + "%" : "-"}</div>
        <div class="s">최근 ${recent.length}판</div></div>
      <div><div class="k">평점</div>
        <div class="v" style=${`color:${gColor}`}>${sc != null ? sc : "-"}</div>
        <div class="s">${gLabel}등급</div></div>
    </div>

    <div class="grid">
      <div class="card" style="animation-delay:.04s">
        <h2>🕸 플레이 성향 <small>클랜 내 백분위</small></h2>
        <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
          ${rank ? html`<${Radar} axes=${rank.axes} />` : html`<div class="note">표본이 적어 계산하지 않았습니다.</div>`}
          <div style="flex:1;min-width:170px">
            <div style="margin-bottom:10px"><span class="tagchip">${style}</span></div>
            <div class="strip" style="margin:0">
        <div class="cell"><div class="k">승률</div>
          <div class="v" style="color:${st.wr >= 50 ? "var(--win)" : "var(--lose)"}">${st.wr}%</div></div>
        ${st.ratio != null ? html`<div class="cell"><div class="k">KDA</div><div class="v">${st.ratio.toFixed(2)}</div>
          <div class="k">${st.avg.k.toFixed(1)}/${st.avg.d.toFixed(1)}/${st.avg.a.toFixed(1)}</div></div>` : null}
        ${st.cspm != null ? html`<div class="cell"><div class="k">CS/분</div><div class="v">${st.cspm.toFixed(1)}</div></div>` : null}
        ${st.vision != null ? html`<div class="cell"><div class="k">시야</div><div class="v">${Math.round(st.vision)}</div></div>` : null}
        <div class="cell"><div class="k">MVP</div><div class="v" style="color:var(--gold)">${st.mvp}</div></div>
        <div class="cell"><div class="k">ACE</div><div class="v" style="color:var(--win)">${st.ace}</div></div>
        <div class="cell"><div class="k">역적</div><div class="v" style="color:var(--lose)">${st.bad}</div></div>
            </div>
            <div style="color:var(--mut);font-size:12px;margin-top:8px">
              라인: ${st.pos.map(([p, n]) => `${p} ${n}판`).join(" · ")}
            </div>
            ${items.length ? html`<div style="margin-top:10px">
              <div style="color:var(--mut);font-size:12px;margin-bottom:5px">선호 아이템 <span style="opacity:.7">(7/13 이후 기록)</span></div>
              <div class="itemrow">${items.map(([id, n]) => html`<img class="itm" title=${`${n}회`}
                src=${`https://ddragon.leagueoflegends.com/cdn/15.13.1/img/item/${id}.png`} loading="lazy" />`)}</div>
            </div>` : null}
            <div style="margin-top:10px">
              <div style="color:var(--mut);font-size:12px;margin-bottom:5px">최근 내전</div>
              ${recent.slice(0, 10).map((r) => html`<span class=${"resbadge " + (r["결과"] === "승리" ? "w" : "l")}>${r["결과"] === "승리" ? "W" : "L"}</span>`)}
            </div>
          </div>
        </div>
      </div>

      <div class="card" style="animation-delay:.07s">
        <h2>📜 최근 전적 <small>최신 20판</small></h2>
        ${mine.slice(0, 20).map((r, i) => {
          const win = r["결과"] === "승리";
          const ko = kda(r["KDA"]);
          const mt = metrics(r);
          return html`<div class="mcard ${win ? "w" : r["결과"] === "패배" ? "l" : ""}" style="animation-delay:${Math.min(i, 12) * 0.02}s">
            ${icon(r["챔피언"]) ? html`<img class="champ" src=${icon(r["챔피언"])} alt=${r["챔피언"]} loading="lazy" />`
              : html`<div class="champ"></div>`}
            <div style="flex:1;min-width:0">
              <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">
                <b>${r["챔피언"]}</b>
                <span style="color:var(--mut);font-size:12px">${r["포지션"]}</span>
                ${tag(r["매치평가"])}
              </div>
              <div style="color:var(--mut);font-size:12px">
                ${ko ? `${ko.k}/${ko.d}/${ko.a}` : "기록 없음"}
                ${mt && mt.cs ? ` · CS ${mt.cs}(${(mt.cs / mt.m).toFixed(1)}/분)` : ""}
                ${mt && mt.vs != null ? ` · 시야 ${mt.vs}` : ""}
              </div>
            </div>
            <div style="text-align:right">
              <div style="font-weight:800;color:${win ? "var(--win)" : "var(--lose)"}">${win ? "승" : r["결과"] === "패배" ? "패" : "-"}</div>
              <div style="color:var(--mut);font-size:11.5px">${String(r["날짜"] || "").slice(5, 16)}</div>
            </div>
          </div>`;
        })}
      </div>

      <div class="card" style="animation-delay:.1s">
        <h2>🏅 모스트 챔피언</h2>
        ${st.most.map((c, i) => {
          const cwr = pct(c.w, c.g);
          const cr = c.kn ? (c.k + c.a) / Math.max(1, c.d) : null;
          return html`<div class="mrow rowin" style="animation-delay:${i * 0.04}s">
            ${icon(c.champ) ? html`<img class="champ" src=${icon(c.champ)} alt=${c.champ} loading="lazy" />` : html`<div class="champ"></div>`}
            <div style="flex:1"><b>${c.champ}</b>
              <div style="color:var(--mut);font-size:12px">${c.g}판${cr != null ? ` · KDA ${cr.toFixed(2)}` : ""}</div></div>
            <div style="width:86px"><div class="bar"><i style="width:${cwr}%"></i></div>
              <div style="text-align:right;font-size:12px;color:${cwr >= 50 ? "var(--win)" : "var(--lose)"}">${cwr}%</div></div>
          </div>`;
        })}
        <div class="note">
          시험판은 아직 <b>부계정·닉변 통합</b>을 하지 않습니다 — 본 사이트와 판수가 다를 수 있습니다.
          정식으로 옮길 때 그 계산을 그대로 가져옵니다.
        </div>
      </div>
    </div>
  </div>`;
}

function App() {
  const [rows, setRows] = useState(null);
  const [q, setQ] = useState("");
  const [sort, setSort] = useState({ k: "g", dir: -1 });
  const [who, setWho] = useState(() => decodeURIComponent((location.hash || "").replace(/^#\/?/, "")));
  const [tiers, setTiers] = useState({});
  const [icons, setIcons] = useState({});

  useEffect(() => { loadTab(GID_RIFT).then(setRows); }, []);
  useEffect(() => {
    loadNamed("CLAN_TIERS").then((rs) => {
      const m = {};
      for (const r of rs) { const n = short(r["닉네임"]); if (n) m[n] = String(r["티어"] || "").trim(); }
      setTiers(m);
    });
    loadChampIcons().then(setIcons);
  }, []);
  useEffect(() => {                       // 뒤로가기로 목록으로 돌아갈 수 있게 주소에 남긴다
    const onHash = () => setWho(decodeURIComponent((location.hash || "").replace(/^#\/?/, "")));
    addEventListener("hashchange", onHash);
    return () => removeEventListener("hashchange", onHash);
  }, []);
  const open = (nm) => { location.hash = "/" + encodeURIComponent(nm); };
  const agg = useMemo(() => (rows ? aggregate(rows) : null), [rows]);

  const shown = useMemo(() => {
    if (!agg) return [];
    const nz = (v) => (v == null ? -Infinity : v);
    const f = q.trim().toLowerCase();
    return agg.list
      .filter((p) => !f || p.name.toLowerCase().includes(f))
      .sort((a, b) => {
        const av = sort.k === "name" ? a.name : nz(a[sort.k]);
        const bv = sort.k === "name" ? b.name : nz(b[sort.k]);
        return ((av > bv ? 1 : av < bv ? -1 : 0) * sort.dir) || b.g - a.g;
      })
      .slice(0, 40);
  }, [agg, q, sort]);

  if (!agg) {
    return html`<div class="wrap">
      <header class="top"><div class="logo">SQUAD<span>.GG</span></div><div class="pill">시험판</div></header>
      <div class="card">${[1, 2, 3, 4, 5].map((i) => html`<div class="skel" style="width:${90 - i * 8}%;margin:10px 0"></div>`)}</div>
    </div>`;
  }

  if (who) {
    return html`<${Player} name=${who} rows=${rows} tiers=${tiers} icons=${icons}
                  back=${() => { location.hash = ""; }} />`;
  }

  const top = [...agg.list].filter((p) => p.g >= 10).sort((a, b) => b.wr - a.wr || b.g - a.g).slice(0, 5);
  const kpi = (k, v, delay) => html`<div class="kpi" style="animation-delay:${delay}s"><div class="k">${k}</div><div class="v">${v}</div></div>`;

  const th = (c) => html`<th class=${c.num ? "num" : ""} onClick=${() =>
    setSort((s) => (s.k === c.k ? { k: c.k, dir: -s.dir } : { k: c.k, dir: c.k === "name" ? 1 : -1 }))}>
    ${c.label}${sort.k === c.k ? (sort.dir > 0 ? " ▲" : " ▼") : ""}</th>`;

  return html`<div class="wrap">
    <header class="top">
      <div class="logo">SQUAD<span>.GG</span></div>
      <div class="pill">React 시험판 · 협곡</div>
      <div class="search"><input placeholder="소환사 검색" value=${q} onInput=${(e) => setQ(e.target.value)} /></div>
    </header>

    <div class="kpis">
      ${kpi("총 내전", agg.games.toLocaleString() + "판", 0)}
      ${kpi("기록된 클랜원", agg.list.length + "명", 0.05)}
      ${kpi("평균 KDA", (agg.list.reduce((s, p) => s + (p.ratio || 0), 0) / Math.max(1, agg.list.filter((p) => p.ratio).length)).toFixed(2), 0.1)}
      ${kpi("표시 중", shown.length + "명", 0.15)}
    </div>

    <div class="grid">
      <div class="card" style="animation-delay:.05s">
        <h2>🏆 플레이어 랭킹 <small>열 제목을 눌러 정렬 · 상위 40명</small></h2>
        <table>
          <thead><tr>${COLS.map(th)}</tr></thead>
          <tbody>
            ${shown.map((p, i) => html`<tr class="rowin" style="animation-delay:${Math.min(i, 12) * 0.015}s">
              <td><span class="name" onClick=${() => open(p.name)}>${short(p.name)}</span></td>
              <td class="num">${p.g}</td>
              <td><div style="display:flex;align-items:center;gap:8px">
                <div class="bar"><i style="width:${p.wr}%"></i></div>
                <span style="color:${p.wr >= 50 ? "var(--win)" : "var(--lose)"};font-size:13px">${p.wr}%</span>
              </div></td>
              <td class="num">${p.ratio != null ? p.ratio.toFixed(2) : "-"}</td>
              <td class="num">${p.cspm != null ? p.cspm.toFixed(1) : "-"}</td>
              <td class="num">${p.vision != null ? Math.round(p.vision) : "-"}</td>
              <td class="num" style="color:var(--gold)">${p.mvp || ""}</td>
            </tr>`)}
          </tbody>
        </table>
      </div>

      <div class="card" style="animation-delay:.1s">
        <h2>🔥 승률 상위 <small>10판 이상</small></h2>
        ${top.map((p, i) => html`<div class="rowin" style="animation-delay:${i * 0.05}s;display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)">
          <div style="width:22px;color:var(--mut);font-size:13px">${i + 1}</div>
          <div style="flex:1"><div class="name" onClick=${() => open(p.name)}>${short(p.name)}</div>
            <div style="color:var(--mut);font-size:12px">${p.g}판 · KDA ${p.ratio != null ? p.ratio.toFixed(2) : "-"}</div></div>
          <div class="score"><b>${p.wr}</b><s>%</s></div>
        </div>`)}
        <div class="note">
          이 화면은 <b>본 사이트와 같은 시트</b>를 읽습니다. 숫자가 다르면 계산 방식 차이가 아니라
          이 시험판이 아직 별칭 통합·부계정 병합을 하지 않아서입니다 — 옮길 때 그대로 가져옵니다.
        </div>
      </div>
    </div>

    <div class="note">
      🧪 시험판입니다. 본 사이트(<a href="../">/squad-analyzer</a>)는 그대로 돌아갑니다.
      이 폴더만 지우면 흔적 없이 사라집니다. 비용은 들지 않습니다(라이브러리·호스팅 모두 무료).
    </div>
  </div>`;
}

render(html`<${App} />`, document.getElementById("root"));
</script>
</body>
</html>
