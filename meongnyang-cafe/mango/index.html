<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFE9B8">
<title>망고게임 · 상준♡투이 게임천국</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* 한 화면짜리 게임: 위에 점수·다음 과일, 가운데 통, 아래에 도감 */
:root {
  --bg1: #FFF6DA; --bg2: #FFE0B8; --bg3: #FFD3E1; --ink: #4A3550; --ink-soft: #85708A;
  --card: rgba(255, 255, 255, .82); --line: #FFFFFF; --pink: #FFB3C9; --pink-deep: #F28CAE;
  --mint: #BDE8D3; --mint-deep: #8FD0B3; --sun: #FFC93C; --sun-deep: #F2A900;
  --font-display: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-body: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background-color: var(--bg1); color: var(--ink); font-family: var(--font-body); font-size: 16px; overflow: hidden;
  background-image: radial-gradient(circle at 10% 6%, var(--bg2) 0, transparent 40%), radial-gradient(circle at 92% 94%, var(--bg3) 0, transparent 42%), radial-gradient(circle, rgba(255,255,255,.7) 2px, transparent 2.5px);
  background-size: auto, auto, 28px 28px;
  padding-inline: max(14px, env(safe-area-inset-left, 0px)) max(14px, env(safe-area-inset-right, 0px)); padding-block: 8px;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, .num { font-family: var(--font-display); font-weight: 400; margin: 0; }
p { margin: 0; }
button, a.btn { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.btn {
  font-family: var(--font-display); font-size: 20px; min-height: 52px; padding: 0 26px; border: 0; border-radius: 999px; background: var(--pink); color: var(--ink);
  box-shadow: 0 5px 0 var(--pink-deep); transition: transform .08s, box-shadow .08s; display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--pink-deep); }
.btn.sun { background: var(--sun); box-shadow: 0 5px 0 var(--sun-deep); } .btn.sun:active { box-shadow: 0 1px 0 var(--sun-deep); }
.btn.ghost { background: var(--card); box-shadow: 0 5px 0 rgba(133,112,138,.25); font-size: 16px; }
.btn.small { min-height: 40px; font-size: 15px; padding: 0 16px; }
#app { height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; position: relative; z-index: 1; }
.bunting { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); height: 22px; z-index: 0; pointer-events: none; display: flex; opacity: .9; }
.bunting i { flex: 1; clip-path: polygon(6% 0, 94% 0, 50% 100%); }
.bar { display: flex; gap: 8px; align-items: center; padding-top: 14px; }
.bar .sp { flex: 1; }
.hud { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: stretch; }
.box { background: var(--card); border: 3px solid var(--line); border-radius: 20px; padding: 4px 12px; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.box .lab { font-size: 12px; color: var(--ink-soft); line-height: 1.1; }
.box .num { font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.box.next { align-items: center; min-width: 92px; }
.box.next img { width: 40px; height: 40px; }
.chain { display: flex; gap: 3px; justify-content: space-between; background: var(--card); border: 3px solid var(--line); border-radius: 18px; padding: 5px 7px; }
.chain .ci { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.chain img { width: 100%; max-width: 30px; aspect-ratio: 1; object-fit: contain; filter: grayscale(1) brightness(.75) opacity(.55); transition: filter .3s, transform .3s; }
.chain .ci.on img { filter: none; }
.chain .ci.new img { transform: scale(1.35); }
.chain .ci b { font-family: var(--font-display); font-weight: 400; font-size: 8.5px; color: var(--ink-soft); line-height: 1; white-space: nowrap; }
.chain .ci:last-child img { max-width: 34px; }
#stage { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; }
#frame {
  padding: 10px; border: 4px solid #fff; border-radius: 30px; background-color: #FFD27A;
  background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.55) 0 10px, transparent 10px 20px), repeating-linear-gradient(90deg, rgba(255,255,255,.55) 0 10px, transparent 10px 20px);
  box-shadow: 0 8px 0 rgba(242,169,0,.5); outline: 3px dashed rgba(255,255,255,.95); outline-offset: -10px;
}
#stage.vs { display: flex; gap: 8px; justify-content: center; align-items: flex-end; padding-bottom: 6px; }
#oppFrame { padding: 5px; border: 3px solid #fff; border-radius: 18px; background: #FFD27A; box-shadow: 0 5px 0 rgba(242,169,0,.5); flex: none; }
#oppCv { display: block; border-radius: 12px; background: rgba(255,255,255,.72); }
#cv { display: block; border-radius: 20px; touch-action: none; background: rgba(255,255,255,.72); }
.shake { animation: shake .4s; }
@keyframes shake { 20% { transform: translate(-6px, 3px); } 40% { transform: translate(6px, -3px); } 60% { transform: translate(-4px, -2px); } 80% { transform: translate(3px, 2px); } }
#toast {
  position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%) scale(.6); opacity: 0; pointer-events: none; z-index: 3;
  font-family: var(--font-display); font-size: 28px; color: var(--ink); background: #fff; padding: 6px 20px; border-radius: 999px; border: 3px solid var(--sun-deep); white-space: nowrap; max-width: 96%;
}
#toast.go { animation: pop 1.3s ease-out; }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.5); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 75% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -85%) scale(1); } }
.sheetwrap { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; padding: 10px; background: rgba(255, 246, 218, .88); border-radius: 26px; overflow-y: auto; }
.sheet { background: #fff; border-radius: 30px; border: 3px solid var(--sun); padding: 20px 16px; width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 12px; box-shadow: 0 8px 0 rgba(242,169,0,.4); text-align: center; }
.sheet h1 { font-size: 36px; } .sheet h2 { font-size: 28px; }
.sheet .sub { color: var(--ink-soft); font-size: 15px; word-break: keep-all; text-wrap: balance; line-height: 1.45; }
.sheet .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.hero { width: 120px; height: 120px; animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-8px) rotate(-3deg); } }
.minichain { display: flex; gap: 2px; width: 100%; }
.minichain img { flex: 1; min-width: 0; aspect-ratio: 1; object-fit: contain; }
.nick { display: flex; align-items: center; gap: 8px; width: 100%; font-family: var(--font-display); }
.nick input { flex: 1; min-width: 0; height: 42px; border-radius: 999px; border: 3px solid #FFE9B8; background: #fff; padding: 0 14px; font-family: var(--font-display); font-size: 17px; color: var(--ink); text-align: center; }
.big { font-family: var(--font-display); font-size: 44px; font-variant-numeric: tabular-nums; line-height: 1; }
.got { display: flex; align-items: center; gap: 10px; background: #FFF6DA; border-radius: 20px; padding: 6px 14px; }
.got img { width: 52px; height: 52px; }
.ranklist { list-style: none; margin: 0; padding: 0; width: 100%; max-height: 46vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.ranklist li { display: grid; grid-template-columns: 28px 38px 1fr auto; gap: 8px; align-items: center; background: #FFF6DA; border: 3px solid #fff; border-radius: 16px; padding: 4px 10px 4px 6px; text-align: left; }
.ranklist li.me { border-color: var(--pink-deep); background: #fff; }
.ranklist .no { font-family: var(--font-display); font-size: 18px; text-align: center; color: var(--ink-soft); }
.ranklist img { width: 36px; height: 36px; object-fit: contain; }
.ranklist .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
.ranklist .vl { font-family: var(--font-display); font-size: 18px; font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 10px; width: 100%; align-items: stretch; }
.join { display: flex; gap: 8px; }
.join input { flex: 1; min-width: 0; height: 52px; border-radius: 999px; border: 3px solid #FFE9B8; background: #fff; padding: 0 14px; font-family: var(--font-display); font-size: 18px; color: var(--ink); text-align: center; letter-spacing: 4px; text-transform: lowercase; }
.join input::placeholder { letter-spacing: 0; font-size: 15px; color: var(--ink-soft); font-family: var(--font-body); }
.btn.mint { background: var(--mint); box-shadow: 0 5px 0 var(--mint-deep); } .btn.mint:active { box-shadow: 0 1px 0 var(--mint-deep); }
.btn[disabled] { opacity: .5; pointer-events: none; }
.code { font-family: var(--font-display); font-size: 48px; letter-spacing: 9px; padding: 2px 6px 2px 16px; background: #fff; border-radius: 22px; border: 3px dashed var(--pink-deep); }
.seats { display: flex; gap: 10px; width: 100%; }
.seat { flex: 1; min-width: 0; background: #FFF6DA; border: 3px solid #fff; border-radius: 20px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.seat img { width: 48px; height: 48px; } .seat.empty img { opacity: .25; filter: grayscale(1); }
.seat .who { font-family: var(--font-display); font-size: 16px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat .st { font-size: 13px; color: var(--ink-soft); } .seat.ok { border-color: var(--mint-deep); background: #fff; }
.vsbar { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; background: var(--card); border: 3px solid var(--line); border-radius: 18px; padding: 3px 10px 3px 6px; }
.vsbar img { width: 30px; height: 30px; object-fit: contain; }
.vsbar .who { min-width: 0; font-size: 13px; line-height: 1.15; } .vsbar .who b { font-family: var(--font-display); font-weight: 400; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vsbar .meter { height: 6px; border-radius: 999px; background: #F1E4D0; overflow: hidden; margin-top: 2px; } .vsbar .meter i { display: block; height: 100%; width: 0; background: #7CCBA8; transition: width .25s, background .25s; }
.vsbar .meter i.hot { background: #E5566B; }
.vsbar .vl { font-family: var(--font-display); font-size: 20px; font-variant-numeric: tabular-nums; }
.note { color: var(--ink-soft); font-size: 14px; min-height: 18px; }
@media (max-height: 700px) { .hero { width: 80px; height: 80px; } .sheet h1 { font-size: 30px; } .big { font-size: 36px; } }
@media (prefers-reduced-motion: reduce) { .hero, .shake, #toast.go { animation: none !important; } #toast.go { opacity: 1; transform: translate(-50%, -50%); } }
</style>
</head>
<body>
<div class="bunting" id="bunting" aria-hidden="true"></div>
<div id="app">
  <div class="bar">
    <a class="btn small ghost" href="../">← 게임 선택</a>
    <span class="sp"></span>
    <button class="btn small ghost" id="btnMusic" type="button">음악 켜짐</button>
    <button class="btn small ghost" id="btnSound" type="button">소리 켜짐</button>
  </div>
  <div class="hud">
    <div class="box"><span class="lab">점수</span><span class="num" id="score">0</span></div>
    <div class="box"><span class="lab">내 최고</span><span class="num" id="best">0</span></div>
    <div class="box next"><span class="lab">다음 과일</span><img id="nextImg" alt="" width="40" height="40"></div>
  </div>
  <div class="chain" id="chain" aria-label="과일 도감"></div>
  <div class="vsbar" id="vsBar" hidden><img id="vsImg" alt="" width="30" height="30"><div class="who"><b id="vsName">상대</b><div class="meter" aria-hidden="true"><i id="vsDg"></i></div></div><span class="vl" id="vsScore">0</span></div>
  <div id="stage">
    <div id="frame"><canvas id="cv" aria-label="망고게임 화면"></canvas></div>
    <div id="oppFrame" hidden><canvas id="oppCv" aria-label="상대 화면"></canvas></div>
    <div id="toast" aria-live="polite"></div>

    <div class="sheetwrap" id="startSheet">
      <div class="sheet">
        <img class="hero" id="heroImg" alt="" width="120" height="120">
        <h1>망고게임</h1>
        <p class="sub">같은 과일끼리 닿으면 합쳐져요.<br>베트남 과일을 키워서 <b>망고</b>를 만들어 봐요!</p>
        <div class="minichain" id="miniChain" aria-hidden="true"></div>
        <p class="sub">손가락을 좌우로 움직이고, 떼면 떨어져요.<br>과일이 위 점선을 넘어 쌓이면 끝나요.</p>
        <label class="nick"><span>내 이름</span><input id="nick" maxlength="12" placeholder="랭킹에 보여요" autocomplete="off" spellcheck="false"></label>
        <div class="row"><button class="btn sun" id="btnStart" type="button">시작!</button><button class="btn ghost" id="btnRank1" type="button">랭킹</button></div>
        <button class="btn mint" id="btnVs" type="button">둘이서 온라인 대결</button>
      </div>
    </div>

    <div class="sheetwrap" id="vsSheet" hidden>
      <div class="sheet">
        <h2>망고 대결</h2>
        <p class="sub">과일 순서는 둘이 똑같아요.<br><b>먼저 망고를 완성</b>하거나 <b>상대보다 오래 버티면</b> 이겨요!</p>
        <div class="stack" id="vsHome">
          <button class="btn sun" id="btnVsCreate" type="button">방 만들기</button>
          <div class="join"><input id="vsCodeIn" maxlength="4" placeholder="친구가 알려준 코드" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="방 코드"><button class="btn mint" id="btnVsJoin" type="button">들어가기</button></div>
        </div>
        <div class="stack" id="vsLobby" hidden>
          <div class="code" id="vsCode" aria-live="polite"></div>
          <div class="row"><button class="btn small ghost" id="btnVsCopy" type="button">코드 복사</button><a class="btn small ghost" id="btnVsSms" href="#">자기야 같이하자</a></div>
          <div class="seats">
            <div class="seat" id="seatMe"><img id="seatMeImg" alt="" width="48" height="48"><span class="who" id="whoMe">나</span><span class="st" id="stMe"></span></div>
            <div class="seat empty" id="seatFr"><img id="seatFrImg" alt="" width="48" height="48"><span class="who" id="whoFr">상대</span><span class="st" id="stFr">기다리는 중…</span></div>
          </div>
          <button class="btn sun" id="btnVsReady" type="button">준비 완료!</button>
        </div>
        <p class="note" id="vsNote"></p>
        <button class="btn ghost small" id="btnVsBack" type="button">돌아가기</button>
      </div>
    </div>

    <div class="sheetwrap" id="endSheet" hidden>
      <div class="sheet">
        <h2 id="endTitle">게임 끝!</h2>
        <div class="big" id="endScore">0</div>
        <div class="got"><img id="endImg" alt="" width="52" height="52"><div><div class="note">가장 큰 과일</div><b id="endName"></b></div></div>
        <p class="note" id="endRank"></p>
        <p class="note" id="endQuote"></p>
        <div class="row"><button class="btn sun" id="btnAgain" type="button">한 번 더</button><button class="btn ghost" id="btnRank2" type="button">랭킹</button></div>
        <a class="btn ghost small" href="../">게임 선택</a>
      </div>
    </div>

    <div class="sheetwrap" id="rankSheet" hidden>
      <div class="sheet">
        <h2>망고게임 랭킹</h2>
        <ol class="ranklist" id="rankList"></ol>
        <p class="note" id="rankNote"></p>
        <button class="btn ghost" id="btnRankBack" type="button">돌아가기</button>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../shared.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('ko-KR');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const W = 360, H = 540, LINE = 96;
const FR = [
  { ko: '리치', vi: 'Vải', r: 15, c: '#FF5A5F' }, { ko: '람부탄', vi: 'Chôm chôm', r: 21, c: '#FF4B3E' }, { ko: '망고스틴', vi: 'Măng cụt', r: 27, c: '#9B4F9E' },
  { ko: '용과', vi: 'Thanh long', r: 34, c: '#FF5FA2' }, { ko: '구아바', vi: 'Ổi', r: 41, c: '#B5D957' }, { ko: '스타프루트', vi: 'Khế', r: 50, c: '#F1DB3C' },
  { ko: '파파야', vi: 'Đu đủ', r: 60, c: '#FF9A2E' }, { ko: '코코넛', vi: 'Dừa', r: 71, c: '#9A6A45' }, { ko: '두리안', vi: 'Sầu riêng', r: 83, c: '#B9C73E' },
  { ko: '잭프루트', vi: 'Mít', r: 96, c: '#C7D14A' }, { ko: '망고', vi: 'Xoài', r: 112, c: '#FFB41F' }
];
const MANGO = FR.length;
const imgs = FR.map((f, i) => { const im = new Image(); im.src = '../img/fruit/' + String(i + 1).padStart(2, '0') + '.webp'; return im; });
const src = i => '../img/fruit/' + String(i).padStart(2, '0') + '.webp';

/* ---------- 소리·진동 ---------- */
let muted = false, AC = null;
try { muted = localStorage.getItem('mn-mute') === '1'; } catch (_) { /* 무시 */ }
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { AC = null; } } if (AC && AC.state === 'suspended') AC.resume().catch(() => {}); return AC; }
function tone(f, dur, type, vol, when, slide) {
  if (muted) return; const a = ac(); if (!a) return;
  const t = a.currentTime + (when || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + dur);
  g.gain.setValueAtTime(vol || .12, t); g.gain.exponentialRampToValueAtTime(.001, t + dur); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + .03);
}
const buzz = p => { if (muted) return; try { if (navigator.vibrate) navigator.vibrate(p); } catch (_) { /* 무시 */ } };
const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
const SFX = {
  drop() { tone(330, .08, 'triangle', .08, 0, .7); },
  merge(lv, combo) { const f = 392 * Math.pow(1.0595, SCALE[Math.min(lv, 10)] + Math.min(combo - 1, 4)); tone(f, .16, 'sine', .15); tone(f * 1.5, .14, 'triangle', .07, .05); },
  found() { [659, 784, 988, 1319].forEach((f, i) => tone(f, .2, 'triangle', .1, i * .07)); },
  mango() { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, .32, 'triangle', .13, i * .09)); },
  over() { [440, 392, 349, 294].forEach((f, i) => tone(f, .3, 'triangle', .11, i * .17, .9)); }
};

/* ---------- 물리 ---------- */
const { Engine, Bodies, Composite, Events } = Matter;
let engine = null, mergeQ = [];
const S = { playing: false, score: 0, best: 0, maxLv: 0, hold: null, next: null, x: W / 2, canDrop: true, t: 0, lastMerge: -9, combo: 0, danger: 0, mangos: 0, scale: 1, dpr: 1, vs: false, lock: false };
const parts = [], floats = [];
try { S.best = +localStorage.getItem('mango-best') || 0; } catch (_) { /* 무시 */ }

let rnd = Math.random; // 대결에서는 두 사람이 같은 씨앗을 써서 과일이 같은 순서로 나온다
function seedRng(s) { let a = s >>> 0; rnd = () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function roll() { const r = rnd() * 100; return { lv: r < 34 ? 1 : r < 62 ? 2 : r < 82 ? 3 : r < 94 ? 4 : 5, gold: rnd() < .06 }; }
function fruits() { return engine.world.bodies.filter(b => b.label === 'fruit'); }
function makeFruit(lv, x, y, gold, pop) {
  const b = Bodies.circle(x, y, FR[lv - 1].r, { restitution: .12, friction: .25, frictionStatic: .5, frictionAir: .012, density: .0015, label: 'fruit' });

function vsAgain() { V.over = false; openVs(); ready(); }
function startVs() {
  V.games = V.readyFor; V.readyFor = null; V.ev = null; V.over = false; V.fin = false;
  start(hashCode(V.code) + V.games * 7919); S.lock = true; sendState(true);
  clearInterval(V.timer); V.timer = setInterval(() => { sendState(false); vsRender(); }, 150);
  ['3', '2', '1', '시작!'].forEach((t, i) => setTimeout(() => { if (!S.vs) return; toast(t); tone(t === '시작!' ? 880 : 520, .12, 'triangle', .12); if (t === '시작!') S.lock = false; }, i * 900));
}
function vsRender() {
  const fp = V.friend ? V.friend.presence : null; if (!fp) return;
  $('vsName').textContent = String(fp.nm || '').slice(0, 12) || '상대';
  $('vsScore').textContent = fmt(fp.score | 0); $('vsImg').src = src(clamp(fp.mx | 0 || 1, 1, MANGO));
  const d = $('vsDg'); d.style.width = Math.round(clamp(+fp.dg || 0, 0, 1) * 100) + '%'; d.classList.toggle('hot', (+fp.dg || 0) > .45);
}
function vsTick() {
  if (V.over || V.fin) return;
  vsRender();
  const fp = V.friend ? V.friend.presence : null;
  if (!V.friend) { V.fin = true; setTimeout(vsFinish, 1200); return; } // 상대가 나갔다 — 잠깐 기다려 재접속이 아닌지 본다
  if (fp.ev && !V.ev) { V.fin = true; S.playing = false; setTimeout(vsFinish, 800); }
}
function vsEvent(kind) {
  if (V.ev || V.over) return;
  V.ev = { kind, at: Date.now() }; S.playing = false; sendState(true);
  if (kind === 'mango') { SFX.mango(); buzz([40, 40, 40, 40, 120]); } else { SFX.over(); buzz([60, 40, 60]); }
  V.fin = true; setTimeout(vsFinish, 800);
}
async function vsFinish() {
  if (V.over || !S.vs) return; V.over = true; S.playing = false; S.vs = false; clearInterval(V.timer); V.timer = null;
  const fp = V.friend ? V.friend.presence : null, evs = [];
  if (V.ev) evs.push({ me: true, kind: V.ev.kind, at: V.ev.at });
  if (fp && fp.ev) evs.push({ me: false, kind: fp.ev, at: +fp.at || 0 });
  evs.sort((a, b) => a.at - b.at);
  const e = evs[0], left = !e;
  const win = left ? true : e.kind === 'mango' ? e.me : !e.me;
  const why = left ? '상대가 나가서 부전승이에요.' : e.kind === 'mango' ? (e.me ? '내가 먼저 망고를 완성했어요! 🥭' : '상대가 먼저 망고를 완성했어요.') : (e.me ? '내 통이 먼저 가득 찼어요. 상대가 더 오래 버텼어요.' : '상대 통이 먼저 가득 찼어요. 내가 더 오래 버텼어요!');
  if (win) { SFX.found(); buzz([30, 30, 80]); } else SFX.over();
  await sleep(500);
  $('endTitle').textContent = win ? '내가 이겼어요!' : '아쉬워요, 졌어요';
  $('endScore').textContent = fmt(S.score);
  const lv = Math.max(1, S.maxLv || 1); $('endImg').src = src(lv); $('endName').textContent = `${FR[lv - 1].ko} (${FR[lv - 1].vi})`;
  $('endRank').textContent = why + (fp ? ` (상대 ${fmt(fp.score | 0)}점)` : '');
  $('endQuote').textContent = win ? '🎁 이긴 사람의 소원 하나! 낙산공원에서 고백 다시 받기, 한복 입고 사진 찍기… 💗' : '알겠오~ 소원은 꼭 들어줄게! 다음 판엔 내가 이길 거야 🥭';
  $('btnAgain').textContent = '다시 대결'; $('btnRank2').hidden = true; $('endSheet').hidden = false;
}
$('btnVs').onclick = () => { ac(); openVs(); };
$('btnVsCreate').onclick = () => { let c = ''; for (let i = 0; i < 4; i++) c += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]; enterRoom(c); };
$('btnVsJoin').onclick = () => { const c = $('vsCodeIn').value.toLowerCase().replace(/[^a-z0-9]/g, ''); if (c.length !== 4) { vsNote('코드는 4글자예요.'); return; } enterRoom(c); };
$('vsCodeIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnVsJoin').click(); });
$('btnVsReady').onclick = () => { ac(); ready(); };
$('btnVsBack').onclick = async () => { await leaveRoom(); $('vsSheet').hidden = true; $('btnAgain').textContent = '한 번 더'; $('btnRank2').hidden = false; $('startSheet').hidden = false; };
$('btnVsCopy').onclick = () => { const b = $('btnVsCopy'), done = ok => { b.textContent = ok ? '복사했어요!' : '코드를 직접 알려 주세요'; setTimeout(() => { b.textContent = '코드 복사'; }, 1800); }; try { navigator.clipboard.writeText(V.code).then(() => done(true), () => done(false)); } catch (_) { done(false); } };
$('btnVsSms').addEventListener('click', e => { e.preventDefault(); const msg = `자기야 망고게임 대결하자~ 🥭\n방 코드: ${V.code}\n링크: ${GAME_URL}\n(링크 열고 '둘이서 온라인 대결' → 코드 4글자 입력!)`; location.href = 'sms:?&body=' + encodeURIComponent(msg); });

/* ---------- 버튼·시작 ---------- */
$('btnStart').onclick = () => { ac(); $('btnAgain').textContent = '한 번 더'; $('btnRank2').hidden = false; start(); };
$('btnAgain').onclick = () => { ac(); if (V.over) vsAgain(); else start(); };
$('btnRank1').onclick = () => openRank('start');
$('btnRank2').onclick = () => openRank('end');
$('btnSound').onclick = () => { muted = !muted; try { localStorage.setItem('mn-mute', muted ? '1' : '0'); } catch (_) { /* 무시 */ } $('btnSound').textContent = muted ? '소리 꺼짐' : '소리 켜짐'; if (!muted) { ac(); SFX.drop(); } };
$('btnMusic').onclick = () => { MN.bgm.toggle(); $('btnMusic').textContent = MN.bgm.isOn() ? '음악 켜짐' : '음악 꺼짐'; };
$('nick').addEventListener('input', () => MN.setNick($('nick').value));
(function boot() {
  $('nick').value = MN.nick(); $('btnSound').textContent = muted ? '소리 꺼짐' : '소리 켜짐'; $('btnMusic').textContent = MN.bgm.isOn() ? '음악 켜짐' : '음악 꺼짐';
  const ch = $('chain'), mc = $('miniChain');
  FR.forEach((f, i) => {
    const d = document.createElement('div'); d.className = 'ci'; const im = document.createElement('img'); im.src = src(i + 1); im.alt = f.ko; const b = document.createElement('b'); b.textContent = f.ko === '스타프루트' ? '스타' : f.ko; d.append(im, b); ch.appendChild(d);
    const m = document.createElement('img'); m.src = src(i + 1); m.alt = ''; mc.appendChild(m);
  });
  $('heroImg').src = src(MANGO); $('nextImg').src = src(1); $('best').textContent = fmt(S.best);
  const flags = ['#FFB3C9', '#FFE08A', '#BDE8D3', '#CDBFF5', '#BFE1F7'], bt = $('bunting'); for (let i = 0; i < 14; i++) { const f = document.createElement('i'); f.style.background = flags[i % 5]; bt.appendChild(f); }
  resetWorld(); fit(); initRank(); V.ns = MN.roomNs(); if (!V.ns) $('btnVs').hidden = true; requestAnimationFrame(frame);
})();
</script>
</body>
</html>
