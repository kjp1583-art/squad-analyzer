<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFE3EE">
<title>카페 매치 · 상준♡투이 게임천국</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* 한 화면짜리 앱: 위에 점수판, 가운데 정사각 보드, 아래에 엄지로 누르는 버튼. 파스텔 단일 테마 */
:root {
  --bg1: #FFF3EA;
  --bg2: #FFDDE8;
  --bg3: #E4DDFB;
  --ink: #4A3550;
  --ink-soft: #85708A;
  --card: rgba(255, 255, 255, .78);
  --line: #FFFFFF;
  --pink: #FFB3C9;
  --pink-deep: #F28CAE;
  --mint: #BDE8D3;
  --mint-deep: #8FD0B3;
  --sky: #CBE6F8;
  --butter: #FFEFA8;
  --butter-deep: #F4D35E;
  --font-display: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-body: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background-color: var(--bg1);
  background-image:
    radial-gradient(circle at 12% 8%, var(--bg2) 0, transparent 38%),
    radial-gradient(circle at 92% 92%, var(--bg3) 0, transparent 42%),
    radial-gradient(circle, rgba(255, 255, 255, .7) 2px, transparent 2.5px);
  background-size: auto, auto, 28px 28px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 34px 12px;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
#app { height: 100%; max-width: 560px; margin: 0 auto; position: relative; z-index: 1; }
.screen { height: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; }
h1, h2, .num { font-family: var(--font-display); font-weight: 400; margin: 0; }
h1 { font-size: 42px; letter-spacing: 1px; text-wrap: balance; }
h2 { font-size: 26px; text-wrap: balance; }
p { margin: 0; }
.sub { color: var(--ink-soft); text-align: center; }
.note { color: var(--ink-soft); font-size: 14px; text-align: center; min-height: 20px; text-wrap: balance; }

button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.btn {
  font-family: var(--font-display); font-size: 20px; min-height: 52px; padding: 0 26px;
  border: 0; border-radius: 999px; background: var(--pink); color: var(--ink);
  box-shadow: 0 5px 0 var(--pink-deep); transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--pink-deep); }
.btn.mint { background: var(--mint); box-shadow: 0 5px 0 var(--mint-deep); }
.btn.mint:active { box-shadow: 0 1px 0 var(--mint-deep); }
.btn.ghost { background: var(--card); box-shadow: 0 5px 0 rgba(133, 112, 138, .25); font-size: 17px; }
.btn.small { min-height: 40px; font-size: 16px; padding: 0 18px; }
.btn[disabled] { opacity: .5; pointer-events: none; }

/* 홈 */
#home { justify-content: center; padding-block: 8px; }
.logo { display: flex; gap: 6px; align-items: flex-end; }
.logo img { width: 92px; height: 92px; animation: bob 2.4s ease-in-out infinite; }
.logo img + img { animation-delay: -1.2s; }
@keyframes bob { 50% { transform: translateY(-8px) rotate(-3deg); } }
.pick { display: flex; gap: 12px; width: 100%; }
.char {
  flex: 1; border: 3px solid var(--line); border-radius: 24px; background: var(--card);
  padding: 10px 6px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-family: var(--font-display); font-size: 18px; transition: transform .1s, border-color .1s, background .1s;
}
.char img { width: 64px; height: 64px; }
.char small { font-family: var(--font-body); font-size: 13px; color: var(--ink-soft); }
.char[aria-pressed="true"] { border-color: var(--pink-deep); background: #fff; transform: scale(1.04); }
.stack { display: flex; flex-direction: column; gap: 12px; width: 100%; align-items: stretch; }
.join { display: flex; gap: 8px; }
.join input {
  flex: 1; min-width: 0; height: 52px; border-radius: 999px; border: 3px solid var(--line);
  background: var(--card); padding: 0 20px; font-family: var(--font-display); font-size: 22px;
  letter-spacing: 6px; text-align: center; text-transform: lowercase; color: var(--ink);
}
.join input::placeholder { letter-spacing: 0; font-size: 16px; color: var(--ink-soft); font-family: var(--font-body); }

/* 대기실 */
#lobby { justify-content: center; }
.code {
  font-family: var(--font-display); font-size: 56px; letter-spacing: 10px; padding: 4px 8px 4px 18px;
  background: #fff; border-radius: 24px; border: 3px dashed var(--pink-deep);
}
.seats { display: flex; gap: 12px; width: 100%; }
.seat {
  flex: 1; min-width: 0; background: var(--card); border: 3px solid var(--line); border-radius: 24px;
  padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
}
.seat img { width: 72px; height: 72px; }
.seat.empty img { opacity: .25; filter: grayscale(1); }
.seat .who { font-family: var(--font-display); font-size: 18px; }
.seat .st { font-size: 14px; color: var(--ink-soft); }
.seat.ok { border-color: var(--mint-deep); background: #fff; }

/* 게임 */
#game { gap: 10px; }
.hud { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; width: 100%; align-items: stretch; }
.pl {
  background: var(--card); border: 3px solid var(--line); border-radius: 22px; padding: 6px 10px;
  display: flex; align-items: center; gap: 8px; min-width: 0;
}
.pl img { width: 40px; height: 40px; flex: none; }
.pl .lab { font-size: 12px; color: var(--ink-soft); line-height: 1; }
.pl .num { font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.pl.me { border-bottom-color: var(--pink-deep); }
.pl.fr { border-bottom-color: var(--mint-deep); flex-direction: row-reverse; text-align: right; }
.mv { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 6px; }
.mv .lab { font-size: 12px; color: var(--ink-soft); }
.mv .num { font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.goal { width: 100%; display: flex; flex-direction: column; gap: 4px; }
.bar { position: relative; height: 18px; border-radius: 999px; background: rgba(255, 255, 255, .85); border: 3px solid var(--line); }
.bar i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--pink), var(--butter-deep)); transition: width .4s; }
.bar b { position: absolute; top: 50%; transform: translate(-50%, -50%); font-size: 20px; color: #D9CFE0; line-height: 1; text-shadow: 0 0 0 #fff; }
.bar b.on { color: var(--butter-deep); transform: translate(-50%, -50%) scale(1.25); }
#goalTxt { font-size: 13px; color: var(--ink-soft); text-align: center; }
#boardWrap { flex: 1; min-height: 0; width: 100%; display: grid; place-items: center; position: relative; }
#cv { touch-action: none; display: block; border-radius: 22px; }
#frame {
  padding: 10px; border: 4px solid #fff; border-radius: 32px; background-color: #FFC9DA;
  background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.6) 0 10px, transparent 10px 20px), repeating-linear-gradient(90deg, rgba(255,255,255,.6) 0 10px, transparent 10px 20px);
  box-shadow: 0 8px 0 rgba(242, 140, 174, .5); outline: 3px dashed rgba(255,255,255,.95); outline-offset: -10px;
}
#toast {
  position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.6); opacity: 0; pointer-events: none;
  font-family: var(--font-display); font-size: 34px; color: var(--ink); background: #fff; padding: 6px 22px;
  border-radius: 999px; border: 3px solid var(--pink-deep); white-space: nowrap;
}
#toast.go { animation: pop 1.1s ease-out; }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.5); } 18% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 70% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -80%) scale(1); } }
.foot { display: flex; gap: 10px; padding-bottom: 4px; }

/* 결과 */
#result {
  position: fixed; inset: 0; background: rgba(255, 243, 234, .88); display: grid; place-items: center;
  padding: 16px; z-index: 5; border-radius: 0;
}
.sheet {
  background: #fff; border-radius: 32px; border: 3px solid var(--pink); padding: 22px 18px;
  width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; gap: 12px;
  box-shadow: 0 8px 0 rgba(242, 140, 174, .35);
}
.stars { display: flex; gap: 6px; font-size: 52px; line-height: 1; }
.stars span { color: #E9DFEE; }
.stars span.on { color: var(--butter-deep); animation: starpop .5s backwards; }
.stars span.on:nth-child(2) { animation-delay: .15s; }
.stars span.on:nth-child(3) { animation-delay: .3s; }
@keyframes starpop { from { transform: scale(0) rotate(-40deg); } }
.tally { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center; width: 100%; font-variant-numeric: tabular-nums; }
.tally img { width: 36px; height: 36px; }
.tally .num { font-size: 24px; text-align: right; }
.tally .tot { grid-column: 1 / -1; border-top: 2px dashed var(--bg2); padding-top: 8px; display: flex; justify-content: space-between; font-family: var(--font-display); font-size: 22px; }
.sheet .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
@media (prefers-reduced-motion: reduce) {
  .logo img, #toast.go, .stars span.on { animation: none; }
  #toast.go { opacity: 1; transform: translate(-50%, -50%); }
}
@media (max-height: 640px) { h1 { font-size: 34px; } .logo img { width: 68px; height: 68px; } .code { font-size: 44px; } }

/* 아기자기 장식 */
#deco { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
#deco span { position: absolute; opacity: .42; animation: drift var(--d, 9s) ease-in-out infinite alternate; }
@keyframes drift { to { transform: translate(var(--dx, 12px), var(--dy, -18px)) rotate(var(--rot, 12deg)); } }
.bunting { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); height: 34px; z-index: 2; pointer-events: none; display: flex; }
.bunting::before { content: ""; position: absolute; left: 0; right: 0; top: 2px; border-top: 2px solid rgba(133, 112, 138, .35); border-radius: 50%; height: 6px; }
.bunting i { flex: 1; margin-top: 4px; clip-path: polygon(6% 0, 94% 0, 50% 100%); animation: sway 3s ease-in-out infinite alternate; transform-origin: 50% 0; }
.bunting i:nth-child(even) { animation-delay: -1.5s; }
@keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
h1 span { display: inline-block; text-shadow: -2px 0 #fff, 2px 0 #fff, 0 -2px #fff, 0 2px #fff, 0 6px 0 rgba(133, 112, 138, .25); animation: bob 2.2s ease-in-out infinite; }
h1 span:nth-child(1) { color: #F28CAE; } h1 span:nth-child(2) { color: #F2A93B; animation-delay: -.3s; }
h1 span:nth-child(3) { color: #6FBF9A; animation-delay: -.6s; } h1 span:nth-child(4) { color: #8F7FE0; animation-delay: -.9s; }
.bump { animation: bump .35s; transform-origin: left center; }
@keyframes bump { 40% { transform: scale(1.25); } }
.pl.me img.jig, .pl.fr img.jig { animation: jig .5s; }
@keyframes jig { 30% { transform: rotate(-14deg) scale(1.15); } 60% { transform: rotate(10deg) scale(1.1); } }
.sheet { margin-top: 34px; }
.pals { display: flex; justify-content: center; margin-top: -62px; }
.pals img { width: 76px; height: 76px; margin: 0 -4px; background: #fff; border-radius: 50%; border: 3px solid var(--pink); padding: 4px; }
.char[aria-pressed="true"] img { animation: bob 1.6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { #deco span, .bunting i, h1 span, .bump, .jig, .char[aria-pressed="true"] img { animation: none !important; } }

/* 도파민 */
.fv { position: relative; height: 18px; border-radius: 999px; background: rgba(255,255,255,.85); border: 3px solid #fff; overflow: hidden; width: 100%; }
.fv i { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #FFD84D, #FF8FB1, #B9A6F0, #8FC9F2, #FFD84D); background-size: 200% 100%; transition: width .3s; animation: flow 2s linear infinite; }
@keyframes flow { to { background-position: -200% 0; } }
.fv span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-size: 12px; color: var(--ink); text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
body.fever { background-color: #FFE3F1; }
body.fever #frame { box-shadow: 0 0 0 4px #FFD84D, 0 0 26px 6px rgba(255,140,200,.85), 0 8px 0 rgba(242,140,174,.5); animation: glow .8s ease-in-out infinite alternate; }
@keyframes glow { to { box-shadow: 0 0 0 4px #fff, 0 0 40px 12px rgba(255,200,80,.9), 0 8px 0 rgba(242,140,174,.5); } }
.shake { animation: shake .4s; }
@keyframes shake { 20% { transform: translate(-6px, 3px); } 40% { transform: translate(6px, -3px); } 60% { transform: translate(-4px, -2px); } 80% { transform: translate(3px, 2px); } }
#lucky { position: absolute; inset: 0; display: grid; place-items: center; z-index: 4; pointer-events: none; background: rgba(255,255,255,.4); border-radius: 28px; }
.lk { background: #fff; border: 4px solid #FFC400; border-radius: 28px; padding: 14px 24px; text-align: center; box-shadow: 0 8px 0 #F2A900, 0 0 30px rgba(255,196,0,.7); }
.lk small { display: block; font-size: 14px; color: var(--ink-soft); }
.lk b { font-family: var(--font-display); font-weight: 400; font-size: 28px; white-space: nowrap; }
#lucky.landed .lk { animation: landed .5s; }
@keyframes landed { 0% { transform: scale(.7) rotate(-6deg); } 60% { transform: scale(1.2) rotate(3deg); } 100% { transform: scale(1); } }
.pick { gap: 8px; }
.char { font-size: 15px; padding: 8px 2px 6px; border-radius: 20px; min-width: 0; }
.char img { width: 54px; height: 54px; }
.char small { font-size: 11px; }
.logo img { width: 72px; height: 72px; }
@media (prefers-reduced-motion: reduce) { .fv i, body.fever #frame, .shake, #lucky.landed .lk { animation: none !important; } }

#late { position: absolute; inset: 0; display: grid; place-items: center; z-index: 6; background: rgba(74, 53, 80, .42); border-radius: 28px; cursor: pointer; padding: 10px; }
.lt { position: relative; background: #fff; border: 4px solid var(--pink-deep); border-radius: 28px; padding: 20px 22px 14px; text-align: center; max-width: 100%; box-shadow: 0 8px 0 rgba(242, 140, 174, .55); }
.lt small { display: block; font-size: 15px; color: var(--ink-soft); }
.lt b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 30px; margin: 8px 0 6px; text-wrap: balance; }
.lt i { font-style: normal; font-size: 12px; color: var(--ink-soft); }
.lt::before, .lt::after { position: absolute; font-size: 28px; color: var(--pink-deep); animation: note 1.6s ease-in-out infinite alternate; }
.lt::before { content: "♪"; left: -10px; top: -18px; } .lt::after { content: "♫"; right: -8px; bottom: 10px; animation-delay: -.8s; color: #8F7FE0; }
@keyframes note { to { transform: translateY(-10px) rotate(12deg); } }
#late.in .lt { animation: landed .55s; }
@media (prefers-reduced-motion: reduce) { .lt::before, .lt::after, #late.in .lt { animation: none; } }
.invite { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.invite a.btn { display: inline-flex; align-items: center; text-decoration: none; }

.tabs { display: flex; gap: 6px; width: 100%; }
.tabs button { flex: 1; min-height: 40px; border: 3px solid #fff; border-radius: 999px; background: var(--card); font-family: var(--font-display); font-size: 15px; }
.tabs button[aria-pressed="true"] { background: var(--pink); border-color: var(--pink-deep); }
.ranklist { list-style: none; margin: 0; padding: 0; width: 100%; flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.ranklist li { display: grid; grid-template-columns: 34px 46px 1fr auto; gap: 10px; align-items: center; background: var(--card); border: 3px solid #fff; border-radius: 20px; padding: 6px 12px 6px 8px; }
.ranklist li.me { border-color: var(--pink-deep); background: #fff; }
.ranklist .no { font-family: var(--font-display); font-size: 22px; text-align: center; color: var(--ink-soft); }
.ranklist li:nth-child(1) .no { color: #E5A400; } .ranklist li:nth-child(2) .no { color: #9AA3B5; } .ranklist li:nth-child(3) .no { color: #C57F4A; }
.ranklist img { width: 44px; height: 44px; }
.ranklist .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ranklist .vl { font-family: var(--font-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.back { align-self: flex-start; display: inline-flex; align-items: center; text-decoration: none; }
.nick { display: flex; align-items: center; gap: 10px; width: 100%; font-family: var(--font-display); }
.nick input { flex: 1; min-width: 0; height: 44px; border-radius: 999px; border: 3px solid var(--line); background: var(--card); padding: 0 18px; font-family: var(--font-display); font-size: 18px; color: var(--ink); text-align: center; }
#home { padding-top: 0; }

/* 꽃 축제 단계 */
body.flower { background-color: #FFF0F6; }
body.flower #frame { background-color: #CDEFD0; box-shadow: 0 8px 0 rgba(111,191,154,.55); }
#goalTxt { white-space: pre-line; }
.bq { max-width: 100%; height: auto; }
</style>
<style>:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }</style>
</head>
<body>


<div id="deco" aria-hidden="true"></div>
<div class="bunting" id="bunting" aria-hidden="true"></div>
<div id="app">
  <section id="home" class="screen">
    <a class="btn small ghost back" href="../">← 게임 선택</a>
    <div class="logo"><img id="logoDog" alt="" width="92" height="92"><img id="logoCapy" alt="" width="92" height="92"><img id="logoFrog" alt="" width="92" height="92"><img id="logoCat" alt="" width="92" height="92"></div>
    <h1 aria-label="멍냥 카페"><span>멍</span><span>냥</span> <span>카</span><span>페</span></h1>
    <p class="sub">각자 폰으로 한 팀이 되어<br>같이 점수를 모아요</p>
    <div class="pick" role="group" aria-label="캐릭터 고르기">
      <button class="char" id="pickDog" aria-pressed="true"><img alt="" width="64" height="64">멍멍이<small>푸들 팀</small></button>
      <button class="char" id="pickCapy" aria-pressed="false"><img alt="" width="64" height="64">카피바라<small>느긋한 먹보</small></button>
      <button class="char" id="pickFrog" aria-pressed="false"><img alt="" width="64" height="64">개구리<small>고기 먹자~</small></button>
      <button class="char" id="pickCat" aria-pressed="false"><img alt="" width="64" height="64">냥이<small>고양이 팀</small></button>
    </div>
    <label class="nick"><span>내 이름</span><input id="nick" maxlength="12" placeholder="랭킹에 보여요" autocomplete="off" spellcheck="false"></label>
    <div class="stack">
      <button class="btn" id="btnCreate">방 만들기</button>
      <div class="join">
        <input id="codeIn" maxlength="4" placeholder="친구가 알려준 코드" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="방 코드">
        <button class="btn mint" id="btnJoin">들어가기</button>
      </div>
      <button class="btn ghost" id="btnSolo">혼자 연습하기</button>
      <button class="btn mint" id="btnRank">랭킹 보기</button>
    </div>
    <p class="note" id="homeNote"></p>
  </section>

  <section id="rank" class="screen" hidden>
    <h2>랭킹</h2>
    <div class="tabs" id="rankTabs">
      <button data-tab="best" aria-pressed="true">최고 점수</button><button data-tab="stage" aria-pressed="false">최고 단계</button><button data-tab="team" aria-pressed="false">팀 기록</button>
    </div>
    <ol class="ranklist" id="rankList"></ol>
    <p class="note" id="rankNote"></p>
    <button class="btn ghost" id="btnRankBack">돌아가기</button>
  </section>

  <section id="lobby" class="screen" hidden>
    <h2>방 코드</h2>
    <div class="code" id="codeShow" aria-live="polite"></div>
    <button class="btn small ghost" id="btnCopy">코드 복사</button>
    <div class="invite"><button class="btn small mint" data-who="자기야">자기야 같이하자</button><a class="btn small ghost sms" data-who="자기야" href="#">문자로 보내기</a></div>
    <div class="seats">
      <div class="seat" id="seatMe"><img alt="" width="72" height="72"><span class="who">나</span><span class="st" id="stMe"></span></div>
      <div class="seat empty" id="seatFr"><img alt="" width="72" height="72"><span class="who" id="whoFr">친구</span><span class="st" id="stFr">기다리는 중…</span></div>
    </div>

  $('codeShow').textContent = S.code;

  $('stMe').textContent = S.readyFor != null ? '준비 완료!' : '준비 중';
  $('seatMe').classList.toggle('ok', S.readyFor != null);
  const f = S.friend, seat = $('seatFr');
  seat.classList.toggle('empty', !f);
  seat.querySelector('img').src = portrait(f ? CHAR_T[friendCh()] : CHAR_T[S.ch === 'dog' ? 'cat' : 'dog']);
  $('whoFr').textContent = f ? NAMES[friendCh()] : '친구';
  const fr = f && f.presence.readyFor != null && f.presence.readyFor >= S.games + 1;
  $('stFr').textContent = !f ? '기다리는 중…' : fr ? '준비 완료!' : '준비 중';
  seat.classList.toggle('ok', !!fr);
  $('btnReady').disabled = !f || S.readyFor != null;
  $('btnReady').textContent = S.readyFor != null ? '친구를 기다려요…' : '준비 완료!';
  $('lobbyNote').textContent = f ? '둘 다 준비하면 바로 시작해요.' : '친구가 같은 링크를 열고 이 코드를 입력하면 들어와요.';
}
const CODE_CHARS = 'abcdefghjkmnpqrstuvwxyz23456789';
async function enterRoom(code) {
  if (!roomNs) { $('homeNote').textContent = '같이하기를 불러오지 못했어요. 새로고침해 보세요.'; return; }
  $('homeNote').textContent = '방에 들어가는 중…';
  try { S.room = await roomNs.join('cafe-' + code); } catch (e) { S.room = null; $('homeNote').textContent = '방에 들어가지 못했어요. 잠시 뒤에 다시 해봐요.'; return; }
  $('homeNote').textContent = '';
  S.mode = 'duo'; S.code = code; S.readyFor = null; S.friend = null; S.games = 0; S.stage = 1;
  S.room.onPeers(onPeers);
  S.room.presence({ ch: S.ch, stage: 1, games: 0, readyFor: null, score: 0, moves: MOVES, done: false }).catch(() => {});
  show('lobby'); renderLobby(); onPeers();
}
async function leaveRoom() {
  clearHint(); S.playing = false;
  if (S.room) { try { await S.room.leave(); } catch (_) { /* 무시 */ } }
  S.room = null; S.friend = null; S.readyFor = null; S.mode = 'solo'; $('result').hidden = true;
  show('home');
}

/* ---------- 버튼 ---------- */
function pick(ch) {
  S.ch = ch; for (const [k, id] of [['dog', 'pickDog'], ['capy', 'pickCapy'], ['frog', 'pickFrog'], ['cat', 'pickCat']]) $(id).setAttribute('aria-pressed', ch === k);
  try { localStorage.setItem('mn-ch', ch); } catch (_) { /* 무시 */ }
}
$('pickDog').onclick = () => pick('dog');
$('pickCapy').onclick = () => pick('capy');
$('pickFrog').onclick = () => pick('frog');
$('pickCat').onclick = () => pick('cat');
$('btnCreate').onclick = () => { let code = ''; for (let i = 0; i < 4; i++) code += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]; enterRoom(code); };
$('btnJoin').onclick = () => {
  const code = $('codeIn').value.toLowerCase().replace(/[^a-z0-9]/g, '');
  if (code.length !== 4) { $('homeNote').textContent = '코드는 4글자예요.'; return; }
  enterRoom(code);
};
$('codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnJoin').click(); });
$('btnSolo').onclick = () => { S.mode = 'solo'; S.stage = 1; S.games = 0; S.readyFor = null; startGame(); };
$('btnReady').onclick = () => { S.readyFor = S.games + 1; publish(); renderLobby(); tryStart(); };
$('btnLeave').onclick = leaveRoom;
$('btnCopy').onclick = () => {
  const b = $('btnCopy');
  const done = ok => { b.textContent = ok ? '복사했어요!' : '코드를 직접 알려 주세요'; setTimeout(() => { b.textContent = '코드 복사'; }, 1800); };
  try { navigator.clipboard.writeText(S.code).then(() => done(true), () => done(false)); } catch (_) { done(false); }
};
/* ---------- 랭킹 (Supabase) ---------- */
const GAME_ID = 'match-1';
let SB = null, rankRows = [], rankTab = 'best';
function initRank() { SB = MN.client(); if (SB) fetchRanks(); }
async function fetchRanks() {
  if (SB) { try { const { data, error } = await SB.rpc('game_ranks', { p_game: GAME_ID, p_pid: MN.pid() }); if (!error && Array.isArray(data)) rankRows = data; } catch (_) { /* 무시 */ } }
  if (S.screen === 'rank') renderRank();
  updateResultRank();
}
const rankVal = (d, tab) => num(d[tab]);
function rankSorted(tab) { return rankRows.filter(d => rankVal(d, tab) > 0).sort((a, b) => rankVal(b, tab) - rankVal(a, tab) || num(b.games) - num(a.games)); }
function recordResult(total, cleared) {
  if (!SB) return;
  S.newRecord = S.score > num((rankRows.find(d => d.me) || {}).best);
  SB.rpc('game_submit', {
    p_game: GAME_ID, p_pid: MN.pid(), p_nm: MN.nick() || '익명', p_ch: S.ch,
    p_score: Math.min(Math.round(S.score), 300000), p_team: S.mode === 'duo' ? Math.min(Math.round(total), 600000) : 0, p_stage: cleared ? S.stage : 0
  }).then(() => fetchRanks(), () => {});
}
function updateResultRank() {
  const el = $('resRank'); if (!el) return;
  if (!SB) { el.textContent = ''; return; }
  const list = rankSorted('best'), i = list.findIndex(d => d.me);
  el.textContent = i >= 0 ? `${S.newRecord ? '신기록! ' : ''}내 최고 점수 ${fmt(num(list[i].best))} · 전체 ${i + 1}위` : '';
}
function renderRank() {
  const ol = $('rankList'), note = $('rankNote');
  for (const b of document.querySelectorAll('#rankTabs button')) b.setAttribute('aria-pressed', b.dataset.tab === rankTab);
  ol.textContent = '';
  if (!SB) { note.textContent = '랭킹을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'; return; }
  const list = rankSorted(rankTab).slice(0, 30);
  note.textContent = list.length ? '' : '아직 기록이 없어요. 한 판 해서 1등이 되어 봐요!';
  const unit = rankTab === 'stage' ? '단계' : '';
  list.forEach((d, i) => {
    const li = document.createElement('li'); if (d.me) li.className = 'me';
    const no = document.createElement('span'); no.className = 'no'; no.textContent = i + 1;
    const im = document.createElement('img'); im.alt = ''; im.width = im.height = 44;
    const ch = (d.ch === 'cat' || d.ch === 'capy' || d.ch === 'frog') ? d.ch : 'dog'; im.src = portrait(CHAR_T[ch]);
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = (String(d.nm || '').slice(0, 12) || NAMES[ch]) + (d.me ? ' (나)' : '');
    const vl = document.createElement('span'); vl.className = 'vl'; vl.textContent = fmt(rankVal(d, rankTab)) + unit;
    li.append(no, im, nm, vl); ol.appendChild(li);
  });
}
$('btnRank').onclick = () => { show('rank'); fetchRanks(); renderRank(); };
$('btnRankBack').onclick = () => show('home');
for (const b of document.querySelectorAll('#rankTabs button')) b.onclick = () => { rankTab = b.dataset.tab; renderRank(); };
const GAME_URL = new URL('../', location.href).href;
for (const b of document.querySelectorAll('.invite button')) b.onclick = () => {
  const msg = `${b.dataset.who} 멍냥 카페 같이하자~ 🐾\n방 코드: ${S.code}\n링크: ${GAME_URL}\n(링크 열고 코드 4글자 입력하면 돼!)`;
  const old = b.textContent;
  const ok = () => { b.textContent = '복사했어요! 카톡에 붙여넣기'; setTimeout(() => { b.textContent = old; }, 2500); };
  const no = () => { $('lobbyNote').textContent = msg; };
  try { navigator.clipboard.writeText(msg).then(ok, no); } catch (_) { no(); }
};
const inviteMsg = who => `${who} 멍냥 카페 같이하자~ 🐾\n방 코드: ${S.code}\n링크: ${GAME_URL}\n(링크 열고 코드 4글자 입력하면 돼!)`;
for (const a of document.querySelectorAll('a.sms')) a.addEventListener('click', () => {
  const msg = inviteMsg(a.dataset.who);
  a.href = 'sms:?&body=' + encodeURIComponent(msg);
  try { navigator.clipboard.writeText(msg); } catch (_) { /* 무시 */ }
  $('lobbyNote').textContent = '문자 앱이 안 열리면 붙여넣기 하세요. 문구는 복사해 뒀어요.';
});
let quitArm = 0;
$('btnQuit').onclick = () => {
  const b = $('btnQuit');
  if (!quitArm) { b.textContent = '정말 그만할까요?'; quitArm = setTimeout(() => { quitArm = 0; b.textContent = '그만하기'; }, 3000); return; }
  clearTimeout(quitArm); quitArm = 0; b.textContent = '그만하기'; leaveRoom();
};
$('btnHome').onclick = leaveRoom;
$('btnSound').onclick = () => {
  muted = !muted; try { localStorage.setItem('mn-mute', muted ? '1' : '0'); } catch (_) { /* 무시 */ }
  $('btnSound').textContent = muted ? '소리 꺼짐' : '소리 켜짐';
  if (!muted) { ac(); SFX.swap(); buzz(15); }
};
document.addEventListener('pointerdown', () => { if (!muted) ac(); });
const musicText = () => { $('btnMusic').textContent = MN.bgm.isOn() ? '음악 켜짐' : '음악 꺼짐'; };
$('btnMusic').onclick = () => { MN.bgm.toggle(); musicText(); };
musicText();
$('btnNext').onclick = () => {
  if (S.cleared) S.stage++;
  $('result').hidden = true;
  if (S.mode === 'solo') { startGame(); return; }
  S.readyFor = null; S.playing = false; publish({ stage: S.stage, done: false });
  show('lobby'); renderLobby();
};

/* ---------- 시작 ---------- */
(async function boot() {
  try { muted = localStorage.getItem('mn-mute') === '1'; } catch (_) { /* 무시 */ }
  $('btnSound').textContent = muted ? '소리 꺼짐' : '소리 켜짐';
  await loadImgs();
  try { const v = localStorage.getItem('mn-ch'); if (v === 'dog' || v === 'cat' || v === 'capy' || v === 'frog') S.ch = v; } catch (_) { /* 무시 */ }
  $('pickDog').querySelector('img').src = portrait(0);
  $('pickCat').querySelector('img').src = portrait(1);
  $('pickCapy').querySelector('img').src = portrait(6);
  $('pickFrog').querySelector('img').src = portrait(7); $('logoFrog').src = portrait(7);
  $('logoDog').src = portrait(0); $('logoCapy').src = portrait(6); $('logoCat').src = portrait(1);
  const deco = $('deco'), icons = ['🐾', '☁️', '⭐', '🧁', '🍩', '☕', '🍓', '🍪', '🌸', '🐾', '🥐', '🍊', '☁️', '⭐'];
  icons.forEach((ic, i) => {
    const sp = document.createElement('span'); sp.textContent = ic;
    sp.style.cssText = `left:${(i * 37 + 8) % 92}%;top:${(i * 53 + 6) % 90}%;font-size:${20 + (i * 7) % 18}px;--d:${7 + (i * 3) % 6}s;--dx:${(i % 3 - 1) * 18}px;--dy:${-14 - (i % 4) * 6}px;--rot:${(i % 5 - 2) * 8}deg`;
    deco.appendChild(sp);
  });
  ['#FFB3C9', '#FFE08A', '#BDE8D3', '#CDBFF5', '#BFE1F7'].forEach(() => 0);
  const flags = ['#FFB3C9', '#FFE08A', '#BDE8D3', '#CDBFF5', '#BFE1F7'];
  for (let i = 0; i < 14; i++) { const f = document.createElement('i'); f.style.background = flags[i % 5]; $('bunting').appendChild(f); }
  pick(S.ch);
  $('nick').value = MN.nick(); $('nick').addEventListener('input', () => MN.setNick($('nick').value));
  requestAnimationFrame(frame);
  initRank();
  roomNs = makeRoomNs();
  if (!roomNs) $('homeNote').textContent = '같이하기를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 보세요. 혼자 연습은 바로 돼요.';
})();
</script>
