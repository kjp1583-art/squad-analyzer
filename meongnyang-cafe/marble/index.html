<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D9F0FF">
<title>여행마블 · 상준♡투이 게임천국</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
:root {
  --bg1: #EAF6FF; --bg2: #D7ECFA; --bg3: #FFDDE8; --ink: #4A3550; --ink-soft: #85708A;
  --card: rgba(255, 255, 255, .86); --line: #FFFFFF; --pink: #FFB3C9; --pink-deep: #F28CAE;
  --mint: #BDE8D3; --mint-deep: #8FD0B3; --sun: #FFC93C; --sun-deep: #F2A900; --p0: #F28CAE; --p1: #5FA8E8;
  --font-display: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-body: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background-color: var(--bg1); color: var(--ink); font-family: var(--font-body); font-size: 16px;
  background-image: radial-gradient(circle at 10% 6%, var(--bg2) 0, transparent 40%), radial-gradient(circle at 92% 94%, var(--bg3) 0, transparent 42%), radial-gradient(circle, rgba(255,255,255,.7) 2px, transparent 2.5px);
  background-size: auto, auto, 28px 28px; background-attachment: fixed;
  padding-inline: max(10px, env(safe-area-inset-left, 0px)) max(10px, env(safe-area-inset-right, 0px)); padding-block: 6px 18px; -webkit-tap-highlight-color: transparent;
}
h1, h2, .num { font-family: var(--font-display); font-weight: 400; margin: 0; }
p { margin: 0; }
button, a.btn { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.btn { font-family: var(--font-display); font-size: 19px; min-height: 50px; padding: 0 22px; border: 0; border-radius: 999px; background: var(--pink); color: var(--ink); box-shadow: 0 5px 0 var(--pink-deep); transition: transform .08s, box-shadow .08s; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--pink-deep); }
.btn.sun { background: var(--sun); box-shadow: 0 5px 0 var(--sun-deep); } .btn.sun:active { box-shadow: 0 1px 0 var(--sun-deep); }
.btn.mint { background: var(--mint); box-shadow: 0 5px 0 var(--mint-deep); } .btn.mint:active { box-shadow: 0 1px 0 var(--mint-deep); }
.btn.ghost { background: var(--card); box-shadow: 0 5px 0 rgba(133,112,138,.25); font-size: 16px; }
.btn.small { min-height: 38px; font-size: 14px; padding: 0 14px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
#app { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; position: relative; }
.bunting { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); height: 20px; z-index: 0; pointer-events: none; display: flex; opacity: .9; }
.bunting i { flex: 1; clip-path: polygon(6% 0, 94% 0, 50% 100%); }
.bar { display: flex; gap: 8px; align-items: center; padding-top: 14px; position: relative; z-index: 1; }
.bar .sp { flex: 1; }
.pcards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pc { display: grid; grid-template-columns: 38px 1fr; gap: 2px 8px; align-items: center; background: var(--card); border: 3px solid var(--line); border-radius: 18px; padding: 4px 8px; min-width: 0; }
.pc.turn { border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 30%, transparent); }
.pc img { grid-row: span 2; width: 38px; height: 38px; object-fit: contain; }
.pc .nm { font-size: 13px; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc .cash { font-family: var(--font-display); font-size: 19px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.pc small { color: var(--ink-soft); font-size: 11px; }
#boardWrap { position: relative; }
#board { position: relative; width: 100%; aspect-ratio: 1; display: grid; grid-template: repeat(9, 1fr) / repeat(9, 1fr); gap: 2px; background: #fff; border: 3px solid #fff; border-radius: 18px; box-shadow: 0 6px 0 rgba(95,168,232,.28); padding: 2px; touch-action: manipulation; }
.tile { position: relative; background: #fff; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; padding: 0; border: 2px solid transparent; min-width: 0; cursor: pointer; font-family: var(--font-body); }
.tile .band { align-self: stretch; height: 22%; min-height: 5px; background: var(--g, #ddd); position: relative; }
.tile .fl { position: absolute; right: 1px; top: -1px; font-size: 6.5px; line-height: 1; }
.tile .em { font-size: clamp(11px, 3.4vw, 17px); line-height: 1.05; margin-top: 1px; }
.tile .tn { font-size: clamp(6.5px, 2vw, 9.5px); line-height: 1.05; font-weight: 700; word-break: keep-all; padding: 0 1px; }
.tile .pr { font-size: clamp(6px, 1.7vw, 8.5px); color: var(--ink-soft); line-height: 1; }
.tile .lv { position: absolute; left: 1px; bottom: 0; font-size: 8px; line-height: 1; }
.tile.corner { background: #FFF6DA; justify-content: center; } .tile.corner .em { font-size: clamp(16px, 5vw, 26px); margin: 0; }
.tile.key { background: #FFF1B8; justify-content: center; }
.tile.o0 { border-color: var(--p0); background: color-mix(in srgb, var(--p0) 18%, #fff); }
.tile.o1 { border-color: var(--p1); background: color-mix(in srgb, var(--p1) 18%, #fff); }
.tile.sel { outline: 3px solid var(--ink); outline-offset: -3px; z-index: 2; }
.tile.fly { animation: blink .9s infinite alternate; }
@keyframes blink { to { background: #FFE9B8; } }
#center { grid-area: 2 / 2 / 9 / 9; border-radius: 12px; background: linear-gradient(180deg, #F4FBFF, #FFF3F8); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 6px; text-align: center; min-width: 0; overflow: hidden; }
#center .ttl { font-family: var(--font-display); font-size: clamp(15px, 4.6vw, 22px); line-height: 1.1; }
#center .rnd { font-size: clamp(10px, 3vw, 13px); color: var(--ink-soft); }
#dice { display: flex; gap: 8px; font-size: clamp(34px, 11vw, 56px); line-height: 1; }
#dice span { display: inline-block; }
#dice.roll span { animation: tumble .25s linear infinite; }
@keyframes tumble { to { transform: rotate(360deg); } }
#logbox { font-size: clamp(10px, 3.1vw, 13px); line-height: 1.35; color: var(--ink); width: 100%; word-break: keep-all; }
#logbox div { opacity: .55; } #logbox div:last-child { opacity: 1; font-weight: 700; }
.tok { position: absolute; width: calc((100% - 20px) / 9); height: calc((100% - 20px) / 9); pointer-events: none; z-index: 3; transition: left .16s linear, top .16s linear; }
.tok img { position: absolute; width: 74%; height: 74%; object-fit: contain; border-radius: 50%; background: #fff; border: 2px solid var(--c); padding: 1px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
.tok.t0 img { left: 2%; top: 2%; } .tok.t1 img { right: 2%; bottom: 2%; }
.tok.mine::after { content: ''; position: absolute; left: 50%; top: -6%; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--c); }
#info { background: var(--card); border: 3px solid var(--line); border-radius: 18px; padding: 8px 12px; font-size: 14px; line-height: 1.45; min-height: 64px; word-break: keep-all; }
#info b { font-family: var(--font-display); font-weight: 400; font-size: 17px; }
#info .vi { color: var(--ink-soft); font-size: 12.5px; }
#acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; min-height: 56px; align-items: center; }
#acts .btn { flex: 1 1 130px; max-width: 240px; }
#acts .wait { color: var(--ink-soft); font-size: 14px; }
.sheetwrap { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: 14px; background: rgba(234, 246, 255, .9); overflow-y: auto; }
.sheet { background: #fff; border-radius: 30px; border: 3px solid var(--mint-deep); padding: 20px 16px; width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; gap: 12px; box-shadow: 0 8px 0 rgba(95,168,232,.3); text-align: center; }
.sheet h1 { font-size: 34px; } .sheet h2 { font-size: 28px; }
.sheet .sub { color: var(--ink-soft); font-size: 15px; word-break: keep-all; text-wrap: balance; line-height: 1.45; }
.sheet .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.hero { display: flex; gap: 6px; font-size: 44px; animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-8px) rotate(-3deg); } }
.stack { display: flex; flex-direction: column; gap: 10px; width: 100%; align-items: stretch; }
.nick { display: flex; align-items: center; gap: 8px; width: 100%; font-family: var(--font-display); }
.nick input, .join input { flex: 1; min-width: 0; height: 46px; border-radius: 999px; border: 3px solid #D7ECFA; background: #fff; padding: 0 14px; font-family: var(--font-display); font-size: 17px; color: var(--ink); text-align: center; }
.join { display: flex; gap: 8px; } .join input { height: 50px; font-size: 18px; letter-spacing: 4px; text-transform: lowercase; }
.join input::placeholder { letter-spacing: 0; font-size: 15px; color: var(--ink-soft); font-family: var(--font-body); }
.code { font-family: var(--font-display); font-size: 48px; letter-spacing: 9px; padding: 2px 6px 2px 16px; background: #fff; border-radius: 22px; border: 3px dashed var(--pink-deep); }
.pick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; }
.pick button { background: #F4FBFF; border: 3px solid #fff; border-radius: 16px; padding: 4px 0 2px; display: flex; flex-direction: column; align-items: center; font-size: 12px; font-family: var(--font-display); }
.pick button img { width: 46px; height: 46px; object-fit: contain; }
.pick button[aria-pressed="true"] { border-color: var(--pink-deep); background: #fff; }
.pick button:disabled { opacity: .35; }
.seats { display: flex; gap: 10px; width: 100%; }
.seat { flex: 1; min-width: 0; background: #F4FBFF; border: 3px solid #fff; border-radius: 20px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.seat img { width: 48px; height: 48px; object-fit: contain; } .seat.empty img { opacity: .25; filter: grayscale(1); }
.seat .who { font-family: var(--font-display); font-size: 16px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat .st { font-size: 13px; color: var(--ink-soft); } .seat.ok { border-color: var(--mint-deep); background: #fff; }
.note { color: var(--ink-soft); font-size: 14px; min-height: 18px; }
.rules { text-align: left; font-size: 13.5px; line-height: 1.5; color: var(--ink); width: 100%; background: #F4FBFF; border-radius: 16px; padding: 8px 12px; word-break: keep-all; }
.rules b { font-family: var(--font-display); font-weight: 400; }
.big { font-family: var(--font-display); font-size: 40px; line-height: 1.1; }
.worth { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
.worth div { background: #F4FBFF; border-radius: 16px; padding: 6px; font-size: 13px; } .worth b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 20px; }
@media (prefers-reduced-motion: reduce) { .hero, .tile.fly, #dice.roll span { animation: none !important; } .tok { transition: none; } }
</style>
</head>
<body>
<div class="bunting" id="bunting" aria-hidden="true"></div>
<div id="app">
  <div class="bar">
    <a class="btn small ghost" href="../">← 게임 선택</a>
    <span class="sp"></span>
    <button class="btn small ghost" id="btnMusic" type="button">음악 켜짐</button>
    <button class="btn small ghost" id="btnSound" type="button">소리 켜짐</button>

  <div class="pcards" id="pcards"></div>
  <div id="boardWrap"><div id="board"></div></div>
  <div id="info" aria-live="polite">칸을 누르면 설명이 나와요.</div>
  <div id="acts"></div>
</div>

<div class="sheetwrap" id="homeSheet">
  <div class="sheet">
    <div class="hero" aria-hidden="true"><span>🏯</span><span>🎲</span><span>🛶</span></div>
    <h1>여행마블</h1>

    <label class="nick"><span>내 이름</span><input id="nick" maxlength="12" placeholder="이름을 적어요" autocomplete="off" spellcheck="false"></label>
    <div class="pick" id="pickHome" role="group" aria-label="내 동물 고르기"></div>
    <div class="stack">
      <button class="btn sun" id="btnCreate" type="button">방 만들기 (둘이서 온라인)</button>
      <div class="join"><input id="codeIn" maxlength="4" placeholder="친구가 알려준 코드" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="방 코드"><button class="btn mint" id="btnJoin" type="button">들어가기</button></div>
      <button class="btn ghost" id="btnSolo" type="button">혼자 컴퓨터랑 연습</button>
    </div>
    <div class="rules"><b>규칙</b> · 주사위를 굴려 말을 움직여요. 주인 없는 명소는 <b>사서</b> 내 땅으로! 내 땅에 다시 오면 <b>숙소·호텔</b>로 키워요. 남의 땅에 서면 <b>통행료</b>를 내요. 같은 도시 땅을 다 모으면 통행료 1.5배! 15라운드가 끝나거나 한 명이 파산하면 끝나고, 재산이 더 많은 쪽이 이겨요.</div>
    <p class="note" id="homeNote"></p>
  </div>
</div>

<div class="sheetwrap" id="lobbySheet" hidden>
  <div class="sheet">
    <h2>방 코드</h2>
    <div class="code" id="vsCode" aria-live="polite"></div>
    <div class="row"><button class="btn small ghost" id="btnCopy" type="button">코드 복사</button><a class="btn small ghost" id="btnSms" href="#">자기야 같이하자</a></div>
    <div class="pick" id="pickLobby" role="group" aria-label="내 동물 고르기"></div>
    <div class="seats">
      <div class="seat" id="seatMe"><img id="seatMeImg" alt="" width="48" height="48"><span class="who" id="whoMe">나</span><span class="st" id="stMe"></span></div>
      <div class="seat empty" id="seatFr"><img id="seatFrImg" alt="" width="48" height="48"><span class="who" id="whoFr">상대</span><span class="st" id="stFr">기다리는 중…</span></div>
    </div>
    <button class="btn sun" id="btnReady" type="button">준비 완료!</button>
    <button class="btn sun" id="btnStart" type="button" hidden>게임 시작!</button>
    <p class="note" id="lobbyNote"></p>
    <button class="btn ghost small" id="btnLeave" type="button">나가기</button>
  </div>
</div>

<div class="sheetwrap" id="endSheet" hidden>
  <div class="sheet">
    <h2 id="endTitle">게임 끝!</h2>
    <p class="sub" id="endWhy"></p>
    <div class="worth" id="endWorth"></div>
    <div class="row"><button class="btn sun" id="btnAgain" type="button">한 판 더</button><button class="btn ghost" id="btnEndLeave" type="button">나가기</button></div>
    <p class="note" id="endNote"></p>
  </div>
</div>

function placeTok(k) {

}
function pickTile(i) { selTile = i; renderInfo(); document.querySelectorAll('.tile').forEach(e => e.classList.toggle('sel', +e.dataset.i === i)); }
function tileInfoHtml(i) {
  const t = TILES[i], d = document.createElement('div');
  const b = document.createElement('b'); b.textContent = `${t.e} ${t.n}`; d.appendChild(b);
  if (t.t === 'p') {
    const o = S && S.own[i]; const line = document.createElement('div');
    line.textContent = `${t.c === 'KR' ? '🇰🇷 한국' : '🇻🇳 베트남'} · ${t.city} · 땅값 ${fmt(t.p)}` + (t.sp ? ` · ${t.sp}` : '');
    const vi = document.createElement('div'); vi.className = 'vi'; vi.textContent = t.vi;
    const rent = document.createElement('div'); rent.textContent = o ? `주인: ${S.pl[o[0]].nm} · ${['빈 땅', '숙소', '호텔'][o[1]]} · 통행료 ${fmt(rentOf(i))}` : `주인 없음 · 통행료 약 ${fmt(Math.round(t.p * .22 / 10) * 10)}부터`;
    d.append(line, vi, rent);
  } else { const e = document.createElement('div'); e.textContent = { start: '지나갈 때마다 +200을 받아요.', island: '여기에 서면 두 턴 쉬어요. 벌금 100을 내거나 더블이 나오면 탈출!', air: '여기에 서면 다음 턴에 원하는 칸으로 날아가요.', cafe: '서면 쉬어가며 +100.', key: '밟으면 황금열쇠 카드를 한 장 뽑아요.' }[t.t]; d.appendChild(e); }
  return d;
}
function renderInfo() {
  const el = $('info'); el.textContent = '';
  if (!S) { el.textContent = '칸을 누르면 설명이 나와요.'; return; }
  const i = selTile >= 0 ? selTile : S.pl[S.turn].pos; el.appendChild(tileInfoHtml(i));
}
function renderActs() {
  const box = $('acts'); box.textContent = ''; if (!S || S.over) return;
  const mk = (txt, cls, fn, dis) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn ' + cls; b.textContent = txt; b.disabled = !!dis; b.onclick = () => { ac(); fn(); }; box.appendChild(b); };
  const wait = txt => { const s = document.createElement('span'); s.className = 'wait'; s.textContent = txt; box.appendChild(s); };
  const p = S.pl[S.turn], mine = S.turn === ME;
  if (!mine) { wait(`${p.nm}님이 하는 중이에요…`); return; }
  if (animating) { wait('말이 움직이는 중…'); return; }
  const i = p.pos;
  if (S.phase === 'roll') mk('🎲 주사위 굴리기', 'sun', () => sendCmd('roll'));
  else if (S.phase === 'jail') { mk('🎲 더블에 도전', 'sun', () => sendCmd('roll')); mk(`벌금 ${JAIL_FEE} 내고 탈출`, 'mint', () => sendCmd('jailpay'), p.cash < JAIL_FEE); }
  else if (S.phase === 'buy') { mk(`땅 사기 (${fmt(TILES[i].p)})`, 'sun', () => sendCmd('buy')); mk('지나가기', 'ghost', () => sendCmd('pass')); }
  else if (S.phase === 'upg') { mk(`${S.own[i][1] === 0 ? '숙소' : '호텔'} 짓기 (${fmt(upCost(i))})`, 'sun', () => sendCmd('up')); mk('그냥 가기', 'ghost', () => sendCmd('pass')); }
  else if (S.phase === 'fly') { const ok = selTile >= 0 && selTile !== p.pos; mk(ok ? `✈️ ${TILES[selTile].n}(으)로 날아가기` : '✈️ 가고 싶은 칸을 눌러요', 'sun', () => sendCmd('fly', selTile), !ok); }
}
function renderPcards() {
  const box = $('pcards'); box.textContent = ''; if (!S) return;
  S.pl.forEach((p, k) => {
    const d = document.createElement('div'); d.className = 'pc' + (S.turn === k && !S.over ? ' turn' : ''); d.style.setProperty('--c', k ? 'var(--p1)' : 'var(--p0)');
    const im = document.createElement('img'); im.src = animalSrc(p.ch); im.alt = ''; im.width = im.height = 38;
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = p.nm + (k === ME ? ' (나)' : p.ai ? ' (컴퓨터)' : '');
    const cash = document.createElement('span'); cash.className = 'cash'; const props = Object.keys(S.own).filter(x => S.own[x][0] === k).length; cash.textContent = '💰 ' + fmt(p.cash) + ' ';
    const sm = document.createElement('small'); sm.textContent = `땅 ${props}`; cash.appendChild(sm); d.append(im, nm, cash); box.appendChild(d);
  });
}
function render() {
  if (!S) { $('pcards').textContent = ''; $('acts').textContent = ''; return; }
  document.querySelectorAll('.tile').forEach(el => {
    const i = +el.dataset.i, o = S.own[i]; el.classList.toggle('o0', !!o && o[0] === 0); el.classList.toggle('o1', !!o && o[0] === 1);
    el.classList.toggle('fly', S.phase === 'fly' && S.turn === ME && !animating && TILES[i].t !== 'x'); const lv = el.querySelector('.lv'); if (lv) lv.textContent = o ? ['', '🏠', '🏨'][o[1]] : '';
  });
  for (let k = 0; k < 2; k++) { const im = $('tok' + k).querySelector('img'); im.src = animalSrc(S.pl[k].ch); $('tok' + k).classList.toggle('mine', k === ME); }
  $('cTtl').textContent = S.over ? '게임 끝!' : S.turn === ME ? '내 차례!' : `${S.pl[S.turn].nm}님 차례`;
  $('cRnd').textContent = `라운드 ${Math.min(S.round, ROUNDS)} / ${ROUNDS}`;
  const dc = $('dice'); dc.querySelectorAll('span').forEach((sp, k) => { sp.textContent = '⚀⚁⚂⚃⚄⚅'[clamp(S.dice[k], 1, 6) - 1]; });
  const lb = $('logbox'); lb.textContent = ''; S.log.slice(-3).forEach(t => { const d = document.createElement('div'); d.textContent = t; lb.appendChild(d); });
  renderPcards(); handleEvents(); syncTokens(); renderInfo(); renderActs();
  if (S.over) showEnd();
}
function handleEvents() {
  if (S.v === lastV) return; lastV = S.v;
  const e = S.ev; if (e === 'roll') { SFX.roll(); buzz(10); const d = $('dice'); d.classList.add('roll'); setTimeout(() => d.classList.remove('roll'), 450); }
  else if (e === 'buy') { SFX.buy(); buzz([20, 30, 40]); } else if (e === 'pay') { SFX.pay(); buzz(40); } else if (e === 'card') { SFX.card(); buzz(15); }
}
function syncTokens() {
  for (let k = 0; k < 2; k++) {
    const target = S.pl[k].pos; if (D[k] === target) { placeTok(k); continue; }
    const tp = S.mv && S.mv.p === k && S.mv.tp;
    if (tp) { D[k] = target; placeTok(k); continue; }
    if (animQ.some(q => q.k === k)) continue;
    animQ.push({ k, to: target }); runAnim();
  }
}
function runAnim() {
  if (animating) return; const q = animQ[0]; if (!q) return; animating = true;
  const step = () => {
    if (D[q.k] === q.to) { animQ.shift(); animating = false; if (animQ.length) runAnim(); else { renderActs(); renderInfo(); } return; }
    D[q.k] = (D[q.k] + 1) % NT; placeTok(q.k); SFX.step(); setTimeout(step, 170);
  };
  renderActs(); step();
}
let endState = 0;
function showEnd() {
  if (endState) return; endState = 1;
  const go = () => { if (!S || !S.over) { endState = 0; return; } if (animating || animQ.length) { setTimeout(go, 400); return; }
    endState = 2; const w = S.win, you = w === ME;
    $('endTitle').textContent = w < 0 ? '무승부!' : you ? '내가 이겼어요! 🎉' : '아쉬워요, 졌어요'; $('endWhy').textContent = S.why;
    const box = $('endWorth'); box.textContent = ''; S.pl.forEach((p, k) => { const d = document.createElement('div'); d.textContent = p.nm + (k === ME ? ' (나)' : ''); const b = document.createElement('b'); b.textContent = '💰 ' + fmt(worth(k)); d.appendChild(b); box.appendChild(d); });
    $('btnAgain').hidden = V.online && !HOST; $('endNote').textContent = V.online && !HOST ? '방장이 한 판 더를 누르면 다시 시작해요.' : '';
    if (you) SFX.win(); else SFX.lose(); $('endSheet').hidden = false;
  };
  setTimeout(go, 700);
}

/* ---------- 버튼 ---------- */
function startSolo() { ac(); HOST = true; ME = 0; V.online = false; D = [0, 0]; animQ = []; animating = false; lastV = -1; newGame(mkPl(MN.nick() || '나', myCh, false), mkPl('컴퓨터', 'cat', true)); enterGame(); S.v++; render(); aiSoon(); }
function startOnline() {
  const f = V.friend; if (!f || !f.presence.ready) return; HOST = true; ME = 0; D = [0, 0]; animQ = []; animating = false; lastV = -1;
  newGame(mkPl(MN.nick() || '나', myCh, false), mkPl(f.presence.nm, f.presence.ch, false)); enterGame(); commit();
}
$('btnSolo').onclick = startSolo;
$('btnCreate').onclick = async () => { ac(); let c = ''; for (let i = 0; i < 4; i++) c += CODE_CHARS[rint(CODE_CHARS.length)]; HOST = true; ME = 0; await enterRoom(c); };
$('btnJoin').onclick = async () => { ac(); const c = $('codeIn').value.toLowerCase().replace(/[^a-z0-9]/g, ''); if (c.length !== 4) { $('homeNote').textContent = '코드는 4글자예요.'; return; } HOST = false; ME = 1; if (!(await enterRoom(c))) { HOST = true; ME = 0; } };
$('codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnJoin').click(); });
$('btnReady').onclick = () => { ac(); V.ready = true; pushPresence(); renderLobby(); };
$('btnStart').onclick = () => { ac(); startOnline(); };
$('btnLeave').onclick = leaveRoom; $('btnEndLeave').onclick = leaveRoom;
$('btnAgain').onclick = () => { ac(); $('endSheet').hidden = true; if (V.online) { if (HOST && V.friend) { D = [0, 0]; animQ = []; animating = false; lastV = -1; newGame(mkPl(MN.nick() || '나', myCh, false), mkPl(V.friend.presence.nm, V.friend.presence.ch, false)); commit(); } } else startSolo(); };
$('btnCopy').onclick = () => { const b = $('btnCopy'), done = ok => { b.textContent = ok ? '복사했어요!' : '코드를 직접 알려 주세요'; setTimeout(() => { b.textContent = '코드 복사'; }, 1800); }; try { navigator.clipboard.writeText(V.code).then(() => done(true), () => done(false)); } catch (_) { done(false); } };
$('btnSms').addEventListener('click', e => { e.preventDefault(); const msg = `자기야 여행마블 같이하자~ 🎲\n방 코드: ${V.code}\n링크: ${GAME_URL}\n(링크 열고 코드 4글자 입력하면 돼!)`; location.href = 'sms:?&body=' + encodeURIComponent(msg); });
$('btnSound').onclick = () => { muted = !muted; try { localStorage.setItem('mn-mute', muted ? '1' : '0'); } catch (_) { /* 무시 */ } $('btnSound').textContent = muted ? '소리 꺼짐' : '소리 켜짐'; if (!muted) { ac(); SFX.step(); } };
$('btnMusic').onclick = () => { MN.bgm.toggle(); $('btnMusic').textContent = MN.bgm.isOn() ? '음악 켜짐' : '음악 꺼짐'; };
$('nick').addEventListener('input', () => MN.setNick($('nick').value));
(function boot() {
  $('nick').value = MN.nick(); $('btnSound').textContent = muted ? '소리 꺼짐' : '소리 켜짐'; $('btnMusic').textContent = MN.bgm.isOn() ? '음악 켜짐' : '음악 꺼짐';
  const flags = ['#FFB3C9', '#FFE08A', '#BDE8D3', '#CDBFF5', '#BFE1F7'], bt = $('bunting'); for (let i = 0; i < 14; i++) { const f = document.createElement('i'); f.style.background = flags[i % 5]; bt.appendChild(f); }
  buildBoard(); drawPick('pickHome'); for (let k = 0; k < 2; k++) placeTok(k);
  window.addEventListener('resize', () => { for (let k = 0; k < 2; k++) placeTok(k); });
  V.ns = MN.roomNs(); if (!V.ns) { $('btnCreate').hidden = true; $('codeIn').parentElement.hidden = true; }
})();
</script>
