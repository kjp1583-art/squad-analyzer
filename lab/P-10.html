<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>P-10 시제품 · 지난번 대비</title><style>:root{--bg:#11131a;--card:#1b1f2b;--txt:#e7eaf3;--sub:#9aa3b8;--line:#2a3042;--acc:#5b8cff;--gold:#f5c542;--ok:#4cc38a;--bad:#ef6b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.55 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}.wrap{max-width:560px;margin:0 auto;padding:16px}.lab{background:#2a2110;border:1px solid #6b5420;color:#f5d58a;border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:14px}h1{font-size:18px;margin:4px 0 12px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}.muted{color:var(--sub);font-size:12.5px}.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 10px;margin:3px 3px 0 0;font-size:12.5px}.seg button{background:var(--card);color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font:inherit;cursor:pointer;margin:0 6px 8px 0}.seg button.on{color:var(--txt);border-color:var(--acc)}.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.w{color:var(--ok)}.l{color:var(--bad)}.bar{height:7px;background:#11131a;border-radius:4px;overflow:hidden;margin:4px 0 8px}.bar i{display:block;height:100%;background:var(--acc)}pre{white-space:pre-wrap;background:#11131a;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12.5px;margin:6px 0}button.act{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}</style></head><body><div class="wrap">
<div class="lab">🧪 P-10 시제품 — 가짜 숫자(링크 없음). 이 브라우저의 localStorage 에만 저장합니다. '방문 시뮬레이션'으로 며칠 뒤에 온 척 해 보세요.</div>
<h1>🔄 지난번 대비</h1>
<div class="card" id="head"></div>
<div class="card"><b>내 프로필(가짜)</b><div class="muted" id="now"></div>
<div style="margin-top:10px"><button class="act" onclick="play()">내전 12판 더 뛴 척하기</button> <button class="act" style="background:#3a4056" onclick="visit(9)">9일 뒤에 방문한 척</button> <button class="act" style="background:#3a4056" onclick="visit(3)">3일 뒤에 방문한 척</button> <button class="act" style="background:#3a4056" onclick="reset()">초기화</button></div></div>
<p class="muted">저장 내용: 시각·판수·승수·라인별 판/승·챔프 목록뿐. 서버 전송 없음. 저장 실패(비공개 창)면 줄을 그냥 숨깁니다.</p>
</div><script>
var KEY='lab_p10_seen',cur={g:94,w:50,pos:{'서폿':[60,26],'탑':[34,24]},ch:['럭스','리산드라','쉔']},clock=Date.now();
function ld(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function sv(o){try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
function pct(a){return a[0]?Math.round(a[1]/a[0]*100):0}
function render(){document.getElementById('now').textContent='통산 '+cur.g+'판 '+cur.w+'승 · 서폿 '+cur.pos['서폿'][0]+'판 '+pct(cur.pos['서폿'])+'% · 챔프 '+cur.ch.join('·');
 var p=ld(),h;
 if(!p){h='<span class="muted">처음 오셨네요 — 다음에 오시면 달라진 점을 알려드려요.</span>';}
 else{var d=Math.floor((clock-p.t)/864e5);
  if(d<7){h='<span class="muted">마지막 방문 '+d+'일 전 — 7일 미만이라 비교 줄은 숨겨요.</span>';}
  else{var dg=cur.g-p.g,dw=cur.w-p.w,bits=[];
   if(dg>0)bits.push(dg+'판 '+dw+'승 '+(dg-dw)+'패');
   var a=cur.pos['서폿'],b=p.pos['서폿'];if(a[0]-b[0]>=5)bits.push('서폿 승률 '+pct(b)+'→'+pct(a)+'%');
   var nw=cur.ch.filter(function(c){return p.ch.indexOf(c)<0});if(nw.length)bits.push('새 챔프 '+nw.join('·'));
   h=bits.length?'🔄 <b>마지막 방문('+d+'일 전) 이후</b> — '+bits.join(' · ')+' <br><button class="act" style="margin-top:8px" onclick="save()">지금 기준으로 다시 저장</button>':'저번과 같아요.';}}
 document.getElementById('head').innerHTML=h}
function save(){sv({t:clock,g:cur.g,w:cur.w,pos:JSON.parse(JSON.stringify(cur.pos)),ch:cur.ch.slice()});render()}
function play(){cur.g+=12;cur.w+=7;cur.pos['서폿'][0]+=8;cur.pos['서폿'][1]+=5;cur.ch.push('질리언');render()}
function visit(d){clock+=d*864e5;render()}
function reset(){try{localStorage.removeItem(KEY)}catch(e){}cur={g:94,w:50,pos:{'서폿':[60,26],'탑':[34,24]},ch:['럭스','리산드라','쉔']};clock=Date.now();render()}
if(!ld())sv({t:Date.now(),g:cur.g,w:cur.w,pos:JSON.parse(JSON.stringify(cur.pos)),ch:cur.ch.slice()}),document.getElementById('head').innerHTML='';
render();
</script></body></html>
