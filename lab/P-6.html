<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>P-6 시제품 · 브장신 서바이버</title>
<style>
:root{--bg:#11131a;--bg2:#171a23;--card:#1b1f2b;--card2:#212636;--txt:#e7eaf3;--sub:#9aa3b8;--mut:#717a91;--line:#2a3042;--acc:#5b8cff;--gold:#f5c04a;--win:#4fb3ff;--lose:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
#hud{position:fixed;left:0;right:0;top:0;padding:8px 12px;pointer-events:none;display:none}
.bar{height:8px;background:var(--card2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0}
#xpb i{background:var(--acc)} #hpb i{background:var(--lose)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;font-size:13px;font-weight:700;text-shadow:0 1px 2px #000}
#pauseBtn{pointer-events:auto;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:2px 10px;font:inherit}
#bossb{margin-top:6px;display:none}#bossb .bar i{background:var(--gold)}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(10,12,18,.78);z-index:5}
.ov.on{display:flex}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;width:100%;max-width:420px;text-align:center}
.box h1{font-size:22px;margin:4px 0}.box h2{font-size:18px;margin:0 0 10px}
.lab{display:inline-block;background:#2a2110;border:1px solid #6b5420;color:#f5d58a;border-radius:8px;padding:2px 8px;font-size:11.5px}
.how{text-align:left;color:var(--sub);font-size:13px;margin:12px 0;padding-left:18px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;width:100%;margin-top:6px}
.btn.g{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.muted{color:var(--mut);font-size:12px}
.hero{width:96px;height:96px;object-fit:contain}
.ch{display:flex;gap:10px;align-items:center;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;cursor:pointer;width:100%;color:var(--txt);font:inherit}
.ch:hover,.ch:focus{border-color:var(--acc);outline:0}
.ch .ic{font-size:26px;width:38px;text-align:center}.ch b{display:block}.ch small{color:var(--sub)}
.ch .lv{margin-left:auto;color:var(--gold);font-weight:700;font-size:12px;white-space:nowrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.stats div{background:var(--card2);border-radius:10px;padding:8px}.stats b{display:block;font-size:18px}
.stats span{color:var(--sub);font-size:12px}
.new{color:var(--gold);font-weight:700}
footer{margin-top:12px;color:var(--mut);font-size:11.5px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div class="bar" id="xpb"><i></i></div>
  <div class="hrow"><span id="hLv">Lv 1</span><span id="hTime">00:00</span><span id="hKill">💀 0</span><button id="pauseBtn">⏸</button></div>
  <div class="bar" id="hpb" style="margin-top:6px;max-width:220px"><i></i></div>
  <div id="bossb"><div class="muted" id="bossName" style="color:var(--gold)"></div><div class="bar"><i></i></div></div>
</div>

<div class="ov on" id="title"><div class="box">
  <span class="lab">🧪 P-6 시제품 · 아직 정식 기능 아님</span>
  <img class="hero" src="../img/brjang/parts/poses/happy.png" alt="브장신">
  <h1>🐤 브장신 서바이버</h1>
  <ol class="how">
    <li>WASD·방향키(폰은 화면을 끌어서)로 브장신을 움직여요.</li>
    <li>공격은 자동! 떨어진 경험치 알을 주워 레벨업하고 3개 중 하나를 골라요.</li>
    <li>3분에 중간 보스, 6분에 보스. 8분 버티면 승리!</li>
  </ol>
  <div class="muted" id="bestT">최고 기록 없음</div>
  <button class="btn" id="startBtn">▶ 시작하기</button>
  <footer>SQUAD.GG · 만든 사람: 클랜원 맛동산장인 유미</footer>
</div></div>

<div class="ov" id="lvup"><div class="box"><h2>⬆ 레벨 업! 하나 고르세요</h2><div id="choices"></div></div></div>

<div class="ov" id="pause"><div class="box"><h2>⏸ 일시정지</h2><div id="pInfo" class="muted"></div><button class="btn" id="resumeBtn">계속하기</button><button class="btn g" id="quitBtn">포기하기</button></div></div>

<div class="ov" id="result"><div class="box">
  <h2 id="rTitle">결과</h2>
  <div class="stats">
    <div><b id="rTime">0:00</b><span>생존 시간</span></div>
    <div><b id="rKill">0</b><span>처치 수</span></div>
    <div><b id="rLv">1</b><span>레벨</span></div>
    <div><b id="rBest">-</b><span>내 최고 기록</span></div>
  </div>
  <div id="rWeap" class="muted"></div>
  <button class="btn" id="againBtn">🔁 다시하기</button>
  <button class="btn g" id="homeBtn">처음으로</button>
  <footer>SQUAD.GG · 만든 사람: 클랜원 맛동산장인 유미</footer>
</div></div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'),cx=cv.getContext('2d');
let W=0,H=0,DPR=1,SC=1; // SC: world->screen scale
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR|0;cv.height=H*DPR|0;SC=Math.max(.7,Math.min(1.2,Math.min(W,H)/560));}
addEventListener('resize',resize);resize();

// ---------- assets (가볍게: 필요할 때만, 작은 캔버스로 한 번 줄여 둔다) ----------
function sprite(src,size){const o={c:null};const im=new Image();im.onload=()=>{const c=document.createElement('canvas');const r=im.width/im.height;c.width=r>=1?size:size*r|0;c.height=r>=1?size/r|0:size;c.getContext('2d').drawImage(im,0,0,c.width,c.height);o.c=c;};im.src=src;return o;}
const SPR={run:sprite('../img/brjang/parts/poses/run.png',96),front:sprite('../img/brjang/skins/base/front.png',96),egg:sprite('../img/brjang/skins/base/egg.png',32)};
let bossSpr={};
function loadBoss(k){if(!bossSpr[k])bossSpr[k]=sprite('../img/brjang/skins/boss_'+k+'/front.png',160);}

// ---------- 저장(내 브라우저에만) ----------
const BK='p6_best_v1';
function getBest(){try{return JSON.parse(localStorage.getItem(BK)||'null');}catch(e){return null;}}
function setBest(b){try{localStorage.setItem(BK,JSON.stringify(b));}catch(e){}}
const fmt=s=>{s=Math.floor(s);return String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
function showBest(){const b=getBest();$('bestT').textContent=b?`🏆 최고 기록 ${fmt(b.t)} · 처치 ${b.k} · Lv ${b.lv}`:'최고 기록 없음';}
showBest();

// ---------- 풀 ----------
function Pool(n,mk){this.a=[];for(let i=0;i<n;i++){const o=mk();o.on=false;this.a.push(o);}}
Pool.prototype.get=function(){for(const o of this.a)if(!o.on){o.on=true;return o;}return null;};
Pool.prototype.clear=function(){for(const o of this.a)o.on=false;};
const LOW=(navigator.hardwareConcurrency||4)<=4||Math.min(screen.width,screen.height)<420;
const MAXE=LOW?140:220;
const enemies=new Pool(MAXE,()=>({x:0,y:0,hp:0,mhp:0,r:10,sp:0,dmg:0,t:0,hit:0,boss:0,xp:1,kb:0,kx:0,ky:0}));
const shots=new Pool(120,()=>({x:0,y:0,vx:0,vy:0,life:0,dmg:0,pierce:0,r:6}));
const gems=new Pool(300,()=>({x:0,y:0,v:1,mag:0}));
const texts=new Pool(60,()=>({x:0,y:0,s:'',life:0,c:''}));

// ---------- 무기·패시브 ----------
const WEAP={
  feed:{ic:'🌾',nm:'사료 투척',ds:['가장 가까운 적에게 사료를 던진다','투사체 +1','피해 +40%','투사체 +1 · 관통 +1','연사 +30% · 피해 +30%']},
  fryer:{ic:'🍟',nm:'튀김기 오라',ds:['주변에 뜨거운 기름 오라(지속 피해)','범위 +20%','피해 +40%','범위 +20% · 피해 +20%','피해 +50%']},
  sushi:{ic:'🍣',nm:'아카보시 초밥',ds:['초밥이 브장신 주위를 돈다','초밥 +1','피해 +40% · 회전 빠르게','초밥 +1 · 반경 +15%','초밥 +1 · 피해 +30%']},
  egg:{ic:'🥚',nm:'달걀 폭탄',ds:['무작위 적 위치에 떨어져 터진다','폭발 범위 +25%','피해 +40%','달걀 +1','쿨타임 -30%']}
};
const PASS={
  spd:{ic:'👟',nm:'이동속도',ds:'이동속도 +10%'},
  hp:{ic:'❤️',nm:'최대 HP',ds:'최대 HP +20 (그만큼 회복)'},
  cd:{ic:'⚡',nm:'공격속도',ds:'모든 무기 쿨타임 -8%'},
  mag:{ic:'🧲',nm:'획득 범위',ds:'경험치 줍는 범위 +30%'},
  arm:{ic:'🛡',nm:'깃털 갑옷',ds:'받는 피해 -1'}
};
const MAXLV=5,MAXPASS=5;

let S=null,state='title',keys={},joy={on:false,id:null,ox:0,oy:0,dx:0,dy:0};
function newRun(){
  enemies.clear();shots.clear();gems.clear();texts.clear();
  S={t:0,kills:0,lv:1,xp:0,need:4,pendingLv:0,
     p:{x:0,y:0,r:16,hp:100,mhp:100,sp:150,face:1,inv:0,moving:false},
     w:{feed:1},ps:{},cd:{feed:0,egg:0},aura:0,spawnT:0,mid:false,boss:false,won:false,bossRef:null,booms:[],shake:0};
}
const pv=k=>S.ps[k]||0;
const cdMul=()=>Math.pow(.92,pv('cd'));

// ---------- 입력 ----------
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Escape'||e.code==='KeyP'){if(state==='play')pauseGame();else if(state==='pause')resume();}
  if(state==='lvup'&&/^Digit[123]$/.test(e.code)){const b=$('choices').children[+e.code[5]-1];b&&b.click();}});
addEventListener('keyup',e=>{keys[e.code]=false;});
cv.addEventListener('pointerdown',e=>{if(state!=='play')return;joy.on=true;joy.id=e.pointerId;joy.ox=e.clientX;joy.oy=e.clientY;joy.dx=joy.dy=0;try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener('pointermove',e=>{if(!joy.on||e.pointerId!==joy.id)return;let dx=e.clientX-joy.ox,dy=e.clientY-joy.oy;const d=Math.hypot(dx,dy),m=50;if(d>m){dx=dx/d*m;dy=dy/d*m;}joy.dx=dx/m;joy.dy=dy/m;});
const joyEnd=e=>{if(e.pointerId===joy.id){joy.on=false;joy.dx=joy.dy=0;}};
cv.addEventListener('pointerup',joyEnd);cv.addEventListener('pointercancel',joyEnd);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pauseGame();});
addEventListener('blur',()=>{if(state==='play')pauseGame();});

// ---------- 화면 전환 ----------
const ovs=['title','lvup','pause','result'];
function show(id){for(const o of ovs)$(o).classList.toggle('on',o===id);$('hud').style.display=(id==='title'||id==='result')?'none':'block';}
function start(){newRun();state='play';show(null);$('hud').style.display='block';last=performance.now();}
function pauseGame(){state='pause';keys={};joy.on=false;joy.dx=joy.dy=0;$('pInfo').textContent=`${fmt(S.t)} · Lv ${S.lv} · 처치 ${S.kills}`;show('pause');}
function resume(){state='play';show(null);$('hud').style.display='block';last=performance.now();}
$('startBtn').onclick=start;$('againBtn').onclick=start;$('resumeBtn').onclick=resume;$('pauseBtn').onclick=()=>state==='play'&&pauseGame();
$('quitBtn').onclick=()=>endRun(false);$('homeBtn').onclick=()=>{state='title';showBest();show('title');};

// ---------- 레벨업 ----------
function offers(){
  const pool=[];
  const nw=Object.keys(S.w).length;
  for(const k in WEAP){const l=S.w[k]||0;if(l>=MAXLV)continue;if(!l&&nw>=4)continue;pool.push({t:'w',k,l});}
  for(const k in PASS){const l=pv(k);if(l<MAXPASS)pool.push({t:'p',k,l});}
  for(let i=pool.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[pool[i],pool[j]]=[pool[j],pool[i]];}
  const r=pool.slice(0,3);
  if(!r.length)r.push({t:'heal'});
  return r;
}
function openLvup(){
  state='lvup';keys={};joy.on=false;joy.dx=joy.dy=0;
  const box=$('choices');box.innerHTML='';
  for(const o of offers()){
    const b=document.createElement('button');b.className='ch';
    let ic,nm,ds,lv;
    if(o.t==='w'){const d=WEAP[o.k];ic=d.ic;nm=d.nm;ds=d.ds[o.l];lv=o.l?`Lv ${o.l}→${o.l+1}`:'새 무기';}
    else if(o.t==='p'){const d=PASS[o.k];ic=d.ic;nm=d.nm;ds=d.ds;lv=`Lv ${o.l}→${o.l+1}`;}
    else{ic='🍗';nm='치킨 한 조각';ds='HP 50 회복';lv='';}
    b.innerHTML=`<span class="ic">${ic}</span><span><b>${nm}</b><small>${ds}</small></span><span class="lv">${lv}</span>`;
    b.onclick=()=>{pick(o);};
    box.appendChild(b);
  }
  show('lvup');
}
function pick(o){
  if(o.t==='w')S.w[o.k]=(S.w[o.k]||0)+1;
  else if(o.t==='p'){S.ps[o.k]=pv(o.k)+1;if(o.k==='hp'){S.p.mhp+=20;S.p.hp=Math.min(S.p.mhp,S.p.hp+20);}}
  else S.p.hp=Math.min(S.p.mhp,S.p.hp+50);
  S.pendingLv--;
  if(S.pendingLv>0)openLvup();else resume();
}
function gainXp(v){S.xp+=v;while(S.xp>=S.need){S.xp-=S.need;S.lv++;S.need=Math.floor(5+S.lv*3.2+Math.pow(S.lv,1.35));S.pendingLv++;}}

// ---------- 스폰 ----------
const KIND=[ // 미니언 종류: 색·크기·속도·HP
  {c:'#7a8cff',r:11,sp:58,hp:8,d:4,xp:1},  // 파랑 미니언
  {c:'#ff7a7a',r:11,sp:62,hp:10,d:5,xp:1}, // 빨강 미니언
  {c:'#9be36b',r:9,sp:100,hp:6,d:4,xp:1},  // 빠른 정글몹
  {c:'#c79bff',r:17,sp:45,hp:40,d:12,xp:4},// 대포 미니언
];
function spawnEnemy(kind,mult,boss){
  const e=enemies.get();if(!e)return null;
  const a=Math.random()*Math.PI*2,R=Math.hypot(W,H)/2/SC+40;
  e.x=S.p.x+Math.cos(a)*R;e.y=S.p.y+Math.sin(a)*R;
  if(boss){e.boss=boss.k;e.r=boss.r;e.sp=boss.sp;e.mhp=e.hp=boss.hp;e.dmg=boss.d;e.xp=boss.xp;e.c='#f5c04a';}
  else{const k=KIND[kind];e.boss=0;e.r=k.r;e.sp=k.sp*(1+S.t/900);e.mhp=e.hp=k.hp*mult;e.dmg=k.d+(S.t/60|0);e.xp=k.xp;e.c=k.c;}
  e.hit=0;e.kb=0;e.t=Math.random()*6;return e;
}
function waveTick(dt){
  const m=S.t/60; // 분
  const rate=1.2+m*1.6+m*m*0.12; // 초당 마릿수
  S.spawnT+=dt*rate;
  const hpMul=1+m*0.55+m*m*0.06;
  while(S.spawnT>=1){S.spawnT--;
    let k=0;const r=Math.random();
    if(m>1&&r<.3)k=2;else if(m>2&&r<.4)k=3*(Math.random()<.35)|0||1;else k=Math.random()<.5?0:1;
    spawnEnemy(k,hpMul);}
  if(!S.mid&&S.t>=180){S.mid=true;loadBoss('sr');S.bossRef=spawnEnemy(0,1,{k:'sr',r:40,sp:58,hp:900,d:18,xp:40});banner('⚠ 중간 보스 등장!');}
  if(!S.boss&&S.t>=360){S.boss=true;loadBoss('ddo');S.bossRef=spawnEnemy(0,1,{k:'ddo',r:54,sp:52,hp:4200,d:26,xp:120});banner('🔥 보스 등장!');}
  if(S.t>=480&&!S.won){S.won=true;endRun(true);}
}
let bannerT=0,bannerS='';function banner(s){bannerS=s;bannerT=2.5;}

// ---------- 전투 ----------
function hurt(e,d){
  e.hp-=d;e.hit=.08;
  const t=texts.get();if(t){t.x=e.x;t.y=e.y-e.r;t.s=String(Math.round(d));t.life=.5;t.c=e.boss?'#f5c04a':'#fff';}
  if(e.hp<=0){e.on=false;S.kills++;
    const n=e.boss?8:1;for(let i=0;i<n;i++){const g=gems.get();if(!g)break;g.x=e.x+(n>1?(Math.random()-.5)*60:0);g.y=e.y+(n>1?(Math.random()-.5)*60:0);g.v=e.boss?e.xp/n:e.xp;g.mag=0;}
    if(e===S.bossRef){S.bossRef=null;S.p.hp=Math.min(S.p.mhp,S.p.hp+30);}}
}
function nearest(){let b=null,bd=1e18;for(const e of enemies.a){if(!e.on)continue;const d=(e.x-S.p.x)**2+(e.y-S.p.y)**2;if(d<bd){bd=d;b=e;}}return b;}
function weapons(dt){
  const p=S.p,cm=cdMul();
  // 사료 투척
  const fl=S.w.feed||0;
  if(fl){S.cd.feed-=dt;if(S.cd.feed<=0){const tg=nearest();if(tg){
    const n=1+(fl>=2)+(fl>=4),dmg=10*(fl>=3?1.4:1)*(fl>=5?1.3:1),pierce=fl>=4?1:0;
    const base=Math.atan2(tg.y-p.y,tg.x-p.x);
    for(let i=0;i<n;i++){const s=shots.get();if(!s)break;const a=base+(i-(n-1)/2)*.18;s.x=p.x;s.y=p.y;s.vx=Math.cos(a)*420;s.vy=Math.sin(a)*420;s.life=1.1;s.dmg=dmg;s.pierce=pierce;s.r=6;}
    S.cd.feed=.7*cm*(fl>=5?.7:1);}}}
  // 튀김기 오라
  const al=S.w.fryer||0;
  if(al){S.aura+=dt;const R=(60*(al>=2?1.2:1)*(al>=4?1.2:1));S.auraR=R;
    if(S.aura>=.4*cm){S.aura=0;const dmg=5*(al>=3?1.4:1)*(al>=4?1.2:1)*(al>=5?1.5:1);
      for(const e of enemies.a)if(e.on&&(e.x-p.x)**2+(e.y-p.y)**2<(R+e.r)**2)hurt(e,dmg);}}
  // 아카보시 초밥 회전
  const sl=S.w.sushi||0;
  if(sl){const n=1+(sl>=2)+(sl>=4)+(sl>=5),R=70*(sl>=4?1.15:1),spd=(sl>=3?3.6:2.6)/Math.max(.6,cm),dmg=12*(sl>=3?1.4:1)*(sl>=5?1.3:1);
    S.sushiA=(S.sushiA||0)+dt*spd;S.sushi=S.sushi||[];S.sushi.length=n;
    for(let i=0;i<n;i++){const a=S.sushiA+i*Math.PI*2/n;const x=p.x+Math.cos(a)*R,y=p.y+Math.sin(a)*R;S.sushi[i]={x,y};
      for(const e of enemies.a)if(e.on&&e.kb<=0&&(e.x-x)**2+(e.y-y)**2<(e.r+12)**2){hurt(e,dmg);if(!e.boss){e.kb=.25;const d=Math.hypot(e.x-p.x,e.y-p.y)||1;e.kx=(e.x-p.x)/d*220;e.ky=(e.y-p.y)/d*220;}else e.kb=.25;}}}
  // 달걀 폭탄
  const el=S.w.egg||0;
  if(el){S.cd.egg-=dt;if(S.cd.egg<=0){const n=1+(el>=4);const live=enemies.a.filter(e=>e.on);
    for(let i=0;i<n&&live.length;i++){const e=live[Math.random()*live.length|0];S.booms.push({x:e.x,y:e.y,t:.45,R:55*(el>=2?1.25:1),d:25*(el>=3?1.4:1),done:false});}
    S.cd.egg=2.6*cm*(el>=5?.7:1);}}
  for(let i=S.booms.length-1;i>=0;i--){const b=S.booms[i];b.t-=dt;
    if(b.t<=0&&!b.done){b.done=true;S.shake=.15;for(const e of enemies.a)if(e.on&&(e.x-b.x)**2+(e.y-b.y)**2<(b.R+e.r)**2)hurt(e,b.d);}
    if(b.t<-.25)S.booms.splice(i,1);}
}

function update(dt){
  S.t+=dt;const p=S.p;
  let mx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),my=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
  if(joy.on&&(joy.dx||joy.dy)){mx=joy.dx;my=joy.dy;}
  const ml=Math.hypot(mx,my);p.moving=ml>.1;
  if(ml>1){mx/=ml;my/=ml;}
  const sp=p.sp*(1+.1*pv('spd'));p.x+=mx*sp*dt;p.y+=my*sp*dt;if(mx)p.face=mx>0?1:-1;
  if(p.inv>0)p.inv-=dt;
  waveTick(dt);if(state!=='play')return;
  weapons(dt);
  for(const s of shots.a){if(!s.on)continue;s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;if(s.life<=0){s.on=false;continue;}
    for(const e of enemies.a){if(!e.on)continue;if((e.x-s.x)**2+(e.y-s.y)**2<(e.r+s.r)**2){hurt(e,s.dmg);if(s.pierce-->0){s.x+=s.vx*.05;s.y+=s.vy*.05;}else s.on=false;break;}}}
  const arm=pv('arm');
  for(const e of enemies.a){if(!e.on)continue;e.t+=dt;if(e.hit>0)e.hit-=dt;
    if(e.kb>0){e.kb-=dt;e.x+=e.kx*dt;e.y+=e.ky*dt;e.kx*=.9;e.ky*=.9;}
    const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;
    if(d>1400&&!e.boss){e.on=false;continue;} // 너무 멀어진 잡몹 정리
    if(!(e.kb>0&&!e.boss)){e.x+=dx/d*e.sp*dt;e.y+=dy/d*e.sp*dt;}
    if(d<e.r+p.r&&p.inv<=0){p.hp-=Math.max(1,e.dmg-arm);p.inv=.45;S.shake=.12;if(p.hp<=0){p.hp=0;endRun(false);return;}}}
  const mag=(70*(1+.3*pv('mag')))**2;
  for(const g of gems.a){if(!g.on)continue;const dx=p.x-g.x,dy=p.y-g.y,d2=dx*dx+dy*dy;
    if(d2<mag)g.mag=1;if(g.mag){const d=Math.sqrt(d2)||1;g.x+=dx/d*480*dt;g.y+=dy/d*480*dt;}
    if(d2<(p.r+6)**2){g.on=false;gainXp(g.v);}}
  for(const t of texts.a)if(t.on){t.life-=dt;t.y-=40*dt;if(t.life<=0)t.on=false;}
  if(bannerT>0)bannerT-=dt;if(S.shake>0)S.shake-=dt;
  if(S.pendingLv>0)openLvup();
}

function endRun(won){
  state='result';
  const b=getBest();const cur={t:S.t,k:S.kills,lv:S.lv};let nb=false;
  if(!b||cur.t>b.t||(cur.t===b.t&&cur.k>b.k)){setBest(cur);nb=true;}
  $('rTitle').innerHTML=won?'🎉 8분 생존! 브장신 승리':'💫 브장신이 쓰러졌다…';
  $('rTime').textContent=fmt(S.t);$('rKill').textContent=S.kills;$('rLv').textContent=S.lv;
  const bb=getBest();$('rBest').innerHTML=nb?'<span class="new">신기록!</span>':(bb?fmt(bb.t):'-');
  $('rWeap').textContent='획득 무기: '+Object.keys(S.w).map(k=>`${WEAP[k].ic} ${WEAP[k].nm} Lv${S.w[k]}`).join(' · ');
  show('result');
}

// ---------- 그리기 ----------
function draw(){
  const p=S?S.p:{x:0,y:0};
  cx.setTransform(DPR,0,0,DPR,0,0);
  cx.fillStyle='#11131a';cx.fillRect(0,0,W,H);
  if(!S)return;
  let sx=0,sy=0;if(S.shake>0){sx=(Math.random()-.5)*6;sy=(Math.random()-.5)*6;}
  cx.setTransform(DPR*SC,0,0,DPR*SC,DPR*(W/2+sx),DPR*(H/2+sy));
  cx.translate(-p.x,-p.y);
  // 바닥 격자
  const vw=W/2/SC+80,vh=H/2/SC+80,g=80;
  cx.strokeStyle='#1c2030';cx.lineWidth=1;cx.beginPath();
  for(let x=Math.floor((p.x-vw)/g)*g;x<p.x+vw;x+=g){cx.moveTo(x,p.y-vh);cx.lineTo(x,p.y+vh);}
  for(let y=Math.floor((p.y-vh)/g)*g;y<p.y+vh;y+=g){cx.moveTo(p.x-vw,y);cx.lineTo(p.x+vw,y);}
  cx.stroke();
  // 오라
  if(S.w.fryer){const R=S.auraR||60;const gr=cx.createRadialGradient(p.x,p.y,R*.3,p.x,p.y,R);gr.addColorStop(0,'rgba(255,170,60,.05)');gr.addColorStop(1,'rgba(255,140,40,.28)');cx.fillStyle=gr;cx.beginPath();cx.arc(p.x,p.y,R,0,7);cx.fill();}
  // 폭탄
  for(const b of S.booms){if(b.t>0){cx.strokeStyle='rgba(245,192,74,.6)';cx.setLineDash([5,5]);cx.beginPath();cx.arc(b.x,b.y,b.R,0,7);cx.stroke();cx.setLineDash([]);if(SPR.egg.c)cx.drawImage(SPR.egg.c,b.x-10,b.y-14-b.t*80,20,24);}
    else{cx.fillStyle=`rgba(255,220,120,${Math.max(0,.5+b.t*2)})`;cx.beginPath();cx.arc(b.x,b.y,b.R,0,7);cx.fill();}}
  // 보석
  cx.fillStyle='#5bd1ff';
  for(const gm of gems.a){if(!gm.on)continue;const s=gm.v>3?6:4;cx.beginPath();cx.moveTo(gm.x,gm.y-s);cx.lineTo(gm.x+s,gm.y);cx.lineTo(gm.x,gm.y+s);cx.lineTo(gm.x-s,gm.y);cx.fill();}
  // 적
  for(const e of enemies.a){if(!e.on)continue;
    if(e.boss){const sp=bossSpr[e.boss];if(sp&&sp.c){const s=e.r*2.4;cx.drawImage(sp.c,e.x-s/2,e.y-s/2,s,s*sp.c.height/sp.c.width);}else{cx.fillStyle='#f5c04a';cx.beginPath();cx.arc(e.x,e.y,e.r,0,7);cx.fill();}
      if(e.hit>0){cx.fillStyle='rgba(255,255,255,.35)';cx.beginPath();cx.arc(e.x,e.y,e.r,0,7);cx.fill();}continue;}
    cx.fillStyle=e.hit>0?'#fff':e.c;const bob=Math.sin(e.t*8)*1.5;
    cx.beginPath();cx.moveTo(e.x,e.y-e.r+bob);cx.lineTo(e.x+e.r,e.y+e.r*.8);cx.lineTo(e.x-e.r,e.y+e.r*.8);cx.closePath();cx.fill();
    cx.fillStyle='#11131a';cx.fillRect(e.x-e.r*.45,e.y,e.r*.25,e.r*.25);cx.fillRect(e.x+e.r*.2,e.y,e.r*.25,e.r*.25);}
  // 투사체(사료)
  cx.fillStyle='#e8c46a';
  for(const s of shots.a){if(!s.on)continue;cx.beginPath();cx.arc(s.x,s.y,s.r,0,7);cx.fill();}
  // 초밥
  if(S.w.sushi&&S.sushi)for(const u of S.sushi){if(!u)continue;cx.fillStyle='#fff';cx.fillRect(u.x-11,u.y-4,22,10);cx.fillStyle='#ff6b4a';cx.fillRect(u.x-12,u.y-8,24,6);}
  // 브장신
  const spr=(p.moving?SPR.run:SPR.front).c;
  const blink=p.inv>0&&((S.t*20|0)%2);
  if(!blink){cx.save();cx.translate(p.x,p.y);if(p.face<0)cx.scale(-1,1);
    if(spr){const s=52,h=s*spr.height/spr.width;cx.drawImage(spr,-s/2,-h/2-4+(p.moving?Math.sin(S.t*18)*2:0),s,h);}
    else{cx.fillStyle='#ffd84a';cx.beginPath();cx.arc(0,0,p.r,0,7);cx.fill();}
    cx.restore();}
  // 떠오르는 숫자
  cx.font='bold 12px sans-serif';cx.textAlign='center';
  for(const t of texts.a){if(!t.on)continue;cx.globalAlpha=Math.min(1,t.life*3);cx.fillStyle=t.c;cx.fillText(t.s,t.x,t.y);}
  cx.globalAlpha=1;
  // 화면 고정 요소
  cx.setTransform(DPR,0,0,DPR,0,0);
  if(joy.on){cx.strokeStyle='rgba(255,255,255,.25)';cx.lineWidth=2;cx.beginPath();cx.arc(joy.ox,joy.oy,50,0,7);cx.stroke();cx.fillStyle='rgba(91,140,255,.5)';cx.beginPath();cx.arc(joy.ox+joy.dx*50,joy.oy+joy.dy*50,20,0,7);cx.fill();}
  if(bannerT>0){cx.globalAlpha=Math.min(1,bannerT);cx.fillStyle='#f5c04a';cx.font='bold 22px sans-serif';cx.textAlign='center';cx.fillText(bannerS,W/2,H*.3);cx.globalAlpha=1;}
}
function hud(){
  $('xpb').firstElementChild.style.width=(S.xp/S.need*100)+'%';
  $('hpb').firstElementChild.style.width=(S.p.hp/S.p.mhp*100)+'%';
  $('hLv').textContent='Lv '+S.lv;$('hTime').textContent=fmt(S.t);$('hKill').textContent='💀 '+S.kills;
  const b=S.bossRef;const bb=$('bossb');
  if(b&&b.on){bb.style.display='block';$('bossName').textContent=b.boss==='sr'?'중간 보스':'보스';bb.querySelector('i').style.width=(b.hp/b.mhp*100)+'%';}else bb.style.display='none';
}

let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;if(dt>.05)dt=.05;
  if(state==='play'){update(dt);if(S)hud();}
  draw();
}
requestAnimationFrame(frame);

// 검증용 훅(화면엔 영향 없음)
window.__p6={get state(){return state;},get S(){return S;},forceLevel(){if(state==='play'){S.pendingLv++;S.lv++;openLvup();}},skip(t){if(S)S.t=t;}};
})();
</script>
