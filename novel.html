<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>스콰드 (비주얼 노벨)</title>
<meta name="theme-color" content="#05060a">
<!--
==========================================================================
 「스콰드」 호러 비주얼 노벨 — 단일 정적 페이지 (서버·라이브러리·외부 오디오 없음)
 이 이야기는 전부 허구이며 실제 인물·단체와 관계없습니다. 등장인물은 전부 가상의 알리아스입니다.

 [원고 → 이 페이지]  시나리오는 data/novel/ch/ch_*.txt (없으면 data/novel/fallback_short.txt) 에 있다.
   고친 뒤  python3 tooling/novel_build.py  를 돌리면 아래 STORY 시작·끝 표식 사이(const STORY)가 다시 만들어진다.
   (줄 형식·퍼즐 json 은 tooling/novel_build.py 맨 위 설명 참고. 표식 사이는 손으로 고쳐도 되지만 다음 변환 때 덮어 쓴다.)
 [그림]  img/novel/bg_<배경id>.webp , ch_<캐릭터id>.webp(놀란 얼굴은 ch_<id>_f.webp) 가 있으면 쓰고, 없으면 그라디언트·동그라미로 대신한다.
 [저장]  장 시작마다 자동 저장 + 마지막 위치 이어하기 + 슬롯 3칸. 장 선택은 지난 장만. 읽은 대사는 따로 기억해 '건너뛰기'는 읽은 대사만 넘긴다.
 [접근성] 번쩍임은 초당 2회 이하·2초 남짓. '움직임 줄이기'는 OS 설정을 따르고 설정에서도 켠다(흔들림·명멸·타자기·맥동 끔).
          선택 제한시간·퍼즐 타이머는 설정에서 끌 수 있고, 퍼즐은 2번 틀리면 '넘어가기'가 나온다(설정에서 끌 수 있음).
 [테스트] ?fast=1 이면 모든 대기·타자기를 줄인다(자동 테스트용). window.__novel 에 테스트용 손잡이가 있다.
==========================================================================
-->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05060a;color:#e8e6ea;overflow:hidden;
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#020306}
#stage{position:relative;width:min(100vw,960px);height:100vh;height:100dvh;max-height:720px;overflow:hidden;background:#000;
  user-select:none;-webkit-user-select:none;box-shadow:0 0 60px #000}
@media (max-width:600px){#stage{max-height:none}}
.layer{position:absolute;inset:0}
.bg{background-size:cover;background-position:center;opacity:0;transition:opacity 1s}
.bg.on{opacity:1}
#vig{pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.65) 100%)}
#chars{position:absolute;left:0;right:0;top:9%;bottom:33%;display:flex;justify-content:center;align-items:flex-end;gap:2%;pointer-events:none}
.ch{flex:0 1 32%;height:100%;display:flex;align-items:flex-end;justify-content:center;transition:filter .4s,opacity .4s,transform .4s,flex-basis .4s,max-width .4s;filter:brightness(.3);opacity:.7}
.ch.on{filter:none;opacity:1;transform:translateY(-1%)}
.ch img{max-width:100%;max-height:100%;object-fit:contain}
.ch .sil{width:min(30vw,150px);aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:min(14vw,64px);font-weight:700;color:#fff;border:2px solid rgba(255,255,255,.25);margin-bottom:6%}
#props{position:absolute;inset:0;pointer-events:none}
.prop{position:absolute;pointer-events:auto;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;
  border:2px solid #f0c060;background:rgba(240,192,96,.15);font-size:28px;display:flex;align-items:center;justify-content:center;
  animation:glow 1.6s ease-in-out infinite;z-index:5}
.prop small{position:absolute;top:100%;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;color:#f0c060;margin-top:2px}
@keyframes glow{0%,100%{box-shadow:0 0 6px #f0c06088}50%{box-shadow:0 0 22px #f0c060}}
#fxBlack{background:#000;opacity:0;transition:opacity .8s;pointer-events:none;z-index:5}
#fxBlack.on{opacity:1}
#fxWhite{background:#f4f1ea;opacity:0;transition:opacity .6s;pointer-events:none;z-index:2}
#fxWhite.on{opacity:1}
#fxFlick{background:radial-gradient(ellipse at center,transparent 52%,rgba(200,24,36,.6) 100%);opacity:0;pointer-events:none;z-index:4;transition:opacity .5s}
#fxFlick.on{animation:redp 1.6s ease-in-out infinite}
@keyframes redp{0%,100%{opacity:.12}50%{opacity:1}}
#stage.shake{animation:shake .5s linear 2}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}50%{transform:translate(3px,-3px)}75%{transform:translate(-2px,3px)}}
.rm #fxFlick.on{animation:none;opacity:.35}
.rm #stage.shake{animation:none}
.rm .prop{animation:none}
.rm *{transition-duration:.01s!important}
#chars[data-n="4"] .ch{flex-basis:24%}
.ch.in{opacity:0}
.ch.out{opacity:0;flex-basis:0;max-width:0}
#tlab{text-align:center;font-size:12px;color:#9a95a4;margin-top:4px;min-height:16px}
/* HUD */
#hud{position:absolute;top:0;left:0;right:0;padding:max(8px,env(safe-area-inset-top)) 8px 0;display:flex;gap:4px;align-items:center;z-index:12;pointer-events:none}
#hud>*{pointer-events:auto}
#bNote{margin-right:auto;color:#f0c060;border-color:rgba(240,192,96,.5)}
#bNote.pulse{animation:glow 1.6s ease-in-out infinite}
.hb{white-space:nowrap;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);border-radius:14px;min-height:32px;padding:3px 7px;font-size:12px}
.hb.on{background:#7a1f2b;border-color:#c0394a}
.hb:focus-visible,.m:focus-visible,.cbtn:focus-visible,.pk:focus-visible,.key:focus-visible,.cc:focus-visible,.prop:focus-visible,.vc:focus-visible,.dir:focus-visible,.slot:focus-visible,.back:focus-visible{outline:2px solid #f0c060;outline-offset:2px}
/* textbox */
#tb{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:0 10px max(10px,env(safe-area-inset-bottom));min-height:30%}
#name{display:inline-block;min-height:26px;padding:3px 14px;margin:0 0 -1px 8px;border-radius:8px 8px 0 0;font-weight:700;font-size:15px;background:#222;border:1px solid rgba(255,255,255,.3);border-bottom:0}
#name:empty{visibility:hidden}
#box{background:rgba(6,8,14,.9);border:1px solid rgba(255,255,255,.28);border-radius:10px;padding:14px 16px 26px;min-height:112px;font-size:17px;line-height:1.7;position:relative;word-break:keep-all;overflow-wrap:anywhere}
#box.narr{font-style:italic;color:#c9c6cf}
#box.tho{font-style:italic;color:#9fa9c8;border:1px dashed rgba(174,184,216,.55);background:rgba(10,14,28,.82);box-shadow:inset 0 0 14px rgba(120,140,200,.12)}
#box.tho::before{content:'속마음';position:absolute;top:-9px;right:12px;font-size:10px;font-style:normal;letter-spacing:.1em;color:#8a98c0;background:#0a0e1c;padding:0 6px;border-radius:6px}
#more{position:absolute;right:12px;bottom:6px;font-size:12px;opacity:.7}
#more.blink{animation:bl 1.2s steps(2) infinite}
.rm #more.blink{animation:none}
@keyframes bl{50%{opacity:.1}}
@media (min-width:700px){#box{font-size:19px;min-height:128px}#tb{padding-left:6%;padding-right:6%}}
/* choices */
#choices{position:absolute;left:0;right:0;top:0;bottom:0;z-index:7;display:none;flex-direction:column;justify-content:center;gap:10px;padding:48px 6% 12px;background:rgba(0,0,0,.5);overflow-y:auto}
#choices.on{display:flex}
#cl{display:flex;flex-direction:column;gap:10px}
#cq{text-align:center;font-size:15px;color:#cfcad6;margin-bottom:4px}
.cbtn{background:rgba(10,12,20,.94);border:1px solid #8c8498;border-radius:10px;padding:14px 14px;text-align:left;font-size:16px;line-height:1.5;min-height:48px;word-break:keep-all}
.cbtn:hover{border-color:#f0c060}
.cbtn.true{border-color:#f0c060;color:#f0c060}
#timer{height:6px;background:#222;border-radius:3px;overflow:hidden;margin-top:6px}
#timer i{display:block;height:100%;width:100%;background:#c0394a;transform-origin:left}
/* overlays */
.ov{position:absolute;inset:0;z-index:20;background:rgba(3,4,8,.97);display:none;flex-direction:column;align-items:center;padding:56px 16px 24px;overflow-y:auto;text-align:center}
.ov::before{content:"";margin-top:auto}.ov::after{content:"";margin-bottom:auto}
.ov.on{display:flex}
.ov h1{font-size:clamp(34px,10vw,56px);letter-spacing:.3em;margin:0 0 6px;color:#e8d8d8;text-shadow:0 0 18px #7a1f2b;font-weight:900}
.ov h2{margin:0 0 14px;font-size:20px}
.ov .sub{color:#9a95a4;font-size:13px;margin:0 0 22px;max-width:320px;line-height:1.6}
.ov .m{display:block;width:min(280px,84vw);margin:5px auto;padding:12px;background:#14161e;border:1px solid #5a5666;border-radius:10px;font-size:16px;min-height:46px}
.ov .m:hover{border-color:#f0c060}
.ov .m[disabled]{opacity:.35;cursor:default}
.ov .back{margin-top:14px;background:none;border:0;color:#9a95a4;text-decoration:underline;min-height:44px;padding:0 16px}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;width:min(320px,88vw);margin:6px 0;font-size:15px;text-align:left}
.set button{min-width:64px}
.stat{font-size:12px;color:#6f6a7a;margin-top:10px}
#log{width:min(560px,100%);text-align:left;max-height:72vh;overflow-y:auto;font-size:15px;line-height:1.6}
#log p{margin:0 0 10px}#log b{color:#f0c060}#log .chl{color:#8a8494;font-size:12px}
.list{display:grid;gap:10px;width:min(440px,100%)}
.gcard,.slot,.cnote{border:1px solid #444;border-radius:10px;padding:12px;text-align:left;background:#0f1118;color:#e8e6ea;font-size:14px;line-height:1.5;word-break:keep-all}
.slot{cursor:pointer;min-height:56px;width:100%}.slot:hover{border-color:#f0c060}
.slot[disabled]{opacity:.4;cursor:default}
.slot small{display:block;color:#8a8494;font-size:12px}
.gcard.lock,.cnote.lock{opacity:.45}
.gcard b,.slot b,.cnote b{display:block;margin-bottom:3px}
.cnote.got{border-color:#f0c06088}
.cnote .ic{float:left;font-size:22px;margin-right:10px;line-height:1.2}
#ovNote .hint{font-size:12px;color:#f0c060;margin:0 0 10px;min-height:16px}
#gate{width:min(440px,92vw);margin:6px 0 10px;padding:12px 14px;border:1px solid #f0c06066;border-radius:10px;background:#0f1118;font-size:14px;line-height:1.6;word-break:keep-all}
#gate p{margin:0 0 10px}#gate .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#gate button{min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid #f0c060;background:#1a1710;color:#f0c060;font-weight:700}
#gate button.dc{background:#5865f2;border-color:#5865f2;color:#fff}
#testBadge{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:30;background:#f0c060;color:#1a1200;font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;pointer-events:none;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#ovSet .nvhint{width:min(320px,88vw);font-size:12px;color:#8a8494;line-height:1.5;margin:0 0 6px;text-align:left}
#chap{position:absolute;inset:0;z-index:15;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column;opacity:0;transition:opacity .7s;pointer-events:none;padding:0 16px;text-align:center}
#chap.on{display:flex;opacity:1}
#chap span{font-size:13px;letter-spacing:.4em;color:#8a8494}
#chap b{font-size:clamp(24px,7vw,40px);margin-top:10px;font-weight:700;word-break:keep-all}
#endcard{z-index:19}
#endcard h2{font-size:clamp(24px,7vw,36px);margin:0 0 6px;word-break:keep-all}
#toast{position:absolute;left:50%;top:48px;transform:translateX(-50%);z-index:30;max-width:92%;background:#222;border:1px solid #f0c060;border-radius:10px;padding:6px 12px;font-size:13px;display:none;text-align:center;word-break:keep-all;pointer-events:none}
/* 퍼즐 */
#puz{position:absolute;inset:0;z-index:8;display:none;flex-direction:column;align-items:center;background:rgba(3,4,8,.94);padding:50px 14px 14px;overflow-y:auto}
#puz.on{display:flex}
#puz::before{content:"";margin-top:auto}#puz::after{content:"";margin-bottom:auto}
.pzq{font-size:16px;line-height:1.6;text-align:center;margin:0 0 6px;max-width:520px;word-break:keep-all}
.pzs{font-size:13px;color:#9a95a4;margin:0 0 10px;text-align:center;min-height:19px;max-width:520px;word-break:keep-all}
.pzs.bad{color:#e0707e}.pzs.good{color:#8fd19e}
.pzbar{height:5px;width:min(420px,100%);background:#222;border-radius:3px;overflow:hidden;margin:0 0 10px}
.pzbar i{display:block;height:100%;width:100%;background:#c0394a;transform-origin:left}
.pzgrid{display:grid;gap:8px;width:min(520px,100%);grid-template-columns:repeat(2,1fr)}
@media (min-width:640px){.pzgrid.p3{grid-template-columns:repeat(3,1fr)}}
.pk{background:#12141c;border:2px solid #4a4658;border-radius:10px;padding:10px 8px;min-height:64px;font-size:15px;line-height:1.4;text-align:center;word-break:keep-all}
.pk small{display:block;font-size:11px;color:#8a8494;margin-top:2px}
.pk[aria-pressed=true]{border-color:#f0c060;background:#2a2412;color:#ffe9b0}
.pk[aria-pressed=true]::before{content:"✔ "}
.pzact{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.pzbtn{background:#1c2030;border:1px solid #6a6678;border-radius:10px;padding:11px 18px;min-height:46px;font-size:15px}
.pzbtn.go{border-color:#f0c060;color:#f0c060}
.pzbtn[disabled]{opacity:.35;cursor:default}
.pzbtn:focus-visible{outline:2px solid #f0c060;outline-offset:2px}
.codeslots{display:flex;gap:8px;margin:2px 0 10px}
.codeslots span{width:46px;height:56px;border:2px solid #6a6678;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;background:#0c0e14}
.codeslots span.cur{border-color:#f0c060}
.keys{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center}
.key{height:54px;background:#161926;border:1px solid #5a5666;border-radius:10px;font-size:22px;font-weight:700}
.key.sm{font-size:15px}
.hints{width:min(420px,100%);margin:0 0 10px;font-size:13px;line-height:1.6;color:#c9c0a0;border-left:3px solid #f0c06088;padding-left:10px;text-align:left;word-break:keep-all}
.vgrid{display:grid;gap:8px;width:min(560px,100%);grid-template-columns:repeat(2,1fr)}
@media (min-width:640px){.vgrid{grid-template-columns:repeat(4,1fr)}}
.vc{background:#12141c;border:2px solid #4a4658;border-radius:10px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:132px;font-size:14px;word-break:keep-all}
.vc .face{width:64px;height:64px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff;border:2px solid rgba(255,255,255,.25);flex:none}
.vc .face img{width:100%;height:100%;object-fit:cover;object-position:top}
.vc small{font-size:11px;color:#8a8494;line-height:1.3}
.vc[aria-pressed=true]{border-color:#f0c060;background:#2a2412}
.vc.ref{min-height:56px;justify-content:center;border-style:dashed;grid-column:1/-1;flex-direction:row}
.voice{background:#10141d;border:1px solid #3a4560;border-radius:12px;padding:14px 16px;margin:0 0 12px;width:min(480px,100%);font-size:16px;line-height:1.7;text-align:center;word-break:keep-all}
.voice b{display:block;font-size:12px;color:#8a98c0;margin-bottom:4px}
.dots{display:flex;gap:6px;margin:0 0 10px}.dots i{width:12px;height:12px;border-radius:50%;border:2px solid #6a6678}.dots i.done{background:#8fd19e;border-color:#8fd19e}.dots i.now{border-color:#f0c060}
.dirs{display:flex;gap:8px;width:min(480px,100%)}
.dir{flex:1;min-height:76px;background:#161926;border:2px solid #5a5666;border-radius:12px;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.dir em{font-style:normal;font-size:26px}
.dir:hover{border-color:#f0c060}
.cgrid{display:grid;gap:5px;grid-template-columns:repeat(5,1fr);width:min(420px,100%)}
.cc{aspect-ratio:1;min-height:48px;background:#0b1410;border:1px solid #2c4a3a;border-radius:6px;color:#9fe0b0;font-size:clamp(20px,6.5vw,30px);display:flex;align-items:center;justify-content:center;position:relative;padding:2px;line-height:1.1;word-break:keep-all;overflow-wrap:anywhere}
.cc.nm{font-size:10.5px;aspect-ratio:auto;min-height:54px}
.cc small{position:absolute;left:3px;top:1px;font-size:8px;color:#4a7a5a}
.cc b{position:absolute;right:3px;top:1px;font-size:11px;color:#f0c060}
.cc.miss{border-color:#c0394a;background:#241014}
.cc.hit{border-color:#8fd19e;background:#10241a}
.cc.extra{grid-column:1/-1;aspect-ratio:auto;min-height:40px;border-style:dashed;color:#5a7a68;font-size:12px}
.cc:disabled{cursor:default}
.rm .prop,.rm #bNote.pulse{animation:none}
.rm .pzbar i,.rm #timer i{transition:none!important}
</style>
</head>
<body>
<div id="app">
 <div id="stage">
  <div class="layer bg" id="bgA"></div><div class="layer bg" id="bgB"></div>
  <div class="layer" id="fxWhite"></div>
  <div class="layer" id="vig"></div>
  <div id="chars"></div>
  <div id="props"></div>
  <div class="layer" id="fxFlick"></div>
  <div class="layer" id="fxBlack"></div>
  <div id="hud">
   <button class="hb" id="bNote" aria-label="단서 수첩 열기">📓 0/12</button>
   <button class="hb" id="bAuto" aria-pressed="false">AUTO</button><button class="hb" id="bSkip" aria-pressed="false" title="읽은 대사만 넘깁니다">SKIP</button>
   <button class="hb" id="bLog">기록</button><button class="hb" id="bMute" aria-label="소리">🔊</button><button class="hb" id="bMenu">메뉴</button>
  </div>
  <div id="tb"><div id="name"></div><div id="box"><span id="txt"></span><span id="more">▼</span></div></div>
  <div id="choices"><div id="cq"></div><div id="cl"></div><div id="timer"><i></i></div><div id="tlab"></div></div>
  <div id="puz" role="dialog" aria-modal="true"><div id="pzBody" style="width:100%;display:flex;flex-direction:column;align-items:center"></div></div>
  <div id="chap"><span id="chapN"></span><b id="chapT"></b></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="testBadge" hidden>시험 모드(로그인 없음 · 진행도 기록 안 함)</div>

  <div class="ov on" id="ovTitle">
   <h1>스콰드</h1>
   <p class="sub">이 이야기는 전부 허구이며 실제 인물·단체와 관계없습니다.<br>소리가 납니다. 이어폰을 권합니다.<br>한 시간쯤 걸리는 이야기이고, 언제든 저장할 수 있습니다.</p>
   <div id="gate" role="status" aria-live="polite" hidden><p id="gMsg"></p><div class="row"><button class="dc" id="gLogin" type="button" hidden>디스코드로 로그인</button><button id="gRetry" type="button" hidden>다시 확인</button></div></div>
   <button class="m" id="tCont">이어하기</button>
   <button class="m" id="tNew">처음부터</button>

/* ===================== 그림: 미리 불러오기 + 캐시 ===================== */
const IM={m:{},manifest:null,total:0,done:0,ready:false};
function imGet(k){
  let e=IM.m[k]; if(e)return e;
  e=IM.m[k]={st:'loading',img:new Image(),cbs:[]};
  const fin=s=>{e.st=s;const c=e.cbs;e.cbs=[];c.forEach(f=>{try{f()}catch(x){}})};
  e.img.alt='';
  e.img.onload=()=>{const ok=()=>fin('ok'); if(e.img.decode)e.img.decode().then(ok,ok); else ok()};
  e.img.onerror=()=>fin('fail');
  e.img.src='img/novel/'+k+'.webp'; return e;
}
function imReady(k,cb){const e=imGet(k); if(e.st==='loading')e.cbs.push(cb); else cb()}
function preloadAll(){
  const keys=[]; const finish=()=>{if(IM.ready)return;IM.ready=true;onPreloaded()};
  fetch('data/novel/cast_hide.json').then(r=>r.ok?r.json():null).then(j=>{if(j&&j.hide)j.hide.forEach(x=>HIDE.add(x))}).catch(()=>{});
  const go=()=>{
    IM.total=keys.length; if(!keys.length){finish();return}
    keys.forEach(k=>imReady(k,()=>{IM.done++;prog();if(IM.done>=IM.total)finish()}));
    setTimeout(finish,14000);
  };
  fetch('img/novel/manifest.json').then(r=>r.json()).then(m=>{
    IM.manifest=m; (m.bg||[]).forEach(b=>keys.push('bg_'+b));
    Object.keys(m.ch||{}).forEach(id=>{const c=m.ch[id]; if(c.n)keys.push('ch_'+id); if(c.f)keys.push('ch_'+id+'_f')});
    go();
  }).catch(()=>{CHARS.forEach(c=>keys.push('ch_'+c.id));Object.keys(BGFALL).forEach(b=>keys.push('bg_'+b));go()});
}
function prog(){ if(!IM.ready)$('tStat').textContent='그림을 불러오는 중… '+IM.done+'/'+IM.total }
// 다음 장에 쓰는 그림을 미리(목록에 없는 것까지) 챙긴다
function warmChapter(n){
  const ch=STORY.chapters[n]; if(!ch)return; const end=STORY.chapters[n+1]?STORY.chapters[n+1].pc:STORY.ops.length;
  for(let i=ch.pc;i<end;i++){const o=STORY.ops[i]; if(o.o==='bg')imGet('bg_'+o.id); else if(o.o==='show')o.ids.forEach(x=>{imGet('ch_'+x.id);if(x.f)imGet('ch_'+x.id+'_f')})}
}

/* ===================== 소리(WebAudio 합성만) ===================== */
const AU={ctx:null,master:null,drone:null,hbT:null,mood:'none'};
function auInit(){
  if(AU.ctx){ if(AU.ctx.state==='suspended')AU.ctx.resume(); return; }
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
    const x=AU.ctx=new C(); AU.master=x.createGain(); AU.master.gain.value=SET.mute?0:.8; AU.master.connect(x.destination);
    const g=AU.drone=x.createGain(); g.gain.value=0; g.connect(AU.master);
    const lp=x.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=180; lp.connect(g);
    [55,55.7,82.4].forEach((f,i)=>{const o=x.createOscillator(); o.type=i==2?'sine':'sawtooth'; o.frequency.value=f; const og=x.createGain(); og.gain.value=i==2?.25:.5; o.connect(og); og.connect(lp); o.start();});
    const lfo=x.createOscillator(), lg=x.createGain(); lfo.frequency.value=.08; lg.gain.value=60; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  }catch(e){AU.ctx=null}
}
function auMute(){ if(AU.master)AU.master.gain.value=SET.mute?0:.8; $('bMute').textContent=SET.mute?'🔇':'🔊'; }
function noiseBuf(d){const x=AU.ctx,b=x.createBuffer(1,x.sampleRate*d,x.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;return b}
function tone(f,t0,d,vol,type,f2){const x=AU.ctx,o=x.createOscillator(),g=x.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.01);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(AU.master);o.start(t0);o.stop(t0+d+.05)}
function noise(t0,d,vol,fq){const x=AU.ctx,s=x.createBufferSource(),f=x.createBiquadFilter(),g=x.createGain();s.buffer=noiseBuf(d);f.type='lowpass';f.frequency.value=fq;g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);s.connect(f);f.connect(g);g.connect(AU.master);s.start(t0)}
function sfx(n){
  if(!AU.ctx||SET.mute)return; const t=AU.ctx.currentTime;
  if(n==='knock'){[0,.25,.5].forEach(d=>{tone(110,t+d,.18,.7,'sine',60);noise(t+d,.08,.4,500)})}
  else if(n==='door'){noise(t,.5,.5,300);tone(70,t,.7,.8,'sine',35)}
  else if(n==='thud'){tone(80,t,.4,.9,'sine',40);noise(t,.15,.4,200)}
  else if(n==='fall'){tone(320,t,1.6,.35,'triangle',35);noise(t+.2,1.2,.2,800)}
  else if(n==='chime'){tone(660,t,.9,.25);tone(495,t+.5,1.2,.25)}
  else if(n==='keys'){for(let i=0;i<14;i++)noise(t+i*.12+Math.random()*.05,.03,.25,3000)}
  else if(n==='heartbeat'){beat(t);beat(t+.9);beat(t+1.8)}
  else if(n==='drone'){tone(48,t,2.6,.35,'sine',42);tone(72,t,2.6,.12,'triangle',66)}
}
function beat(t){tone(62,t,.18,.9,'sine',40);tone(55,t+.2,.2,.6,'sine',38)}
function setMood(m){
  AU.mood=m; if(!AU.ctx)return; clearInterval(AU.hbT);
  const v={none:0,calm:.05,tense:.09,dark:.12}[m]||0; AU.drone.gain.setTargetAtTime(v,AU.ctx.currentTime,1.2);
  const per=SET.rm?0:{tense:1100,dark:760}[m];
  if(per) AU.hbT=setInterval(()=>{if(!SET.mute&&AU.ctx.state==='running')beat(AU.ctx.currentTime)},per);
}

function fresh(){return {pc:0,V:{},clues:[],bg:'prologue',show:null,mood:'none',play:0,ls:{},n:0}}
let hist=[],backlog=[],cur=null,WS='title',typing=false,typeT=null,tickT=null,fullText='',auto=false,skip=false,locked=false,bgOn='A',started=false,curRead=false,readDirty=0;
let READ=new Set((lsGet(K_READ)&&lsGet(K_READ).sv===SV)?lsGet(K_READ).r:[]);

function getv(n){if(n==='clues')return ST.clues.length; if(n in ST.V)return ST.V[n]; return ST.clues.includes(n)?1:0}
function evalC(cs){
  if(!cs||!cs.length)return true;
  for(const [n,op,x,neg] of cs){
    const v=getv(n); let r;
    if(op==='flag'){r=v>0; if(neg)r=!r}
    else r=op==='>='?v>=x:op==='<='?v<=x:op==='>'?v>x:op==='<'?v<x:op==='=='?v===x:v!==x;
    if(!r)return false;
  }
  return true;
}
function applyActs(acts){ // goto 가 있으면 true
  let jumped=false;
  (acts||[]).forEach(a=>{
    if(a[0]==='set')ST.V[a[1]]=a[2];
    else if(a[0]==='add')ST.V[a[1]]=(ST.V[a[1]]|0)+a[2];
    else if(a[0]==='goto'){ if(LAB[a[1]]===undefined){fatal('없는 라벨: '+a[1])} else {ST.pc=LAB[a[1]];jumped=true} }
  });
  return jumped;
}

function desiredChars(){

function fillChar(d,x){
  const c=BYID[x.id]; let key='ch_'+x.id;
  if(x.f){const fe=imGet(key+'_f'); if(fe.st!=='fail')key=key+'_f'}
  if(isHid(x.id)){ if(d.dataset.k==='hid')return; d.dataset.k='hid'; d.innerHTML=''; const s=el('div','sil','?'); s.style.background='#3a3a4c'; d.appendChild(s); return }
  const e=imGet(key), tag=key+':'+e.st; if(d.dataset.k===tag)return; d.dataset.k=tag; d.innerHTML='';
  if(e.st==='ok'){const im=e.img; im.alt=c.name; d.appendChild(im)}

function renderChars(spkId){
  const wrap=$('chars'), list=desiredChars(); wrap.dataset.n=list.length;
  const want=new Set(list.map(x=>x.id));
  [...wrap.children].forEach(d=>{ if(!want.has(d.dataset.id)&&!d.classList.contains('out')){d.classList.add('out');setTimeout(()=>{if(d.classList.contains('out'))d.remove()},FAST?10:420)} });
  const doms=list.map(x=>{
    let d=[...wrap.children].find(z=>z.dataset.id===x.id&&!z.classList.contains('out'));
    if(!d){ d=el('div','ch in'); d.dataset.id=x.id; wrap.appendChild(d); requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.remove('in'))); }
    fillChar(d,x); d.classList.toggle('on',x.id===spkId); return d;
  });
  doms.forEach((d,i)=>{ const act=[...wrap.children].filter(z=>!z.classList.contains('out')); if(act[i]!==d)wrap.insertBefore(d,act[i]||null) });
}
function noteSpeaker(c){ if(!c)return; hist=hist.filter(x=>x!==c.id); hist.push(c.id); if(hist.length>3)hist.shift() }

/* ===================== 진행 엔진 ===================== */
function run(){
  let guard=0;
  for(;;){
    if(++guard>8000){fatal('무한 반복');return}
    if(ST.pc>=OPS.length){fatal('이야기가 끝없이 이어지지 않음');return}
    const op=OPS[ST.pc]; cur=op;
    switch(op.o){
      case 'chap': onChap(op); if(!op.c){ST.pc++;showCard(op.t,'',run);return} ST.pc++; continue;
      case 'card': ST.pc++; showCard(op.t,op.s,run); return;
      case 'bg': setBg(op.id); clearProps(); fxClear(); ST.pc++; continue;
      case 'show': ST.show=op.ids.map(x=>({id:x.id,f:x.f})); renderChars(null); ST.pc++; continue;
      case 'fx': {const w=doFx(op.v); ST.pc++; if(w){WS='busy';later(run,D(w));return} continue}
      case 'sfx': sfx(op.v); ST.pc++; continue;
      case 'mood': ST.mood=op.v; setMood(op.v); ST.pc++; continue;
      case 'wait': ST.pc++; WS='busy'; later(run,D(op.ms)); return;
      case 'clue': spawnClue(op.id); ST.pc++; continue;
      case 'set': ST.V[op.k]=op.v; ST.pc++; continue;
      case 'unset': ST.V[op.k]=0; ST.pc++; continue;
      case 'add': ST.V[op.k]=(ST.V[op.k]|0)+op.v; ST.pc++; continue;
      case 'jf': ST.pc=evalC(op.c)?ST.pc+1:op.to; continue;
      case 'jmp': ST.pc=op.to; continue;
      case 'goto': if(LAB[op.l]===undefined){fatal('없는 라벨: '+op.l);return} ST.pc=LAB[op.l]; continue;
      case 'say': case 'nar': case 'tho': showLine(op); return;
      case 'choice': showChoice(op); return;
      case 'puz': openPuzzle(op); return;
      case 'end': doEnd(op); return;
      default: fatal('알 수 없는 op '+op.o); ST.pc++; continue;
    }
  }
}
function onChap(op){
  clearProps(); fxClear(); ST.show=null; hist=[]; renderChars(null);
  backlog.push({chap:op.t});
  const s=snap(); const m=lsGet(K_CHAP)||{}; m[op.n]=s; lsSet(K_CHAP,m); lsSet(K_AUTO,s); lsSet(K_LAST,s); saveRead();
  warmChapter(op.n+1);
  if(op.n>0)toast('자동 저장됨',1000);
  try{nvSend('ch')}catch(e){}
}
function showCard(title,sub,cb){
  locked=true; WS='card'; const cp=$('chap');
  fxClear();
  $('chapN').textContent=sub?title:''; $('chapT').textContent=sub||title;
  cp.classList.add('on'); $('tb').style.visibility='hidden';
  const hold=skip?420:(SET.rm?900:1900);
  later(()=>{cp.classList.remove('on'); later(()=>{locked=false;cb()},D(SET.rm?10:700))},D(hold));
}
function doFx(v){
  const B=$('fxBlack'),F=$('fxFlick');
  if(v==='flicker'){F.classList.add('on');later(()=>F.classList.remove('on'),SET.rm?1200:3300);return 0}
  if(v==='shake'){if(!SET.rm){stage.classList.remove('shake');void stage.offsetWidth;stage.classList.add('shake')}return 0}
  if(v==='blackout'){B.classList.add('on');return SET.rm?500:900}
  if(v==='off'){fxClear();return 0}
  return 0;
}

/* 말하는 사람이 @show 에 없으면 임시로 올린다(최대 3명 유지 — 가장 오래 말 안 한 사람을 내림) */
function promote(c){
  if(!c)return; ST.n=(ST.n||0)+1; ST.ls=ST.ls||{}; ST.ls[c.id]=ST.n;
  if(!ST.show||!ST.show.length)return;
  if(ST.show.some(x=>x.id===c.id))return;
  const cur=ST.show.filter(x=>BYID[x.id]);
  if(cur.length>=3){ let k=0; cur.forEach((x,i)=>{if((ST.ls[x.id]||0)<(ST.ls[cur[k].id]||0))k=i}); cur.splice(k,1) }
  cur.push({id:c.id,f:0}); ST.show=cur;
}
/* 줄 보여주기 */
function showLine(op){
  WS='line'; clearInterval(tickT); $('tb').style.visibility='visible'; $('choices').classList.remove('on');
  const spk=op.o==='nar'?'':op.s, c=spk?charOf(spk):null;
  $('name').textContent=spk?shownName(spk):''; $('name').style.background=c&&!isHid(c.id)?c.c:(spk==='방송'?'#3a3a4c':'#333');
  $('box').className=op.o==='nar'?'narr':(op.o==='tho'?'tho':'');
  if(c)noteSpeaker(c); promote(c); renderChars(c?c.id:null);
  backlog.push({s:spk?shownName(spk):spk,t:op.t,th:op.o==='tho'}); if(backlog.length>400)backlog.shift();
  curRead=READ.has(ST.pc); fullText=op.t; saveLast(); startType();
}
function startType(){
  clearInterval(typeT); const e=$('txt'); e.textContent=''; $('more').classList.remove('blink'); typing=true; let n=0;
  if(SET.rm||FAST||(skip&&curRead)){e.textContent=fullText;endType();return}
  const sp=[44,26,12][SET.speed]||26;
  typeT=setInterval(()=>{n++;e.textContent=fullText.slice(0,n);if(n>=fullText.length)endType()},sp);
}
function endType(){
  clearInterval(typeT); typing=false; $('txt').textContent=fullText; $('more').classList.add('blink');
  if(skip){
    if(!curRead){setSkip(false);toast('아직 안 읽은 대사에서 멈췄습니다')}
    else{later(next,FAST?1:70);return}
  }
  if(auto){later(next,FAST?1:1500+fullText.length*45)}
}

  if(typing){endType();return}
  markRead(ST.pc); ST.pc++; run();
}

/* 단서 핫스팟 */
const SLOTS=[[24,30],[76,34],[50,24],[30,50],[70,52],[50,40],[16,44],[84,46]];
function clearProps(){$('props').innerHTML=''}
function spawnClue(id){
  if(ST.clues.includes(id))return;
  const hk=window.__novel&&window.__novel.hook; if(hk&&hk.clue&&hk.clue(id)){getClue(id);return}   // 자동 시험용
  if([...$('props').children].some(b=>b.dataset.id===id))return;
  let h=0; for(const ch of id)h=(h*31+ch.charCodeAt(0))>>>0;
  const used=new Set([...$('props').children].map(b=>+b.dataset.slot)); let s=h%SLOTS.length; while(used.has(s))s=(s+1)%SLOTS.length;
  const p=el('button','prop'); p.dataset.id=id; p.dataset.slot=s; p.style.left=SLOTS[s][0]+'%'; p.style.top=SLOTS[s][1]+'%'; p.type='button';
  p.textContent=CLUE_ICON[id]||'🔍'; p.setAttribute('aria-label','수상한 것 살펴보기(단서)');
  p.onclick=e=>{e.stopPropagation(); getClue(id); p.remove()};
  $('props').appendChild(p); if(skip){setSkip(false)} noteHud();
}
function getClue(id){
  if(ST.clues.includes(id))return; ST.clues.push(id); updClue(); sfx('chime');

function pzAssist(B){
  const b=el('button','pzbtn','넘어가기 (도움)'); b.type='button'; b.style.display='none'; b.id='pzSkip';
  b.onclick=()=>pzFinish('skip'); const w=el('div','pzact'); w.appendChild(b); B.appendChild(w);

}
function pzFail(){PZ.fails++; if(PZ.fails>=2&&SET.assist&&PZ.type!=='vote'&&PZ.skipBtn)PZ.skipBtn.style.display=''}
function pzFinish(kind,acts){
  if(!PZ||PZ.done)return; PZ.done=true; const d=PZ.op.d;
  TM.forEach(h=>clearTimeout(h)); TM.clear(); clearInterval(tickT); document.removeEventListener('keydown',PZ.keyH||(()=>{}));
  $('puz').classList.remove('on'); $('pzBody').innerHTML='';
  if(kind==='skip'){ST.V.assisted=(ST.V.assisted|0)+1;acts=d.skip||d.ok}
  else if(kind==='ok')acts=d.ok; else if(kind==='fail')acts=d.fail;
  backlog.push({s:'퍼즐',t:PZ.op.type+' · '+(kind==='ok'?'성공':kind==='fail'?'실패':kind==='skip'?'도움으로 통과':'선택')});
  PZ=null; if(!applyActs(acts))ST.pc++; run();
}
/* 3개 고르기 */
function pzPick3(op,B){
  const d=op.d; PZ.type='pick3'; const st=pzHead(B,op,d.pick+'개를 고르세요 (0/'+d.pick+')'); const sel=[];
  const g=el('div','pzgrid'+(d.items.length>=6?' p3':'')); B.appendChild(g); const btns={};
  const ok=el('button','pzbtn go','확인'); ok.type='button'; ok.disabled=true;
  const upd=()=>{ok.disabled=sel.length!==d.pick; for(const k in btns)btns[k].setAttribute('aria-pressed',sel.includes(k)); if(!PZ.msg)pzSay(st,d.pick+'개를 고르세요 ('+sel.length+'/'+d.pick+')')};
  d.items.forEach(it=>{
    const b=el('button','pk',it.t); b.type='button'; b.setAttribute('aria-pressed','false'); if(it.sub)b.appendChild(el('small',null,it.sub));
    b.onclick=()=>{PZ.msg=false; const i=sel.indexOf(it.id); if(i>=0)sel.splice(i,1); else if(sel.length<d.pick)sel.push(it.id); else{PZ.msg=true;pzSay(st,'이미 '+d.pick+'개를 골랐습니다. 하나를 빼고 다시 고르세요','bad')} upd()};
    btns[it.id]=b; g.appendChild(b);
  });
  const w=el('div','pzact'); w.appendChild(ok); B.appendChild(w); pzAssist(B);
  ok.onclick=()=>{
    if(sel.length!==d.pick)return;
    const right=d.answer.every(a=>sel.includes(a));
    if(right){pzSay(st,'맞아떨어진다','good');ok.disabled=true;later(()=>pzFinish('ok'),D(600));return}
    pzFail(); sel.length=0; PZ.msg=true;
    const left=d.tries-PZ.fails;
    if(left<=0){pzSay(st,'맞지 않는다','bad');ok.disabled=true;later(()=>pzFinish('fail'),D(800));return}
    pzSay(st,'맞지 않습니다. '+(d.hint||'다시 골라 보세요.')+' (남은 기회 '+left+')','bad'); upd();
  };
  PZ.solve=()=>{sel.length=0;d.answer.forEach(a=>sel.push(a));upd();ok.click()};
  PZ.wrong=()=>{sel.length=0;d.items.filter(it=>!d.answer.includes(it.id)).slice(0,d.pick).forEach(it=>sel.push(it.id));upd();ok.click()};
}
/* 숫자 자물쇠 */
function pzCode(op,B){
  const d=op.d; PZ.type='code'; let val='';
  const st=pzHead(B,op,d.digits+'자리 숫자를 입력하세요');
  const hv=el('div','hints'); B.appendChild(hv);
  const shown=d.hints.filter(h=>{
    if(!evalC(h.c))return false;
    if(h.any&&h.any.length){return h.any.filter(x=>getv(x)>0).length>=Math.max(1,h.min||1)}
    return true;
  }).map(h=>h.t);
  hv.textContent=shown.length?'힌트 — '+shown.join(' / '):(d.none||''); if(!hv.textContent)hv.style.display='none';
  const sl=el('div','codeslots'); B.appendChild(sl); sl.setAttribute('aria-label','입력한 숫자');
  const spans=[]; for(let i=0;i<d.digits;i++){const s=el('span',null,''); sl.appendChild(s); spans.push(s)}
  const draw=()=>spans.forEach((s,i)=>{s.textContent=val[i]||'';s.classList.toggle('cur',i===val.length)});
  const keys=el('div','keys'); B.appendChild(keys);
  const press=n=>{ if(val.length<d.digits){val+=n;draw()} };
  const ok=el('button','key sm','확인'); ok.type='button';
  const back=el('button','key sm','지움'); back.type='button';
  for(let i=1;i<=9;i++){const b=el('button','key',String(i)); b.type='button'; b.onclick=()=>press(String(i)); keys.appendChild(b)}
  back.onclick=()=>{val=val.slice(0,-1);draw()}; keys.appendChild(back);
  const z=el('button','key','0'); z.type='button'; z.onclick=()=>press('0'); keys.appendChild(z); keys.appendChild(ok);
  pzAssist(B);
  const submit=()=>{
    if(val.length<d.digits){pzSay(st,d.digits+'자리를 모두 넣어야 합니다','bad');return}
    if(val===d.answer){pzSay(st,'딸깍. 열렸다','good');later(()=>pzFinish('ok'),D(600));return}
    pzFail(); val=''; draw(); const left=d.tries-PZ.fails;
    if(left<=0){pzSay(st,d.wrong||'잠겼다','bad');later(()=>pzFinish('fail'),D(800));return}
    pzSay(st,(d.wrong||'맞지 않는다.')+(d.tries<50?' (남은 기회 '+left+')':''),'bad');
  };
  ok.onclick=submit;
  PZ.keyH=e=>{ if(WS!=='puz'||anyOv())return; if(/^[0-9]$/.test(e.key)){press(e.key)} else if(e.key==='Backspace'){back.click()} else if(e.key==='Enter'){e.preventDefault();submit()} };
  document.addEventListener('keydown',PZ.keyH);
  PZ.solve=()=>{val=d.answer;draw();submit()};
  PZ.wrong=()=>{val=d.answer.split('').map(c=>String((+c+1)%10)).join('');draw();submit()};
  draw();
}
/* 투표 */
function pzVote(op,B){
  const d=op.d; PZ.type='vote'; const st=pzHead(B,op,'한 사람을 고르세요'); let sel=-1;
  const g=el('div','vgrid'); B.appendChild(g); const cards=[];
  const go=el('button','pzbtn go','이 선택으로 확정'); go.type='button'; go.disabled=true;
  const mk=(i,b)=>{ b.onclick=()=>{sel=i;cards.forEach((c,k)=>c.setAttribute('aria-pressed',k===i));go.disabled=false;pzSay(st,(i<d.cands.length?d.cands[i].name:d.refuse.t)+' — 확정하려면 아래 버튼')} };
  d.cands.forEach((c,i)=>{
    const b=el('button','vc'); b.type='button'; b.setAttribute('aria-pressed','false');

    else if(ch){const im=imGet('ch_'+c.face); if(im.st==='ok'){const x=im.img.cloneNode();x.alt='';f.appendChild(x)} else if(im.st==='fail'){f.style.background=ch.c;f.textContent=ch.name[0]}}
    else{f.style.background='#3a3a4c';f.textContent=(c.name||'?')[0]}
    b.appendChild(f); b.appendChild(el('b',null,hid?'참가자':c.name));
    const sus=c.sus?(ST.V[c.sus]|0):0; const sub=[c.sub,sus>0?'의심 '+'●'.repeat(Math.min(5,sus)):''].filter(Boolean).join(' · ');
    if(sub)b.appendChild(el('small',null,sub));
    mk(i,b); cards.push(b); g.appendChild(b);
  });
  if(d.refuse&&evalC(d.refuse.c)){ const b=el('button','vc ref',d.refuse.t); b.type='button'; b.setAttribute('aria-pressed','false'); mk(d.cands.length,b); cards.push(b); g.appendChild(b) }
  const w=el('div','pzact'); w.appendChild(go); B.appendChild(w);
  const confirmVote=()=>{ if(sel<0)return; const acts=sel<d.cands.length?d.cands[sel].do:d.refuse.do; backlog.push({s:'투표',t:sel<d.cands.length?d.cands[sel].name:d.refuse.t}); pzFinish('vote',acts) };
  go.onclick=confirmVote;
  PZ.solve=PZ.wrong=()=>{ sel=0; confirmVote() };
  PZ.pickIdx=i=>{ sel=i; confirmVote() };
}
/* 목소리 유도 */
function pzGuide(op,B){
  const d=op.d; PZ.type='guide'; let ti=0, busy=false;
  const st=pzHead(B,op,'목소리를 듣고 방향을 고르세요');
  const dots=el('div','dots'); B.appendChild(dots);
  const bub=el('div','voice'); B.appendChild(bub);
  const bar=el('div','pzbar'); const bi=el('i'); bar.appendChild(bi); B.appendChild(bar);
  const dirs=el('div','dirs'); B.appendChild(dirs); pzAssist(B);
  const strip=s=>s.replace(/^[^:：]{1,12}[:：]\s*/,'');
  const ICON={'왼쪽':'⬅','오른쪽':'➡','앞':'⬆','앞으로':'⬆','뒤':'⬇','멈춤':'✋','멈춘다':'✋'};
  const drawDots=()=>{dots.innerHTML='';d.turns.forEach((_,i)=>dots.appendChild(el('i',i<ti?'done':(i===ti?'now':''))) )};
  const timerOn=()=>d.timer>0&&SET.timer;
  function turn(){
    busy=false; clearInterval(tickT); TM.forEach(h=>clearTimeout(h)); TM.clear(); drawDots(); const t=d.turns[ti];
    bub.innerHTML=''; bub.appendChild(el('b',null,(d.who?d.who+'의 눈에 보이는 것':'보이는 것')+' ('+(ti+1)+'/'+d.turns.length+')')); bub.appendChild(document.createTextNode(t.see));
    dirs.innerHTML='';
    t.dirs.forEach((nm,i)=>{const b=el('button','dir'); b.type='button'; b.appendChild(el('em',null,ICON[nm]||'•')); b.appendChild(document.createTextNode(nm)); b.onclick=()=>answer(i); dirs.appendChild(b)});
    bar.style.display=timerOn()?'':'none';
    if(timerOn()){ bi.style.transition='none'; bi.style.transform='scaleX(1)'; void bi.offsetWidth; bi.style.transition='transform '+d.timer+'s linear'; bi.style.transform='scaleX(0)'; later(()=>{if(!busy)answer(-1)},(FAST?Math.min(d.timer,2):d.timer)*1000); pzSay(st,d.timer+'초 안에 고르세요 (설정에서 끌 수 있습니다)') }
    else pzSay(st,'천천히 골라도 됩니다');
  }
  function answer(i){
    if(busy||!PZ)return; busy=true; clearInterval(tickT); TM.forEach(h=>clearTimeout(h)); TM.clear(); const t=d.turns[ti];
    if(i===t.answer){
      bub.innerHTML=''; bub.appendChild(el('b',null,d.who||'목소리')); bub.appendChild(document.createTextNode(strip(t.good)||'좋아, 그대로.')); pzSay(st,'좋다','good'); ti++; drawDots();
      later(()=>{ if(ti>=d.turns.length)pzFinish('ok'); else turn() },D(1000));
    } else {
      pzFail(); const left=d.maxfail-PZ.fails;
      bub.innerHTML=''; bub.appendChild(el('b',null,d.who||'목소리')); bub.appendChild(document.createTextNode(strip(t.bad)||(i<0?'…시간이 없어!':'아니야…')));
      if(left<=0){pzSay(st,'놓쳤다','bad');later(()=>pzFinish('fail'),D(1100));return}
      pzSay(st,(i<0?'시간이 지났습니다':'길이 아닙니다')+'. 같은 곳에서 다시. (남은 기회 '+left+')','bad'); later(turn,D(1300));
    }
  }
  PZ.solve=()=>{ const p=PZ; (function go(){ if(!PZ||PZ!==p||PZ.done)return; busy=false; answer(d.turns[ti].answer); setTimeout(go,FAST?30:1100) })() };
  PZ.wrong=()=>{ for(let k=0;k<d.maxfail&&PZ;k++){ busy=false; answer((d.turns[ti].answer+1)%d.turns[ti].dirs.length); if(!PZ)break } };
  turn();
}
/* CCTV */
const ODD=[['○','◎'],['□','◇'],['△','▽'],['＋','×'],['▮','▯']];
function pzCctv(op,B){
  const d=op.d; PZ.type='cctv'; let lives=d.lives;
  const st=pzHead(B,op,d.mode==='seq'?(d.guide||'순서대로 누르세요'):'다른 모양이 하나 있습니다 — 찾아서 누르세요');
  const hv=el('div','hints'); hv.style.display='none'; B.appendChild(hv);
  const g=el('div','cgrid'); B.appendChild(g); pzAssist(B);
  const miss=()=>{ pzFail(); lives--; return lives };
  if(d.mode==='seq'){
    let prog=0; const cells=[];
    if(d.hint&&evalC(d.hint.c)){hv.textContent='힌트 — '+d.hint.t;hv.style.display=''}
    const clear=()=>cells.forEach(c=>{c.classList.remove('hit','miss');const b=c.querySelector('b');if(b)b.remove()});
    d.cells.forEach((c,i)=>{
      const nm=c.face&&isHid(c.face)?'참가자':c.t; const b=el('button','cc nm',nm); b.type='button'; b.appendChild(el('small',null,'CAM '+String(i+1).padStart(2,'0'))); b.setAttribute('aria-label','화면 '+(i+1)+' '+nm);
      b.onclick=()=>hit(i,b); cells.push(b); g.appendChild(b);
    });
    let ex=null; if(d.extra){ex=el('button','cc extra',d.extra);ex.type='button';ex.onclick=()=>hit(-1,ex);g.appendChild(ex)}
    const hit=(i,b)=>{
      if(!PZ||PZ.busy)return;
      if(i===d.order[prog]){ prog++; b.classList.add('hit'); b.appendChild(el('b',null,String(prog))); pzSay(st,prog+'/'+d.order.length,'good');
        if(prog>=d.order.length){PZ.busy=true;pzSay(st,'순서가 맞았다','good');later(()=>pzFinish('ok'),D(700))} }
      else { b.classList.add('miss'); const l=miss(); prog=0; PZ.busy=true;
        if(l<=0){pzSay(st,'신호를 놓쳤다','bad');later(()=>pzFinish('fail'),D(900));return}
        pzSay(st,'순서가 맞지 않는다. 처음부터. (남은 기회 '+l+')','bad'); later(()=>{PZ.busy=false;clear()},D(700)) }
    };
    PZ.solve=()=>{ clear(); prog=0; d.order.forEach(i=>cells[i].click()) };
    PZ.wrong=()=>{ for(let k=0;k<d.lives&&PZ;k++){ PZ.busy=false; const wrong=cells.findIndex((_,i)=>i!==d.order[0]); cells[wrong].click() } };
  } else {
    let round=0; const total=d.rounds;
    const build=()=>{
      g.innerHTML=''; PZ.busy=false; const pair=ODD[round%ODD.length], odd=Math.floor(Math.random()*25), cells=[];
      for(let i=0;i<25;i++){
        const b=el('button','cc',i===odd?pair[1]:pair[0]); b.type='button'; b.appendChild(el('small',null,String(i+1).padStart(2,'0'))); b.setAttribute('aria-label','화면 '+(i+1));
        b.onclick=()=>{ if(PZ.busy)return;
          if(i===odd){b.classList.add('hit');round++;PZ.busy=true;pzSay(st,round+'/'+total+' 찾았다','good'); later(()=>{ if(round>=total)pzFinish('ok'); else{pzSay(st,'다음 화면');build()} },D(600)) }
          else{b.classList.add('miss');const l=miss(); if(l<=0){PZ.busy=true;pzSay(st,'놓쳤다','bad');later(()=>pzFinish('fail'),D(900));return} pzSay(st,'그 화면은 정상이다. (남은 기회 '+l+')','bad')} };
        cells.push(b); g.appendChild(b);
      }
      PZ.oddBtn=cells[odd];
    };
    PZ.solve=()=>{ for(let k=round;k<total&&PZ;k++){ if(PZ.busy)PZ.busy=false; PZ.oddBtn&&PZ.oddBtn.click(); } };
    PZ.wrong=()=>{ for(let k=0;k<d.lives&&PZ;k++){ PZ.busy=false; const b=[...g.children].find(x=>x!==PZ.oddBtn&&!x.classList.contains('miss')); b&&b.click() } };
    build();
  }
}

/* ===================== 🔐 로그인 게이트 · 📊 진행도 기록 =====================
   운영 도메인(NV_PROD_HOST)에서는 디스코드 로그인 + 봇의 클랜 멤버 확인(/nv/me)이 돼야만 시작·이어하기가 열린다.
   그 밖(비공개 미리보기·localhost)은 '시험 모드' — 게이트도 기록도 없다. 판별은 location.hostname 하나뿐(?fast=1 같은 주소 값으로는 못 건너뛴다).
   토큰은 사이트 로그인이 저장해 둔 sgg_dc 를 읽을 뿐, 이 페이지는 토큰·키를 갖고 있지 않다. 기록 전송은 실패해도 플레이를 막지 않는다. */
const NV_API='https://hth3thmujs.apps.bot-hosting.cloud', NV_CLIENT='1520763174675022028', NV_PROD_HOST='kjp1583-art.github.io';
const NV={prod:location.hostname===NV_PROD_HOST||/[?&]nvgate=1/.test(location.search),st:'checking',name:'',last:0,busy:false,tm:null,ev:'tick',picks:[],off:false,retryT:null};
function dcUser(){try{const o=JSON.parse(localStorage.getItem('sgg_dc')||'null');if(o&&o.id&&o.token&&o.exp>Date.now())return o}catch(e){}return null}
function dcLogin(){
  const st=Math.random().toString(36).slice(2)+'.'+Math.floor(performance.now());
  let none=false; try{const a=JSON.parse(localStorage.getItem('sgg_dc_auto')||'null');none=!!(a&&a.id&&a!==0)}catch(e){}
  try{sessionStorage.setItem('sgg_oauth_state',st);sessionStorage.setItem('sgg_oauth_return','게임:novel');if(none)localStorage.setItem('sgg_dc_try',String(Date.now()))}catch(e){}
  const main=location.origin+new URL('./',location.href).pathname;
  location.href='https://discord.com/api/oauth2/authorize?response_type=token&client_id='+encodeURIComponent(NV_CLIENT)+'&redirect_uri='+encodeURIComponent(main)+'&scope=identify&state='+encodeURIComponent(st)+(none?'&prompt=none':'');
}
function gateOk(){return !NV.prod||NV.st==='ok'}
async function nvApi(path,body){
  const ac=typeof AbortController==='function'?new AbortController():null, to=setTimeout(()=>{try{ac&&ac.abort()}catch(e){}},8000);
  try{
    const r=await fetch(NV_API+path,Object.assign({cache:'no-store'},ac?{signal:ac.signal}:{},body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{}));
    let j=null; try{j=await r.json()}catch(e){} return {status:r.status,j:j||{}};
  }finally{clearTimeout(to)}
}
async function nvCheck(){
  clearTimeout(NV.retryT);
  if(!NV.prod){NV.st='test';gateApply();return}
  const u=dcUser(); if(!u){NV.st='nologin';gateApply();return}
  NV.st='checking';gateApply();
  try{
    const {status,j}=await nvApi('/nv/me?token='+encodeURIComponent(u.token));
    if(status===200&&j.ok&&j.member){NV.st='ok';NV.name=j.name||u.name||''}
    else if(status===401||j.code==='auth')NV.st='nologin';
    else if(status===403&&j.code==='not_member')NV.st='notmember';
    else NV.st='fail';
  }catch(e){NV.st='fail'}
  if(NV.st==='fail')NV.retryT=setTimeout(()=>{if(NV.st==='fail'&&!started)nvCheck()},FAST?3000:15000);
  gateApply(); if(NV.st==='ok')nvSend('tick');
}
function gateApply(){
  const g=$('gate'), play=['tCont','tNew','tChap','tLoad'].map($), lock=NV.prod&&NV.st!=='ok';
  $('testBadge').hidden=NV.prod;
  play.forEach(b=>{b.style.display=lock?'none':''});
  g.hidden=!lock; if(!lock)return;
  const M={checking:'로그인 상태를 확인하는 중…',
    nologin:'이 이야기는 클랜 디스코드에 로그인해야 읽을 수 있어요.',
    notmember:'클랜 디스코드 서버 멤버만 읽을 수 있어요. 방금 가입했다면 잠시 뒤 다시 확인해 보세요. 다른 계정이라면 로그인을 다시 해 주세요.',
    fail:'서버에 연결하지 못했어요. 인터넷이 끊겼거나 봇이 점검 중일 수 있어요. 연결되면 자동으로 다시 확인하며, 오프라인에서는 플레이할 수 없어요.'};
  $('gMsg').textContent=M[NV.st]||''; $('gLogin').hidden=!(NV.st==='nologin'||NV.st==='notmember'); $('gRetry').hidden=!(NV.st==='notmember'||NV.st==='fail');
  $('gLogin').textContent=NV.st==='notmember'?'다른 계정으로 로그인':'디스코드로 로그인';
}
$('gLogin').onclick=()=>{ if(NV.st==='notmember'){try{localStorage.removeItem('sgg_dc');localStorage.removeItem('sgg_dc_auto');localStorage.removeItem('sgg_dc_try')}catch(e){}} dcLogin() };
$('gRetry').onclick=()=>nvCheck();
function nvSetBtn(){
  const b=$('sNv'); if(!NV.prod){b.textContent='시험 모드';b.disabled=true;return}
  if(NV.st!=='ok'){b.textContent='로그인 필요';b.disabled=true;return}
  b.disabled=false; b.textContent=SET.nvSend===false?'끔':'켬'; b.setAttribute('aria-pressed',SET.nvSend!==false);
}
function nvOn(){return NV.prod&&NV.st==='ok'&&SET.nvSend!==false&&!NV.off}
function nvPick(o){ if(!cur||!cur.opts)return; const i=cur.opts.indexOf(o); if(i<0||i>9)return; NV.picks.push([ST.pc,i,String(o.t||'').slice(0,28)]); if(NV.picks.length>20)NV.picks.shift() }
function nvBody(ev){
  const g=lsGet(K_END)||{}, m=lsGet(K_META)||{play:0}, u=dcUser(), flags={};
  Object.keys(ST.V).forEach(k=>{ const v=ST.V[k]; if(/^[a-z][a-z0-9_]{0,15}$/.test(k)&&Number.isFinite(v)&&Object.keys(flags).length<12)flags[k]=Math.max(-99,Math.min(999,Math.round(v))) });
  return {token:u?u.token:'',sv:SV,ch:chapterIdx(ST.pc),nch:CHAPS.length,line:ST.pc,play:Math.round((m.play||0)+(ST.play-(saveMeta.last||0))),nc:NCLUE,
    clues:ST.clues.filter(c=>/^[A-Za-z0-9_\-]{1,24}$/.test(c)).slice(0,24),flags,
    endings:Object.keys(g).filter(k=>/^[A-Za-z0-9_\-]{1,24}$/.test(k)).slice(0,16),te:STORY.endings.some(e=>g[e.id]&&isTrueEnd(e))?1:0,
    choices:NV.picks.slice(),ev}
}
function nvSend(ev){
  if(!nvOn())return;
  const rank={tick:0,ch:1,end:2}; if(rank[ev]>rank[NV.ev])NV.ev=ev;
  if(NV.tm||NV.busy)return;
  NV.tm=setTimeout(nvFlush,Math.max(0,NV.last+11000-Date.now()));
}
async function nvFlush(){
  NV.tm=null; if(!nvOn()||NV.busy||!started&&NV.ev==='tick')return;
  NV.busy=true; const ev=NV.ev; NV.ev='tick';
  try{
    const b=nvBody(ev); if(!b.token)return;
    const {status}=await nvApi('/nv/prog',b); NV.last=Date.now();
    if(status===429){NV.ev=ev;NV.busy=false;nvSend(ev);return}
    if(status===401||status===403)NV.off=true;
  }catch(e){NV.last=Date.now()}
  finally{NV.busy=false}
}
setInterval(()=>{ if(started&&!document.hidden&&WS!=='title')nvSend('tick') },FAST?3000:60000);

const OVS=['ovTitle','ovMenu','ovSet','ovLog','ovNote','ovGal','ovSlots','ovChap','endcard'];

  const last=lsGet(K_LAST), ch=chapUnlocked(), g=lsGet(K_END)||{}, m=lsGet(K_META)||{play:0}, rd=IM.ready;
  $('tCont').disabled=!(last&&last.sv===SV)||!rd; $('tNew').disabled=!rd; $('tChap').disabled=!ch.some(x=>x.ok)||!rd; $('tLoad').disabled=!rd;
  if(rd)$('tStat').textContent='누적 플레이 '+fmtT(m.play||0)+' · 엔딩 '+Object.keys(g).length+'/'+Math.max(STORY.endings.length,Object.keys(g).length)+' · 읽은 대사 '+READ.size+'/'+STORY.meta.lines;
  else prog();
  try{gateApply()}catch(e){}
}

function chapUnlocked(){
  const m=lsGet(K_CHAP)||{}, any=Object.keys(lsGet(K_END)||{}).length>0; const maxI=Math.max(-1,...Object.keys(m).map(Number));
  return CHAPS.map((c,i)=>({i,t:c.t,s:m[i],ok:!!(m[i]&&m[i].sv===SV&&(i<maxI||any))}));
}
function buildChap(){
  const L=$('chList'); L.innerHTML=''; const list=chapUnlocked(); let n=0;
  list.forEach(x=>{
    const b=el('button','slot'); b.type='button'; b.disabled=!x.ok;
    b.appendChild(el('b',null,x.ok?x.t:'??? (아직 지나지 않은 장)')); if(x.ok){n++;b.appendChild(el('small',null,'그 장을 시작할 때의 상태로 이어집니다'))}
    b.onclick=()=>{ if(x.ok)loadSnap(x.s) }; L.appendChild(b);
  });
  $('chHint').textContent=n?'지나간 장을 처음부터 다시 볼 수 있습니다. (마지막으로 지난 때의 선택·단서 상태)':'아직 끝낸 장이 없습니다.';
}
function slotsGet(){const s=lsGet(K_SLOTS)||[]; return [s[0]||null,s[1]||null,s[2]||null]}
function buildSlots(mode){
  $('slT').textContent=mode==='save'?'저장할 슬롯':'불러올 슬롯'; const L=$('slList'); L.innerHTML=''; const S=slotsGet();
  S.forEach((s,i)=>{
    const b=el('button','slot'); b.type='button'; b.appendChild(el('b',null,'슬롯 '+(i+1)));
    b.appendChild(el('small',null,s?((CHAPS[s.ch]?CHAPS[s.ch].t:'')+' · 플레이 '+fmtT(s.play||0)+' · '+new Date(s.ts).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})):'비어 있음'));
    if(mode==='load'){b.disabled=!s||s.sv!==SV; b.onclick=()=>{if(s)loadSnap(s)}}
    else{ let armed=false; b.onclick=()=>{
      if(s&&!armed){armed=true;b.lastChild.textContent='덮어씁니다. 한 번 더 누르세요';return}
      const all=slotsGet(); all[i]=snap(); const okk=lsSet(K_SLOTS,all); toast(okk?'슬롯 '+(i+1)+'에 저장했습니다':'저장 실패(브라우저 저장소 막힘 — 이 탭에서만 유지)'); closeOv('ovSlots'); closeOv('ovMenu') } }
    L.appendChild(b);
  });
}
function buildNote(){
  const L=$('nList'); L.innerHTML=''; $('nT').textContent='단서 수첩 '+ST.clues.length+'/'+NCLUE;
  const got=ST.clues; CLUE_IDS.forEach(id=>{
    const has=got.includes(id), c=el('div','cnote '+(has?'got':'lock'));
    if(has){c.appendChild(el('span','ic',CLUE_ICON[id]||'🔍')); c.appendChild(el('span',null,STORY.clues[id]))}
    else c.appendChild(el('span',null,'？ 아직 찾지 못한 단서'));
    L.appendChild(c);
  });
  $('nHint').textContent=$('props').children.length?'지금 장면에 아직 줍지 않은 것이 있습니다 — 반짝이는 곳을 눌러 보세요.':'';
}
function buildGal(){
  const g=lsGet(K_END)||{}, G=$('gal'); G.innerHTML=''; const E=STORY.endings;
  const normal=E.filter(e=>!isTrueEnd(e)), tr=E.find(isTrueEnd), seenAll=normal.every(e=>g[e.id]);
  $('gT').textContent='엔딩 보기 '+Object.keys(g).length+'/'+E.length;
  $('gHint').textContent=tr&&!g[tr.id]?(seenAll?'하나가 더 있습니다. 수첩의 빈칸을 채우고, 스물여섯 번째 칸을 세어 보세요.':'아직 보지 못한 엔딩이 더 있습니다.'):'';
  E.forEach(e=>{
    const has=!!g[e.id], d=el('div','gcard'+(has?'':' lock')); d.appendChild(el('b',null,has?e.t:(isTrueEnd(e)?'??? — 숨겨진 엔딩':'??? (미공개)')));
    if(has)d.appendChild(el('span',null,'플레이 '+fmtT(g[e.id].play||0))); G.appendChild(d);
  });
}
