<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>스콰드 (비주얼 노벨)</title>
<meta name="theme-color" content="#05060a">
<!--
==========================================================================
 「스콰드」 호러 비주얼 노벨 — 단일 정적 페이지 (서버·라이브러리·외부 오디오 없음)
 이 이야기는 전부 허구이며 실제 인물·단체와 관계없습니다. 등장인물은 전부 가상의 알리아스입니다.

 [수정하는 법]  대사·장면은 아래 <script> 의 const SCENES 한 곳에서 고친다.
   대사 = ['화자','대사', {옵션}]  /  지문 = {n:'지문'}  /  선택 = {choice:{...}}  /  이동 = {go:'장면'}  /  엔딩 = {end:'A'}
   옵션: when(플래그 조건) fx sfx bg clue(단서 줍기)  — 화자 이름은 CHARS 의 name 과 같아야 초상화가 붙는다.

 [그림]  img/novel/bg_<배경id>.webp , img/novel/ch_<캐릭터id>.webp 가 있으면 자동으로 쓰고,
         없으면 어두운 그라디언트 배경 + 이름표/동그라미(첫 글자)로 대신한다.

 [분기 규칙]
   플래그: key(7장①로 열쇠를 빼앗음) / heard(7장②로 이유를 들음) / alerted(7장③으로 모두에게 알림)
   변수:   trust(간장맛명태소환사와의 신뢰: 7장②+1, 7장③+1, 4장 쪽지 줍기 +1), clues(단서 6개)
   단서 6개(탭해서 줍기): 3장 열쇠·벽의 숫자 / 4장 가입 문구 쪽지 / 6장 서류철·'마지막 생존 후보' 메모 / 7장 낡은 명단 조각
   7장 ①②③ → 8장 지문이 달라진다(열쇠를 쥔 승우, 그냥혀의 말, 물러난 일행).
   8장 ① 승우가 남는다 → 엔딩 A(희생)  ② 허기허기·포만포만이 남는다 → 엔딩 B(함께)  ③ 규칙 거부 → 엔딩 C(거부)
   ★ 진엔딩: 단서 6개 전부 + 7장②(이유를 들음) 를 모두 충족하면 8장에 숨은 선택지 ④(명단 조각을 맞춰 본다)가 나타나고,
     그것을 고르면 진엔딩. (조건이 안 되면 ④는 아예 보이지 않는다)
 [접근성] 번쩍임은 초당 2회 이하의 느린 명멸뿐. '움직임 줄이기'는 OS 설정을 따르고 메뉴에서도 켤 수 있다(흔들림·명멸·타자기 끔).
          선택지 제한시간은 메뉴에서 끌 수 있다.
==========================================================================
-->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05060a;color:#e8e6ea;overflow:hidden;
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#020306}
#stage{position:relative;width:min(100vw,960px);height:100vh;height:100dvh;max-height:720px;overflow:hidden;background:#000;
  user-select:none;-webkit-user-select:none;box-shadow:0 0 60px #000}
@media (max-width:600px){#stage{max-height:none}}
.layer{position:absolute;inset:0}
.bg{background-size:cover;background-position:center;opacity:0;transition:opacity 1s}
.bg.on{opacity:1}
#vig{pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.65) 100%)}
#chars{position:absolute;left:0;right:0;top:9%;bottom:33%;display:flex;justify-content:center;align-items:flex-end;gap:2%;pointer-events:none}
.ch{flex:0 1 32%;height:100%;display:flex;align-items:flex-end;justify-content:center;transition:filter .4s,opacity .4s,transform .4s;filter:brightness(.4);opacity:.75}
.ch.on{filter:none;opacity:1;transform:translateY(-1%)}
.ch img{max-width:100%;max-height:100%;object-fit:contain}
.ch .sil{width:min(30vw,150px);aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:min(14vw,64px);font-weight:700;color:#fff;border:2px solid rgba(255,255,255,.25);margin-bottom:6%}
#props{position:absolute;inset:0;pointer-events:none}
.prop{position:absolute;pointer-events:auto;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;
  border:2px solid #f0c060;background:rgba(240,192,96,.15);font-size:28px;display:flex;align-items:center;justify-content:center;
  animation:glow 1.6s ease-in-out infinite;z-index:5}
.prop small{position:absolute;top:100%;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;color:#f0c060;margin-top:2px}
@keyframes glow{0%,100%{box-shadow:0 0 6px #f0c06088}50%{box-shadow:0 0 22px #f0c060}}
#fxBlack{background:#000;opacity:0;transition:opacity .8s;pointer-events:none;z-index:5}
#fxBlack.on{opacity:1}
#fxWhite{background:#f4f1ea;opacity:0;transition:opacity .6s;pointer-events:none;z-index:2}
#fxWhite.on{opacity:1}
#fxFlick{background:#000;opacity:0;pointer-events:none;z-index:4}
#fxFlick.on{animation:flick 1.25s steps(1) infinite}
@keyframes flick{0%{opacity:0}30%{opacity:.55}45%{opacity:.1}70%{opacity:.7}100%{opacity:0}}
#stage.shake{animation:shake .5s linear 2}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}50%{transform:translate(3px,-3px)}75%{transform:translate(-2px,3px)}}
.rm #fxFlick.on{animation:none;opacity:.35}
.rm #stage.shake{animation:none}
.rm .prop{animation:none}
.rm *{transition-duration:.01s!important}
/* HUD */
#hud{position:absolute;top:0;left:0;right:0;padding:max(8px,env(safe-area-inset-top)) 10px 0;display:flex;gap:6px;align-items:center;z-index:9;pointer-events:none}
#hud>*{pointer-events:auto}
#clueHud{white-space:nowrap;font-size:12px;color:#f0c060;background:rgba(0,0,0,.5);padding:4px 8px;border-radius:12px;margin-right:auto}
.hb{white-space:nowrap;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);border-radius:14px;min-height:32px;padding:3px 8px;font-size:12px}
.hb.on{background:#7a1f2b;border-color:#c0394a}
/* textbox */
#tb{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:0 10px max(10px,env(safe-area-inset-bottom));min-height:30%}
#name{display:inline-block;min-height:26px;padding:3px 14px;margin:0 0 -1px 8px;border-radius:8px 8px 0 0;font-weight:700;font-size:15px;background:#222;border:1px solid rgba(255,255,255,.3);border-bottom:0}
#name:empty{visibility:hidden}
#box{background:rgba(6,8,14,.88);border:1px solid rgba(255,255,255,.28);border-radius:10px;padding:14px 16px 26px;min-height:112px;font-size:17px;line-height:1.7;position:relative;word-break:keep-all;overflow-wrap:anywhere}
#box.narr{font-style:italic;color:#c9c6cf}
#more{position:absolute;right:12px;bottom:6px;font-size:12px;opacity:.7}
#more.blink{animation:bl 1.2s steps(2) infinite}
.rm #more.blink{animation:none}
@keyframes bl{50%{opacity:.1}}
@media (min-width:700px){#box{font-size:19px;min-height:128px}#tb{padding-left:6%;padding-right:6%}}
/* choices */
#choices{position:absolute;left:0;right:0;top:0;bottom:0;z-index:7;display:none;flex-direction:column;justify-content:center;gap:10px;padding:0 6%;background:rgba(0,0,0,.45)}
#choices.on{display:flex}
#cl{display:flex;flex-direction:column;gap:10px}
#cq{text-align:center;font-size:15px;color:#cfcad6;margin-bottom:4px}
.cbtn{background:rgba(10,12,20,.92);border:1px solid #8c8498;border-radius:10px;padding:14px 14px;text-align:left;font-size:16px;line-height:1.5;min-height:48px}
.cbtn:hover,.cbtn:focus-visible{border-color:#f0c060;outline:none}
.cbtn.true{border-color:#f0c060;color:#f0c060}
#timer{height:6px;background:#222;border-radius:3px;overflow:hidden;margin-top:6px}
#timer i{display:block;height:100%;width:100%;background:#c0394a;transform-origin:left}
/* overlays */
.ov{position:absolute;inset:0;z-index:20;background:rgba(3,4,8,.96);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow-y:auto;text-align:center}
.ov.on{display:flex}
.ov h1{font-size:clamp(34px,10vw,56px);letter-spacing:.3em;margin:0 0 6px;color:#e8d8d8;text-shadow:0 0 18px #7a1f2b;font-weight:900}
.ov .sub{color:#9a95a4;font-size:13px;margin:0 0 26px;max-width:320px;line-height:1.6}
.ov .m{display:block;width:min(260px,80vw);margin:6px auto;padding:13px;background:#14161e;border:1px solid #5a5666;border-radius:10px;font-size:16px;min-height:46px}
.ov .m:hover,.ov .m:focus-visible{border-color:#f0c060;outline:none}
.ov .m[disabled]{opacity:.35;cursor:default}
.ov .back{margin-top:16px;background:none;border:0;color:#9a95a4;text-decoration:underline;min-height:40px}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;width:min(300px,86vw);margin:6px 0;font-size:15px;text-align:left}
.set button{min-width:64px}
#log{width:min(560px,100%);text-align:left;max-height:70vh;overflow-y:auto;font-size:15px;line-height:1.6}
#log p{margin:0 0 10px}#log b{color:#f0c060}
#gal{display:grid;gap:10px;width:min(420px,100%)}
.gcard{border:1px solid #444;border-radius:10px;padding:12px;text-align:left;background:#0f1118}
.gcard.lock{opacity:.4}
.gcard b{display:block;margin-bottom:4px}
#chap{position:absolute;inset:0;z-index:10;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column;opacity:0;transition:opacity .7s;pointer-events:none}
#chap.on{display:flex;opacity:1}
#chap span{font-size:13px;letter-spacing:.4em;color:#8a8494}
#chap b{font-size:clamp(26px,7vw,40px);margin-top:10px;font-weight:700}
#endcard{z-index:25}
#endcard h2{font-size:clamp(26px,7vw,38px);margin:0 0 6px}
#toast{position:absolute;left:50%;top:48px;transform:translateX(-50%);z-index:30;background:#222;border:1px solid #f0c060;border-radius:10px;padding:6px 12px;font-size:13px;display:none}
</style>
</head>
<body>
<div id="app">
 <div id="stage">
  <div class="layer bg" id="bgA"></div><div class="layer bg" id="bgB"></div>
  <div class="layer" id="fxWhite"></div>
  <div class="layer" id="vig"></div>
  <div id="chars"></div>
  <div id="props"></div>
  <div class="layer" id="fxFlick"></div>
  <div class="layer" id="fxBlack"></div>
  <div id="hud">
   <span id="clueHud">🔍 단서 0/6</span>
   <button class="hb" id="bAuto">AUTO</button><button class="hb" id="bSkip">SKIP</button>
   <button class="hb" id="bLog">기록</button><button class="hb" id="bMute">🔊</button><button class="hb" id="bMenu">메뉴</button>
  </div>
  <div id="tb"><div id="name"></div><div id="box"><span id="txt"></span><span id="more">▼</span></div></div>
  <div id="choices"><div id="cq"></div><div id="cl"></div><div id="timer"><i></i></div></div>
  <div id="chap"><span id="chapN"></span><b id="chapT"></b></div>
  <div id="toast"></div>

  <div class="ov on" id="ovTitle">
   <h1>스콰드</h1>
   <p class="sub">이 이야기는 전부 허구이며 실제 인물·단체와 관계없습니다.<br>소리가 납니다. 이어폰을 권합니다.</p>
   <button class="m" id="tCont">이어하기</button>
   <button class="m" id="tNew">처음부터</button>
   <button class="m" id="tGal">엔딩 보기</button>
   <button class="m" id="tSet">설정</button>
  </div>
  <div class="ov" id="ovMenu">
   <h2>메뉴</h2>
   <button class="m" id="mSave">슬롯에 저장</button>
   <button class="m" id="mLoad">슬롯에서 불러오기</button>
   <button class="m" id="mSet">설정</button>
   <button class="m" id="mTitle">타이틀로</button>
   <button class="back" data-close>닫기</button>
  </div>
  <div class="ov" id="ovSet">
   <h2>설정</h2>
   <div class="set">움직임 줄이기 <button class="hb" id="sRm"></button></div>
   <div class="set">선택 제한시간 <button class="hb" id="sTimer"></button></div>
   <div class="set">글자 속도 <button class="hb" id="sSpeed"></button></div>
   <div class="set">소리 <button class="hb" id="sMute"></button></div>
   <button class="back" data-close>닫기</button>
  </div>
  <div class="ov" id="ovLog"><div id="log"></div><button class="back" data-close>닫기</button></div>
  <div class="ov" id="ovGal"><h2>엔딩 보기</h2><div id="gal"></div><button class="back" data-close>닫기</button></div>
  <div class="ov" id="endcard"><h2 id="eT"></h2><p class="sub" id="eS"></p><button class="m" id="eBack">타이틀로</button></div>
 </div>
</div>

<script>
"use strict";
/* ===================== 데이터 ===================== */
// 캐릭터(전원 가상의 알리아스). id → img/novel/ch_<id>.webp
const CHARS=[
 {id:'seungwoo',name:'승우',c:'#3b6ea5'},{id:'myeongtae',name:'간장맛명태소환사',c:'#c98a2b'},
 {id:'ttokku',name:'또꾸',c:'#8a2b3a'},{id:'sinrin',name:'신린',c:'#6a2b8a'},
 {id:'hungry',name:'허기허기',c:'#d0607a'},{id:'pman',name:'포만포만',c:'#4a8a9a'},
 {id:'yumi',name:'감자깡장인 유미',c:'#b08a4a'},{id:'arin',name:'아린',c:'#a05a9a'},
 {id:'squirrel',name:'용맹한다람쥐',c:'#9a6a3a'},{id:'ugeoji',name:'우거지',c:'#5a8a4a'},
 {id:'leivy',name:'레이비',c:'#4a5aa0'},{id:'mongip',name:'몰입겜',c:'#7a7a3a'},
 {id:'usjeul',name:'우선즐겨',c:'#3a8a7a'},{id:'jelly',name:'대한제일젤리',c:'#a04a4a'},
 {id:'hallabong',name:'한라봉 갓',c:'#d08a2a'},{id:'taeyong',name:'태용',c:'#4a6a8a'},
 {id:'snake',name:'뱀조련사',c:'#3a7a4a'},{id:'gaeul',name:'가을',c:'#a0604a'},
 {id:'anjin',name:'안진',c:'#5a5a8a'},{id:'ongaeng',name:'앙앵모르콩',c:'#8a4a6a'},
 {id:'weiho',name:'weiho',c:'#4a8a6a'},{id:'yeri',name:'예리야',c:'#a07a9a'},
 {id:'parrot',name:'망앵무',c:'#6a9a3a'},{id:'geunyang',name:'그냥혀',c:'#7a3a3a'},
 {id:'kater',name:'kater',c:'#5a6a7a'}
];
const BYNAME={}; CHARS.forEach(c=>BYNAME[c.name]=c);
// 배경 id → img/novel/bg_<id>.webp (없으면 그라디언트)
const BGFALL={
 white:'#f4f1ea',
 prologue:'linear-gradient(#10131c,#05060a)',
 forest:'linear-gradient(#3a2a2a 0%,#1a1a22 55%,#07080c 100%)',
 lobby:'linear-gradient(#262a35,#0b0d13)',
 door:'linear-gradient(#1b1d24,#050608)',
 dining:'linear-gradient(#2b2220,#0a0809)',
 dark:'linear-gradient(#050507,#000)',
 archive:'linear-gradient(#232a2a,#080b0b)',
 broadcast:'linear-gradient(#1a2230,#06080c)',
 final:'linear-gradient(#2a1a1a,#060405)',
 morning:'linear-gradient(#d9b98a,#5a6a7a)'
};

/* 장면. 대사=[화자,대사,{옵션}] 지문={n:'..'} */
const SCENES={
 s0:{ch:['프롤로그','모집글'],bg:'white',mood:'none',next:'s1',steps:[
  {n:'모집글: 스콰드 클랜원 모집. 오래 같이 놀 사람. 분위기 좋아요. 내전 매일 열어요. 가입하면 챙겨 드립니다.',sfx:'keys',white:1},
  {fx:'white-off',bg:'prologue'},
  ['또꾸','이번 달에 스물다섯 명 모였어.'],
  ['신린','딱 맞네. 더 받으면 흐트러져.'],
  ['또꾸','이제 날짜만 정하면 돼. MT로 하자.'],
  ['신린','다들 웃으면서 올 거야. 아무도 의심 안 하고.'],
  {fx:'black',wait:1600}
 ]},
 s1:{ch:['1장','도착'],bg:'forest',mood:'calm',next:'s2',steps:[
  ['승우','승객… 아니, 여러분, 한 줄로 모여 주세요. 인원 확인하겠습니다.'],
  ['우거지','승우 형, 여기 신호 안 잡혀요.'],
  ['레이비','어차피 이틀이잖아. 와이파이 있겠지.'],
  ['허기허기','오빠, 배고파… 고기부터 굽자.'],
  ['포만포만','저녁은 도착해서 먹는다고 했잖아.'],
  ['간장맛명태소환사','저는 아직 어디가 방인지도 모르겠어요…'],
  ['승우','제가 안내해 드릴게요. 일단 안으로 들어가세요.'],
  {n:'승우가 마지막으로 들어서며 센다.',sfx:'door'},
  ['승우','스물여섯.',{sfx:'heart'}],
  {n:'승우가 멈춘다. 다시 센다.'},
  ['승우','스물다섯.'],
  {n:'…넘어간다.'}
 ]},
 s2:{ch:['2장','문이 잠긴다'],bg:'lobby',mood:'tense',next:'s3',steps:[
  {n:'불이 깜빡인다.',fx:'flicker',sfx:'chime'},
  ['방송','환영합니다, 스콰드 여러분. 여러분은 오늘 이곳을 떠날 수 없습니다.'],
  ['몰입겜','뭐야, 장난치는 거죠? 또꾸 형이죠?'],
  ['방송','규칙은 세 가지입니다. 하나, 미션은 순서대로 진행됩니다. 둘, 실패한 사람은 다음 방으로 가지 않습니다. 셋, 모든 미션을 끝낸 사람만 문을 나갑니다.'],
  ['우선즐겨','문이 안 열려!',{sfx:'knock',fx:'shake'}],
  ['한라봉 갓','창문도 철판이야.'],
  ['가을','…진정해. 규칙을 끝까지 듣자.'],
  ['방송','첫 미션은 한 시간 뒤입니다.'],
  {n:'(정적)',fx:'flicker-off'}
 ]},
 s3:{ch:['3장','첫 번째 미션'],bg:'door',mood:'tense',next:'s4',steps:[
  {n:'복도 끝, 철문. 열 개의 열쇠 중 맞는 것을 3분 안에 골라야 한다.'},

const AU={ctx:null,master:null,drone:null,hbT:null,mood:'none'};
function auInit(){
  if(AU.ctx){ if(AU.ctx.state==='suspended')AU.ctx.resume(); return; }
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
    const x=AU.ctx=new C(); AU.master=x.createGain(); AU.master.gain.value=SET.mute?0:.8; AU.master.connect(x.destination);
    const g=AU.drone=x.createGain(); g.gain.value=0; g.connect(AU.master);
    const lp=x.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=180; lp.connect(g);
    [55,55.7,82.4].forEach((f,i)=>{const o=x.createOscillator(); o.type=i==2?'sine':'sawtooth'; o.frequency.value=f; const og=x.createGain(); og.gain.value=i==2?.25:.5; o.connect(og); og.connect(lp); o.start();});
    const lfo=x.createOscillator(), lg=x.createGain(); lfo.frequency.value=.08; lg.gain.value=60; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  }catch(e){AU.ctx=null}
}
function auMute(){ if(AU.master)AU.master.gain.value=SET.mute?0:.8; $('bMute').textContent=SET.mute?'🔇':'🔊'; }
function noiseBuf(d){const x=AU.ctx,b=x.createBuffer(1,x.sampleRate*d,x.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;return b}
function tone(f,t0,d,vol,type,f2){const x=AU.ctx,o=x.createOscillator(),g=x.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.01);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(AU.master);o.start(t0);o.stop(t0+d+.05)}
function noise(t0,d,vol,fq){const x=AU.ctx,s=x.createBufferSource(),f=x.createBiquadFilter(),g=x.createGain();s.buffer=noiseBuf(d);f.type='lowpass';f.frequency.value=fq;g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);s.connect(f);f.connect(g);g.connect(AU.master);s.start(t0)}
function sfx(n){
  if(!AU.ctx||SET.mute)return; const t=AU.ctx.currentTime;
  if(n==='knock'){[0,.25,.5].forEach(d=>{tone(110,t+d,.18,.7,'sine',60);noise(t+d,.08,.4,500)})}
  else if(n==='door'){noise(t,.5,.5,300);tone(70,t,.7,.8,'sine',35)}
  else if(n==='thud'){tone(80,t,.4,.9,'sine',40);noise(t,.15,.4,200)}
  else if(n==='fall'){tone(320,t,1.6,.35,'triangle',35);noise(t+.2,1.2,.2,800)}
  else if(n==='drop'){tone(60,t,1.2,.5,'sine',30)}
  else if(n==='chime'){tone(660,t,.9,.25);tone(495,t+.5,1.2,.25)}
  else if(n==='keys'){for(let i=0;i<14;i++)noise(t+i*.12+Math.random()*.05,.03,.25,3000)}
  else if(n==='heart'){beat(t)}
}
function beat(t){tone(62,t,.18,.9,'sine',40);tone(55,t+.2,.2,.6,'sine',38)}
function setMood(m){
  AU.mood=m; if(!AU.ctx)return; clearInterval(AU.hbT);
  const v={none:0,calm:.05,tense:.09,dark:.12}[m]||0; AU.drone.gain.setTargetAtTime(v,AU.ctx.currentTime,1.2);
  const per={tense:1100,dark:760}[m];
  if(per) AU.hbT=setInterval(()=>{if(!SET.mute&&AU.ctx.state==='running')beat(AU.ctx.currentTime)},per);
}

function run(){
  clearTimeout(waitT); const arr=stepsOf(S.sc);
  while(S.i<arr.length&&!cond(norm(arr[S.i]).when))S.i++;
  if(S.i>=arr.length){ const nx=SCENES[S.sc].next; if(nx){enterScene(nx,0)} return; }
  autosave(); const st=norm(arr[S.i]); cur=st;
  if(st.bg)setBg(st.bg);

  if(st.sfx)sfx(st.sfx);
  if(st.go){enterScene(st.go,0);return}
  if(st.end){doEnd(st.end);return}
  if(st.choice){showChoice(st.choice);return}
  $('props').innerHTML='';

}
function show(st){
  const spk=st.s; $('name').textContent=spk||''; const c=BYNAME[spk]; $('name').style.background=c?c.c:'#333';
  $('box').classList.toggle('narr',!spk);
  if(spk)noteSpeaker(spk); renderChars(spk);
  backlog.push({s:spk,t:st.t}); if(backlog.length>200)backlog.shift();
  fullText=st.t; startType();
}
function startType(){
  clearInterval(typeT); const el=$('txt'); el.textContent=''; $('more').classList.remove('blink'); typing=true; let n=0;
  if(SET.rm||skip){el.textContent=fullText;endType();return}
  const sp=[44,26,12][SET.speed]||26;
  typeT=setInterval(()=>{n++;el.textContent=fullText.slice(0,n);if(n>=fullText.length)endType()},sp);
}
function endType(){
  clearInterval(typeT); typing=false; $('txt').textContent=fullText; $('more').classList.add('blink');
  if(skip&&!blocking()){waitT=setTimeout(next,70);return}
  if(auto&&!blocking()){waitT=setTimeout(next,1500+fullText.length*45)}
}
function blocking(){return !!(cur&&cur.choice)}
function next(){
  if(locked||$('choices').classList.contains('on'))return;
  if(typing){endType();return}
  if(cur&&cur.wait&&cur.t!==undefined&&false)return;
  S.i++; run();
}
function doFx(f){
  const B=$('fxBlack'),F=$('fxFlick');
  if(f==='flicker'){if(!SET.rm||true)F.classList.add('on')}
  else if(f==='flicker-off')F.classList.remove('on');
  else if(f==='shake'){stage.classList.remove('shake');void stage.offsetWidth;stage.classList.add('shake')}
  else if(f==='black'||f==='black-on')B.classList.add('on');
  else if(f==='black-off')B.classList.remove('on');
  else if(f==='white-off')$('fxWhite').classList.remove('on');
}
function showProp(cl){
  const p=document.createElement('button'); p.className='prop'; p.style.left=cl.x+'%'; p.style.top=cl.y+'%';
  p.innerHTML=cl.icon+'<small>'+cl.label+'</small>'; p.setAttribute('aria-label',cl.label+' 줍기');
  p.onclick=e=>{e.stopPropagation(); if(!S.clues.includes(cl.id)){S.clues.push(cl.id);if(cl.trust)S.trust+=cl.trust;updClue();toast('단서 획득: '+cl.label);sfx('chime')} p.remove();autosave()};
  $('props').appendChild(p);
}
/* 선택 */
function showChoice(ch){
  clearTimeout(waitT); clearTimeout(choiceT); auto=false;$('bAuto').classList.remove('on'); skip=false;$('bSkip').classList.remove('on');
  $('props').innerHTML=''; $('cq').textContent=ch.q||''; const L=$('cl'); L.innerHTML='';
  const opts=ch.opts.filter(o=>cond(o.when)); let k=0;
  opts.forEach((o,idx)=>{const b=document.createElement('button'); b.className='cbtn'+(o.when?' true':''); b.textContent=(idx+1)+'. '+o.t; b.onclick=()=>{if(Date.now()-chShown>350)pick(o)}; L.appendChild(b)});
  $('choices').classList.add('on'); chShown=Date.now();
  const tm=$('timer'); tm.style.display='none';
  if(ch.timer&&SET.timer){
    tm.style.display='block'; const bar=tm.firstChild; bar.style.transition='none'; bar.style.transform='scaleX(1)'; void bar.offsetWidth;
    bar.style.transition='transform '+ch.timer+'s linear'; bar.style.transform='scaleX(0)';
    const d=opts.find(o=>o.def&&!o.when)||opts[0]; choiceT=setTimeout(()=>pick(d),ch.timer*1000);
  }
  cur=Object.assign({},cur,{choice:ch,_opts:opts});
}
function pick(o){
  clearTimeout(choiceT); $('choices').classList.remove('on');
  if(o.set)Object.assign(S.F,o.set); if(o.trust)S.trust+=o.trust;
  backlog.push({s:'선택',t:o.t}); enterScene(o.go,0);
}
/* 엔딩 */
function doEnd(k){
  const g=lsGet(K_END)||{}; g[k]=1; lsSet(K_END,g); mem.end=g;
  try{localStorage.removeItem(K_SAVE)}catch(e){} delete mem[K_SAVE];
  $('eT').textContent=ENDINGS[k].t; $('eS').textContent=ENDINGS[k].s; $('endcard').classList.add('on'); setMood('none');
  $('tb').style.visibility='hidden';
}

/* ===================== UI ===================== */
function openOv(id){$(id).classList.add('on')}
function closeOv(id){$(id).classList.remove('on')}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.ov').classList.remove('on'));
function anyOv(){return !!stage.querySelector('.ov.on')}
function newGame(){S={sc:'s0',i:0,F:{},clues:[],trust:0};backlog=[];updClue();closeOv('ovTitle');closeOv('endcard');started=true;auInit();auMute();
  $('tb').style.visibility='visible'; enterScene('s0',0)}
function resume(d){S={sc:d.sc,i:d.i,F:d.F||{},clues:d.clues||[],trust:d.trust||0};updClue();closeOv('ovTitle');closeOv('endcard');closeOv('ovMenu');started=true;auInit();auMute();
  $('tb').style.visibility='visible'; enterScene(S.sc,S.i,true)}
function refreshTitle(){const d=loadAuto();$('tCont').disabled=!d;}
$('tNew').onclick=newGame;
$('tCont').onclick=()=>{const d=loadAuto();if(d)resume(d)};
$('tGal').onclick=()=>{buildGal();openOv('ovGal')};
$('tSet').onclick=()=>{buildSet();openOv('ovSet')};
$('mSet').onclick=()=>{buildSet();openOv('ovSet')};
$('bMenu').onclick=()=>openOv('ovMenu');
$('mTitle').onclick=()=>{closeOv('ovMenu');setMood('none');clearTimeout(waitT);clearTimeout(choiceT);$('choices').classList.remove('on');refreshTitle();openOv('ovTitle')};
$('eBack').onclick=()=>{closeOv('endcard');refreshTitle();openOv('ovTitle')};
$('mSave').onclick=()=>{const d={sc:S.sc,i:S.i,F:S.F,clues:S.clues,trust:S.trust};toast(lsSet(K_SLOT,d)?'저장했습니다':'저장 실패(브라우저 저장소 막힘)');closeOv('ovMenu')};
$('mLoad').onclick=()=>{const d=lsGet(K_SLOT);if(!d){toast('저장된 슬롯이 없습니다');return}clearTimeout(waitT);clearTimeout(choiceT);$('choices').classList.remove('on');resume(d)};
$('bAuto').onclick=()=>{auto=!auto;$('bAuto').classList.toggle('on',auto);if(auto&&!typing)next()};
$('bSkip').onclick=()=>{skip=!skip;$('bSkip').classList.toggle('on',skip);if(skip&&!typing&&!blocking())next();else if(skip)endType()};
$('bMute').onclick=()=>{SET.mute=!SET.mute;saveSet();auMute()};
$('bLog').onclick=()=>{const L=$('log');L.innerHTML='';backlog.forEach(b=>{const p=document.createElement('p');p.innerHTML=(b.s?'<b></b> ':'')+'<span></span>';if(b.s)p.firstChild.textContent=b.s;p.lastChild.textContent=b.t;L.appendChild(p)});openOv('ovLog');L.scrollTop=L.scrollHeight};
function buildGal(){const g=lsGet(K_END)||mem.end||{},G=$('gal');G.innerHTML='';
  Object.keys(ENDINGS).forEach(k=>{const d=document.createElement('div');d.className='gcard'+(g[k]?'':' lock');d.innerHTML='<b></b><span></span>';d.firstChild.textContent=g[k]?ENDINGS[k].t:'??? (미공개)';d.lastChild.textContent=g[k]?ENDINGS[k].s:'';G.appendChild(d)})}
function applyRm(){app.classList.toggle('rm',!!SET.rm)}
function buildSet(){
  $('sRm').textContent=SET.rm?'켬':'끔';$('sTimer').textContent=SET.timer?'켬':'끔';$('sSpeed').textContent=['느림','보통','빠름'][SET.speed];$('sMute').textContent=SET.mute?'끔':'켬';
}
$('sRm').onclick=()=>{SET.rm=!SET.rm;saveSet();applyRm();buildSet()};
$('sTimer').onclick=()=>{SET.timer=!SET.timer;saveSet();buildSet()};
$('sSpeed').onclick=()=>{SET.speed=(SET.speed+1)%3;saveSet();buildSet()};
$('sMute').onclick=()=>{SET.mute=!SET.mute;saveSet();auMute();buildSet()};
// 진행 입력
$('stage').addEventListener('click',e=>{
  if(!started||anyOv())return; if(e.target.closest('#hud,.prop,#choices,.ov'))return; next();
});
document.addEventListener('keydown',e=>{
  if(!started||anyOv())return;
  if($('choices').classList.contains('on')){if(e.key==='Enter'||e.key===' ')e.preventDefault();const n=parseInt(e.key,10);const b=$('cl').children[n-1];if(b&&Date.now()-chShown>350){b.click()}return}
  if(e.key===' '||e.key==='Enter'){if(e.target.tagName==='BUTTON')return;e.preventDefault();next()}
});
document.addEventListener('visibilitychange',()=>{if(AU.ctx){document.hidden?AU.ctx.suspend():AU.ctx.resume()}});
applyRm(); auMute(); refreshTitle();
window.__novel={S:()=>S,SCENES,pick:k=>0};
</script>
</body>
</html>
