<script>
(function(){ try{
  var ls=localStorage, ss=sessionStorage; ls.setItem('sgg_dc_probe','1'); ls.removeItem('sgg_dc_probe'); ss.setItem('sgg_dc_probe','1'); ss.removeItem('sgg_dc_probe');
  var J=function(k){ try{ return JSON.parse(ls.getItem(k)||'null'); }catch(e){ return null; } };
  var dc=J('sgg_dc'), auto=J('sgg_dc_auto'), now=Date.now();
  if(ls.getItem('sgg_dc_auto')===null&&dc&&dc.id){ auto={id:String(dc.id),name:String(dc.name||''),avatar:String(dc.avatar||'')}; ls.setItem('sgg_dc_auto',JSON.stringify(auto)); }
  if(ls.getItem('sgg_dc_try')!==null){ ls.setItem('sgg_dc_auto','0'); ls.removeItem('sgg_dc_try'); return; }
  if(!(auto&&auto.id)) return;
  if(dc&&dc.token&&dc.exp>now+24*3600*1000) return;
  if(window.top!==window.self||document.prerendering||navigator.onLine===false) return;
  var a=new Uint8Array(16); crypto.getRandomValues(a); var st=Array.prototype.map.call(a,function(x){return (x<16?'0':'')+x.toString(16);}).join('');
  ls.setItem('sgg_dc_try',String(now)); ss.setItem('sgg_oauth_state',st); ss.setItem('sgg_oauth_return','게임:brjhunt');
  window.SGG_DC_BOUNCE=true;
  location.replace('https://discord.com/api/oauth2/authorize?response_type=token&client_id=1520763174675022028'
    +'&redirect_uri='+encodeURIComponent(location.origin+new URL('./',location.href).pathname)
    +'&scope=identify&state='+encodeURIComponent(st)+'&prompt=none');
}catch(e){} })();
</script>

<script>
// ---------- 브장신 키우기 웹 사냥터 ----------
// 로그인·서버 주소는 survivors.html 과 같은 방식(디스코드 토큰은 메인 사이트와 같은 localStorage 칸 sgg_dc).
// 서버가 주는 문자열은 전부 esc 를 거쳐 innerHTML 에 넣는다. 숫자는 N() 으로 한 번 걸러 쓴다.
const P6_API='https://hth3thmujs.apps.bot-hosting.cloud';
const DISCORD_CLIENT_ID='1520763174675022028';
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=v=>{v=Number(v);return Number.isFinite(v)?v:0;};
const fmt=v=>Math.floor(N(v)).toLocaleString('ko-KR');
const $=id=>document.getElementById(id);
const GR_KO={normal:'노말',rare:'레어',epic:'에픽',unique:'유니크',legend:'레전드'};
const GR_KEYS=['normal','rare','epic','unique','legend'];
const grKey=g=>GR_KEYS.includes(g)?g:'normal';     // 서버 값이 이상해도 클래스 이름으로 못 새어 나가게
const imgKey=k=>/^[a-z0-9_]{1,30}$/.test(String(k||''))?String(k):'';
const TABS=[['hunt','🏞','사냥터'],['crew','🧑‍🤝‍🧑','동료'],['grow','⚔','성장'],['adv','🗝','모험'],['pres','🌟','환생']];

let V=null;              // 서버가 준 전체 화면 값(view)
let TAB='hunt', MSG=null, STATE='boot';   // STATE: boot · out(로그아웃) · nobrj · err · ok
let ERR='', BUSY=false, FETCHED=0, PARTY=null, PARTY_DIRTY=false, SUMRES=null, RANK=null, RANK_AT=0, SEL_PRES=false;

function dcUser(){try{const o=JSON.parse(localStorage.getItem('sgg_dc')||'null');if(o&&o.id&&o.token&&o.exp>Date.now())return o;}catch(e){}return null;}
function dcLogin(){   // 디스코드에 등록된 복귀 주소는 메인 페이지뿐 → 메인이 받아 로그인 처리 후 이 페이지로 되돌려 준다
  const st=Math.random().toString(36).slice(2)+'.'+Math.floor(performance.now());
  let none=false; try{const a=JSON.parse(localStorage.getItem('sgg_dc_auto')||'null');none=!!(a&&a.id);}catch(e){}
  try{sessionStorage.setItem('sgg_oauth_state',st);sessionStorage.setItem('sgg_oauth_return','게임:brjhunt');
      if(none)localStorage.setItem('sgg_dc_try',String(Date.now()));}catch(e){}
  const main=location.origin+new URL('./',location.href).pathname;
  location.href='https://discord.com/api/oauth2/authorize?response_type=token&client_id='+encodeURIComponent(DISCORD_CLIENT_ID)
    +'&redirect_uri='+encodeURIComponent(main)+'&scope=identify&state='+encodeURIComponent(st)+(none?'&prompt=none':'');
}

// ---------- 서버 부르기 ----------
const CODE_MSG={
  auth:'로그인이 끝났어요. 디스코드로 다시 로그인해 주세요.',
  busy:'지금 사람이 몰려서(또는 너무 빨리 눌러서) 잠깐 막혔어요. 몇 초 뒤에 다시 눌러 주세요.',
  upstream:'디스코드 확인이 잠깐 늦어지고 있어요. 로그인은 그대로예요. 조금 뒤에 다시 해 보세요.',
  error:'서버에서 문제가 생겼어요. 잠시 뒤에 다시 해 보세요.',
  big:'요청이 너무 커요.', http:'서버 응답을 읽지 못했어요. 잠시 뒤에 다시 해 보세요.', net:'서버에 연결하지 못했어요. 인터넷을 확인하고 다시 해 보세요.'
};
async function call(path,body){
  const u=dcUser(); if(!u) return {ok:false,code:'auth',local:true};
  let r,j=null; const ac=typeof AbortController==='function'?new AbortController():null, to=setTimeout(()=>{ try{ac&&ac.abort();}catch(e){} },18000);   // 서버가 안 답해도 버튼이 영영 죽지 않게
  try{
    r=await fetch(P6_API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({},body||{},{token:u.token})),signal:ac?ac.signal:undefined});
    try{j=await r.json();}catch(e){}
  }catch(e){return {ok:false,code:'net'};}finally{ clearTimeout(to); }
  if(!j||typeof j!=='object') return {ok:false,code:'http'};
  if(r.status===401) j.code='auth';
  return j;
}
function takeView(j){ if(j&&j.view&&typeof j.view==='object'){ V=j.view; FETCHED=Date.now(); if(!PARTY_DIRTY) PARTY=null; return true; } return false; }
// 서버가 거절한 이유를 사람 말로. 로그인 문제는 화면 전체를 로그아웃 상태로 바꾼다.
function failText(j){
  if(!j) return CODE_MSG.net;
  if(j.code==='no_brj'){ STATE='nobrj'; return ''; }
  if(j.code==='auth'){ STATE='out'; return ''; }
  return CODE_MSG[j.code]||'요청을 처리하지 못했어요.';
}
async function load(){
  const j=await call('/brj/idle',{});
  if(j.ok&&takeView(j)){ STATE='ok'; ERR=''; }
  else { const t=failText(j); if(STATE==='ok'&&V){ say(t||'다시 불러오지 못했어요.','bad'); } else if(!['out','nobrj'].includes(STATE)){ STATE='err'; ERR=t; } }
  render();
}
// 버튼 한 번 = 요청 한 번. 응답 전에는 다른 버튼이 안 눌린다.
const TRANSPORT=['auth','no_brj','busy','upstream','error','big','http','net','not_found'];
async function act(path,body,onOk){
  if(BUSY) return; BUSY=true; document.body.classList.add('busy');
  try{
    const j=await call(path,body);
    if(TRANSPORT.includes(j.code)&&!j.view){ const t=failText(j); if(t) say(t,'bad'); }   // 로그인·몰림·연결 문제 — 서버가 일을 처리하지 않았다
    else{ takeView(j); try{ onOk(j); }catch(e){ console.warn(e); } }   // 성공이든 「소환권 부족」 같은 거절이든 서버가 준 값으로 다시 그린다
  }finally{ BUSY=false; document.body.classList.remove('busy'); render(); }
}
function say(t,k){ MSG={t,k:k||'info'}; }
function toast(t){ const b=$('toastBox'); const d=document.createElement('div'); d.className='toast'; d.textContent=t; b.appendChild(d); setTimeout(()=>d.remove(),2200); }

// ---------- 실시간 전투 화면 (연출) ----------
// 서버 계산(골드·스테이지·보상)이 정답이고, 이 캔버스는 그것을 눈에 보이게 하는 구경용 연출이다.
// 화면 속 데미지·처치 속도는 뷰의 power·rate 에서 파생하고, 보상은 건드리지 않는다. 보스 승패는 /brj/boss 응답을 그대로 따른다.
// 그림(img/brjhunt/*.webp)이 없거나 실패하면 이모지·도형으로 그려서 그림이 하나도 없어도 돈다.
const Battle=(function(){
  const FONT='"Malgun Gothic","Apple SD Gothic Neo",sans-serif';
  const CHICK_FB='img/brjang/parts/body_chick/front.png';
  const MON_EMOJI=['🦐','🥒','💬','🛵','🐟','🦆'];
  const REG_KEY=['합정 골목','bhc','홍대','상수','망원','한강'];
  const HUE=[205,28,345,262,140,190];
  const GR_COL={normal:'#98a2b8',rare:'#4aa3ff',epic:'#b678ff',unique:'#ffa23a',legend:'#ff5c7a'};
  const GY=196, DH=240, ENG=62, rnd=Math.random;
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;
  const S={root:null,cv:null,ctx:null,raf:0,last:0,running:false,attached:false,vis:true,frames:0,
    cssW:0,dpr:1,sc:1,DW:390,mode:'hunt',t:0,scroll:0,shake:0,walking:true,
    mons:[],parts:[],texts:[],wait:0,kills:0,
    chick:{x:130,pose:'idle',poseT:0,lunge:0,atkT:0.4,alt:0,hitIn:0,hurt:0,kbx:0,down:0,skillT:0},
    skillCd:4,fx:null,party:[],pkey:'',boss:null,low:false,dtAvg:0.016,lowN:0,popAt:0,
    reg:0,stage:1,power:100,rate:0,hitInt:0.5,htk:4,dmg:20,monHp:80,region:'',
    rm:false};
  try{ S.rm=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches); }catch(e){}

  // ----- 그림 -----
  const cache={};
  function ld(src){ let c=cache[src]; if(!c){ c=cache[src]={im:new Image(),ok:false}; c.im.onload=()=>{c.ok=true;}; c.im.onerror=()=>{c.ok=false;}; c.im.src=src; } return c.ok?c.im:null; }
  const art=n=>ld('img/brjhunt/'+n+'.webp');
  const ec={};
  function emo(ch,px){   // 이모지는 한 번만 그려 두고 그림처럼 쓴다
    const k=ch+'|'+px+'|'+S.dpr*S.sc; let c=ec[k];
    if(!c){ const sz=Math.ceil(px*1.4*S.dpr*S.sc); c=document.createElement('canvas'); c.width=c.height=sz; const x=c.getContext('2d');
      x.font=Math.round(px*S.dpr*S.sc)+'px '+FONT; x.textAlign='center'; x.textBaseline='middle'; x.fillText(ch,sz/2,sz/2); c.dw=sz/(S.dpr*S.sc); ec[k]=c; }
    return c;
  }
  function spr(x,fy,h,im,o){   // 발 중앙 (x,fy) 에 높이 h 로
    const c=S.ctx; o=o||{};
    c.save(); c.translate(x,fy); if(o.rot) c.rotate(o.rot); if(o.a!=null) c.globalAlpha=o.a;
    c.scale((o.sx||1)*(o.flip?-1:1),o.sy||1);
    if(im&&im.tagName==='CANVAS') c.drawImage(im,-im.dw/2,-h/2-im.dw/2,im.dw,im.dw);
    else if(im){ const w=h*im.width/im.height; c.drawImage(im,-w/2,-h,w,h); }
    c.restore();
  }
  function txt(s,x,y,size,col,al,stroke){
    const c=S.ctx; c.font='900 '+size+'px '+FONT; c.textAlign=al||'center'; c.textBaseline='middle'; c.lineJoin='round';
    c.lineWidth=Math.max(2,size/5); c.strokeStyle=stroke||'rgba(10,12,20,.85)'; c.strokeText(s,x,y); c.fillStyle=col||'#fff'; c.fillText(s,x,y);
  }

  // ----- 값 파생 -----
  function derive(){
    const v=V||{}, d=v.dungeon||{};
    S.power=Math.max(5,N(d.power)); S.rate=N(v.rate); S.stage=N(v.stage)||1; S.region=String(v.region||'');
    S.hitInt=clamp(0.66-Math.log10(S.rate+10)*0.045,0.34,0.6);          // 시간당 골드가 높을수록 손이 빨라진다
    S.htk=clamp(Math.round(6.2-Math.log10(S.power+10)*0.75),3,5);       // 전투력이 높을수록 몇 대 만에 쓰러뜨린다
    S.dmg=Math.max(1,Math.round(S.power*0.22)); S.monHp=S.dmg*S.htk;
    let ri=-1; const rg=S.region.toLowerCase(); for(let i=0;i<6;i++) if(rg.indexOf(REG_KEY[i])>=0){ ri=i; break; }
    if(ri<0) ri=Math.floor((Math.max(1,S.stage)-1)/5)%6;
    S.reg=ri; if(S.attached) preload();
    const sm=v.summon||{}, ids=Array.isArray(sm.party)?sm.party.slice(0,3):[], cards=Array.isArray(sm.cards)?sm.cards:[];
    const key=ids.join(',')+'|'+cards.length;
    if(key!==S.pkey){ S.pkey=key;
      S.party=ids.map(id=>cards.find(c=>c&&c.id===id)).filter(Boolean).map((c,i)=>({ini:Array.from(String(c.n||'?'))[0]||'?',gr:grKey(c.gr),t:0.6+i*0.37,hop:0})); }
  }

  // 지금 지역의 그림만 부른다(병아리 5장 + 몬스터 2장 + 배경 1장 ≈ 150KB). 스테이지가 올라 지역이 바뀌면 그때 그 지역 것만 더 부른다.
  function preload(){ ['idle','atk1','atk2','hit','skill'].forEach(p=>art('chick_'+p)); art('m'+(S.reg+1)+'_idle'); art('m'+(S.reg+1)+'_hit'); art('bg'+(S.reg+1)); }

  // ----- 시작·멈춤 -----
  function build(){
    const w=document.createElement('div'); w.className='bwrap';
    const cv=document.createElement('canvas'); cv.className='bcv'; cv.setAttribute('role','img'); cv.setAttribute('aria-label','자동 전투 구경 화면');
    w.appendChild(cv); S.root=w; S.cv=cv; S.ctx=cv.getContext('2d');
    try{ new IntersectionObserver(es=>{ S.vis=es[es.length-1].isIntersecting; if(S.vis) start(); else stop(); }).observe(cv); }catch(e){}
    window.addEventListener('resize',()=>{ if(S.attached) measure(); });
    document.addEventListener('visibilitychange',()=>{ if(document.hidden) stop(); else if(S.attached) start(); });
  }
  function measure(){
    const cw=S.cv.clientWidth||320, dpr=Math.min(2,window.devicePixelRatio||1);
    if(cw===S.cssW&&dpr===S.dpr) return;
    S.cssW=cw; S.dpr=dpr; S.sc=1; S.DW=cw;
    S.cv.width=Math.round(cw*dpr); S.cv.height=Math.round(DH*dpr);
    if(!S.mons.length&&!S.boss) S.chick.x=S.DW*0.4;
  }
  function attach(slot){
    if(!S.root) build();
    if(S.root.parentNode!==slot) slot.appendChild(S.root);
    const first=!S.attached; S.attached=true;
    measure(); derive();
    preload(); ld(CHICK_FB);
    if(first){ S.chick.x=S.DW*0.4; S.mons.length=0; spawnWave(true); }
    drawFrame(); start();
  }
  function detach(){ S.attached=false; stop(); }
  function start(){ if(S.running||!S.attached||document.hidden||!S.vis) return; S.running=true; S.last=performance.now(); S.raf=requestAnimationFrame(loop); }
  function stop(){ S.running=false; if(S.raf) cancelAnimationFrame(S.raf); S.raf=0; }
  function loop(ts){
    S.raf=0; if(!S.running) return;
    const dt=Math.min(0.05,Math.max(0.001,(ts-S.last)/1000||0.016)); S.last=ts;
    S.dtAvg=S.dtAvg*0.95+dt*0.05;
    if(!S.low&&S.dtAvg>0.032){ if(++S.lowN>120) S.low=true; } else if(S.lowN>0) S.lowN--;
    if((S.frames&31)===0) measure();
    update(dt); drawFrame(); S.frames++;
    S.raf=requestAnimationFrame(loop);
  }

  // ----- 만들기 -----
  function spawnWave(first){
    let n=2+(rnd()<0.4?1:0)+(S.stage>=15&&rnd()<0.3?1:0); n=Math.min(3,n);   // 한 무리 최소 2마리 — 계속 몰아치는 느낌
    for(let i=0;i<n;i++) S.mons.push({x:first?S.DW*0.7+i*46:S.DW*0.85+i*46,hp:S.monHp,max:S.monHp,hit:0,kb:0,dead:-1,ph:rnd()*6,sp:120+rnd()*20,atk:1+rnd()*1.2,lunge:0});
  }
  function pushP(p){ if(S.parts.length<(S.low||S.rm?26:60)) S.parts.push(p); }
  function say2(s,x,y,size,col,life,alpha){   // 이미 떠 있는 숫자 수만큼 위로 어긋나게, 좌우 번갈아 — 겹쳐서 못 읽는 일 방지
    if(S.texts.length>=22) S.texts.shift();
    const k=S.texts.filter(t=>t.t<0.5).length; S.dmgSide=-(S.dmgSide||1);
    S.texts.push({s,x:x+(k?S.dmgSide*16:0),y:y-Math.min(k,5)*12,vy:-38,t:0,life:life||0.9,size,col,al:alpha==null?1:alpha});
  }
  function coins(x,y,n){ for(let i=0;i<n;i++) pushP({k:'coin',x,y,vx:(rnd()-0.5)*90,vy:-130-rnd()*80,t:0,life:1.1,b:0}); }
  function poof(x,y,col,n){ for(let i=0;i<n;i++){ const a=rnd()*6.28,s=40+rnd()*70; pushP({k:'dot',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,t:0,life:0.45,c:col,r:2+rnd()*2}); } }
  function popPend(){
    const now=performance.now(); if(now-S.popAt<800) return; S.popAt=now;
    const e=document.getElementById('pend'); if(e){ e.classList.remove('pop'); void e.offsetWidth; e.classList.add('pop'); }
  }

  // ----- 피해 -----
  function hitMon(m,dmg,crit,col){
    if(m.dead>=0) return;
    m.hp-=dmg; m.hit=0.16; m.kb=crit?14:8;
    say2(fmt(dmg)+(crit?'!':''),m.x+(rnd()-0.5)*14,GY-68,crit?22:16,crit?'#ffd23c':(col||'#fff'),crit?1.0:0.8,col==='#bfe0ff'?0.8:1);
    poof(m.x,GY-30,crit?'#ffd23c':'#fff',crit?5:2);
    if(m.hp<=0){ m.dead=0; S.kills++; coins(m.x,GY-24,S.low?3:5); poof(m.x,GY-30,'#fff6c0',6); popPend(); }
  }
  function frontMon(){ for(let i=0;i<S.mons.length;i++) if(S.mons[i].dead<0) return S.mons[i]; return null; }
  function hitBoss(step,crit,col){
    const B=S.boss; if(!B||B.state!=='fight') return;
    const dmg=Math.max(1,Math.round(step*(0.9+rnd()*0.2)*(crit?1.8:1)));
    const was=B.hp; B.hp=Math.max(B.target,B.hp-dmg); B.hit=0.14; B.kb=crit?9:5;
    say2(fmt(Math.max(1,was-B.hp))+(crit?'!':''),B.x+(rnd()-0.5)*40,GY-140,crit?24:16,crit?'#ffd23c':(col||'#fff'),1.0,col==='#bfe0ff'?0.8:1);
    poof(B.x-20,GY-70,crit?'#ffd23c':'#fff',crit?6:3); S.shake=Math.max(S.shake,crit?4:2);
    if(B.hp<=B.target){
      if(B.res==='win'){ B.state='dying'; B.t=0; S.shake=9; coins(B.x,GY-60,S.low?8:16); poof(B.x,GY-80,'#fff6c0',14); popPend(); }
      else { B.state='smash'; B.t=0; }
    }
  }
  function chickHit(){
    const crit=rnd()<0.18;
    if(S.boss){ hitBoss(S.boss.hpMax*(0.085+rnd()*0.03),crit); return; }
    const m=frontMon(); if(m&&m.x<=S.chick.x+ENG+30) hitMon(m,Math.round(S.dmg*(0.88+rnd()*0.24)*(crit?2:1)),crit);
  }
  function skillBurst(){
    const base=S.dmg*2.2;
    if(S.boss){ hitBoss(S.boss.hpMax*0.16,true,'#ff9a3c'); }
    else for(const m of S.mons) if(m.dead<0&&m.x<S.DW) hitMon(m,Math.round(base*(0.9+rnd()*0.2)),true,'#ff9a3c');
    S.shake=Math.max(S.shake,S.rm?0:5);
  }

  // ----- 보스 (결과는 서버가 정한다) -----
  function bossStart(b){
    if(!S.attached||S.boss||!b) return;
    for(const m of S.mons) if(m.dead<0) m.dead=0.0;
    const k=imgKey(b.img);
    S.boss={name:String(b.name||'보스'),img:k,x:S.DW+120,stop:S.DW*0.76,hp:N(b.hp)||1000,hpMax:N(b.hp)||1000,target:0,res:null,state:'intro',t:0,hit:0,kb:0,reward:null};
    if(k) ld('img/brjang/boss/'+k+'/front.png');
    S.mode='boss'; S.shake=S.rm?0:5; S.skillCd=3;
    S.texts.length=0;
  }
  function bossResult(j){
    const B=S.boss; if(!B||B.res) return;
    const r=j&&j.result;
    if(r==='win'||r==='lose'){
      const hp=N(j.hp); if(hp>0&&B.state!=='fight'){ B.hpMax=hp; B.hp=hp; }
      B.res=r;
      if(r==='win'){ B.target=0; B.reward={feast:N(j.feast),ticket:N(j.ticket)}; }
      else { const ratio=clamp(N(j.power)/Math.max(1,B.hpMax),0,0.98); B.target=Math.round(B.hpMax*Math.max(0.12,1-ratio)); }
      if(B.state==='hold') B.state='fight';
    } else bossAbort(true);
  }
  function bossAbort(force){
    const B=S.boss; if(!B||(B.res&&!force)) return;
    B.state='leave'; B.t=0;
  }
  function bossFinish(){ S.boss=null; S.mode='hunt'; S.mons.length=0; S.wait=0.5; S.chick.down=0; S.chick.pose='idle'; }

  // ----- 갱신 -----
  function update(dt){
    S.t+=dt; const c=S.chick, B=S.boss, DW=S.DW;
    S.shake=Math.max(0,S.shake-dt*14);
    const want=B?clamp(B.stop-92,DW*0.4,DW*0.52):DW*0.4;
    c.x+=(want-c.x)*Math.min(1,dt*4);
    c.poseT-=dt; if(c.poseT<=0&&c.pose!=='down') c.pose='idle';
    c.lunge=Math.max(0,c.lunge-dt*5); c.hurt=Math.max(0,c.hurt-dt); c.kbx*=Math.exp(-dt*10); c.skillT=Math.max(0,c.skillT-dt);
    let engaged=false, front=null;
    // 보스
    if(B){
      B.t+=dt; B.hit=Math.max(0,B.hit-dt); B.kb*=Math.exp(-dt*12);
      if(B.state==='hold'&&B.t>22&&!B.res) bossAbort(true);   // 판정이 끝내 안 오면 보스가 물러난다
      if(B.state==='intro'){ B.x=Math.max(B.stop,B.x-150*dt); if(B.x<=B.stop){ B.state=B.res?'fight':'hold'; B.t=0; S.shake=S.rm?0:6; } }
      else if(B.state==='fight') engaged=!c.down;
      else if(B.state==='dying'){ if(B.t>3.2) bossFinish(); }
      else if(B.state==='smash'){
        if(B.t>0.35&&!c.down){ c.down=1; c.pose='down'; S.shake=S.rm?0:8; poof(c.x,GY-40,'#ff5c7a',10); say2('💥',c.x,GY-90,30,'#fff',1.2); }
        if(B.t>3.0){ c.down=0; c.pose='idle'; B.state='leave'; B.t=0; }
      } else if(B.state==='leave'){ if(B.t>0.8) bossFinish(); }
    } else {
      // 몬스터
      let prev=c.x+ENG;
      for(let i=S.mons.length-1;i>=0;i--) if(S.mons[i].dead>=0.45) S.mons.splice(i,1);
      for(const m of S.mons){
        if(m.dead>=0){ m.dead+=dt; continue; }
        if(m.x>prev) m.x=Math.max(prev,m.x-m.sp*dt);
        m.hit=Math.max(0,m.hit-dt); m.kb*=Math.exp(-dt*12); m.lunge=Math.max(0,m.lunge-dt*4);
        if(!front) front=m;
        prev=Math.max(m.x,prev)+44;
      }
      if(front&&front.x<=c.x+ENG+4) engaged=true;
      const alive=S.mons.filter(m=>m.dead<0);
      if(!alive.length){ S.wait-=dt; if(S.wait<=0){ spawnWave(false); S.wait=0.3; } }
      else if(alive.length===1&&alive[0].hp<=alive[0].max*0.3&&S.mons.length<=3){ spawnWave(false); }   // 마지막 한 마리가 거의 쓰러지면 다음 무리가 미리 달려온다
      if(engaged&&front&&!c.down){
        front.atk-=dt;
        if(front.atk<=0){ front.atk=1.8+rnd()*0.9; front.lunge=1; if(c.skillT<=0){ c.pose='hit'; c.poseT=0.26; } c.hurt=0.26; c.kbx=-7; poof(c.x+16,GY-40,'#ff8a8a',3); }
      }
    }
    // 걷는 느낌: 싸우지 않을 때 배경이 흐른다
    S.walking=!engaged&&!c.down&&(!B||B.state==='intro');
    if(S.walking) S.scroll+=(B?110:70)*dt;
    // 병아리 공격
    if(engaged&&c.skillT<=0){
      c.atkT-=dt;
      if(c.atkT<=0){ c.atkT=S.hitInt*(B?1.15:1); c.alt^=1; c.pose=c.alt?'atk2':'atk1'; c.poseT=0.24; c.lunge=1; c.hitIn=0.1; }
    }
    if(c.hitIn>0){ c.hitIn-=dt; if(c.hitIn<=0) chickHit(); }
    // 스킬
    if(engaged||(!B&&S.mons.length&&frontMon()&&frontMon().x<DW-20)){
      S.skillCd-=dt;
      if(S.skillCd<=0&&engaged){ S.skillCd=7; c.skillT=0.8; c.pose='skill'; c.poseT=0.8; S.fx={t:0,done:false}; }
    }
    if(S.fx){ S.fx.t+=dt; if(!S.fx.done&&S.fx.t>=0.3){ S.fx.done=true; skillBurst(); const n=S.low?6:14; for(let i=0;i<n;i++) pushP({k:'star',x:c.x+30+rnd()*DW*0.5,y:GY-20-rnd()*90,vx:20+rnd()*60,vy:-20-rnd()*50,t:0,life:0.7}); } if(S.fx.t>0.9) S.fx=null; }
    // 동료
    S.party.forEach((p,i)=>{
      p.hop=Math.max(0,p.hop-dt);
      if(engaged&&!c.down){ p.t-=dt; if(p.t<=0){ p.t=S.hitInt*2+0.25+i*0.18; p.hop=0.25; const px=c.x-46-34*i;
        pushP({k:'proj',x:px+8,y:GY-24,t:0,life:1,c:GR_COL[p.gr],i}); } }
    });
    // 입자
    for(let i=S.parts.length-1;i>=0;i--){
      const p=S.parts[i]; p.t+=dt;
      if(p.k==='proj'){
        const tx=B?B.x-30:(frontMon()?frontMon().x:DW), ty=GY-34;
        p.x+=Math.max(180,(tx-p.x)*6+120)*dt; p.y+=(ty-p.y)*Math.min(1,dt*8);
        if(p.x>=tx-8||p.t>1.4){ if(p.x>=tx-8){ if(B) hitBoss(B.hpMax*0.026,false,'#bfe0ff'); else { const m=frontMon(); if(m) hitMon(m,Math.max(1,Math.round(S.dmg*0.35*(0.8+rnd()*0.4))),false,'#bfe0ff'); } } S.parts.splice(i,1); }
        continue;
      }
      if(p.t>=p.life){ S.parts.splice(i,1); continue; }
      if(p.k==='coin'){ p.vy+=520*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.y>GY+6&&p.b<2){ p.y=GY+6; p.vy*=-0.45; p.vx*=0.6; p.b++; } }
      else { p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.k==='dot') p.vy+=160*dt; }
    }
    for(let i=S.texts.length-1;i>=0;i--){ const t=S.texts[i]; t.t+=dt; t.y+=t.vy*dt; t.vy*=Math.exp(-dt*2.4); if(t.t>=t.life) S.texts.splice(i,1); }
  }

  // ----- 그리기 -----
  const hash=n=>{ n=Math.imul(n^61,0x45d9f3b); n=Math.imul(n^(n>>>16),0x45d9f3b); return ((n^(n>>>16))>>>0)%1000/1000; };
  function drawBg(){
    const c=S.ctx, DW=S.DW, im=art('bg'+(S.reg+1));
    if(im){
      const w=im.width*(DH/im.height), off=-((S.scroll*0.6)%(w*2));
      for(let k=0;k<4;k++){ const x0=off+k*w; if(x0>DW||x0+w<0) continue;
        if(k%2){ c.save(); c.translate(x0+w,0); c.scale(-1,1); c.drawImage(im,0,0,w,DH); c.restore(); } else c.drawImage(im,x0,0,w,DH); }
      return;
    }
    const h=HUE[S.reg], g=c.createLinearGradient(0,0,0,GY);
    g.addColorStop(0,`hsl(${h},60%,70%)`); g.addColorStop(1,`hsl(${(h+20)%360},70%,88%)`); c.fillStyle=g; c.fillRect(0,0,DW,GY);
    [[0.3,70,'hsl('+h+',30%,62%)',90],[0.6,56,'hsl('+h+',28%,48%)',70]].forEach(([f,sp,col,mh],li)=>{
      const wx=S.scroll*f, b0=Math.floor(wx/sp)-1; c.fillStyle=col;
      for(let b=b0;b<b0+Math.ceil(DW/sp)+3;b++){ const bw=sp*(0.6+hash(b+li*77)*0.4), bh=30+hash(b+99+li*31)*mh; c.fillRect(b*sp-wx,GY-bh,bw,bh); }
    });
    const gg=c.createLinearGradient(0,GY-6,0,DH); gg.addColorStop(0,`hsl(${h},25%,40%)`); gg.addColorStop(1,`hsl(${h},25%,26%)`); c.fillStyle=gg; c.fillRect(0,GY-6,DW,DH-GY+6);
    c.fillStyle='rgba(255,255,255,.14)'; const o=S.scroll%64; for(let x=-o;x<DW;x+=64) c.fillRect(x,GY+16,30,3);
  }
  function drawChick(){
    const c=S.chick, cx=S.ctx; const walk=S.walking?Math.abs(Math.sin(S.t*11))*3.5:Math.sin(S.t*3)*1;
    let x=c.x+c.lunge*(S.boss?26:16)+c.kbx, y=GY+4-walk, o={}; const p=c.pose;

function R(o,k,d){ return (o&&typeof o==='object'&&o[k]!=null)?o[k]:d; }
function resHtml(){
  if(!V) return '';
  const rs=R(V.dungeon,'res',{}), kn=R(V.dungeon,'key',{});
  const g=N(R(rs,'gold',V.gold)), f=N(R(rs,'feast',R(V.growth,'feast',0))), t=N(R(rs,'ticket',R(V.summon,'tickets',0))), s=N(R(rs,'stone',R(V.growth,'stone',0)));
  return `<span class="chip" title="골드">🪙 ${fmt(g)}</span><span class="chip" title="특식 — 귀한 재화">🍖 ${fmt(f)}</span><span class="chip" title="소환권">🎟 ${fmt(t)}</span><span class="chip" title="강화석">🔩 ${fmt(s)}</span><span class="chip" title="던전 열쇠">🔑 ${fmt(R(kn,'n',0))}/${fmt(R(kn,'max',10))}</span>`;
}
function navHtml(){
  const dn=V&&V.dungeon; const todo=dn&&dn.daily&&!dn.daily.claimed&&dn.daily.all;
  const clan=dn&&dn.clan&&dn.clan.claimable;
  const chest=V&&V.prestige&&V.prestige.chest&&N(V.prestige.chest.stock)>0;
  const dots={adv:todo||clan,pres:chest};
  return TABS.map(([k,e,n])=>`<button data-tab="${k}" class="${TAB===k?'on':''}"><span class="e">${e}</span>${n}${dots[k]?'<span class="dot"></span>':''}</button>`).join('');
}
function msgHtml(){ if(!MSG) return ''; return `<div class="msg ${esc(MSG.k)}" role="status">${MSG.t}</div>`; }   // MSG.t 는 이 파일이 만든 문장(서버 문자열은 만들 때 esc 한다)

function render(){
  const main=$('main'), nav=$('nav').firstElementChild;
  if(STATE!=='ok'||TAB!=='hunt') Battle.detach();
  $('res').innerHTML=STATE==='ok'?resHtml():'';
  if(STATE==='boot'){ main.innerHTML='<div class="empty"><div class="big">🐥</div><div class="sub">불러오는 중…</div></div>'; nav.innerHTML=''; return; }
  if(STATE==='out'){
    main.innerHTML=`<div class="empty card"><div class="big">🔐</div><h2 style="justify-content:center">디스코드로 로그인해 주세요</h2><p class="sub">로그인하면 내 사냥터와 동료를 볼 수 있어요.<br>비밀번호는 묻지 않아요. 디스코드 확인 버튼만 누르면 돼요.</p><div class="btns"><button class="btn" id="loginBtn">디스코드 로그인</button></div></div>`;
    nav.innerHTML=''; return;
  }
  if(STATE==='nobrj'){
    main.innerHTML=`<div class="empty card"><div class="big">🥚</div><h2 style="justify-content:center">아직 브장신이 없어요</h2><p class="sub">디스코드 <b>#브장신키우기</b> 채널에서 먼저 시작하세요.<br>채널에 <b>현황</b> 이라고 치면 알이 생겨요. 그런 뒤에 이 화면으로 오세요.</p><div class="btns"><button class="btn alt" id="retryBtn">다시 확인하기</button></div></div>`;
    nav.innerHTML=''; return;
  }
  if(STATE==='err'||!V){
    main.innerHTML=`<div class="empty card"><div class="big">📡</div><h2 style="justify-content:center">불러오지 못했어요</h2><p class="sub">${esc(ERR||CODE_MSG.net)}</p><div class="btns"><button class="btn" id="retryBtn">다시 불러오기</button></div></div>`;
    nav.innerHTML=''; return;
  }
  nav.innerHTML=navHtml();
  const fn={hunt:tabHunt,crew:tabCrew,grow:tabGrow,adv:tabAdv,pres:tabPres}[TAB]||tabHunt;
  const keep=window.scrollY;
  main.innerHTML=msgHtml()+fn();
  { const bs=$('battleSlot'); if(bs) Battle.attach(bs); }
  window.scrollTo(0,keep);
  tick();
}

function gateInfo(){   // 지금 스테이지가 보스 관문이고 아직 못 이겼으면 그 보스
  const g=R(V.dungeon,'gate',{}); const bs=Array.isArray(g.bosses)?g.bosses:[];
  return bs.find(b=>N(b.stage)===N(V.stage)&&!b.cleared)||null;
}
function bossGate(){   // 지금 막힌 보스 관문(모험 탭의 「도전」과 같은 기준)
  const g=R(V.dungeon,'gate',{}); const bs=Array.isArray(g.bosses)?g.bosses:[];
  return bs.find(b=>N(g.stage)>0&&N(b.stage)===N(g.stage)&&!b.cleared)||null;
}
function pendNow(){
  const cap=N(V.cap_h)||12, dt=(Date.now()-FETCHED)/3600000;

  return Math.floor(N(V.rate)*(hrs+N(V.boost)));
}

    ${SEL_PRES&&p.can?`<div class="msg bad" style="margin-top:8px">정말 환생할까요? 되돌릴 수 없어요. 스테이지 ${fmt(p.stage)} 와 쌓인 골드가 사라지고 ⭐ ${fmt(p.gain)} 을 받아요.</div>
      <div class="btns"><button class="btn red" data-do="prestige">네, 환생할래요</button><button class="btn alt" data-do="prestigecancel">아니요</button></div>`:
      `<div class="btns"><button class="btn ${p.can?'gold':'alt'}" data-do="prestigeask" ${p.can?'':'disabled'}>🌟 환생하기</button></div>`}
  </div>
  <div class="card"><h2>🛒 영구 보너스</h2>
    <div class="sub">환생 포인트로 사요. 환생해도 사라지지 않아요. 현재 효과: 시간당 골드 ×${N(p.gold_mult).toFixed(2)} · 스테이지 상한 ${fmt(p.stage_cap)} · 환생 뒤 시작 스테이지 ${fmt(p.start_stage)}</div>
    ${ups.map(u=>`<div class="boss" style="padding:10px 0"><div class="tx"><b>${esc(u.name)}</b> <span class="pill">Lv.${fmt(u.lv)}/${fmt(u.max)}</span><div class="mut">${esc(u.effect)}</div></div>
      <button class="btn ${u.afford?'':'alt'}" data-do="prestigebuy" data-key="${esc(u.key)}" ${u.cost==null?'disabled':''}>${u.cost==null?'최고':`⭐ ${fmt(u.cost)}`}</button></div>`).join('')}
  </div>
  <div class="card"><h2>🎁 내전 상자 <span class="pill">보관 ${fmt(ch.stock)}개</span></h2>
    <div class="sub">내전을 1판 뛸 때마다 상자가 1개 생겨요 (하루 ${fmt(ch.daily_cap)}개까지 · 오늘 ${fmt(ch.today)}개 받음 · 최대 ${fmt(ch.store_max)}개 보관). 열면 🍖 ${fmt(ch.feast)} 개는 꼭 나오고, 아래 중 하나가 더 나와요.</div>
    <div class="tw"><table><thead><tr><th>덤으로 나오는 것</th><th>확률</th></tr></thead><tbody>${(Array.isArray(ch.table)?ch.table:[]).map(t=>`<tr><td>${esc(t.name)}</td><td>${N(t.pct)}%</td></tr>`).join('')}</tbody></table></div>
    <div class="btns"><button class="btn ${N(ch.stock)>0?'gold':'alt'}" data-do="chest" data-n="1" ${N(ch.stock)>0?'':'disabled'}>1개 열기</button><button class="btn ${N(ch.stock)>1?'':'alt'}" data-do="chest" data-n="${Math.max(1,Math.min(N(ch.open_max)||10,N(ch.stock)))}" ${N(ch.stock)>1?'':'disabled'}>한꺼번에 열기 (${Math.max(1,Math.min(N(ch.open_max)||10,N(ch.stock)))}개)</button></div>
  </div>
  <div class="card"><h2>🏆 시즌 ${fmt(ss.no)} <span class="pill">${fmt(ss.days_left)}일 남음</span></h2>
    <div class="sub">시즌은 ${fmt(ss.length_days)}일(4주)마다 새로 시작해요. 순위는 환생을 많이 한 순서, 같으면 최고 스테이지가 높은 순서예요.</div>
    <div class="kv"><span>이번 시즌 내 환생</span><b>${fmt(ss.prestiges)}번</b></div><div class="kv"><span>이번 시즌 내 최고 스테이지</span><b>${fmt(ss.best_stage)}</b></div>
    ${hist.length?`<details><summary>지난 시즌 기록</summary>${hist.map(h=>`<div class="kv"><span>시즌 ${fmt(R(h,'season',0))}</span><b>환생 ${fmt(R(h,'n',0))}번 · 최고 스테이지 ${fmt(R(h,'best',0))}</b></div>`).join('')}</details>`:''}
    <h3>순위표</h3>
    ${rows===null?'<div class="sub">순위표를 불러오는 중…</div>':rows.length?`<div class="tw"><table><thead><tr><th>순위</th><th>이름</th><th>환생</th><th>최고 스테이지</th></tr></thead><tbody>${rows.map(x=>`<tr${x.me?' style="font-weight:900;color:var(--gold)"':''}><td>${fmt(x.rank)}</td><td style="text-align:left;white-space:normal;overflow-wrap:anywhere">${esc(x.name)}${x.me?' ← 나':''}</td><td>${fmt(x.prestiges)}</td><td>${fmt(x.best_stage)}</td></tr>`).join('')}</tbody></table></div>
      <div class="mut">${RANK.me?`내 순위 ${fmt(RANK.me)}위 / ${fmt(RANK.total)}명`:`아직 순위에 없어요 (${fmt(RANK.total)}명 참여)`}</div>`:'<div class="sub">아직 이번 시즌 기록이 없어요.</div>'}
    <div class="btns"><button class="btn alt" data-do="rank">순위표 새로고침</button></div>
  </div>`;
}
async function loadRank(){
  RANK_AT=Date.now();
  const j=await call('/brj/rank',{top:20});
  if(j&&j.ok){ RANK=j; } else { const t=failText(j); if(t) say(t,'bad'); RANK=RANK||{rows:[],total:0,me:null}; }
  render();
}

// ---------- 동작 ----------
const PUSH_MSG={gold:j=>`🪙 골드가 모자라요. 돌파에 ${fmt(j.cost)} 필요해요.`,max:()=>'이 구역의 끝까지 왔어요. 환생하면 더 올라갈 수 있어요.',boss:()=>'🛡 보스를 먼저 이겨야 해요. 모험 탭에서 도전해 보세요.'};
const DO={
  collect:()=>act('/brj/collect',{},j=>{ say(N(j.got)>0?`🪙 +${fmt(j.got)} 골드를 받았어요!`:'아직 쌓인 게 없어요. 조금 있다 다시 오세요.',N(j.got)>0?'ok':'info'); }),
  push:()=>{ const st0=N(V.stage); act('/brj/push',{},j=>{
    if(j.result==='ok') say(`⚔ 스테이지 ${fmt(st0)} → ${fmt(st0+1)} 돌파! (🪙 ${fmt(j.cost)} 사용)`,'ok');
    else say((PUSH_MSG[j.result]||(()=>'돌파하지 못했어요.'))(j),'bad'); }); },
  quick:()=>act('/brj/quick',{},j=>{
    const m={ok:()=>[`⚡ 퀵사냥! 🪙 +${fmt(j.got)} (🍖 ${fmt(j.cost)} 사용)`,'ok'],limit:()=>['오늘 퀵사냥은 모두 썼어요.','bad'],feast:()=>[`🍖 특식이 모자라요. ${fmt(j.cost)}개 필요해요.`,'bad'],none:()=>['받을 골드가 없어요.','bad']}[j.result]; const x=m?m():['처리하지 못했어요.','bad']; say(x[0],x[1]); }),
  summon:el=>{ const n=Number(el.dataset.n); act('/brj/summon',{n},j=>{
    if(j.ok&&Array.isArray(j.results)){ SUMRES=j.results; const nw=j.results.filter(x=>x.new).length; say(`🎟 ${fmt(j.results.length)}회 소환 완료!${nw?` 새 동료 ${fmt(nw)}명!`:''}`,'ok'); }
    else{ SUMRES=null; say({bad_n:'소환 횟수가 올바르지 않아요.',no_ticket:'🎟 소환권이 모자라요.',no_pool:'동료 명단을 준비하고 있어요. 조금 뒤에 다시 해 보세요.'}[j.code]||'소환하지 못했어요.','bad'); } }); },
  party:()=>act('/brj/party',{party:curParty().slice()},j=>{
    if(j.ok){ PARTY_DIRTY=false; PARTY=null; say('👥 파티를 저장했어요!','ok'); } else say({bad_party:'파티 구성이 올바르지 않아요.',not_owned:'가지고 있지 않은 동료가 들어 있어요.'}[j.code]||'저장하지 못했어요.','bad'); }),
  partyreset:()=>{ PARTY=null; PARTY_DIRTY=false; render(); },
  upgrade:el=>act('/brj/upgrade',{axis:el.dataset.axis},j=>{
    say({ok:'📈 성장했어요!',gold:`🪙 골드가 모자라요. ${fmt(j.cost)} 필요해요.`,max:'이미 최고 레벨이에요.'}[j.result]||'처리하지 못했어요.',j.result==='ok'?'ok':'bad'); }),
  enhance:el=>act('/brj/enhance',{slot:el.dataset.slot},j=>{
    const m={success:['✨ 강화 성공!','ok'],pity:['✨ 강화 포인트가 가득 차서 성공했어요!','ok'],fail:['💨 이번엔 실패했어요. 장비는 그대로예요. 강화 포인트가 쌓였어요.','info'],stone:[`🔩 강화석이 모자라요. ${fmt(j.cost)}개 필요해요.`,'bad'],max:['이미 최고 강화예요.','bad']}[j.result]||['처리하지 못했어요.','bad']; say(m[0],m[1]); }),
  boss:async()=>{ if(BUSY) return; const gb=bossGate(); if(TAB==='hunt'&&gb) Battle.bossStart(gb);
    await act('/brj/boss',{},j=>{
      Battle.bossResult(j);
    if(j.result==='win') say(`🏆 보스를 쓰러뜨렸어요! 🍖 +${fmt(j.feast)} · 🎟 +${fmt(j.ticket)}. 이제 돌파할 수 있어요.`,'ok');
    else if(j.result==='lose') say(`💥 졌어요. 내 전투력 ${fmt(j.power)} / 보스 체력 ${fmt(j.hp)}. 더 키워서 다시 도전해요. 잃은 건 없어요.`,'bad');
    else say('지금 도전할 보스가 없어요.','info'); });
    Battle.bossAbort(); },
  dungeon:()=>act('/brj/dungeon',{},j=>{
    const gt=x=>{const g=x||{};return [N(g.stone)?`🔩 ${fmt(g.stone)}`:'',N(g.gold)?`🪙 ${fmt(g.gold)}`:'',N(g.ticket)?`🎟 ${fmt(g.ticket)}`:''].filter(Boolean).join(' · ')||'없음';};
    if(j.result==='win') say(`🗝 ${fmt(j.level)}단계 클리어! 보상 ${gt(j.got)}`,'ok');
    else if(j.result==='sweep') say(`🧹 소탕 완료! 보상 ${gt(j.got)}`,'ok');
    else if(j.result==='lose') say(`💥 ${fmt(j.level)}단계에서 졌어요 (내 ${fmt(j.power)} / 몬스터 ${fmt(j.hp)}). 열쇠는 그대로예요.`,'bad');
    else if(j.result==='nokey') say('🔑 열쇠가 없어요. 시간이 지나면 충전돼요.','bad');
    else say('처리하지 못했어요.','bad'); }),
  clanatk:()=>act('/brj/clanboss',{action:'attack'},j=>{
    if(j.result==='ok') say(`🐲 클랜 보스에게 ${fmt(j.dmg)} 피해를 줬어요!`,'ok'); else if(j.result==='limit') say('오늘 공격은 모두 썼어요. 내일 또 와요.','bad'); else if(j.result==='dead') say('이번 주 보스는 이미 쓰러졌어요. 월요일에 새 보스가 와요.','bad'); else if(j.result==='capped') say('이번 주 내가 줄 수 있는 피해를 다 채웠어요. 나머지는 다른 클랜원 몫이에요.','bad'); else say('처리하지 못했어요.','bad'); }),
  clanclaim:()=>act('/brj/clanboss',{action:'claim'},j=>{
    if(j.result==='ok') say(`🍖 클랜 보스 보상 +${fmt(j.feast)} 받았어요!`,'ok'); else say('받을 보상이 없어요. 보스가 쓰러졌는지, 내가 이번 주 3번 이상 공격하고 체력의 2% 이상 피해를 줬는지 확인해 보세요.','bad'); }),
  daily:()=>act('/brj/daily',{},j=>{
    if(j.result==='ok'){ const c=j.chest||{}; const nm=({stone:'🔩 강화석',ticket:'🎟 소환권',gold:'🪙 골드'})[c.kind]||''; say(`🎁 오늘 할 일 완료! 🍖 +${fmt(j.feast)}${nm?` · 상자: ${nm}${N(c.n)?' '+fmt(c.n)+'개':''}`:''}`,'ok'); }
    else if(j.result==='claimed') say('오늘 보상은 이미 받았어요.','info'); else say('아직 못 끝낸 일이 있어요. 위 목록을 확인해 보세요.','bad'); }),
  prestigeask:()=>{ SEL_PRES=true; render(); },
  prestigecancel:()=>{ SEL_PRES=false; render(); },
  prestige:()=>{ SEL_PRES=false; act('/brj/prestige',{confirm:true},j=>{
    if(j.ok) say(`🌟 환생했어요! ⭐ +${fmt(j.gain)}. 영구 보너스를 사 보세요.`,'ok'); else say(j.code==='stage'?`스테이지 ${fmt(j.need)} 부터 환생할 수 있어요.`:'환생하지 못했어요.','bad'); }); },
  prestigebuy:el=>act('/brj/prestige_buy',{key:el.dataset.key},j=>{
    if(j.ok) say('🛒 영구 보너스를 샀어요!','ok'); else say({max:'이미 최고 레벨이에요.',points:`⭐ 포인트가 모자라요. ${fmt(j.cost)} 필요해요.`,bad_input:'올바르지 않은 요청이에요.'}[j.code]||'처리하지 못했어요.','bad'); }),
  chest:el=>act('/brj/chest',{n:Number(el.dataset.n)||1},j=>{
    if(j.ok){ const g=j.got||{}; say(`🎁 상자 ${fmt(j.opened)}개를 열었어요! 🍖 +${fmt(g.feast)}${N(g.ticket)?` · 🎟 +${fmt(g.ticket)}`:''}${N(g.stone)?` · 🔩 +${fmt(g.stone)}`:''}`,'ok'); }
    else say(j.code==='empty'?'열 상자가 없어요. 내전을 뛰면 생겨요.':'처리하지 못했어요.','bad'); }),
  rank:()=>loadRank(),
};

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-do],[data-card],#loginBtn,#retryBtn'); if(!t) return;
  if(t.id==='loginBtn'){ dcLogin(); return; }
  if(t.id==='retryBtn'){ STATE='boot'; render(); load(); return; }
  if(t.dataset.tab){ TAB=t.dataset.tab; MSG=null; render(); window.scrollTo(0,0); if(TAB==='pres'&&(!RANK||Date.now()-RANK_AT>60000)) loadRank(); return; }
  if(t.dataset.card!=null){   // 파티 편성(저장 전까지는 이 화면에서만 바뀐다)
    const id=t.dataset.card, p=curParty(), i=p.indexOf(id), mx=N(R(V.summon,'party_max',3))||3;
    if(i>=0) p.splice(i,1); else if(p.length<mx) p.push(id); else { toast(`파티는 최대 ${mx}명이에요`); return; }
    PARTY_DIRTY=true; MSG=null; render(); return;
  }
  const d=t.dataset.do; if(d&&DO[d]){ if(t.disabled) return; MSG=null; DO[d](t); }
});
$('thBtn').onclick=()=>{ const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'); const nx=cur==='light'?'dark':'light'; document.documentElement.dataset.theme=nx; try{localStorage.setItem('brjhunt_theme',nx);}catch(e){} };
$('rfBtn').onclick=()=>{ if(STATE==='ok'){ MSG=null; load(); } else { STATE='boot'; render(); load(); } };
try{ const th=localStorage.getItem('brjhunt_theme'); if(th==='light'||th==='dark') document.documentElement.dataset.theme=th; }catch(e){}

// 쌓이는 골드 숫자만 1초마다 갱신(화면 전체를 다시 그리지 않는다)
function tick(){ const el=$('pend'); if(el&&V) el.textContent=fmt(pendNow()); }
setInterval(tick,1000);
// 탭으로 돌아왔을 때 오래됐으면 새로 받는다
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&STATE==='ok'&&!BUSY&&Date.now()-FETCHED>60000) load(); });

// ---------- 시작 ----------
(function boot(){
  if(window.SGG_DC_BOUNCE) return;     // 디스코드에 조용히 다녀오는 중
  if(!dcUser()){ STATE='out'; render(); return; }
  render(); load();
})();
</script>
</body>
