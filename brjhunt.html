<!-- 🔐 자동 로그인 — survivors.html 과 같은 방식. 토큰이 하루 안에 끝나고 한 번 로그인한 적이 있으면 디스코드를 조용히 한 번 다녀온다 -->
<script>
(function(){ try{
  var ls=localStorage, ss=sessionStorage; ls.setItem('sgg_dc_probe','1'); ls.removeItem('sgg_dc_probe'); ss.setItem('sgg_dc_probe','1'); ss.removeItem('sgg_dc_probe');
  var J=function(k){ try{ return JSON.parse(ls.getItem(k)||'null'); }catch(e){ return null; } };
  var dc=J('sgg_dc'), auto=J('sgg_dc_auto'), now=Date.now();
  if(ls.getItem('sgg_dc_auto')===null&&dc&&dc.id){ auto={id:String(dc.id),name:String(dc.name||''),avatar:String(dc.avatar||'')}; ls.setItem('sgg_dc_auto',JSON.stringify(auto)); }
  if(ls.getItem('sgg_dc_try')!==null){ ls.setItem('sgg_dc_auto','0'); ls.removeItem('sgg_dc_try'); return; }
  if(!(auto&&auto.id)) return;
  if(dc&&dc.token&&dc.exp>now+24*3600*1000) return;
  if(window.top!==window.self||document.prerendering||navigator.onLine===false) return;
  var a=new Uint8Array(16); crypto.getRandomValues(a); var st=Array.prototype.map.call(a,function(x){return (x<16?'0':'')+x.toString(16);}).join('');
  ls.setItem('sgg_dc_try',String(now)); ss.setItem('sgg_oauth_state',st); ss.setItem('sgg_oauth_return','게임:brjhunt');
  window.SGG_DC_BOUNCE=true;
  location.replace('https://discord.com/api/oauth2/authorize?response_type=token&client_id=1520763174675022028'
    +'&redirect_uri='+encodeURIComponent(location.origin+new URL('./',location.href).pathname)
    +'&scope=identify&state='+encodeURIComponent(st)+'&prompt=none');
}catch(e){} })();
</script>

<script>
// ---------- 브장신 키우기 웹 사냥터 ----------
// 로그인·서버 주소는 survivors.html 과 같은 방식(디스코드 토큰은 메인 사이트와 같은 localStorage 칸 sgg_dc).
// 서버가 주는 문자열은 전부 esc 를 거쳐 innerHTML 에 넣는다. 숫자는 N() 으로 한 번 걸러 쓴다.
const P6_API='https://hth3thmujs.apps.bot-hosting.cloud';
const DISCORD_CLIENT_ID='1520763174675022028';
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=v=>{v=Number(v);return Number.isFinite(v)?v:0;};
const fmt=v=>Math.floor(N(v)).toLocaleString('ko-KR');
const $=id=>document.getElementById(id);
const GR_KO={normal:'노말',rare:'레어',epic:'에픽',unique:'유니크',legend:'레전드'};
const GR_KEYS=['normal','rare','epic','unique','legend'];
const grKey=g=>GR_KEYS.includes(g)?g:'normal';     // 서버 값이 이상해도 클래스 이름으로 못 새어 나가게
const imgKey=k=>/^[a-z0-9_]{1,30}$/.test(String(k||''))?String(k):'';
const TABS=[['hunt','🏞','사냥터'],['crew','🧑‍🤝‍🧑','동료'],['grow','⚔','성장'],['adv','🗝','모험'],['pres','🌟','환생']];

let V=null;              // 서버가 준 전체 화면 값(view)
let TAB='hunt', MSG=null, STATE='boot';   // STATE: boot · out(로그아웃) · nobrj · err · ok
let ERR='', BUSY=false, FETCHED=0, PARTY=null, PARTY_DIRTY=false, SUMRES=null, RANK=null, RANK_AT=0, SEL_PRES=false;

function dcUser(){try{const o=JSON.parse(localStorage.getItem('sgg_dc')||'null');if(o&&o.id&&o.token&&o.exp>Date.now())return o;}catch(e){}return null;}
function dcLogin(){   // 디스코드에 등록된 복귀 주소는 메인 페이지뿐 → 메인이 받아 로그인 처리 후 이 페이지로 되돌려 준다
  const st=Math.random().toString(36).slice(2)+'.'+Math.floor(performance.now());
  let none=false; try{const a=JSON.parse(localStorage.getItem('sgg_dc_auto')||'null');none=!!(a&&a.id);}catch(e){}
  try{sessionStorage.setItem('sgg_oauth_state',st);sessionStorage.setItem('sgg_oauth_return','게임:brjhunt');
      if(none)localStorage.setItem('sgg_dc_try',String(Date.now()));}catch(e){}
  const main=location.origin+new URL('./',location.href).pathname;
  location.href='https://discord.com/api/oauth2/authorize?response_type=token&client_id='+encodeURIComponent(DISCORD_CLIENT_ID)
    +'&redirect_uri='+encodeURIComponent(main)+'&scope=identify&state='+encodeURIComponent(st)+(none?'&prompt=none':'');
}

// ---------- 서버 부르기 ----------
const CODE_MSG={
  auth:'로그인이 끝났어요. 디스코드로 다시 로그인해 주세요.',
  busy:'지금 사람이 몰려서(또는 너무 빨리 눌러서) 잠깐 막혔어요. 몇 초 뒤에 다시 눌러 주세요.',
  upstream:'디스코드 확인이 잠깐 늦어지고 있어요. 로그인은 그대로예요. 조금 뒤에 다시 해 보세요.',
  error:'서버에서 문제가 생겼어요. 잠시 뒤에 다시 해 보세요.',
  big:'요청이 너무 커요.', http:'서버 응답을 읽지 못했어요. 잠시 뒤에 다시 해 보세요.', net:'서버에 연결하지 못했어요. 인터넷을 확인하고 다시 해 보세요.'
};
async function call(path,body){
  const u=dcUser(); if(!u) return {ok:false,code:'auth',local:true};
  let r,j=null;
  try{
    r=await fetch(P6_API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({},body||{},{token:u.token}))});
    try{j=await r.json();}catch(e){}
  }catch(e){return {ok:false,code:'net'};}
  if(!j||typeof j!=='object') return {ok:false,code:'http'};
  if(r.status===401) j.code='auth';
  return j;
}
function takeView(j){ if(j&&j.view&&typeof j.view==='object'){ V=j.view; FETCHED=Date.now(); if(!PARTY_DIRTY) PARTY=null; return true; } return false; }
// 서버가 거절한 이유를 사람 말로. 로그인 문제는 화면 전체를 로그아웃 상태로 바꾼다.
function failText(j){
  if(!j) return CODE_MSG.net;
  if(j.code==='no_brj'){ STATE='nobrj'; return ''; }
  if(j.code==='auth'){ STATE='out'; return ''; }
  return CODE_MSG[j.code]||'요청을 처리하지 못했어요.';
}
async function load(){
  const j=await call('/brj/idle',{});
  if(j.ok&&takeView(j)){ STATE='ok'; ERR=''; }
  else { const t=failText(j); if(STATE==='ok'&&V){ say(t||'다시 불러오지 못했어요.','bad'); } else if(!['out','nobrj'].includes(STATE)){ STATE='err'; ERR=t; } }
  render();
}
// 버튼 한 번 = 요청 한 번. 응답 전에는 다른 버튼이 안 눌린다.
const TRANSPORT=['auth','no_brj','busy','upstream','error','big','http','net','not_found'];
async function act(path,body,onOk){
  if(BUSY) return; BUSY=true; document.body.classList.add('busy');
  try{
    const j=await call(path,body);
    if(TRANSPORT.includes(j.code)&&!j.view){ const t=failText(j); if(t) say(t,'bad'); }   // 로그인·몰림·연결 문제 — 서버가 일을 처리하지 않았다
    else{ takeView(j); try{ onOk(j); }catch(e){ console.warn(e); } }   // 성공이든 「소환권 부족」 같은 거절이든 서버가 준 값으로 다시 그린다
  }finally{ BUSY=false; document.body.classList.remove('busy'); render(); }
}
function say(t,k){ MSG={t,k:k||'info'}; }
function toast(t){ const b=$('toastBox'); const d=document.createElement('div'); d.className='toast'; d.textContent=t; b.appendChild(d); setTimeout(()=>d.remove(),2200); }

// ---------- 그리기 ----------
function R(o,k,d){ return (o&&typeof o==='object'&&o[k]!=null)?o[k]:d; }
function resHtml(){
  if(!V) return '';
  const rs=R(V.dungeon,'res',{}), kn=R(V.dungeon,'key',{});
  const g=N(R(rs,'gold',V.gold)), f=N(R(rs,'feast',R(V.growth,'feast',0))), t=N(R(rs,'ticket',R(V.summon,'tickets',0))), s=N(R(rs,'stone',R(V.growth,'stone',0)));
  return `<span class="chip" title="골드">🪙 ${fmt(g)}</span><span class="chip" title="특식 — 귀한 재화">🍖 ${fmt(f)}</span><span class="chip" title="소환권">🎟 ${fmt(t)}</span><span class="chip" title="강화석">🔩 ${fmt(s)}</span><span class="chip" title="던전 열쇠">🔑 ${fmt(R(kn,'n',0))}/${fmt(R(kn,'max',10))}</span>`;
}
function navHtml(){
  const dn=V&&V.dungeon; const todo=dn&&dn.daily&&!dn.daily.claimed&&dn.daily.all;
  const clan=dn&&dn.clan&&dn.clan.claimable;
  const chest=V&&V.prestige&&V.prestige.chest&&N(V.prestige.chest.stock)>0;
  const dots={adv:todo||clan,pres:chest};
  return TABS.map(([k,e,n])=>`<button data-tab="${k}" class="${TAB===k?'on':''}"><span class="e">${e}</span>${n}${dots[k]?'<span class="dot"></span>':''}</button>`).join('');
}
function msgHtml(){ if(!MSG) return ''; return `<div class="msg ${esc(MSG.k)}" role="status">${MSG.t}</div>`; }   // MSG.t 는 이 파일이 만든 문장(서버 문자열은 만들 때 esc 한다)

function render(){
  const main=$('main'), nav=$('nav').firstElementChild;
  $('res').innerHTML=STATE==='ok'?resHtml():'';
  if(STATE==='boot'){ main.innerHTML='<div class="empty"><div class="big">🐥</div><div class="sub">불러오는 중…</div></div>'; nav.innerHTML=''; return; }
  if(STATE==='out'){
    main.innerHTML=`<div class="empty card"><div class="big">🔐</div><h2 style="justify-content:center">디스코드로 로그인해 주세요</h2><p class="sub">로그인하면 내 사냥터와 동료를 볼 수 있어요.<br>비밀번호는 묻지 않아요. 디스코드 확인 버튼만 누르면 돼요.</p><div class="btns"><button class="btn" id="loginBtn">디스코드 로그인</button></div></div>`;
    nav.innerHTML=''; return;
  }
  if(STATE==='nobrj'){
    main.innerHTML=`<div class="empty card"><div class="big">🥚</div><h2 style="justify-content:center">아직 브장신이 없어요</h2><p class="sub">디스코드 <b>#브장신키우기</b> 채널에서 먼저 시작하세요.<br>채널에 <b>현황</b> 이라고 치면 알이 생겨요. 그런 뒤에 이 화면으로 오세요.</p><div class="btns"><button class="btn alt" id="retryBtn">다시 확인하기</button></div></div>`;
    nav.innerHTML=''; return;
  }
  if(STATE==='err'||!V){
    main.innerHTML=`<div class="empty card"><div class="big">📡</div><h2 style="justify-content:center">불러오지 못했어요</h2><p class="sub">${esc(ERR||CODE_MSG.net)}</p><div class="btns"><button class="btn" id="retryBtn">다시 불러오기</button></div></div>`;
    nav.innerHTML=''; return;
  }
  nav.innerHTML=navHtml();
  const fn={hunt:tabHunt,crew:tabCrew,grow:tabGrow,adv:tabAdv,pres:tabPres}[TAB]||tabHunt;
  const keep=window.scrollY;
  main.innerHTML=msgHtml()+fn();
  window.scrollTo(0,keep);
  tick();
}

}

function tabPres(){
  const p=V.prestige||{}; const ups=Array.isArray(p.ups)?p.ups:[]; const ss=p.season||{}; const ch=p.chest||{};
  const hist=Array.isArray(ss.history)?ss.history:[];

  return `

    <div class="sub" style="margin-top:4px">${esc(p.warn)}</div>
    <div class="kv"><span>내 환생 포인트</span><b>⭐ ${fmt(p.points)}</b></div>
    <div class="kv"><span>지금 환생하면</span><b>${p.can?`⭐ +${fmt(p.gain)}`:`스테이지 ${fmt(p.min_stage)} 부터 가능 (지금 ${fmt(p.stage)})`}</b></div>
    <div class="mut">${esc(p.pt_rule)}</div>
    ${SEL_PRES&&p.can?`<div class="msg bad" style="margin-top:8px">정말 환생할까요? 되돌릴 수 없어요. 스테이지 ${fmt(p.stage)} 와 쌓인 골드가 사라지고 ⭐ ${fmt(p.gain)} 을 받아요.</div>
      <div class="btns"><button class="btn red" data-do="prestige">네, 환생할래요</button><button class="btn alt" data-do="prestigecancel">아니요</button></div>`:
      `<div class="btns"><button class="btn ${p.can?'gold':'alt'}" data-do="prestigeask" ${p.can?'':'disabled'}>🌟 환생하기</button></div>`}
  </div>
  <div class="card"><h2>🛒 영구 보너스</h2>
    <div class="sub">환생 포인트로 사요. 환생해도 사라지지 않아요. 현재 효과: 시간당 골드 ×${N(p.gold_mult).toFixed(2)} · 스테이지 상한 ${fmt(p.stage_cap)} · 환생 뒤 시작 스테이지 ${fmt(p.start_stage)}</div>
    ${ups.map(u=>`<div class="boss" style="padding:10px 0"><div class="tx"><b>${esc(u.name)}</b> <span class="pill">Lv.${fmt(u.lv)}/${fmt(u.max)}</span><div class="mut">${esc(u.effect)}</div></div>
      <button class="btn ${u.afford?'':'alt'}" data-do="prestigebuy" data-key="${esc(u.key)}" ${u.cost==null?'disabled':''}>${u.cost==null?'최고':`⭐ ${fmt(u.cost)}`}</button></div>`).join('')}
  </div>
  <div class="card"><h2>🎁 내전 상자 <span class="pill">보관 ${fmt(ch.stock)}개</span></h2>
    <div class="sub">내전을 1판 뛸 때마다 상자가 1개 생겨요 (하루 ${fmt(ch.daily_cap)}개까지 · 오늘 ${fmt(ch.today)}개 받음 · 최대 ${fmt(ch.store_max)}개 보관). 열면 🍖 ${fmt(ch.feast)} 개는 꼭 나오고, 아래 중 하나가 더 나와요.</div>
    <div class="tw"><table><thead><tr><th>덤으로 나오는 것</th><th>확률</th></tr></thead><tbody>${(Array.isArray(ch.table)?ch.table:[]).map(t=>`<tr><td>${esc(t.name)}</td><td>${N(t.pct)}%</td></tr>`).join('')}</tbody></table></div>
    <div class="btns"><button class="btn ${N(ch.stock)>0?'gold':'alt'}" data-do="chest" data-n="1" ${N(ch.stock)>0?'':'disabled'}>1개 열기</button><button class="btn ${N(ch.stock)>1?'':'alt'}" data-do="chest" data-n="${Math.max(1,Math.min(N(ch.open_max)||10,N(ch.stock)))}" ${N(ch.stock)>1?'':'disabled'}>한꺼번에 열기 (${Math.max(1,Math.min(N(ch.open_max)||10,N(ch.stock)))}개)</button></div>
  </div>
  <div class="card"><h2>🏆 시즌 ${fmt(ss.no)} <span class="pill">${fmt(ss.days_left)}일 남음</span></h2>
    <div class="sub">시즌은 ${fmt(ss.length_days)}일(4주)마다 새로 시작해요. 순위는 환생을 많이 한 순서, 같으면 최고 스테이지가 높은 순서예요.</div>
    <div class="kv"><span>이번 시즌 내 환생</span><b>${fmt(ss.prestiges)}번</b></div><div class="kv"><span>이번 시즌 내 최고 스테이지</span><b>${fmt(ss.best_stage)}</b></div>
    ${hist.length?`<details><summary>지난 시즌 기록</summary>${hist.map(h=>`<div class="kv"><span>시즌 ${fmt(R(h,'season',0))}</span><b>환생 ${fmt(R(h,'n',0))}번 · 최고 스테이지 ${fmt(R(h,'best',0))}</b></div>`).join('')}</details>`:''}
    <h3>순위표</h3>
    ${rows===null?'<div class="sub">순위표를 불러오는 중…</div>':rows.length?`<div class="tw"><table><thead><tr><th>순위</th><th>이름</th><th>환생</th><th>최고 스테이지</th></tr></thead><tbody>${rows.map(x=>`<tr${x.me?' style="font-weight:900;color:var(--gold)"':''}><td>${fmt(x.rank)}</td><td style="text-align:left;white-space:normal;overflow-wrap:anywhere">${esc(x.name)}${x.me?' ← 나':''}</td><td>${fmt(x.prestiges)}</td><td>${fmt(x.best_stage)}</td></tr>`).join('')}</tbody></table></div>
      <div class="mut">${RANK.me?`내 순위 ${fmt(RANK.me)}위 / ${fmt(RANK.total)}명`:`아직 순위에 없어요 (${fmt(RANK.total)}명 참여)`}</div>`:'<div class="sub">아직 이번 시즌 기록이 없어요.</div>'}
    <div class="btns"><button class="btn alt" data-do="rank">순위표 새로고침</button></div>
  </div>`;
}
async function loadRank(){
  RANK_AT=Date.now();
  const j=await call('/brj/rank',{top:20});
  if(j&&j.ok){ RANK=j; } else { const t=failText(j); if(t) say(t,'bad'); RANK=RANK||{rows:[],total:0,me:null}; }
  render();
}

const PUSH_MSG={gold:j=>`🪙 골드가 모자라요. 돌파에 ${fmt(j.cost)} 필요해요.`,max:()=>'이 구역의 끝까지 왔어요. 환생하면 더 올라갈 수 있어요.',boss:()=>'🛡 보스를 먼저 이겨야 해요. 모험 탭에서 도전해 보세요.'};
const DO={
  collect:()=>act('/brj/collect',{},j=>{ say(N(j.got)>0?`🪙 +${fmt(j.got)} 골드를 받았어요!`:'아직 쌓인 게 없어요. 조금 있다 다시 오세요.',N(j.got)>0?'ok':'info'); }),
  push:()=>{ const st0=N(V.stage); act('/brj/push',{},j=>{
    if(j.result==='ok') say(`⚔ 스테이지 ${fmt(st0)} → ${fmt(st0+1)} 돌파! (🪙 ${fmt(j.cost)} 사용)`,'ok');

  quick:()=>act('/brj/quick',{},j=>{

  summon:el=>{ const n=Number(el.dataset.n); act('/brj/summon',{n},j=>{
    if(j.ok&&Array.isArray(j.results)){ SUMRES=j.results; const nw=j.results.filter(x=>x.new).length; say(`🎟 ${fmt(j.results.length)}회 소환 완료!${nw?` 새 동료 ${fmt(nw)}명!`:''}`,'ok'); }
    else{ SUMRES=null; say({bad_n:'소환 횟수가 올바르지 않아요.',no_ticket:'🎟 소환권이 모자라요.',no_pool:'동료 명단을 준비하고 있어요. 조금 뒤에 다시 해 보세요.'}[j.code]||'소환하지 못했어요.','bad'); } }); },
  party:()=>act('/brj/party',{party:curParty().slice()},j=>{
    if(j.ok){ PARTY_DIRTY=false; PARTY=null; say('👥 파티를 저장했어요!','ok'); } else say({bad_party:'파티 구성이 올바르지 않아요.',not_owned:'가지고 있지 않은 동료가 들어 있어요.'}[j.code]||'저장하지 못했어요.','bad'); }),
  partyreset:()=>{ PARTY=null; PARTY_DIRTY=false; render(); },
  upgrade:el=>act('/brj/upgrade',{axis:el.dataset.axis},j=>{
    say({ok:'📈 성장했어요!',gold:`🪙 골드가 모자라요. ${fmt(j.cost)} 필요해요.`,max:'이미 최고 레벨이에요.'}[j.result]||'처리하지 못했어요.',j.result==='ok'?'ok':'bad'); }),
  enhance:el=>act('/brj/enhance',{slot:el.dataset.slot},j=>{
    const m={success:['✨ 강화 성공!','ok'],pity:['✨ 강화 포인트가 가득 차서 성공했어요!','ok'],fail:['💨 이번엔 실패했어요. 장비는 그대로예요. 강화 포인트가 쌓였어요.','info'],stone:[`🔩 강화석이 모자라요. ${fmt(j.cost)}개 필요해요.`,'bad'],max:['이미 최고 강화예요.','bad']}[j.result]||['처리하지 못했어요.','bad']; say(m[0],m[1]); }),
  boss:()=>act('/brj/boss',{},j=>{
    if(j.result==='win') say(`🏆 보스를 쓰러뜨렸어요! 🍖 +${fmt(j.feast)} · 🎟 +${fmt(j.ticket)}. 이제 돌파할 수 있어요.`,'ok');
    else if(j.result==='lose') say(`💥 졌어요. 내 전투력 ${fmt(j.power)} / 보스 체력 ${fmt(j.hp)}. 더 키워서 다시 도전해요. 잃은 건 없어요.`,'bad');
    else say('지금 도전할 보스가 없어요.','info'); }),
  dungeon:()=>act('/brj/dungeon',{},j=>{
    const gt=x=>{const g=x||{};return [N(g.stone)?`🔩 ${fmt(g.stone)}`:'',N(g.gold)?`🪙 ${fmt(g.gold)}`:'',N(g.ticket)?`🎟 ${fmt(g.ticket)}`:''].filter(Boolean).join(' · ')||'없음';};
    if(j.result==='win') say(`🗝 ${fmt(j.level)}단계 클리어! 보상 ${gt(j.got)}`,'ok');
    else if(j.result==='sweep') say(`🧹 소탕 완료! 보상 ${gt(j.got)}`,'ok');
    else if(j.result==='lose') say(`💥 ${fmt(j.level)}단계에서 졌어요 (내 ${fmt(j.power)} / 몬스터 ${fmt(j.hp)}). 열쇠는 그대로예요.`,'bad');
    else if(j.result==='nokey') say('🔑 열쇠가 없어요. 시간이 지나면 충전돼요.','bad');
    else say('처리하지 못했어요.','bad'); }),
  clanatk:()=>act('/brj/clanboss',{action:'attack'},j=>{
    if(j.result==='ok') say(`🐲 클랜 보스에게 ${fmt(j.dmg)} 피해를 줬어요!`,'ok'); else if(j.result==='limit') say('오늘 공격은 모두 썼어요. 내일 또 와요.','bad'); else if(j.result==='dead') say('이번 주 보스는 이미 쓰러졌어요. 월요일에 새 보스가 와요.','bad'); else if(j.result==='capped') say('이번 주 내가 줄 수 있는 피해를 다 채웠어요. 나머지는 다른 클랜원 몫이에요.','bad'); else say('처리하지 못했어요.','bad'); }),
  clanclaim:()=>act('/brj/clanboss',{action:'claim'},j=>{
    if(j.result==='ok') say(`🍖 클랜 보스 보상 +${fmt(j.feast)} 받았어요!`,'ok'); else say('받을 보상이 없어요. 보스가 쓰러졌는지, 내가 이번 주 3번 이상 공격하고 체력의 2% 이상 피해를 줬는지 확인해 보세요.','bad'); }),
  daily:()=>act('/brj/daily',{},j=>{
    if(j.result==='ok'){ const c=j.chest||{}; const nm=({stone:'🔩 강화석',ticket:'🎟 소환권',gold:'🪙 골드'})[c.kind]||''; say(`🎁 오늘 할 일 완료! 🍖 +${fmt(j.feast)}${nm?` · 상자: ${nm}${N(c.n)?' '+fmt(c.n)+'개':''}`:''}`,'ok'); }
    else if(j.result==='claimed') say('오늘 보상은 이미 받았어요.','info'); else say('아직 못 끝낸 일이 있어요. 위 목록을 확인해 보세요.','bad'); }),
  prestigeask:()=>{ SEL_PRES=true; render(); },
  prestigecancel:()=>{ SEL_PRES=false; render(); },
  prestige:()=>{ SEL_PRES=false; act('/brj/prestige',{confirm:true},j=>{
    if(j.ok) say(`🌟 환생했어요! ⭐ +${fmt(j.gain)}. 영구 보너스를 사 보세요.`,'ok'); else say(j.code==='stage'?`스테이지 ${fmt(j.need)} 부터 환생할 수 있어요.`:'환생하지 못했어요.','bad'); }); },
  prestigebuy:el=>act('/brj/prestige_buy',{key:el.dataset.key},j=>{
    if(j.ok) say('🛒 영구 보너스를 샀어요!','ok'); else say({max:'이미 최고 레벨이에요.',points:`⭐ 포인트가 모자라요. ${fmt(j.cost)} 필요해요.`,bad_input:'올바르지 않은 요청이에요.'}[j.code]||'처리하지 못했어요.','bad'); }),
  chest:el=>act('/brj/chest',{n:Number(el.dataset.n)||1},j=>{
    if(j.ok){ const g=j.got||{}; say(`🎁 상자 ${fmt(j.opened)}개를 열었어요! 🍖 +${fmt(g.feast)}${N(g.ticket)?` · 🎟 +${fmt(g.ticket)}`:''}${N(g.stone)?` · 🔩 +${fmt(g.stone)}`:''}`,'ok'); }
    else say(j.code==='empty'?'열 상자가 없어요. 내전을 뛰면 생겨요.':'처리하지 못했어요.','bad'); }),
  rank:()=>loadRank(),
};

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-do],[data-card],#loginBtn,#retryBtn'); if(!t) return;
  if(t.id==='loginBtn'){ dcLogin(); return; }
  if(t.id==='retryBtn'){ STATE='boot'; render(); load(); return; }
  if(t.dataset.tab){ TAB=t.dataset.tab; MSG=null; render(); window.scrollTo(0,0); if(TAB==='pres'&&(!RANK||Date.now()-RANK_AT>60000)) loadRank(); return; }
  if(t.dataset.card!=null){   // 파티 편성(저장 전까지는 이 화면에서만 바뀐다)
    const id=t.dataset.card, p=curParty(), i=p.indexOf(id), mx=N(R(V.summon,'party_max',3))||3;
    if(i>=0) p.splice(i,1); else if(p.length<mx) p.push(id); else { toast(`파티는 최대 ${mx}명이에요`); return; }
    PARTY_DIRTY=true; MSG=null; render(); return;
  }
  const d=t.dataset.do; if(d&&DO[d]){ if(t.disabled) return; MSG=null; DO[d](t); }
});
$('thBtn').onclick=()=>{ const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'); const nx=cur==='light'?'dark':'light'; document.documentElement.dataset.theme=nx; try{localStorage.setItem('brjhunt_theme',nx);}catch(e){} };
$('rfBtn').onclick=()=>{ if(STATE==='ok'){ MSG=null; load(); } else { STATE='boot'; render(); load(); } };
try{ const th=localStorage.getItem('brjhunt_theme'); if(th==='light'||th==='dark') document.documentElement.dataset.theme=th; }catch(e){}

// 쌓이는 골드 숫자만 1초마다 갱신(화면 전체를 다시 그리지 않는다)
function tick(){ const el=$('pend'); if(el&&V) el.textContent=fmt(pendNow()); }
setInterval(tick,1000);
// 탭으로 돌아왔을 때 오래됐으면 새로 받는다
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&STATE==='ok'&&!BUSY&&Date.now()-FETCHED>60000) load(); });

// ---------- 시작 ----------
(function boot(){
  if(window.SGG_DC_BOUNCE) return;     // 디스코드에 조용히 다녀오는 중
  if(!dcUser()){ STATE='out'; render(); return; }
  render(); load();
})();
</script>
