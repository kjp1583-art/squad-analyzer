// 서버가 주는 문자열은 전부 esc() 를 거쳐 innerHTML 에 넣거나 textContent 로만 쓴다.
const P6_API='https://hth3thmujs.apps.bot-hosting.cloud';
const API=(function(){ try{ const q=new URLSearchParams(location.search).get('api');
  if(q&&/^http:\/\/(127\.0\.0\.1|localhost):\d{2,5}$/.test(q)&&(location.protocol==='file:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname))) return q; }catch(e){} return P6_API; })();   // 시험용 주소는 내 컴퓨터에서 열었을 때만(토큰이 남의 서버로 가지 않게)
const DISCORD_CLIENT_ID='1520763174675022028';
const POLL_MS=1000, POLL_HIDDEN_MS=3000, LOBBY_MS=4000, FAIL_SHOW=3, CHAT_GAP_MS=1200;
const esc=v=>String(v==null?'':v).replace(/[&<>"'`]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));
const N=v=>{v=Number(v);return Number.isFinite(v)?v:0;};
const $=id=>document.getElementById(id);
const ls={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}},del(k){try{localStorage.removeItem(k);}catch(e){}}};
const CAT_FALLBACK=['음식','동물','장소','직업','스포츠','영화/드라마','교통','과일','학교','집안 물건','롤 챔피언','롤 아이템/포지션','게임','브장신 키우기','클랜 용어','한국 지명'];

  http:'서버 응답을 읽지 못했어요. 잠시 뒤에 다시 해 보세요.', error:'서버에서 문제가 생겼어요. 잠시 뒤에 다시 해 보세요.',
  upstream:'디스코드 확인이 잠깐 늦어지고 있어요. 조금 뒤에 다시 해 보세요.', in_room:'이미 다른 방에 들어가 있어요.', few:'인원이 부족해요(최소 3명).'

let ME=null, CODE='', V=null, MSGS=[], LASTMSG=0, OFF=0, FAIL=0, SCR='', PH_KEY='', PH_TOTAL=1, MYVOTE='', LOBBY=null, BUSY=false, CAT_LIST=null;
let pollTimer=0, polling=false, again=false, lastChatAt=0, lastTurnKey='', titleTimer=0, ROOM_GEN=0;

function dcUser(){try{const o=JSON.parse(ls.get('sgg_dc')||'null');if(o&&o.id&&o.token&&o.exp>Date.now())return o;}catch(e){}return null;}
function dcLogin(){
  const st=Math.random().toString(36).slice(2)+'.'+Math.floor(performance.now());
  let none=false; try{const a=JSON.parse(ls.get('sgg_dc_auto')||'null');none=!!(a&&a.id);}catch(e){}
  try{sessionStorage.setItem('sgg_oauth_state',st);sessionStorage.setItem('sgg_oauth_return','게임:liar');
      if(none)ls.set('sgg_dc_try',String(Date.now()));}catch(e){}
  const main=location.origin+new URL('./',location.href).pathname;
  location.href='https://discord.com/api/oauth2/authorize?response_type=token&client_id='+encodeURIComponent(DISCORD_CLIENT_ID)
    +'&redirect_uri='+encodeURIComponent(main)+'&scope=identify&state='+encodeURIComponent(st)+(none?'&prompt=none':'');
}

// ---------- 서버 부르기 ----------
async function call(path,body){
  const u=dcUser(); if(!u) return {ok:false,code:'auth',local:true};
  let r,j=null; const ac2=typeof AbortController==='function'?new AbortController():null, to=setTimeout(()=>{ try{ac2&&ac2.abort();}catch(e){} },12000);
  try{
    r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({},body||{},{token:u.token})),signal:ac2?ac2.signal:undefined});
    try{j=await r.json();}catch(e){}
  }catch(e){return {ok:false,code:'net'};}finally{ clearTimeout(to); }
  if(!j||typeof j!=='object') return {ok:false,code:'http'};
  if(r.status===401) {j.ok=false;j.code='auth';}
  if(r.status===404&&!j.code) {j.ok=false;j.code='http';}
  return j;
}
const NETERR=['net','http','error','upstream'];
function msgOf(j){ return CODE_MSG[(j&&j.code)||'']||'요청을 처리하지 못했어요.'; }
let toastT=0;
function toast(t,bad){ const el=$('toast'); el.textContent=t; el.className='toast'+(bad?' bad':''); el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{el.hidden=true;},3200); }

// ---------- 화면 전환 ----------
function show(which){
  SCR=which;
  $('scrLogin').hidden=which!=='login'; $('scrLobby').hidden=which!=='lobby'; $('room').hidden=which!=='room';
  $('leaveBtn').hidden=which!=='room'; $('rcode').hidden=which!=='room';
  if(which!=='room'){ setTitle(''); fxStop(); A.bgm(null); } else fxStart();
  fitMode();
}
function showLogin(msg){
  show('login');
  $('scrLogin').innerHTML='<div class="card" style="text-align:center"><h2>🕵 라이어 게임</h2><p>제시어를 아는 시민들 사이에 숨은 <b>라이어</b>를 찾아내요.<br>클랜원과 실시간으로 즐기려면 디스코드 로그인이 필요해요.</p>'
    +(msg?'<p class="note">'+esc(msg)+'</p>':'')+'<button class="btn gold" data-a="login">디스코드로 로그인</button></div>';
}
function setTitle(prefix){ document.title=(prefix?prefix+' ':'')+'라이어 게임 — SQUAD.GG'; }

// ---------- 방 들어가기/나가기 ----------
function enterRoom(code){
  CODE=String(code).toUpperCase(); V=null; MSGS=[]; LASTMSG=0; MYVOTE=''; PH_KEY=''; lastTurnKey=''; ROOM_GEN++;
  ls.set('lg_room',CODE); try{ history.replaceState(null,'','#'+CODE); }catch(e){}
  $('msgs').innerHTML=''; for(const k of ['bPlayers','bOpts','bMain','rcard']) { const el=$(k); el._k=null; el.innerHTML=''; }
  sceneEnter(); $('rcode').textContent=CODE; show('room'); renderRoom(); wake();
}
function exitToLobby(msg){
  CODE=''; V=null; ls.del('lg_room'); try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  show('lobby'); if(msg) toast(msg); wake();
}
async function joinCode(code){
  code=String(code||'').trim().toUpperCase();
  if(!/^[A-Z]{4}$/.test(code)){ toast('방 코드는 영문 4자리예요.',true); return; }
  if(BUSY) return; BUSY=true;
  try{ const j=await call('/lg/join',{code}); if(j.ok) enterRoom(code); else if(j.code==='in_room'&&/^[A-Za-z]{4}$/.test(String(j.room||''))){ toast('이미 들어가 있는 방으로 돌아가요.'); enterRoom(j.room); } else { if(j.code==='auth'){ showLogin(CODE_MSG.auth); return; } toast(msgOf(j),true); } }
  finally{ BUSY=false; }
}
async function act(path,body,onOk){   // 버튼 한 번 = 요청 한 번
  if(BUSY) return false; BUSY=true; document.body.style.cursor='progress';
  try{
    const j=await call(path,body);
    if(j.ok){ if(onOk) onOk(j); wake(); return true; }
    if(j.code==='auth'){ showLogin(CODE_MSG.auth); return false; }
    if(['not_found','closed'].includes(j.code)&&CODE){ exitToLobby(msgOf(j)); return false; }
    toast(msgOf(j),true); return false;
  } finally { BUSY=false; document.body.style.cursor=''; }
}

// ---------- 폴링 ----------
function wake(){ clearTimeout(pollTimer); if(polling){ again=true; return; } loop(); }
async function loop(){
  if(polling) return; polling=true;
  try{
    do{ again=false;
      if(!dcUser()){ showLogin(); break; }
      if(SCR==='room'&&CODE) await pollRoom(); else if(SCR==='lobby') await pollLobby(); else break;
    } while(again);
  } catch(e){ FAIL++; }
  polling=false; paintConn();
  if(SCR==='room'||SCR==='lobby'){
    let d=document.hidden?POLL_HIDDEN_MS:(SCR==='room'?POLL_MS:LOBBY_MS);
    if(FAIL>0) d=Math.min(8000,1000*Math.pow(2,Math.min(FAIL-1,3)));   // 끊기면 점점 천천히(최대 8초) 다시 시도
    pollTimer=setTimeout(loop,d);
  }
}
function paintConn(){ $('conn').hidden=!(FAIL>=FAIL_SHOW); }
async function pollLobby(){
  const j=await call('/lg/lobby',{});
  if(j.ok){ FAIL=0; LOBBY=j; if(j.categories&&Array.isArray(j.categories)&&j.categories.length) CAT_LIST=j.categories.map(c=>String(c&&typeof c==='object'?c.name:c)).filter(Boolean).slice(0,60);
    const r=j.my_room||(j.me&&j.me.room); if(typeof r==='string'&&/^[A-Za-z]{4}$/.test(r)&&SCR==='lobby'&&!CODE){ enterRoom(r); return; }
    renderLobby(); }
  else if(j.code==='auth'){ showLogin(CODE_MSG.auth); }
  else { FAIL++; }
}
async function pollRoom(){
  const gen=ROOM_GEN, code=CODE;
  const body={code}; if(V&&V.code===code){ body.since=V.v; body.since_msg=LASTMSG; }
  const t0=performance.now();
  const j=await call('/lg/state',body);
  if(gen!==ROOM_GEN) return;   // 응답을 기다리는 사이 방을 나갔다
  if(j.ok){
    FAIL=0; if(typeof j.now==='number'){ OFF=j.now-(Date.now()/1000)+((performance.now()-t0)/2000); }
    if(j.same) return;
    applyView(j);
  } else if(j.code==='auth'){ showLogin(CODE_MSG.auth); }
  else if(['not_found','closed'].includes(j.code)){ exitToLobby(j.code==='closed'?'방이 닫혔어요.':'방을 찾을 수 없어요.'); }
  else FAIL++;
}
const nowS=()=>Date.now()/1000+OFF;

// ---------- 새 상태 반영 ----------
function applyView(j){
  const prev=V; ME=String(j.me||ME||'');
  if(Array.isArray(j.players)) SLOTS=assignSlots(j.players.map(p=>String(p.uid)));
  if(Array.isArray(j.msgs)){ for(const m of j.msgs){ const id=N(m&&m.id); if(id>LASTMSG){ LASTMSG=id; MSGS.push(m); addMsg(m, !!prev); } } if(MSGS.length>400) MSGS=MSGS.slice(-300); }
  V=j;
  if(Array.isArray(j.players)&&ME&&!j.players.some(p=>String(p.uid)===ME)&&j.state!=='over'){ exitToLobby('방에서 나갔어요.'); return; }
  if(j.opts&&Array.isArray(j.opts.categories)&&j.opts.categories.length) CAT_LIST=j.opts.categories.map(String).slice(0,60);
  // 단계가 바뀌면 소리·진동·타이머 기준
  if(j.state==='vote'||j.state==='revote'){ const m=j.my||{}; MYVOTE=(m.voted&&typeof m.vote==='string')?m.vote:''; myAbst=!!(m.voted&&!m.vote); }
  const key=j.state+'|'+N(j.round)+'|'+String(j.turn||'')+'|'+N(j.deadline);
  if(key!==PH_KEY){ PH_KEY=key; PH_TOTAL=Math.max(1,N(j.deadline)-nowS()); }
  const phaseChanged=!prev||prev.state!==j.state;
  if(Array.isArray(j.hints)){ for(const h of j.hints){ const hk=String(h.uid)+'|'+N(h.round); if(!SC.hintsSeen.has(hk)){ SC.hintsSeen.add(hk); if(prev&&!(h.pass&&!h.text)) setTimeout(()=>sayBubble(h.uid,h.text,'hint'),30); } } }
  if(phaseChanged) scenePhase(prev?prev.state:null,j);
  const tk=j.state==='hints'&&String(j.turn||'')===ME?('h'+N(j.round)+':'+j.turn):(j.state==='guess'&&canGuess()?'g':'');
  if(tk&&tk!==lastTurnKey){ snd('turn'); try{ if(navigator.vibrate&&(!navigator.userActivation||navigator.userActivation.hasBeenActive)) navigator.vibrate([120,60,120]); }catch(e){} /* 화면을 한 번도 안 눌렀으면 브라우저가 막고 오류를 남긴다 */ blinkTitle(); }
  lastTurnKey=tk;
  renderRoom();
  if(phaseChanged&&['lobby','discuss','over'].includes(j.state)) setTimeout(focusInput,60);
}
function blinkTitle(){ clearInterval(titleTimer); if(!document.hidden) return; let on=false; titleTimer=setInterval(()=>{ if(!document.hidden||!lastTurnKey){ clearInterval(titleTimer); setTitle(''); return; } on=!on; setTitle(on?'🔔 내 차례!':''); },900); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ clearInterval(titleTimer); setTitle(''); wake(); } });
function canGuess(){ return !!V&&V.state==='guess'&&(String(V.turn||'')===ME||(V.turn==null&&V.my&&V.my.role==='liar')); }

// ---------- 그리기 도우미 ----------
function hue(uid){ let h=0; const s=String(uid); for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h%360; }
function av(uid){ return '<span class="av"><img src="'+charSrc(uid)+'" alt="" width="40" height="40" data-k="'+slotOf(uid)+'"></span>'; }
document.addEventListener('error',e=>{ const i=e.target; if(i&&i.tagName==='IMG'&&i.dataset&&i.dataset.k!=null&&!i._fb){ i._fb=1; i.src='img/brjhunt/chick_idle.webp'; i.style.filter='hue-rotate('+(Number(i.dataset.k)*36)+'deg)'; } },true);
function nameOf(uid){ uid=String(uid); const p=V&&Array.isArray(V.players)?V.players.find(x=>String(x.uid)===uid):null; if(p&&p.name) return String(p.name); const m=MSGS.find(x=>String(x.uid)===uid&&x.name); if(m) return String(m.name); const rn=V&&V.result&&V.result.names&&V.result.names[uid]; if(rn) return String(rn); const hh=V&&Array.isArray(V.hints)?V.hints.find(x=>String(x.uid)===uid&&x.name):null; return hh?String(hh.name):'(나간 사람)'; }
function setHTML(el,html){ if(el._k!==html){ el._k=html; el.innerHTML=html; } }
function isFool(m){ return /fool|바보/i.test(String(m||'')); }
function modeKo(m){ return isFool(m)?'바보 라이어':'일반'; }
const iAmHost=()=>!!V&&String(V.host||'')===ME;

  }

// ---------- 방 ----------
function playerCard(p,extra){
  const uid=String(p.uid), turn=V&&String(V.turn||'')===uid&&(V.state==='hints'||V.state==='guess');
  const tags=[]; if(p.host) tags.push('👑 방장'); if(uid===ME) tags.push('나'); if(p.away) tags.push('자리비움'); else if(p.online===false) tags.push('오프라인');
  if(V.state==='hints'&&p.hinted) tags.push('✔ 설명함'); if((V.state==='vote'||V.state==='revote')&&p.voted) tags.push('✔ 투표함');
  if(turn) tags.push('✏ 지금 차례');
  return '<div class="pc'+(turn?' turn':'')+(uid===ME?' me':'')+((p.away||p.online===false)?' off':'')+cc(uid)+'>'+av(uid)+'<span class="nm"><b class="cn"><i class="no">'+(slotOf(uid)+1)+'</i> '+esc(p.name)+'</b><small>'+esc(tags.join(' · '))+(tags.length?' · ':'')+N(p.score)+'점</small></span>'
    +(extra||'')+'</div>';
}
function hintsHtml(){
  const hs=Array.isArray(V.hints)?V.hints:[]; if(!hs.length) return '<div class="mut">아직 힌트가 없어요.</div>';
  let h='<div class="hints">', lastR=null;
  for(const x of hs){ if(x.round!==lastR){ lastR=x.round; h+='<div class="rnd">'+N(x.round)+'바퀴</div>'; }
    h+='<div class="hint'+(String(x.uid)===ME?' me':'')+cc(x.uid)+'>'+av(x.uid)+'<div class="bub"><b class="cn">'+esc(x.name||nameOf(x.uid))+'</b>'+(x.pass&&!x.text?'<i>(패스)</i>':esc(x.text))+'</div></div>'; }
  return h+'</div>';
}
function renderRoom(){
  if(!V){ setHTML($('bMain'),'<div class="card mut">방에 들어가는 중…</div>'); return; }
  const st=V.state, my=V.my||{}, players=Array.isArray(V.players)?V.players:[];
  $('phName').textContent=PH_KO[st]||st;
  $('phSub').textContent=(st==='hints'?N(V.round)+'/'+N(V.rounds)+'바퀴':'');
  // 역할 카드
  let rc='';
  if(['reveal','hints','discuss','vote','revote','guess'].includes(st)&&my.role){
    if(my.role==='liar') rc='<div class="rc liar"><small>당신의 역할</small><span class="big">🕵 라이어</span><small>카테고리: <b>'+esc(my.category)+'</b></small><small>제시어를 몰라요. 들키지 않게 눈치껏 말하고, 제시어를 알아내세요!</small></div>';
    else rc='<div class="rc cit"><small>제시어 · 카테고리 '+esc(my.category)+'</small><span class="big">'+esc(my.word)+'</span><small>라이어에게 새지 않게, 직접 말하지 말고 설명하세요.</small></div>';
  }
  setHTML($('rcard'),rc);
  // 참가자
  let pl='';
  for(const p of players){
    if((st==='vote'||st==='revote')) continue;
    const kick=st==='lobby'&&iAmHost()&&String(p.uid)!==ME?'<button class="btn sm sub" data-a="kick" data-uid="'+esc(p.uid)+'" aria-label="'+esc(p.name)+' 강퇴">강퇴</button>':'';
    pl+=playerCard(p,kick);
  }
  $('bPlayersC').hidden=(st==='vote'||st==='revote'||st==='result'||st==='over');
  setHTML($('bPlayers'),pl);
  renderOpts();
  // 본문
  let m='';
  if(st==='lobby'){
    const n=players.length;
    m+='<div class="card"><h3>👥 '+n+'명 대기 중 <span class="mut">(3~'+N(V.opts&&V.opts.max||10)+'명)</span></h3><div class="row"><span class="pill">방 코드 <b>'+esc(CODE)+'</b></span>'
      +'<button class="btn sm sub" data-a="copycode">코드 복사</button><button class="btn sm sub" data-a="copylink">링크 복사</button></div>';
    if(iAmHost()) m+='<p><button class="btn gold" data-a="start"'+(n<3?' disabled':'')+'>▶ 게임 시작</button>'+(n<3?' <span class="mut">3명 이상 모이면 시작할 수 있어요</span>':'')+'</p><button class="btn sm sub" data-a="end">방 닫기</button>';
    else m+='<p class="mut">방장이 시작하기를 기다리고 있어요…</p>';
    m+='</div>';
  } else if(st==='reveal'){
    m+='<div class="card"><h3>🔎 역할을 확인하세요</h3><p class="mut">곧 설명이 시작돼요. 첫 순서부터 한 사람씩 한 문장으로 힌트를 말합니다.</p></div>';
  } else if(st==='hints'){
    const tn=V.turn?nameOf(V.turn):'';

  if(!Object.keys(tally).length) bars+='<div class="mut">득표가 없었어요.</div>';

  h+='<div class="card"><h3>🏆 점수</h3>'+scoreTable(players,r.points||{})+'</div>';

  if(log.length) h+='<div class="card"><details><summary>📜 이번 판 전체 기록 ('+log.length+')</summary><ol class="log">'+log.map(logLine).join('')+'</ol></details></div>';
  h+='<div class="card row">'+(V.state==='over'?'':(iAmHost()?'<button class="btn gold" data-a="next">▶ 다음 판</button><button class="btn sub" data-a="end">방 닫기</button>':'<span class="mut">방장이 다음 판을 시작하기를 기다려요…</span>'))+'<button class="btn sub" data-a="leave">방 나가기</button></div>';
  return h;
}
function tallyOf(r){
  const t={}; const src=r.tally;
  if(src&&typeof src==='object'&&!Array.isArray(src)){ for(const [k,v] of Object.entries(src)) if(N(v)>0) t[String(k)]=N(v); }
  else if(Array.isArray(src)){ for(const x of src) if(x&&x.uid!=null&&N(x.n!=null?x.n:x.count)>0) t[String(x.uid)]=N(x.n!=null?x.n:x.count); }
  else if(r.votes&&typeof r.votes==='object'){ for(const v of Object.values(r.votes)) if(v) t[String(v)]=(t[String(v)]||0)+1; }
  return t;
}
function logLine(x){
  if(x==null) return '';
  if(typeof x==='object'){ const nm=x.name||(x.uid!=null?nameOf(x.uid):''); return '<li>'+(nm?'<b>'+esc(nm)+'</b> ':'')+esc(x.text!=null?x.text:(x.msg!=null?x.msg:''))+'</li>'; }
  return '<li>'+esc(x)+'</li>';
}
function scoreTable(players,points){
  const rows=players.slice().sort((a,b)=>N(b.score)-N(a.score));
  let h='<table class="pts"><thead><tr><th>이름</th><th class="num">이번 판</th><th class="num">누적</th></tr></thead><tbody>';
  for(const p of rows){ const d=N(points[p.uid]); h+='<tr><td><span class="cn'+cc(p.uid)+'><i class="no">'+(slotOf(p.uid)+1)+'</i> '+esc(p.name)+'</span>'+(String(p.uid)===ME?' (나)':'')+'</td><td class="num">'+(d?'+'+d:'0')+'</td><td class="num"><b>'+N(p.score)+'</b></td></tr>'; }
  return h+'</tbody></table>';
}

function tick(){
  if(SCR!=='room'||!V) return;
  const dl=N(V.deadline), tn=$('tnum'), tf=$('tfill');
  if(!dl){ tn.textContent=''; tf.style.transform='scaleX(1)'; sceneTick(null); return; }
  const left=Math.max(0,dl-nowS());
  sceneTick(left);
  const secs=Math.ceil(left); tn.textContent=secs+'초'; tn.className=left<=5?'low':'';
  tf.style.transform='scaleX('+Math.max(0,Math.min(1,left/PH_TOTAL))+')';
  const mine=(V.state==='hints'&&String(V.turn||'')===ME)||canGuess()||((V.state==='vote'||V.state==='revote')&&!MYVOTE&&!myAbst);
  const k=Math.ceil(left);
  if(mine&&k<=5&&k>0&&tick._k!==V.state+k){ tick._k=V.state+k; snd('tick'); }
}

  const finish=()=>{ setTimeout(focusInput,200); clearT(); endAnn(); camTo(''); SC.res='done'; SC.lbl=''; SC.spot=''; $('scene').dataset.res='done'; $('skipBtn').hidden=true; $('svgF').textContent=''; SC.armKey=''; $('floats').querySelectorAll('.tal').forEach(x=>x.remove()); unmask(); mood(winLiar?'lose':'win'); const bgmName=winLiar?'lose':'win'; A.bgm(bgmName);
    const v=$('verdict'); if(!v.classList.contains('on')){ verdict(); points(); } renderRoom(); };
  SC.finish=finish;
  if(RM||j.state==='over'){ SC.res='done'; $('scene').dataset.res='done'; unmask(); verdict(); if(acc){ const an=$('ann'); an.textContent=''; an.className='on '+(r.caught?'yes':'no'); const l1=document.createElement('div'); l1.className='a1'; l1.textContent=ANN_T1+'…'; const l2=document.createElement('div'); l2.className='a2'; l2.textContent=annWord(!!r.caught); an.appendChild(l1); an.appendChild(l2); $('scene').classList.add('rm'); } return; }
  SC.res='dark'; $('scene').dataset.res='dark'; $('skipBtn').hidden=false; mood('dark'); A.bgm('result'); SC.lbl='투표 결과를 공개합니다…';
  let tc=0; const at=(dt,fn)=>{ tc+=dt; T(tc,fn); };
  const caught=!!r.caught, hasGuess=r.liar_guess!=null&&r.liar_guess!=='';
  at(900,()=>{ SC.res='point'; $('scene').dataset.res='point'; SC.lbl='모두가 한 명을 가리킵니다'; mood('vote'); A.sfx('point'); armsRender();
    for(const [u,c] of Object.entries(tally)) floatAt(u,c+'표','fl tal'); });
  at(2400,()=>{ SC.res='accuse'; $('scene').dataset.res='accuse'; SC.spot=acc; if(acc){ SC.lbl=nameOf(acc)+' 님이 최다 득표!'; A.sfx('thud'); mood('guess'); camTo(acc); } else { SC.lbl='동률 — 아무도 지목되지 않았어요'; } sceneRender(); });
  if(acc){
    const plan=annPlan(caught);
    at(1500,()=>{ SC.res='ann'; $('scene').dataset.res='ann'; SC.lbl=''; $('svgF').textContent=''; SC.armKey='X'; $('floats').querySelectorAll('.tal').forEach(x=>x.remove()); sceneRender(); runAnn(acc,caught,unmask); });
    tc+=plan.total;
  } else { at(1000,()=>{ SC.res='silence'; $('scene').dataset.res='silence'; SC.lbl='…'; A.sfx('silence'); $('scene').classList.add('flick'); A.sfx('flicker'); }); }
  at(acc?200:1400,()=>{ $('scene').classList.remove('flick'); endAnn(); SC.res='liar'; $('scene').dataset.res='liar'; SC.spot=liars[0]||acc; $('svgF').textContent=''; SC.armKey='X'; $('floats').querySelectorAll('.tal').forEach(x=>x.remove()); SC.lbl=(caughtText(r,liars)); mood(caught?'liarred':'liarred'); A.sfx('hitLiar'); unmask(); camTo(SC.spot); sceneRender(); });
  if(hasGuess) at(1800,()=>{ SC.res='guess'; $('scene').dataset.res='guess'; const l=liars[0]; if(l) sayBubble(l,'추측: '+r.liar_guess+(r.liar_guess_ok?' (정답!)':' (오답)'),'think'); SC.lbl='라이어의 마지막 기회: '+(r.liar_guess_ok?'제시어를 맞혔어요!':'틀렸어요'); sceneRender(); });
  at(hasGuess?2400:2200,()=>{ SC.res='verdict'; $('scene').dataset.res='verdict'; SC.spot=''; SC.lbl=''; camTo(''); verdict(); sceneRender(); });
  at(2400,()=>{ points(); });
  at(1800,finish);
}
// ---- 「그는 라이어가 … 맞습니다/아닙니다」 한 글자씩 ----
// 타이밍 상수는 여기 한 곳에. 음성 파일이 있으면 실제 길이를, 없으면 defD1/defD2 를 쓴다.
const ANN={defD1:1.9,defD2:1.0,type1Frac:.85,dotMs:420,gapMs:1300,finMs:150,holdMs:1500};
const LG_VOICE_FILES=false;   // tooling/liar_announce_voice.py 로 audio/liar_*.ogg 를 만들어 올린 뒤 true (?voicefiles=1 로 시험)
try{ A.setVoiceFiles&&A.setVoiceFiles(LG_VOICE_FILES||/[?&]voicefiles=1/.test(location.search)); }catch(e){}
A.setVoiceDefaults&&A.setVoiceDefaults({seg1:ANN.defD1,yes:ANN.defD2,no:ANN.defD2});
const ANN_T1='그는 라이어가';
function annWord(caught){ return caught?'맞습니다.':'아닙니다.'; }
function annPlan(caught){
  const D1=A.voiceDur?A.voiceDur('seg1'):ANN.defD1, D2=A.voiceDur?A.voiceDur(caught?'yes':'no'):ANN.defD2, w=annWord(caught), per=Math.min(ANN.finMs,D2*1000*0.8/w.length);
  const t0=D1*1000*ANN.type1Frac, dotsEnd=t0+3*ANN.dotMs, tf=Math.max(dotsEnd,D1*1000)+ANN.gapMs, slam=tf+w.length*per;
  return {D1,D2,per,t0,dotsEnd,tf,slam,total:slam+ANN.holdMs};
}
function addCh(line,ch,cls){ const sp=document.createElement('span'); sp.className='ach'+(cls?' '+cls:''); sp.textContent=ch; line.appendChild(sp); return sp; }
function camTo(uid){ const cam=$('cam'), p=SC.pos[uid]; if(!uid||!p){ cam.classList.remove('zoom'); return; } cam.style.setProperty('--ox',(p.x/SC.W*100).toFixed(1)+'%'); cam.style.setProperty('--oy',(p.y/SC.H*100).toFixed(1)+'%'); if(!RM) cam.classList.add('zoom'); }
function endAnn(){ const an=$('ann'); an.className=''; an.textContent=''; $('scene').classList.remove('pulse'); }
function runAnn(acc,caught,unmask){
  const an=$('ann'), pl=annPlan(caught), w=annWord(caught); an.textContent=''; an.className='on '+(caught?'yes':'no');
  const a0=document.createElement('div'); a0.className='a0 cn cc'; a0.setAttribute('style',cstyle(acc)); a0.textContent='최다 득표 · '+nameOf(acc); const a1=document.createElement('div'); a1.className='a1'; const a2=document.createElement('div'); a2.className='a2';
  an.appendChild(a0); an.appendChild(a1); an.appendChild(a2); $('scene').classList.add('pulse');
  A.voice('seg1',ANN_T1);
  const per1=pl.t0/ANN_T1.length; [...ANN_T1].forEach((ch,i)=>T(i*per1,()=>{ addCh(a1,ch); A.sfx('tick'); }));
  for(let k=0;k<3;k++) T(pl.t0+k*ANN.dotMs,()=>{ addCh(a1,'.'); A.sfx('tick'); });
  T(pl.dotsEnd,()=>{ A.sfx('silence'); $('scene').classList.remove('pulse'); void $('scene').offsetWidth; $('scene').classList.add('pulse'); });   // 「…」 뒤 정적
  T(pl.tf,()=>{ A.voice(caught?'yes':'no',w); });
  [...w].forEach((ch,i)=>T(pl.tf+i*pl.per,()=>{ addCh(a2,ch,'fin'); A.sfx('tick'); }));
  T(pl.slam,()=>{ a2.classList.add('slam'); A.sfx('thud'); if(caught){ mood('liarred'); A.sfx('hitLiar'); unmask([acc]); } else { mood('relief'); A.sfx('bell'); } $('scene').classList.remove('pulse'); });
}
function caughtText(r,liars){ const names=liars.map(nameOf).join(' · '); return '라이어는… '+names+'!'+(r.caught?'':' (시민이 지목당했어요)'); }
function floatAt(uid,text,cls){ const p=SC.pos[String(uid)]; if(!p) return; const el=document.createElement('span'); el.className=cls+' cc'; const tal=/tal/.test(cls); el.setAttribute('style',cstyle(uid)+';left:'+(tal?p.x+p.s*0.62:p.x)+'px;top:'+(tal?p.y-p.s*0.05:p.y-p.s*0.5-tagH(uid)-8)+'px'); el.textContent=text; $('floats').appendChild(el); if(!/tal/.test(cls)) setTimeout(()=>el.remove(),2300); }
// ---- 배경 효과(먼지 · 색종이) — 캔버스 하나, 30프레임, 숨김 탭에서 멈춤 ----
const FX={on:false,raf:0,last:0,dust:[],conf:[],confUntil:0,frames:0,ms:0,dpr:1,ctx:null};
function fxSize(){ const c=$('fxc'); if(!c||!SC.W) return; FX.dpr=Math.min(1.5,window.devicePixelRatio||1); c.width=Math.round(SC.W*FX.dpr); c.height=Math.round(SC.H*FX.dpr); FX.ctx=c.getContext('2d'); if(!FX.dust.length){ for(let i=0;i<34;i++) FX.dust.push({x:Math.random(),y:Math.random(),r:.8+Math.random()*1.8,a:.15+Math.random()*.4,vx:(Math.random()-.5)*.012,vy:(Math.random()-.4)*.01,ph:Math.random()*6.28}); } if(RM) fxDraw(0); }
function confetti(ms){ FX.confUntil=performance.now()+ms; fxStart(); }
function fxDraw(dt){
  const c=FX.ctx; if(!c) return; const W=SC.W, H=SC.H, k=FX.dpr; c.setTransform(k,0,0,k,0,0); c.clearRect(0,0,W,H);
  const s=$('scene'), lw=parseFloat(s.style.getPropertyValue('--lw'))||0, lr=parseFloat(s.style.getPropertyValue('--lr'))||0, lit=Math.min(1,lw+lr), red=lr>lw;
  for(const d of FX.dust){ d.x+=d.vx*dt*8; d.y+=d.vy*dt*8; d.ph+=dt*.8; if(d.x<0)d.x+=1; if(d.x>1)d.x-=1; if(d.y<0)d.y+=1; if(d.y>1)d.y-=1;
    const inCone=Math.abs(d.x-.5)<.08+d.y*.34; const a=d.a*(inCone?1:.25)*(.45+.55*lit)*(.7+.3*Math.sin(d.ph)); if(a<.02) continue;
    c.fillStyle=red?'rgba(255,170,170,'+a.toFixed(3)+')':'rgba(255,240,200,'+a.toFixed(3)+')'; c.beginPath(); c.arc(d.x*W,d.y*H,d.r,0,6.283); c.fill(); }
  const now=performance.now(); if(now<FX.confUntil&&FX.conf.length<90) for(let i=0;i<3;i++) FX.conf.push({x:Math.random()*W,y:-8,vx:(Math.random()-.5)*60,vy:60+Math.random()*90,r:Math.random()*6,vr:(Math.random()-.5)*8,w:5+Math.random()*5,h:3+Math.random()*4,c:['#ffd75e','#ff7a9a','#6be28c','#5cc8ff','#f08cff'][i%5|0]});
  for(let i=FX.conf.length-1;i>=0;i--){ const p=FX.conf[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.r+=p.vr*dt; p.vx*=.995; if(p.y>H+10){ FX.conf.splice(i,1); continue; } c.save(); c.translate(p.x,p.y); c.rotate(p.r); c.fillStyle=p.c; c.fillRect(-p.w/2,-p.h/2,p.w,p.h); c.restore(); }
}
function fxLoop(ts){ FX.raf=0; if(!FX.on||document.hidden||SCR!=='room') return; FX.raf=requestAnimationFrame(fxLoop); if(ts-FX.last<33) return; const dt=Math.min(.1,(ts-(FX.last||ts))/1000)||.033; FX.last=ts; const t0=performance.now(); fxDraw(dt); FX.ms+=performance.now()-t0; FX.frames++; }
function fxStart(){ if(RM){ fxDraw(0); return; } FX.on=true; if(!FX.raf&&!document.hidden) FX.raf=requestAnimationFrame(fxLoop); }
function fxStop(){ FX.on=false; if(FX.raf){ cancelAnimationFrame(FX.raf); FX.raf=0; } }
// ---- 매 0.25초: 말풍선 수명 · 심장 박동 링 · 긴장도 ----
function sceneTick(left){
  const now=Date.now(); let changed=false;
  for(const b of SC.bubs){ if(!b.dead&&now-b.t0>b.ttl){ killBubble(b); changed=true; } }
  SC.bubs=SC.bubs.filter(b=>!b.dead||now-b.t0<b.ttl+800); if(changed) placeBubbles();
  for(const [uid,el] of SC.els){ const on=(SC.talk[uid]&&SC.talk[uid]>now)||(V&&V.state==='hints'&&String(V.turn||'')===uid); if(el.classList.contains('talk')!==!!on) el.classList.toggle('talk',!!on); }
  const st=V.state, dl=N(V.deadline), ring=$('ring');
  let tn=0; if(dl&&left!=null){ if(st==='vote'||st==='revote') tn=left<=12?1-left/12:0; else if(st==='discuss') tn=Math.max(0,Math.min(1,1-left/PH_TOTAL)); }
  A.tension(tn);
  const mine=(st==='hints'&&String(V.turn||'')===ME)||canGuess();
  if(dl&&left!=null){ ring.classList.toggle('on',(mine||left<=10)&&left>0&&!RM); ring.classList.toggle('low',left<=5);
    const hb=left<=10?(1.1-0.75*(1-left/10)):1.25; ring.style.setProperty('--hb',hb.toFixed(2)+'s');
    $('tsec').textContent=String(Math.ceil(left)); $('rf').style.strokeDashoffset=String(1-Math.max(0,Math.min(1,left/PH_TOTAL))); }
  const sc=$('scene'), voting=(st==='vote'||st==='revote'); sc.style.setProperty('--rv',voting?(tn*0.5).toFixed(2):'0');
  if(voting&&left!=null&&left<8&&left>0&&!RM&&now-SC.lastFlick>2600&&Math.random()<0.35){ SC.lastFlick=now; sc.classList.remove('flick'); void sc.offsetWidth; sc.classList.add('flick'); A.sfx('flicker'); setTimeout(()=>sc.classList.remove('flick'),600); }
}
window.addEventListener('resize',()=>{ SC.armKey=''; const bm=$('beam'); if(bm) bm._k=''; sceneRender(); });
try{ new ResizeObserver(()=>{ if(SCR==='room'){ SC.armKey=''; const bm=$('beam'); if(bm) bm._k=''; sceneRender(); } }).observe($('scene')); }catch(e){}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&SCR==='room') fxStart(); });
function sceneEnter(){   // 방에 들어올 때 장면을 처음 상태로
  clearT(); SC.els.forEach(e=>e.remove()); SC.tags.forEach(e=>e.remove()); SC.els.clear(); SC.tags.clear(); SC.pos={}; SC.bubs.forEach(b=>b.el.remove()); SC.bubs=[]; SC.hintsSeen=new Set(); SC.talk={}; SC.cardKey=''; SLOTS={}; SC.W=0; SC.H=0; SC.resKey=''; sceneReset(); fxStart();
}
window.__lg={slots:()=>SLOTS,pos:()=>SC.pos,palette:LG_PALETTE,chars:CHARS,fx:()=>({frames:FX.frames,ms:FX.ms,on:FX.on}),res:()=>SC.res,assign:assignSlots,bubbles:()=>SC.bubs.filter(b=>!b.dead).map(b=>({uid:b.uid,text:b.el.textContent,gone:b.el.classList.contains('gone'),html:b.el.innerHTML})),armPairs:()=>Array.from(document.querySelectorAll('#svgF .arm-g')).map(g=>g.dataset.from+'>'+g.dataset.to)};

// ---------- PC 화면 맞춤 · 마우스/키보드 ----------
const FINE=(()=>{ try{ return matchMedia('(hover:hover) and (pointer:fine)').matches; }catch(e){ return false; } })();
function fitMode(){
  let on=false; try{ on=SCR==='room'&&matchMedia('(min-width:900px) and (min-height:520px)').matches; }catch(e){}
  document.documentElement.classList.toggle('pcfit',on); document.body.classList.toggle('pcfit',on);
  const h=$('bar').offsetHeight; document.documentElement.style.setProperty('--hh',h+'px');
}
window.addEventListener('resize',fitMode);
function setHover(uid){ uid=uid||''; if(SC.hover===uid) return; SC.hover=uid; for(const [u,el] of SC.els){ el.classList.toggle('hv',u===uid); SC.tags.get(u).classList.toggle('hv',u===uid); } armsRender(); }
$('scene').addEventListener('mouseover',e=>{ const c=e.target.closest&&e.target.closest('.ch.vt'); setHover(c?c.dataset.uid:''); });
$('scene').addEventListener('mouseleave',()=>setHover(''));
$('scene').addEventListener('click',e=>{ if(SC.res&&SC.res!=='done'&&SC.finish){ SC.finish(); return; } const c=e.target.closest&&e.target.closest('.ch.vt'); if(c) doVote(c.dataset.uid); });
$('vol').addEventListener('input',e=>{ VOL=Math.max(0,Math.min(100,Number(e.target.value)||0)); ls.set('lg_vol',String(VOL)); A.setVolume(VOL/100); });
function focusInput(){   // 마우스 쓰는 PC 에서만 알맞은 입력칸으로 커서를 옮긴다
  if(!FINE||!V) return; const ae=document.activeElement; if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&ae.value) return;
  for(const id of ['hintIn','guessIn','chatIn']){ const el=$(id); if(el&&!el.disabled&&el.offsetParent!==null){ try{ el.focus({preventScroll:true}); }catch(x){} return; } }
}
document.addEventListener('keydown',e=>{
  if(SCR!=='room'||!V||e.ctrlKey||e.metaKey||e.altKey) return;
  const t=e.target, inField=/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName), voting=V.state==='vote'||V.state==='revote';
  if(e.key==='Escape'){ if(inField){ if(t.value) t.value=''; else t.blur(); } else { setHover(''); try{ document.activeElement&&document.activeElement.blur(); }catch(x){} } return; }
  if(inField) return;
  if((e.key===' '||e.code==='Space')&&SC.res&&SC.res!=='done'&&SC.finish){ e.preventDefault(); SC.finish(); return; }
  if(voting&&/^[0-9]$/.test(e.key)){ const n=e.key==='0'?10:Number(e.key), p=(V.players||[]).find(p=>slotOf(p.uid)+1===n&&String(p.uid)!==ME); if(p){ const b=document.querySelector('#bMain button.pc[data-uid="'+String(p.uid).replace(/"/g,'')+'"]'); if(b&&!b.disabled){ e.preventDefault(); doVote(String(p.uid)); } } return; }
  if(voting&&t.matches&&t.matches('#bMain button.pc')&&/^Arrow(Left|Right|Up|Down)$/.test(e.key)){
    const bs=Array.from(document.querySelectorAll('#bMain button.pc:not([disabled])')), i=bs.indexOf(t); if(i<0) return; e.preventDefault();
    const nx=bs[(i+(/Left|Up/.test(e.key)?-1:1)+bs.length)%bs.length]; nx.focus(); setHover(nx.dataset.uid||''); return; }
  if(e.key==='Enter'&&!(t.closest&&t.closest('button,a,summary,select'))){ e.preventDefault(); focusInput(); }
});
document.addEventListener('focusin',e=>{ const b=e.target.closest&&e.target.closest('#bMain button.pc'); if(b&&b.dataset.uid&&!b.disabled) setHover(b.dataset.uid); });
document.addEventListener('focusout',e=>{ if(e.target.closest&&e.target.closest('#bMain button.pc')) setHover(''); });

// ---------- 시작 ----------
(function boot(){
  paintMute();
  ME=(dcUser()||{}).id?String(dcUser().id):'';
  if(!dcUser()){ showLogin(); return; }
  const m=/^#([A-Za-z]{4})$/.exec(location.hash); const saved=ls.get('lg_room');
  show('lobby'); renderLobby();
  if(m) joinCode(m[1]).then(()=>{ if(!CODE) wake(); });
  else if(saved&&/^[A-Z]{4}$/.test(saved)) enterRoom(saved);
  else wake();
})();
