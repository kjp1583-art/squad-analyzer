name: Import latest web files from Drive handoff

on:
  workflow_dispatch:
  push:
    branches: [claude/project-cloud-migration-0qtorl]
    paths: ['.github/workflows/handoff-import.yml']

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/project-cloud-migration-0qtorl

      - name: Install gdown
        run: pip install gdown

      - name: Download handoff files
        run: |
          set -e
          mkdir -p tools deploy
          dl() { gdown -O "$2" "https://drive.google.com/uc?id=$1"; }
          dl 1pdA0XVTWWJX9skn2BE5JT1uOubwpIy5M index.html
          dl 1IdXhcNv3jEaQYlHUoDjGlXP1bbLzh9W2 coach.html
          dl 1RQCxeJ4s-oCGKFecOD2AhxT9Fo1pwqQx draft.html
          dl 1lcEdsV15axnbdrIQwpTZYSlKQ_viJ8Gn draft_backend.gs
          dl 1uZ8JQ9NT6FCKdg9vnZfUq-5f0DN6DKX8 DESIGN.md
          dl 1WRkVwZBHhguYAej7atATlTbX3SCaF8dZ handoff.md
          dl 1guFy3r44GP4EOB7aCy2wTd1R2CdcNOlh HANDOFF_20260727.md
          dl 1f7V4XrQ6KoIOQevLwTlCXY6m01FvACg_ noban.json
          dl 132ZBFp0jxDFY5rkXcEePwK45weoJ4mIE logo.png
          dl 1L46lxr1R1keoAlf2OOksnnEBTBhmWLp4 honeybee.jfif
          dl 1JVKo3dO-cTKRDgSOXa8d1zoSh7ECqLCk tools/noban.sample.json
          dl 1aR9mP2avTUGfy2SjODpwRxzzgQ81MBXV tools/qna_query.py
          dl 1_GdgHKnLqAenFPP-5J7hHdVoXcQeYQUg tools/noban_metric.py
          dl 14Rc5BLjcVsq-fxJvDUbT6dbx9iCzQRuJ tools/ban_targeted.py
          dl 10OafZXu-QOP6uTCT9RFZxUGZaXUIlmOP deploy/logo.svg
          dl 1Edu8BJH9xgzCkfaJuaL6B62SclHvF83N deploy/logo.png
          dl 1-Js1SGYsf5PrHBdn3Gki2rSCCgp6JS95 deploy/index.html
          ls -la . tools deploy

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "web: import latest site files from 20260727 handoff"
          git push origin claude/project-cloud-migration-0qtorl
