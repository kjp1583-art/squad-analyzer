name: Fix broken player names

# 소환사명 자리에 챔피언 이름이 들어간 행을 PUUID 로 찾아 실제 닉네임으로 되돌린다.
# 기본은 미리보기. apply=true 일 때만 실제로 시트를 고친다.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: '실제로 수정 (체크 안 하면 미리보기만)'
        type: boolean
        default: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet gspread oauth2client
      - name: Run
        env:
          CREDENTIALS_JSON_B64: ${{ secrets.CREDENTIALS_JSON_B64 }}
          APPLY: ${{ inputs.apply && '1' || '0' }}
        run: |
          python tooling/fix_player_names.py
          rm -f creds.json
