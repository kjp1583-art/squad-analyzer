name: Backfill missing games (deeplol)

# 🩹 누락된 내전·스크림 판을 deeplol 매치 번호로 시트에 채워 넣는다(봇 누락경기 복구와 같은 행 형식 · tooling/backfill_game.py).
# 기본은 미리보기. apply=true 일 때만 시트에 쓴다. 이미 있는 판·우리 클랜 판이 아닌 듯한 판은 건너뛴다.
on:
  workflow_dispatch:
    inputs:
      match_ids:
        description: 'deeplol 매치 번호 (공백으로 여러 개, 예: KR_8472179884 KR_8472158372)'
        type: string
        required: true
      apply:
        description: '실제로 시트에 기록 (체크 안 하면 미리보기만)'
        type: boolean
        default: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet gspread oauth2client
      - name: Run
        env:
          CREDENTIALS_JSON_B64: ${{ secrets.CREDENTIALS_JSON_B64 }}
          MATCH_IDS: ${{ inputs.match_ids }}
          APPLY: ${{ inputs.apply && '1' || '0' }}
        run: |
          python tooling/backfill_game.py
          rm -f creds.json
