      - name: Safety check — no secrets in import
        run: |
          set -e
          test ! -f desktop/app_secrets.py
          test ! -f desktop/credentials.json.json
          test ! -f desktop/credentials.json
          test ! -f desktop/token.txt
          ls -la desktop

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
