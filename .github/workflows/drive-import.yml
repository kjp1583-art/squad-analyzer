name: Import desktop source from Google Drive

on:
  workflow_dispatch:
  push:
    branches: [claude/project-cloud-migration-0qtorl]
    paths: ['.github/workflows/drive-import.yml']

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/project-cloud-migration-0qtorl

      - name: Install gdown
        run: pip install gdown

      - name: Download files from shared Drive folder
        run: |
          set -e
          mkdir -p desktop/.github/workflows
          dl() { gdown --fuzzy -O "desktop/$2" "https://drive.google.com/uc?id=$1"; }
