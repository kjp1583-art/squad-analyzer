name: Result column hygiene

# 🧹 결과 열 오염 정리 (2026-08-11 주간감사에서 발견)
#   ① '숭리' 오타 → '승리'
#   ② 결과 칸에 매치평가 값(MVP/ACE/역적)이 들어간 열밀림 행 → 같은 게임·같은 진영 다수결로 복원
#   기본은 미리보기. apply=true 일 때만 실제로 고친다.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: '실제로 수정 (체크 안 하면 미리보기만)'
        type: boolean
        default: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Repair 결과 column
        env:
          CREDENTIALS_JSON_B64: ${{ secrets.CREDENTIALS_JSON_B64 }}
          APPLY: ${{ inputs.apply && '1' || '0' }}
        run: |
          pip -q install gspread oauth2client
          python3 - <<'PY'
          import base64, os, time
          from collections import Counter, defaultdict
          import gspread
          from oauth2client.service_account import ServiceAccountCredentials
          open("creds.json","wb").write(base64.b64decode(os.environ["CREDENTIALS_JSON_B64"]))
          scope=["https://spreadsheets.google.com/feeds","https://www.googleapis.com/auth/spreadsheets",
                 "https://www.googleapis.com/auth/drive.file","https://www.googleapis.com/auth/drive"]
          creds=ServiceAccountCredentials.from_json_keyfile_name("creds.json",scope)
          ss=gspread.authorize(creds).open_by_key("10j2QBdXiyL0_UGKLMDcndieXD7jeMGxVHqH3nj6gJnU")
          APPLY = os.environ.get("APPLY")=="1"
          OK = {"승리","패배","결과 대기","무효"}
          for tab in ("CLASSIC_NORMAL","KIWI_KIWI"):
              try: ws=ss.worksheet(tab)
              except Exception: continue
              vals=ws.get_all_values()
              if not vals: continue
              h=vals[0]
              try: gI,rI,sI = h.index("게임ID"), h.index("결과"), h.index("진영")
              except ValueError: continue
              # 같은 게임·같은 진영의 정상 결과값을 모아 둔다(복원 근거)
              side_res=defaultdict(Counter)
              for r in vals[1:]:
                  v=(r[rI] if len(r)>rI else "").strip()
                  if v in ("승리","패배"):
                      side_res[(r[gI].strip(), r[sI].strip() if len(r)>sI else "")][v]+=1
              cells=[]
              for i,r in enumerate(vals[1:], start=2):
                  v=(r[rI] if len(r)>rI else "").strip()
                  if not v or v in OK: continue
                  if v=="숭리":
                      print(f"  · {tab} {i}행 '숭리' → '승리'"); cells.append(gspread.Cell(i, rI+1, "승리")); continue
                  key=(r[gI].strip(), r[sI].strip() if len(r)>sI else "")
                  c=side_res.get(key)
                  if c:
                      win=c.most_common(1)[0][0]
                      print(f"  · {tab} {i}행 '{v}' → '{win}' (같은 진영 {dict(c)} 근거)")
                      cells.append(gspread.Cell(i, rI+1, win))
                  else:
                      print(f"  ? {tab} {i}행 '{v}' — 같은 진영 근거 없음, 보류")
              print(f"{tab}: 수정 대상 {len(cells)}행")
              if cells and APPLY:
                  ws.update_cells(cells); time.sleep(1.2); print(f"{tab}: 반영 완료")
          if not APPLY: print("미리보기만 했습니다(APPLY=1 이어야 실제 수정).")
          PY
