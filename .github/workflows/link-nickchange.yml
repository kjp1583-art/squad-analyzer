name: Link nickname changes

# 🎭 닉변 자동 감지 → LINK_ACCOUNT (2026-09-16 사장님 지시)
#
# 롤 닉네임은 바뀌어도 PUUID 는 안 바뀐다. 같은 PUUID 가 서로 다른 소환사명으로 기록돼 있으면
# 그건 닉변이고, LINK_ACCOUNT 에 넣어두지 않으면 그 사람 기록이 두 사람 몫으로 갈라진다.
# 6시간마다 훑어서 새로 생긴 닉변만 append 한다(기존 행은 절대 건드리지 않는다).
on:
  workflow_dispatch:
    inputs:
      apply:
        description: '실제로 기록 (체크 안 하면 미리보기만)'
        type: boolean
        default: false
  schedule:
    - cron: '20 */6 * * *'

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet gspread oauth2client
      - name: Detect nickname changes
        env:
          CREDENTIALS_JSON_B64: ${{ secrets.CREDENTIALS_JSON_B64 }}
          # 예약 실행은 바로 기록하고, 손으로 돌릴 때는 기본이 미리보기다
          APPLY: ${{ (github.event_name == 'schedule' || inputs.apply) && '1' || '0' }}
        run: |
          python tooling/link_nickchange.py
          rm -f creds.json
