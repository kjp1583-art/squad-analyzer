name: Champion art probe

# 🔍 [2026-08-01] champion-tile 경로 커버리지 확인.
#   champion-summary.json 의 alias 로 URL 을 만들어 전 챔피언이 200 인지 검사한다.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Coverage check
        run: |
          python3 - <<'PY'
          import urllib.request, json, concurrent.futures as cf
          UA={'User-Agent':'Mozilla/5.0'}
          CD="https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default"
          def get(u):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=25) as r:
                      return r.read()
              except Exception: return None

          summ=json.loads(get(f"{CD}/v1/champion-summary.json"))
          champs=[c for c in summ if int(c.get("id",-1))>0]
          print("champion-summary 챔피언 수:", len(champs))
          print("샘플:", {k:champs[0][k] for k in ("id","name","alias","squarePortraitPath")})

          def urls(c):
              a=str(c["alias"]).lower(); i=c["id"]
              return {
                "tile(alias)":  f"{CD}/assets/characters/{a}/skins/base/images/{a}_splash_tile_0.jpg",
                "load(alias)":  f"{CD}/assets/characters/{a}/skins/base/images/{a}_splash_centered_0.jpg",
                "square(json)": f"{CD}/{str(c['squarePortraitPath']).replace('/lol-game-data/assets','').lstrip('/').lower()}",
              }
          def check(c):
              res={}
              for k,u in urls(c).items():
                  b=get(u); res[k]=bool(b and len(b)>800)
              return (c["name"], c["alias"], c["id"], res)

          bad={"tile(alias)":[], "load(alias)":[], "square(json)":[]}
          with cf.ThreadPoolExecutor(max_workers=16) as ex:
              for name,alias,cid,res in ex.map(check, champs):
                  for k,ok in res.items():
                      if not ok: bad[k].append((name,alias,cid))
          for k,v in bad.items():
              print(f"\n{k} — 실패 {len(v)}명 / {len(champs)}명")
              for n,a,i in v[:25]: print(f"   {n} (alias={a}, id={i})")
          PY
