name: Champion art probe

# 🔍 [2026-08-01] champion-tiles 경로로 교체하기 전, 전 챔피언 커버리지 확인.
#   (champion-icons 는 VGU/ASU 이전 구 아트가 그대로 남아 있는 세트였다)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Coverage check
        run: |
          python3 - <<'PY'
          import urllib.request, json, concurrent.futures as cf
          UA={'User-Agent':'Mozilla/5.0'}
          def head_ok(u):
              try:
                  req=urllib.request.Request(u, headers=UA, method="GET")
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return r.status==200 and int(r.headers.get("Content-Length") or 1)>500
              except Exception: return False
          CD="https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default"
          vs=json.loads(urllib.request.urlopen("https://ddragon.leagueoflegends.com/api/versions.json").read()); V=vs[0]
          champ=json.loads(urllib.request.urlopen(f"https://ddragon.leagueoflegends.com/cdn/{V}/data/ko_KR/champion.json").read())["data"]
          items=[(c["name"], eng, int(c["key"])) for eng,c in champ.items()]
          print("챔피언", len(items))

          def check(it):
              kor,eng,cid=it
              a=f"{CD}/v1/champion-tiles/{cid}/{cid}000.jpg"
              return (kor,eng,cid, head_ok(a))
          bad=[]
          with cf.ThreadPoolExecutor(max_workers=16) as ex:
              for kor,eng,cid,ok in ex.map(check, items):
                  if not ok: bad.append((kor,eng,cid))
          print(f"\nchampion-tiles/{{id}}/{{id}}000.jpg — 실패 {len(bad)}명 / {len(items)}명")
          for kor,eng,cid in bad[:40]: print("  실패:",kor,eng,cid)
          PY
