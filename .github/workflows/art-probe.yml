name: Champion art probe

# 🔍 [2026-08-01] 챔피언 초상화가 '롤 클래식' 옛날 그림으로 뜨는 문제 조사용 임시 워크플로.
#   개발 컨테이너에서는 라이엇 CDN 이 프록시에 막혀 있어 직접 확인이 안 된다.
#   Actions 러너에서 버전별 아이콘을 받아 해시를 찍어, 아트가 바뀐 패치 경계를 찾는다.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Data Dragon / Community Dragon
        run: |
          python3 - <<'PY'
          import json, hashlib, urllib.request, sys
          UA={'User-Agent':'Mozilla/5.0'}
          def get(u, timeout=30):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=timeout) as r:
                      return r.read()
              except Exception as e:
                  return ('ERR:'+type(e).__name__+' '+str(e)[:120]).encode()
          def h(b):
              if b.startswith(b'ERR:'): return b.decode()
              return f"{hashlib.sha256(b).hexdigest()[:16]} {len(b):>7}B"

          vs = json.loads(get("https://ddragon.leagueoflegends.com/api/versions.json"))
          print("=== ddragon versions.json (앞 20개) ===")
          print(vs[:20])
          print()

          # 리신(64/LeeSin) · 애쉬(22/Ashe) · 가렌(86/Garen) — 아트 리메이크가 없던 챔프 위주
          CH = [("LeeSin","64"),("Ashe","22"),("Garen","86"),("Annie","1")]
          # 최신 몇 개 + 과거 기준점
          cand = vs[:12] + [v for v in ("16.1.1","15.24.1","15.13.1","15.1.1","14.23.1") if v in vs]
          seen=set(); cand=[v for v in cand if not (v in seen or seen.add(v))]

          print("=== Data Dragon 버전별 아이콘 해시 ===")
          for v in cand:
              row=[]
              for eng,cid in CH:
                  row.append(f"{eng}={h(get(f'https://ddragon.leagueoflegends.com/cdn/{v}/img/champion/{eng}.png'))}")
              print(f"[{v:>10}] " + " | ".join(row))
          print()

          print("=== Community Dragon (champion-icons) ===")
          for tag in ("latest","pbe","16.15","16.14","16.13","16.1","15.24","15.13"):
              row=[]
              for eng,cid in CH:
                  u=f"https://raw.communitydragon.org/{tag}/plugins/rcp-be-lol-game-data/global/default/v1/champion-icons/{cid}.png"
                  row.append(f"{eng}={h(get(u))}")
              print(f"[{tag:>7}] " + " | ".join(row))
          print()

          print("=== Community Dragon 사용 가능한 버전 목록 ===")
          b=get("https://raw.communitydragon.org/json/")
          print(b[:1200].decode('utf-8','replace'))
          PY
