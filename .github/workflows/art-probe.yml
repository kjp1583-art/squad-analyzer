name: Champion art probe

# 🔍 [2026-08-01] 블리츠크랭크가 구버전 아트로 뜨는 문제 — 라이브 클라이언트가 쓰는 에셋 경로 찾기.
#   champion-icons 경로는 CDragon/DDragon 모두 같은 (구)그림을 준다. 다른 후보 경로들을 전부 받아
#   한 장으로 합성해 art-probe3 브랜치에 올린다.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Try every asset path
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          import urllib.request, io, os, json
          from PIL import Image, ImageDraw
          UA={'User-Agent':'Mozilla/5.0'}
          def get(u):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=30) as r:
                      return r.read()
              except Exception as e:
                  print("  ERR", u.split('/default/')[-1][:70], type(e).__name__); return None

          CD="https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default"
          CDP="https://raw.communitydragon.org/pbe/plugins/rcp-be-lol-game-data/global/default"
          vs=json.loads(get("https://ddragon.leagueoflegends.com/api/versions.json")); V=vs[0]

          # (한글, 영문id, 숫자키, 소문자 alias)
          CH=[("블리츠크랭크","Blitzcrank","53","blitzcrank"),
              ("문도","DrMundo","36","drmundo"),
              ("트런들","Trundle","48","trundle"),
              ("스카너","Skarner","72","skarner"),
              ("아리","Ahri","103","ahri")]

          def paths(eng,cid,low):
              return [
                ("champion-icons",       f"{CD}/v1/champion-icons/{cid}.png"),
                ("hud square",           f"{CD}/assets/characters/{low}/hud/{low}_square.png"),
                ("hud circle",           f"{CD}/assets/characters/{low}/hud/{low}_circle.png"),
                ("champion-tiles",       f"{CD}/v1/champion-tiles/{cid}/{cid}000.jpg"),
                ("pbe champion-icons",   f"{CDP}/v1/champion-icons/{cid}.png"),
                ("pbe hud square",       f"{CDP}/assets/characters/{low}/hud/{low}_square.png"),
                ("ddragon "+V,           f"https://ddragon.leagueoflegends.com/cdn/{V}/img/champion/{eng}.png"),
              ]

          ROWS=[p[0] for p in paths(*CH[0][1:])]
          S=110; PAD=8; LAB=185; HDR=26
          W=LAB+len(CH)*(S+PAD)+PAD; H=HDR+len(ROWS)*(S+PAD)+PAD
          sheet=Image.new("RGB",(W,H),(18,22,32)); dr=ImageDraw.Draw(sheet)
          for j,(kor,eng,cid,low) in enumerate(CH):
              dr.text((LAB+j*(S+PAD)+2,7), eng, fill=(220,225,235))
          for j,(kor,eng,cid,low) in enumerate(CH):
              print(f"--- {eng}")
              for i,(label,u) in enumerate(paths(eng,cid,low)):
                  b=get(u)
                  if not b: continue
                  try:
                      im=Image.open(io.BytesIO(b)).convert("RGB").resize((S,S))
                      sheet.paste(im,(LAB+j*(S+PAD), HDR+i*(S+PAD)))
                      print(f"  OK {label:20s} {len(b):>7}B")
                  except Exception as e: print("  IMG ERR",label,e)
          for i,label in enumerate(ROWS):
              dr.text((6, HDR+i*(S+PAD)+S//2-6), label, fill=(245,212,122))
          os.makedirs("probe",exist_ok=True)
          sheet.save("probe/champ_art_paths.png")
          print("saved", sheet.size)
          PY
      - name: Commit
        run: |
          git config user.name  "art-probe"
          git config user.email "noreply@anthropic.com"
          git checkout --orphan art-probe3
          git rm -rq --cached . || true
          git add -f probe/champ_art_paths.png
          git commit -qm "probe: 에셋 경로별 대조표"
          git push -qf origin art-probe3
