name: Split LoL Classic games

# 롤 클래식 판을 협곡 탭에서 골라 LOL_CLASSIC 탭으로 옮긴다.
# 분석기는 게임 시작 시점에 모드를 구분할 수 없어(큐·맵 ID 미확인) 기록 후 여기서 정리한다.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: '실제로 이동 (체크 안 하면 미리보기만)'
        type: boolean
        default: false
  schedule:
    - cron: '25 * * * *'    # 매시 25분

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet gspread oauth2client
      - name: Run
        env:
          CREDENTIALS_JSON_B64: ${{ secrets.CREDENTIALS_JSON_B64 }}
          # 예약 실행은 항상 적용, 수동 실행은 체크박스에 따름
          APPLY: ${{ (github.event_name == 'schedule' || inputs.apply) && '1' || '0' }}
        run: |
          python tooling/split_classic.py
          rm -f creds.json
