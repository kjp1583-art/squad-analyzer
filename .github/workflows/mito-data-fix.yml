name: Mito data fix 20260810

# 🏟 2026-08-09 미토 데이터 일회성 수리
# 1) MITO_CODES: 회차 '2026/8/9 미토' 인데 구분이 빈 3행 → '[ 8강 ] 1~2팀'
#    (등록 시 첫 구분 줄이 누락된 채 붙여넣어진 것 — 8강 블록 중 1~2팀만 비어 있어 자명)
# 2) CLASSIC_NORMAL: #8334096991(4강 1~4팀)이 양쪽 모두 '패배'로 기록돼 승자 없음 —
#    이 판의 블루팀(승자: 결승 진출 로스터와 PUUID 일치)을 '승리'로 정정
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Apply fixes
        env:
          CREDENTIALS_JSON_B64: ${{ secrets.CREDENTIALS_JSON_B64 }}
        run: |
          pip -q install gspread oauth2client
          python3 - <<'PY'
          import base64, os, time
          import gspread
          from oauth2client.service_account import ServiceAccountCredentials
          open("creds.json","wb").write(base64.b64decode(os.environ["CREDENTIALS_JSON_B64"]))
          scope=["https://spreadsheets.google.com/feeds","https://www.googleapis.com/auth/spreadsheets",
                 "https://www.googleapis.com/auth/drive.file","https://www.googleapis.com/auth/drive"]
          creds=ServiceAccountCredentials.from_json_keyfile_name("creds.json",scope)
          ss=gspread.authorize(creds).open_by_key("10j2QBdXiyL0_UGKLMDcndieXD7jeMGxVHqH3nj6gJnU")

          ws=ss.worksheet("MITO_CODES"); vals=ws.get_all_values()
          n=0
          for i,r in enumerate(vals[1:],start=2):
              if len(r)>=2 and r[1].strip()=="2026/8/9 미토" and (len(r)<3 or not r[2].strip()):
                  ws.update_cell(i,3,"[ 8강 ] 1~2팀"); n+=1; time.sleep(1.1)
          print(f"MITO_CODES 구분 채움: {n}행")

          ws2=ss.worksheet("CLASSIC_NORMAL"); vals2=ws2.get_all_values()
          h=vals2[0]; gI=h.index("게임ID"); sI=h.index("진영"); rI=h.index("결과")
          m=0
          for i,r in enumerate(vals2[1:],start=2):
              if r[gI].strip()=="#8334096991" and r[sI].strip()=="블루팀" and r[rI].strip()=="패배":
                  ws2.update_cell(i,rI+1,"승리"); m+=1; time.sleep(1.1)
          print(f"#8334096991 블루팀 승리 정정: {m}행")
          PY
