name: Check secrets

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate base64 secrets (길이·유효성만 출력, 내용 미출력)
        env:
          APP_SECRETS_B64: ${{ secrets.APP_SECRETS_B64 }}
          CREDENTIALS_JSON_B64: ${{ secrets.CREDENTIALS_JSON_B64 }}
        run: |
          python3 - << 'EOF'
          import os, base64, re
          for name, expect in (("APP_SECRETS_B64", 2388), ("CREDENTIALS_JSON_B64", 3136)):
              v = os.environ.get(name) or ""
              v2 = re.sub(r"\s", "", v)
              ok = True
              try: base64.b64decode(v2, validate=True)
              except Exception: ok = False
              print(f"{name}: raw_len={len(v)} stripped_len={len(v2)} expected={expect} valid_base64={ok}")
          EOF
