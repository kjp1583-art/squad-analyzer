name: Test result webhook

# 🧪 결과 채널 메시지 형식 테스트 — 새 포맷(병합된 경기종료+리포트 한 박스)을 실제 채널에 1건 발송해
# 눈으로 확인하는 용도. 로스터는 가짜 이름(테스트A~)이라 봇의 종료 트리거가 매칭할 대상이 없어 무해하다.
on:
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Post test message
        env:
          APP_SECRETS_B64: ${{ secrets.APP_SECRETS_B64 }}
        run: |
          python3 - <<'PY'
          import base64, re, os, json, urllib.request, datetime
          src = base64.b64decode(re.sub(r"\s", "", os.environ["APP_SECRETS_B64"])).decode("utf-8", "replace")
          m = re.search(r'^\s*RESULT_WEBHOOK_URL\s*=\s*["\']([^"\']+)["\']', src, re.M)
          assert m, "RESULT_WEBHOOK_URL 없음"
          kst = datetime.datetime.utcnow() + datetime.timedelta(hours=9)
          NL = chr(10)
          msg = ("```md" + NL
                 + "🏁 **[스쿼드 내전 경기 종료]** 🏁  ⏰ " + kst.strftime("%H:%M") + " · V82.81" + NL
                 + "🟦 블루: 테스트A, 테스트B, 테스트C, 테스트D, 테스트E        (노밴 : 우르곳)" + NL
                 + "🟥 레드: 테스트F, 테스트G, 테스트H, 테스트I, 테스트J        (노밴 : X)" + NL
                 + "🏆 레드 승" + NL
                 + "🏆 [MVP] 테스트F (베이가) (AI점수 32.2점)" + NL
                 + "🔥 [ACE] 테스트A (이즈리얼) (AI점수 20.8점)" + NL
                 + "✨ 이번 경기는 역적 없이 다들 제 몫을 했어요!" + NL
                 + "🔚 막판 선언: 테스트B (1명)" + NL
                 + "```" + NL
                 + "-# 🧪 새 포맷 미리보기(테스트 발송) — 실제 판이 아닙니다")
          req = urllib.request.Request(m.group(1), data=json.dumps({"content": msg}).encode(),
                                       headers={"Content-Type": "application/json", "User-Agent": "squad-ci"})
          with urllib.request.urlopen(req, timeout=20) as r:
              print("발송:", r.status)
          PY
