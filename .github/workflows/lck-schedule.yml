name: LCK schedule snapshot

# 🏆 LCK 일정·결과를 Leaguepedia 에서 받아 ai-eval-data 브랜치에 lck_schedule.json 으로 커밋한다.
# 봇 호스팅의 공유 IP 가 Fandom 에 상시 ratelimited 라(2026-08-05 콘솔 확인) 봇이 직접 못 읽는다 —
# 봇은 이 파일(raw)을 읽고, 파일이 3시간 넘게 낡았을 때만 직접 조회를 시도한다.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-eval-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse as up, json, time, datetime, sys
          UA = "squad-gg-bot/1.0 (+https://github.com/kjp1583-art/squad-naejeon-bot; LCK schedule for a private clan Discord bot)"
          frm = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=2)
          q = {"action": "cargoquery", "format": "json", "limit": "50",
               "tables": "MatchSchedule=MS,Tournaments=T",
               "join_on": "MS.OverviewPage=T.OverviewPage",
               "fields": ("MS.MatchId,MS.Team1,MS.Team2,MS.DateTime_UTC,MS.BestOf,"
                          "MS.Winner,MS.Team1Score,MS.Team2Score,MS.Tab"),
               "where": f'T.League="LoL Champions Korea" AND MS.DateTime_UTC >= "{frm.strftime("%Y-%m-%d %H:%M:%S")}"',
               "order_by": "MS.DateTime_UTC ASC"}
          url = "https://lol.fandom.com/api.php?" + up.urlencode(q)
          rows = None
          for i in range(4):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "application/json"})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      d = json.loads(r.read().decode("utf-8", "replace"))
                  if "cargoquery" in d:
                      rows = [x.get("title") or {} for x in d["cargoquery"]]; break
                  print("응답 오류:", (d.get("error") or {}).get("code"))
              except Exception as e:
                  print("조회 실패:", e)
              time.sleep(20)
          if rows is None:
              print("레이트리밋 지속 — 기존 파일 유지(커밋 안 함)"); sys.exit(0)
          json.dump({"at": time.time(), "rows": rows},
                    open("lck_schedule.json", "w", encoding="utf-8"), ensure_ascii=False)
          print(f"경기 {len(rows)}건 저장")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lck_schedule.json
          git diff --cached --quiet || { git commit -m "data: lck schedule"; git push origin ai-eval-data; }
