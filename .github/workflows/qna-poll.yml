name: QnA question poll

# 봇(/questions)의 미답변 질문을 매시간 가져와 ai-eval-data 브랜치에 커밋.
# 클라우드 Claude 루틴이 이 파일을 읽고 답변을 qna_answers.json으로 커밋하면
# 봇의 qna_answer_poll(10분)이 가져다 게시한다.
on:
  workflow_dispatch:
  schedule:
    - cron: '20 * * * *'

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-eval-data

      - name: Fetch pending questions
        run: |
          set -e
          curl -sS -m 20 "https://hth3thmujs.apps.bot-hosting.cloud/questions" -o qna_pending.json
          python3 -c "import json; d=json.load(open('qna_pending.json')); print('questions:', len(d.get('questions', [])))"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add qna_pending.json
          git diff --cached --quiet || { git commit -m "data: qna pending questions"; git push origin ai-eval-data; }
