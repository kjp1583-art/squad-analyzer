name: Tier name audit

# 🔤 내부티어 차트의 닉네임 ↔ 실제 롤닉 불일치 감사
#
#   왜 필요한가: CLAN_TIERS 의 닉네임은 tnorm(닉) 키로 티어 조회에 쓰이는데(분석기 tier_of ·
#   웹 tierOf · 봇 _scrim_tiers), 차트 표기가 실제 롤닉과 한 글자라도 다르면 그 사람은
#   '티어 미보유'로 조용히 떨어진다. 실제 사고: 차트 '텍스' ↔ 롤닉 '택 스#tax'(27판) →
#   전적·티어가 통째로 미매칭. 사람 눈에는 같은 이름으로 보여서 발견이 늦는다.
#
#   ⚠️ 보고만 한다. 고칠 수 있는 곳이 없기 때문이다 —
#   ① 마스터 티어 차트는 클랜이 관리하는 문서라 우리가 손대면 안 된다.
#   ② CLAN_TIERS 는 그 차트를 15분 주기로 upsert(추가·변경만, 삭제 없음) 한 결과물이라,
#      여기서 이름을 바꿔도 다음 주기에 옛 이름이 되살아나 행이 둘로 늘어난다.
#   기준은 CLAN_TIERS 가 아니라 '마스터 차트'다. CLAN_TIERS 에는 과거 오타·탈퇴자 잔재가
#   100행 넘게 쌓여 있어 그걸 기준으로 삼으면 유령을 오류로 보고하게 된다(2026-08-12 실측).
#   또 차트에는 휴면·탈퇴 인원이 섞여 있으므로, '최근 60일 내전 기록이 있는 사람'만 따진다.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * 1'      # 매주 화 05:00 KST — 주간 점검과 같은 리듬

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit tier chart nicknames
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, collections, csv, io

          DOC = "10j2QBdXiyL0_UGKLMDcndieXD7jeMGxVHqH3nj6gJnU"
          MASTER = "1UFuAYsXZGMquChIZY-HGsEbE5fmzk4apgWEwthvpQ44"   # 클랜이 관리하는 시각적 차트(수정 금지)
          CHART_GID = 354094721
          ACTIVE_DAYS = 60        # 이 기간 안에 내전 기록이 있어야 '활동 중'으로 본다

          def csv_chart():
              # 마스터 티어 차트(클랜 관리 문서) — 시각적 격자라 CSV 로 읽어 이름만 긁는다
              u = (f"https://docs.google.com/spreadsheets/d/{MASTER}/gviz/tq"
                   f"?tqx=out:csv&gid={CHART_GID}")
              req = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"})
              rows = list(csv.reader(io.StringIO(
                  urllib.request.urlopen(req, timeout=30).read().decode("utf-8"))))
              out = []
              for r in rows[4:]:
                  for x in r:
                      x = x.strip()
                      if not x or x == "-" or x == "닉네임": continue
                      if "티어" in x or "등급" in x: continue
                      out.append(x)
              return out

          def gviz(tab):
              u = (f"https://docs.google.com/spreadsheets/d/{DOC}/gviz/tq"
                   f"?sheet={urllib.parse.quote(tab)}&headers=1&tqx=out:json")
              req = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"})
              raw = urllib.request.urlopen(req, timeout=30).read().decode("utf-8")
              d = json.loads(raw[raw.find("{"):raw.rfind("}") + 1])
              cols = [c.get("label") or c.get("id") for c in d["table"]["cols"]]
              out = []
              for r in d["table"]["rows"]:
                  out.append({cols[i]: (c.get("v") if c else None) for i, c in enumerate(r["c"])})
              return out

          def nk(s):
              return "".join(str(s or "").split("#")[0].lower().split())

          def jamo(s):
              # 한글 음절 → 초/중/종성. '텍/택'처럼 모음 한 끗 차이를 거리 1로 잡기 위함.
              o = []
              for ch in s:
                  x = ord(ch)
                  if 0xAC00 <= x <= 0xD7A3:
                      b = x - 0xAC00
                      o += [chr(0x1100 + b // 588), chr(0x1161 + (b % 588) // 28)]
                      if b % 28: o.append(chr(0x11A7 + b % 28))
                  else:
                      o.append(ch)
              return "".join(o)

          def lev(a, b, cap=2):
              if abs(len(a) - len(b)) > cap: return cap + 1
              prev = list(range(len(b) + 1))
              for i, ca in enumerate(a, 1):
                  cur = [i] + [0] * len(b)
                  for j, cb in enumerate(b, 1):
                      cur[j] = min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (ca != cb))
                  if min(cur) > cap: return cap + 1
                  prev = cur
              return prev[-1]

          # ── 1. 실제 롤닉 대장 (전적 로그) ──
          import datetime
          play = collections.Counter(); last = {}; disp = {}
          for tab in ("CLASSIC_NORMAL", "KIWI_KIWI"):
              for r in gviz(tab):
                  if str(r.get("결과") or "") not in ("승리", "패배"): continue
                  nm = str(r.get("소환사명") or "").strip()
                  if not nm: continue
                  k = nk(nm)
                  play[k] += 1
                  disp[k] = nm
                  d = str(r.get("날짜") or "")[:10]
                  if len(d) == 10 and (k not in last or d > last[k]): last[k] = d

          today = datetime.date.today()
          def ago(k):
              d = last.get(k)
              if not d: return None
              try: return (today - datetime.date(*map(int, d.split("-")))).days
              except Exception: return None

          alias = set()
          for r in gviz("LINK_ACCOUNT"):
              for v in r.values():
                  if v: alias.add(nk(v))

          chart = csv_chart()
          print(f"마스터 차트 {len(chart)}명 · 전적 로그 고유 롤닉 {len(play)}개 · "
                f"활동 기준 최근 {ACTIVE_DAYS}일\n")

          POOL = [k for k, c in play.items() if c >= 3]
          broken = []
          for nm in chart:
              k = nk(nm)
              if k in play or k in alias: continue
              ja = jamo(k)
              lim = 2 if len(ja) >= 16 else 1        # 짧은 이름은 1글자 차이만(오탐 차단)
              cand = sorted((lev(ja, jamo(x)), x) for x in POOL)
              cand = [c for c in cand if c[0] <= lim]
              # 후보가 하나로 좁혀지고, 그 사람이 '활동 중' 일 때만 진짜 오타로 본다
              if cand and (len(cand) == 1 or cand[0][0] < cand[1][0]):
                  a = ago(cand[0][1])
                  if a is not None and a <= ACTIVE_DAYS:
                      broken.append((nm, cand[0][1], cand[0][0], a))

          print("=" * 78)
          print(f"🔧 오타로 보이는 이름 {len(broken)}건 — 활동 중인 사람인데 차트 표기가 어긋남")
          print("=" * 78)
          if not broken:
              print("  없음 — 차트 표기와 실제 롤닉이 전부 연결됩니다.")
          for nm, k, d, a in sorted(broken, key=lambda b: -play[b[1]]):
              print(f"  차트 '{nm}'  →  실제 롤닉 '{disp[k]}'")
              print(f"      {play[k]}판 · 최근 {last.get(k,'?')} ({a}일 전) · 자모거리 {d}")

          # 활동 중인데 차트에 없는 사람 (신규 가입자 등록 누락)
          cset = {nk(x) for x in chart} | alias
          newbie = [(k, c) for k, c in play.items()
                    if c >= 20 and k not in cset and (ago(k) or 999) <= ACTIVE_DAYS]
          print()
          print("=" * 78)
          print(f"🆕 20판 이상 뛰고 활동 중인데 차트에 없는 롤닉 {len(newbie)}명")
          print("=" * 78)
          if not newbie: print("  없음")
          for k, c in sorted(newbie, key=lambda x: -x[1]):
              print(f"  '{disp[k]}'  {c}판 · 최근 {last.get(k,'?')}")

          print()
          print("─" * 78)
          print("※ 차트에 있으나 전적 로그에 없는 인원은 대부분 휴면·탈퇴자이거나 디스코드 별명으로")
          print("   등록된 경우라 정상입니다. 그래서 '활동 중 + 후보 특정' 인 건만 위에 올립니다.")
          print("※ 마스터 차트는 클랜 관리 문서이므로 우리가 고치지 않습니다. 연결이 꼭 필요하면")
          print("   LINK_ACCOUNT 탭에 '차트이름 ↔ 실제롤닉' 한 줄을 넣으면 코드 수정 없이 이어집니다.")
          PY
