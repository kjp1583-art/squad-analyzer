name: Tier name audit

# 🔤 내부티어 차트의 닉네임 ↔ 실제 롤닉 불일치 감사
#
#   왜 필요한가: CLAN_TIERS 의 닉네임은 tnorm(닉) 키로 티어 조회에 쓰이는데(분석기 tier_of ·
#   웹 tierOf · 봇 _scrim_tiers), 차트 표기가 실제 롤닉과 한 글자라도 다르면 그 사람은
#   '티어 미보유'로 조용히 떨어진다. 실제 사고: 차트 '텍스' ↔ 롤닉 '택 스#tax'(27판) →
#   전적·티어가 통째로 미매칭. 사람 눈에는 같은 이름으로 보여서 발견이 늦는다.
#
#   ⚠️ 이 워크플로는 고치지 않고 '보고만' 한다. CLAN_TIERS 를 직접 고치면 안 되기 때문 —
#   호스트 분석기가 마스터 티어 차트(별도 시트)를 15분 주기로 upsert(추가·변경만, 삭제 없음)
#   하므로, 여기서 이름을 바꿔도 다음 주기에 옛 이름이 되살아나 행이 둘로 늘어난다.
#   → 고칠 곳은 마스터 차트다. 거기만 고치면 15분 안에 CLAN_TIERS·분석기·웹·봇이 전부 따라온다.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * 1'      # 매주 화 05:00 KST — 주간 점검과 같은 리듬

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit tier chart nicknames
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, collections, csv, io

          DOC = "10j2QBdXiyL0_UGKLMDcndieXD7jeMGxVHqH3nj6gJnU"
          MASTER = "1UFuAYsXZGMquChIZY-HGsEbE5fmzk4apgWEwthvpQ44"   # 사장님이 직접 편집하는 시각적 차트

          def gviz(tab):
              u = (f"https://docs.google.com/spreadsheets/d/{DOC}/gviz/tq"
                   f"?sheet={urllib.parse.quote(tab)}&headers=1&tqx=out:json")
              req = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"})
              raw = urllib.request.urlopen(req, timeout=30).read().decode("utf-8")
              d = json.loads(raw[raw.find("{"):raw.rfind("}") + 1])
              cols = [c.get("label") or c.get("id") for c in d["table"]["cols"]]
              out = []
              for r in d["table"]["rows"]:
                  out.append({cols[i]: (c.get("v") if c else None) for i, c in enumerate(r["c"])})
              return out

          def nk(s):
              return "".join(str(s or "").split("#")[0].lower().split())

          def jamo(s):
              # 한글 음절 → 초/중/종성. '텍/택'처럼 모음 한 끗 차이를 거리 1로 잡기 위함.
              o = []
              for ch in s:
                  x = ord(ch)
                  if 0xAC00 <= x <= 0xD7A3:
                      b = x - 0xAC00
                      o += [chr(0x1100 + b // 588), chr(0x1161 + (b % 588) // 28)]
                      if b % 28: o.append(chr(0x11A7 + b % 28))
                  else:
                      o.append(ch)
              return "".join(o)

          def lev(a, b, cap=2):
              if abs(len(a) - len(b)) > cap: return cap + 1
              prev = list(range(len(b) + 1))
              for i, ca in enumerate(a, 1):
                  cur = [i] + [0] * len(b)
                  for j, cb in enumerate(b, 1):
                      cur[j] = min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (ca != cb))
                  if min(cur) > cap: return cap + 1
                  prev = cur
              return prev[-1]

          # ── 1. 실제 롤닉 대장 (전적 로그) ──
          play = collections.Counter(); last = {}; disp = {}
          for tab in ("CLASSIC_NORMAL", "KIWI_KIWI"):
              for r in gviz(tab):
                  if str(r.get("결과") or "") not in ("승리", "패배"): continue
                  nm = str(r.get("소환사명") or "").strip()
                  if not nm: continue
                  k = nk(nm)
                  play[k] += 1
                  disp[k] = nm
                  d = str(r.get("날짜") or "")[:10]
                  if k not in last or d > last[k]: last[k] = d

          # ── 2. 별칭(LINK_ACCOUNT)은 이미 연결된 것으로 본다 ──
          alias = set()
          for r in gviz("LINK_ACCOUNT"):
              for v in r.values():
                  if v: alias.add(nk(v))

          tiers = [(str(r.get("닉네임") or "").strip(), str(r.get("티어") or "").strip())
                   for r in gviz("CLAN_TIERS") if r.get("닉네임")]
          print(f"CLAN_TIERS {len(tiers)}명 · 전적 로그 고유 롤닉 {len(play)}개\n")

          POOL = [k for k, c in play.items() if c >= 3]
          bad = []
          for nm, ti in tiers:
              k = nk(nm)
              if k in play or k in alias: continue
              ja = jamo(k)
              lim = 2 if len(ja) >= 16 else 1        # 짧은 이름은 1글자 차이만(오탐 차단)
              cand = sorted((lev(ja, jamo(x)), x) for x in POOL)
              cand = [c for c in cand if c[0] <= lim]
              bad.append((nm, ti, cand[:2]))

          sure = [b for b in bad if len(b[2]) == 1 or (len(b[2]) > 1 and b[2][0][0] < b[2][1][0])]
          none = [b for b in bad if b not in sure]
          print("=" * 78)
          print(f"🔧 마스터 차트에서 고쳐야 할 이름 {len(sure)}건 — 유력 후보가 특정됨")
          print("=" * 78)
          for nm, ti, cand in sorted(sure, key=lambda b: -play[b[2][0][1]]):
              d, k = cand[0]
              print(f"  차트 '{nm}' ({ti}티어)  →  실제 롤닉 '{disp[k]}'")
              print(f"      근거: {play[k]}판 · 최근 {last.get(k,'?')} · 자모거리 {d}")
          print()
          print("=" * 78)
          print(f"❓ 후보를 못 찾음 {len(none)}건 — 롤닉이 완전히 다르거나 내전 기록이 없음")
          print("=" * 78)
          for nm, ti, _ in none:
              print(f"  차트 '{nm}' ({ti}티어) — 전적 로그에 대응하는 이름 없음")

          # ── 3. 반대 방향: 많이 뛰는데 티어가 없는 사람 ──
          tset = {nk(n) for n, _ in tiers} | alias
          orphan = [(k, c) for k, c in play.items() if c >= 20 and k not in tset]
          print()
          print("=" * 78)
          print(f"🆕 20판 이상 뛰는데 티어 차트에 없는 롤닉 {len(orphan)}명")
          print("=" * 78)
          for k, c in sorted(orphan, key=lambda x: -x[1]):
              print(f"  '{disp[k]}'  {c}판 · 최근 {last.get(k,'?')}")

          print()
          print("─" * 78)
          print("※ 고칠 곳은 CLAN_TIERS 가 아니라 마스터 티어 차트입니다.")
          print(f"   https://docs.google.com/spreadsheets/d/{MASTER}/edit")
          print("   호스트 분석기가 15분 주기로 마스터 차트 → CLAN_TIERS 를 upsert(추가·변경만) 하므로,")
          print("   CLAN_TIERS 를 직접 고치면 다음 주기에 옛 이름이 되살아나 행이 둘로 늘어납니다.")
          print("   마스터 차트만 고치면 15분 안에 분석기·웹·봇의 티어 조회가 전부 정상화됩니다.")
          PY
