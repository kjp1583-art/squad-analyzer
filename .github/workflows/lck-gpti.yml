name: LCK GPTI

# LCK 선수 지표(gol.gg)를 받아 GPTI 성향유형을 산출 → ai-eval-data 브랜치 lck_gpti.json.
# 웹은 이 파일을 읽어 GPTI 도감의 'LCK 프로' 칸과 '내 유형과 같은 프로'를 보여준다.
on:
  workflow_dispatch:
    inputs:
      splits:
        description: '스플릿 우선순위 (쉼표)'
        required: false
        default: 'Summer,Spring'
      season:
        description: '시즌'
        required: false
        default: 'S16'
      probe:
        description: "구조 확인만 (yes 면 lck_probe.txt 만 생성)"
        required: false
        default: 'no'
  schedule:
    - cron: '40 20 * * 1'      # 매주 화요일 05:40 KST

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet lxml

      - name: Probe (structure dump)
        if: ${{ inputs.probe == 'yes' }}
        run: python tooling/lck_probe.py

      - name: Build lck_gpti.json
        if: ${{ inputs.probe != 'yes' }}
        env:
          LCK_SPLITS: ${{ inputs.splits || 'Summer,Spring' }}
          LCK_SEASON: ${{ inputs.season || 'S16' }}
        run: python tooling/lck_gpti.py

      - name: Commit to ai-eval-data
        run: |
          F=lck_gpti.json; [ "${{ inputs.probe }}" = "yes" ] && F=lck_probe.txt
          test -s "$F" || { echo "결과 파일이 비었다 — 커밋하지 않음"; exit 1; }
          cp "$F" /tmp/out
          rm -f "$F"                       # 브랜치 전환 시 추적 안 된 파일과 충돌하지 않게
          git fetch origin ai-eval-data
          git checkout -B ai-eval-data origin/ai-eval-data
          cp /tmp/out "$F"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$F"
          git diff --cached --quiet || { git commit -m "data: $F"; git push origin ai-eval-data; }
