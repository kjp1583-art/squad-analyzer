name: Dedupe duplicate games

# 같은 판이 두 번 기록된 행을 CLASSIC_NORMAL에서 정리한다.
# 기본은 미리보기(삭제 안 함). apply=true 로 실행할 때만 실제로 지운다.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: '실제로 삭제 (체크 안 하면 미리보기만)'
        type: boolean
        default: false

jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet gspread oauth2client
      - name: Run
        env:
          CREDENTIALS_JSON_B64: ${{ secrets.CREDENTIALS_JSON_B64 }}
          APPLY: ${{ inputs.apply && '1' || '0' }}
        run: |
          python tooling/dedupe_games.py
          rm -f creds.json
