name: Fix metrics-pack minutes

# 지표 팩의 m 이 분당 CS 로 기록된 판을 진짜 게임 시간(분)으로 되돌린다(2026-10-10 사장님 지시 「시트 원본도 고쳐줘」 — 명예의 전당 DPM 제보).
# 2026-09-19·22 다섯 판 50행이 대상이며 판정은 보수적이다(애매하면 고치지 않고 목록만 남김). 자세한 근거는 tooling/fix_pack_minutes.py 머리말.
# 기본은 미리보기(로그에 고칠 행·보류·BACKUP_JSON 이 찍힌다). apply=true 일 때만 실제로 시트를 고친다. 로그에는 닉네임·PUUID 를 찍지 않는다.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: '실제로 수정 (체크 안 하면 미리보기만)'
        type: boolean
        default: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet gspread oauth2client
      - name: Test the tool (fake sheet)
        run: python tests/fix_pack_minutes_test.py
      - name: Run
        env:
          CREDENTIALS_JSON_B64: ${{ secrets.CREDENTIALS_JSON_B64 }}
          APPLY: ${{ inputs.apply && '1' || '0' }}
        run: |
          python tooling/fix_pack_minutes.py
          rm -f creds.json
