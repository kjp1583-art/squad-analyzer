name: LCK API probe

# 봇의 [lck] 일정 조회 403 추적.
#
# 1차(2026-08-05): esports-api.lolesports.com 8개 조합 전부 403. 키를 빼도 403.
# 2차: 403 정체 = CloudFront/API Gateway 의 `x-amzn-ErrorType: ForbiddenException`,
#      본문 {"message":"Forbidden"}. 봇 IP 차단이 아니라 그 API 자체가 닫힌 것.
#      lolesports.com 첫 화면과 ddragon 은 정상 → 네트워크 문제 아님.
# 3차: ① 현재 lolesports.com 이 실제로 부르는 API 주소를 페이지에서 추출
#      ② Leaguepedia(Fandom) Cargo 로 LCK 일정·결과를 뽑을 수 있는지 확정
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import urllib.request, urllib.error, urllib.parse as up, json, re, collections

          BROWSER = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                     "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36")

          def fetch(url, hd=None, timeout=30):
              req = urllib.request.Request(url, headers=hd or {"User-Agent": BROWSER})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")
              except Exception as e:
                  return None, f"{type(e).__name__} {e}"

          print("## 1. lolesports.com 이 지금 부르는 API 주소\n")
          st, html = fetch("https://lolesports.com/")
          hosts = collections.Counter(re.findall(r"https://([a-z0-9.-]*(?:api|gql|graph|feed)[a-z0-9.-]*\.[a-z]{2,})", html))
          if hosts:
              for h, n in hosts.most_common(12):
                  print(f"- `{h}` ×{n}")
          else:
              print("- (페이지 HTML 에서 API 호스트를 못 찾음 — 스크립트 안에 숨어 있을 수 있음)")
          keys = set(re.findall(r"[\"']([0-9A-Za-z]{30,44})[\"']", html))
          print(f"\n- 40자 안팎 키 후보 {len(keys)}개" + (f": `{list(keys)[:3]}`" if keys else ""))

          print("\n## 2. Leaguepedia(Fandom) Cargo — LCK 이름 확인\n")
          def cargo(**kw):
              q = {"action": "cargoquery", "format": "json", "limit": "30"}
              q.update(kw)
              st, body = fetch("https://lol.fandom.com/api.php?" + up.urlencode(q))
              try:
                  return st, json.loads(body).get("cargoquery") or []
              except Exception:
                  return st, []

          st, rows = cargo(tables="Tournaments",
                           fields="Tournaments.League,Tournaments.OverviewPage,Tournaments.DateStart",
                           where="Tournaments.OverviewPage LIKE 'LCK/2026%'",
                           order_by="Tournaments.DateStart DESC")
          print(f"- LCK/2026 대회 {len(rows)}건 (상태 {st})")
          for r in rows[:6]:
              t = r["title"]
              print(f"  - `{t.get('OverviewPage')}` · League=`{t.get('League')}` · 시작 {t.get('DateStart')}")

          print("\n## 3. 그 대회의 실제 경기 일정\n")
          page = rows[0]["title"]["OverviewPage"] if rows else "LCK/2026 Season/Summer Season"
          st, ms = cargo(tables="MatchSchedule",
                         fields=("MatchSchedule.Team1,MatchSchedule.Team2,MatchSchedule.DateTime_UTC,"
                                 "MatchSchedule.BestOf,MatchSchedule.Winner,MatchSchedule.MatchId,"
                                 "MatchSchedule.Team1Score,MatchSchedule.Team2Score"),
                         where=f"MatchSchedule.OverviewPage='{page}'",
                         order_by="MatchSchedule.DateTime_UTC DESC")
          print(f"- `{page}` 경기 {len(ms)}건 (상태 {st})")
          print("\n| 일시(UTC) | 대진 | BO | 결과 |")
          print("|---|---|---|---|")
          for r in ms[:8]:
              t = r["title"]
              w = t.get("Winner") or ""
              res = f"{t.get('Team1Score','')}-{t.get('Team2Score','')}" + (f" (승 {w})" if w else " (예정)")
              print(f"| {t.get('DateTime UTC') or t.get('DateTime_UTC')} | {t.get('Team1')} vs {t.get('Team2')} | {t.get('BestOf')} | {res} |")
          PY
