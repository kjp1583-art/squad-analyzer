name: LCK API probe

# 봇의 [lck] 일정 조회 403 추적.
#
# 1차: esports-api.lolesports.com 8개 조합 전부 403 (키를 빼도 403).
# 2차: 403 정체 = CloudFront/API Gateway `ForbiddenException` — API 자체가 닫힘.
# 3~4차: lolesports.com 은 클라이언트 렌더라 HTML 에 일정 데이터가 없다(__NEXT_DATA__ 없음).
#        Leaguepedia 0건은 쿼리 문제가 아니라 `ratelimited` — 공용 러너 IP 라 더 잘 걸린다.
# 5차: 정식 User-Agent + 재시도로 Leaguepedia 에서 LCK 일정·결과를 실제로 뽑아본다.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import urllib.request, urllib.error, urllib.parse as up, json, time

          # Fandom 은 '무엇을 하는 누구인지' 밝히는 UA 를 요구한다(익명 UA 는 강하게 제한).
          UA = "squad-gg-bot/1.0 (https://github.com/kjp1583-art/squad-naejeon-bot; LCK schedule for a private clan Discord bot)"

          def cargo(tries=4, **kw):
              q = {"action": "cargoquery", "format": "json", "limit": "20"}
              q.update(kw)
              url = "https://lol.fandom.com/api.php?" + up.urlencode(q)
              for i in range(tries):
                  req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "application/json"})
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          body = r.read().decode("utf-8", "replace")
                      d = json.loads(body)
                      if "cargoquery" in d:
                          return d["cargoquery"], None
                      err = (d.get("error") or {}).get("code") or body[:120]
                      if err == "ratelimited" and i < tries - 1:
                          time.sleep(12); continue
                      return None, err
                  except Exception as e:
                      if i < tries - 1: time.sleep(12); continue
                      return None, f"{type(e).__name__} {e}"
              return None, "재시도 소진"

          def show(label, **kw):
              rows, err = cargo(**kw)
              if err:
                  print(f"- **{label}** → ❌ `{err}`"); return []
              print(f"- **{label}** → ✅ {len(rows)}건")
              for r in rows[:5]:
                  print(f"  - `{json.dumps(r['title'], ensure_ascii=False)[:200]}`")
              time.sleep(4)
              return rows

          print("## 1. LCK 라는 이름을 어떻게 쓰는지 역추적\n")
          show("T1 최근 경기(여기서 대회 이름을 얻는다)",
               tables="MatchSchedule",
               fields="MatchSchedule.OverviewPage,MatchSchedule.Team1,MatchSchedule.Team2,MatchSchedule.DateTime_UTC,MatchSchedule.Winner,MatchSchedule.BestOf",
               where='MatchSchedule.Team1="T1" OR MatchSchedule.Team2="T1"',
               order_by="MatchSchedule.DateTime_UTC DESC", limit="5")

          show("OverviewPage 가 LCK 로 시작하는 대회",
               tables="Tournaments", fields="Tournaments.OverviewPage,Tournaments.League,Tournaments.DateStart",
               where='Tournaments.OverviewPage LIKE "LCK/%"',
               order_by="Tournaments.DateStart DESC", limit="5")

          show("League 에 LCK 가 들어가는 대회",
               tables="Tournaments", fields="Tournaments.OverviewPage,Tournaments.League,Tournaments.DateStart",
               where='Tournaments.League LIKE "%LCK%"',
               order_by="Tournaments.DateStart DESC", limit="5")

          show("Region 이 Korea 인 대회",
               tables="Tournaments", fields="Tournaments.OverviewPage,Tournaments.League,Tournaments.Region,Tournaments.DateStart",
               where='Tournaments.Region="Korea"',
               order_by="Tournaments.DateStart DESC", limit="5")
          PY
