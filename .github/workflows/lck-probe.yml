name: LCK probe
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install --quiet lxml
      - name: gol.gg 필터 폼·대회명·팀 확인
        run: |
          python3 - <<'PY'
          import re, urllib.parse, urllib.request
          from lxml import html as LH
          UA={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36"}
          def get(url, data=None):
              h=dict(UA)
              if data is not None:
                  h["Content-Type"]="application/x-www-form-urlencoded"
                  data=urllib.parse.urlencode(data, doseq=True).encode()
              try:
                  return urllib.request.urlopen(urllib.request.Request(url,data=data,headers=h),timeout=40).read()
              except Exception as e:
                  print("  실패", type(e).__name__, e); return None

          BASE="https://gol.gg/players/list/season-S16/split-Summer/tournament-ALL/"
          raw=get(BASE)
          doc=LH.fromstring(raw)
          print("=== FilterForm 입력값")
          for f in doc.xpath("//form"):
              print("  form action=", f.get("action"), "method=", f.get("method"), "id=", f.get("id"))
              for inp in f.xpath(".//input|.//select"):
                  print("     ", inp.tag, "name=", inp.get("name"), "type=", inp.get("type"),
                        "value=", (inp.get("value") or "")[:40], "id=", inp.get("id"))

          print("\n=== 대회 목록에서 LCK 찾기")
          r=get("https://gol.gg/tournament/list/")
          if r:
              d=LH.fromstring(r)
              hrefs=[a.get("href","") for a in d.xpath("//a")]
              lck=[h for h in hrefs if "LCK" in urllib.parse.unquote(h)]
              print("  LCK href:", lck[:20])
              names=sorted({urllib.parse.unquote(h).split("tournament-stats/")[-1].strip("/") for h in lck if "tournament-stats" in h})
              print("  LCK 대회명:", names[:20])

          print("\n=== 팀 목록(S16 Summer)")
          r=get("https://gol.gg/teams/list/season-S16/split-Summer/tournament-ALL/")
          if r:
              d=LH.fromstring(r)
              trs=d.xpath("//table//tr")
              print("  행수", len(trs))
              print("  컬럼", [t.text_content().strip() for t in d.xpath("//table//th")][:12])
              for tr in trs[1:5]:
                  print("   ", [c.text_content().strip() for c in tr.xpath("./td")][:6],
                        [a.get("href") for a in tr.xpath(".//a")][:2])
          PY
