name: lck-probe
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install --quiet lxml
      - name: gol.gg 컬럼 확인
        run: |
          python3 - <<'PY'
          import re, urllib.request
          from lxml import html as LH
          UA={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36"}
          for url in ["https://gol.gg/players/list/season-S16/split-Summer/tournament-ALL/",
                      "https://gol.gg/players/list/season-S15/split-Summer/tournament-ALL/"]:
              try:
                  raw=urllib.request.urlopen(urllib.request.Request(url,headers=UA),timeout=30).read()
              except Exception as e:
                  print(url,"실패",type(e).__name__); continue
              doc=LH.fromstring(raw)
              ths=[t.text_content().strip() for t in doc.xpath("//table//th")]
              trs=doc.xpath("//table//tr")
              print("\n===",url)
              print("  컬럼:",ths[:20])
              print("  행수:",len(trs))
              for tr in trs[1:4]:
                  print("   ",[c.text_content().strip() for c in tr.xpath("./td")][:16])
          PY
