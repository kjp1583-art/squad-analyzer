name: LCK probe
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: LoL Esports API 도달·형식 확인
        run: |
          python3 - <<'PY'
          import json, urllib.request
          KEY = "0TvQnueqKa5mxJntVWt0w4LpLfEkrV1Ta8rQBb9Z"   # 공개 프론트엔드 키
          H = {"x-api-key": KEY, "User-Agent": "squad-bot/1.0"}
          def get(url):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=H), timeout=30) as r:
                      return json.loads(r.read().decode())
              except Exception as e:
                  print("  실패", type(e).__name__, e); return None

          B = "https://esports-api.lolesports.com/persisted/gw"
          print("=== 리그 목록")
          d = get(f"{B}/getLeagues?hl=ko-KR")
          lck = None
          for l in ((d or {}).get("data", {}).get("leagues") or []):
              if l.get("slug") in ("lck", "lck_challengers_league"):
                  print("  ", l.get("id"), l.get("slug"), l.get("name"), l.get("region"))
                  if l.get("slug") == "lck": lck = l.get("id")
          if not lck: print("  LCK 를 못 찾음"); raise SystemExit(0)

          print("\n=== 일정 (최근/예정)")
          d = get(f"{B}/getSchedule?hl=ko-KR&leagueId={lck}")
          ev = ((d or {}).get("data", {}).get("schedule") or {}).get("events") or []
          print("  이벤트", len(ev))
          for e in ev[-8:]:
              m = e.get("match") or {}
              teams = [(t.get("code"), (t.get("result") or {}).get("gameWins")) for t in (m.get("teams") or [])]
              print("  ", e.get("startTime"), e.get("state"), e.get("blockName"),
                    "| BO%s" % ((m.get("strategy") or {}).get("count")), teams, "| matchId", m.get("id"))

          print("\n=== 진행 중")
          d = get(f"{B}/getLive?hl=ko-KR")
          for e in ((d or {}).get("data", {}).get("schedule") or {}).get("events") or []:
              lg = (e.get("league") or {}).get("slug")
              print("  ", lg, e.get("state"), [(t.get("code")) for t in ((e.get("match") or {}).get("teams") or [])])

          # 종료된 경기 결과 형식
          done = [e for e in ev if e.get("state") == "completed"]
          if done:
              e = done[-1]; m = e.get("match") or {}
              print("\n=== 종료 경기 결과 형식")
              print("  ", json.dumps({"startTime": e.get("startTime"), "state": e.get("state"),
                                      "teams": m.get("teams")}, ensure_ascii=False)[:700])
          PY
