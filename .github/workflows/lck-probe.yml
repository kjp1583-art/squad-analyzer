name: LCK probe
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install --quiet lxml
      - name: LCK 필터 POST + T1 로스터
        run: |
          python3 - <<'PY'
          import urllib.parse, urllib.request
          from lxml import html as LH
          UA={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36"}
          def post(url, data):
              h=dict(UA); h["Content-Type"]="application/x-www-form-urlencoded"
              body=urllib.parse.urlencode(data, doseq=True).encode()
              return urllib.request.urlopen(urllib.request.Request(url,data=body,headers=h),timeout=40).read()
          def get(url):
              return urllib.request.urlopen(urllib.request.Request(url,headers=UA),timeout=40).read()

          for split in ("Summer","Spring"):
            URL=f"https://gol.gg/players/list/season-S16/split-{split}/tournament-ALL/"
            for role in ("TOP","SUPPORT"):
                try:
                    raw=post(URL, {"cbtournament":"ALL","role":role,"leaguePost":"true","leagueFilter[]":["LCK"]})
                except Exception as e:
                    print(split, role, "실패", type(e).__name__, e); continue
                d=LH.fromstring(raw)
                trs=[tr for tr in d.xpath("//table//tr") if tr.xpath("./td/a[contains(@href,'player-stats')]")]
                print(f"\n=== {split} {role} → 선수 {len(trs)}명")
                for tr in trs[:4]:
                    tds=[c.text_content().strip() for c in tr.xpath("./td")]
                    print("   ", tds)
                if trs:
                    print("   컬럼:", [t.text_content().strip() for t in d.xpath("//table//th")])

          print("\n=== LCK 팀 목록에서 T1 찾기")
          raw=post("https://gol.gg/teams/list/season-S16/split-Summer/tournament-ALL/",
                   {"cbtournament":"ALL","leaguePost":"true","leagueFilter[]":["LCK"]})
          d=LH.fromstring(raw)
          for tr in d.xpath("//table//tr"):
              a=tr.xpath("./td/a[contains(@href,'team-stats')]")
              if not a: continue
              nm=a[0].text_content().strip()
              print("  ", nm, a[0].get("href"))
              if nm.upper()=="T1":
                  href=a[0].get("href").replace("./","https://gol.gg/teams/")
                  print("   → T1 페이지:", href)
                  t=LH.fromstring(get(href))
                  print("   T1 선수 링크:", [(x.text_content().strip(), x.get('href')) for x in t.xpath("//a[contains(@href,'player-stats')]")][:12])
          PY
