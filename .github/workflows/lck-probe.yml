name: LCK API probe

# 봇이 [lck] 일정 조회 실패(403) 를 뱉을 때, 어떤 주소·헤더 조합이면 살아나는지 확인한다.
# (개발 컨테이너에서는 이 호스트가 프록시에 막혀 직접 확인이 안 된다)
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import urllib.request, json
          KEY = "0TvQnueqKa5mxJntVWt0w4LpLfEkrV1Ta8rQBb9Z"
          API = "https://esports-api.lolesports.com/persisted/gw"
          LCK = "98767991310872058"
          BROWSER = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                     "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36")
          cases = [
            ("① 현재 봇과 동일", f"{API}/getSchedule?hl=ko-KR&leagueId={LCK}",
             {"x-api-key": KEY, "User-Agent": "squad-bot/1.0"}),
            ("② 브라우저 UA", f"{API}/getSchedule?hl=ko-KR&leagueId={LCK}",
             {"x-api-key": KEY, "User-Agent": BROWSER}),
            ("③ 브라우저 UA + Origin/Referer", f"{API}/getSchedule?hl=ko-KR&leagueId={LCK}",
             {"x-api-key": KEY, "User-Agent": BROWSER, "Origin": "https://lolesports.com",
              "Referer": "https://lolesports.com/", "Accept": "application/json"}),
            ("④ hl=en-US", f"{API}/getSchedule?hl=en-US&leagueId={LCK}",
             {"x-api-key": KEY, "User-Agent": BROWSER}),
            ("⑤ leagueId 없이 전체 일정", f"{API}/getSchedule?hl=en-US",
             {"x-api-key": KEY, "User-Agent": BROWSER}),
            ("⑥ getLeagues", f"{API}/getLeagues?hl=en-US",
             {"x-api-key": KEY, "User-Agent": BROWSER}),
            ("⑦ getLive", f"{API}/getLive?hl=en-US",
             {"x-api-key": KEY, "User-Agent": BROWSER}),
            ("⑧ 키 없이", f"{API}/getSchedule?hl=en-US&leagueId={LCK}",
             {"User-Agent": BROWSER}),
          ]
          print("| 조합 | 결과 | 비고 |")
          print("|---|---|---|")
          for name, url, hd in cases:
              try:
                  req = urllib.request.Request(url, headers=hd)
                  with urllib.request.urlopen(req, timeout=25) as r:
                      body = r.read().decode("utf-8", "replace")
                  d = json.loads(body)
                  ev = (((d or {}).get("data") or {}).get("schedule") or {}).get("events") or []
                  lg = (((d or {}).get("data") or {}).get("leagues") or [])
                  note = f"경기 {len(ev)}건" if ev else (f"리그 {len(lg)}개" if lg else f"본문 {len(body)}B")
                  print(f"| {name} | ✅ 200 | {note} |")
              except Exception as e:
                  print(f"| {name} | ❌ | `{type(e).__name__} {e}` |")
          PY
