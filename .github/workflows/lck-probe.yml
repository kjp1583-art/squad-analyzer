name: LCK API probe

# 봇의 [lck] 일정 조회 403 추적.
#
# 1차: esports-api.lolesports.com 8개 조합 전부 403 (키를 빼도 403).
# 2차: 403 정체 = CloudFront/API Gateway `ForbiddenException` — API 자체가 닫힘.
#      lolesports.com 첫 화면·ddragon 은 정상 → 네트워크·IP 문제 아님.
# 3차: 페이지에서 API 호스트는 안 잡혔고, 30자 문자열 하나가 나왔다
#      (`giabiihe129qbd3mvcocnl10keykmh` — Next.js buildId 형태).
# 4차: ① __NEXT_DATA__ / _next/data 경로로 일정 JSON 을 받을 수 있는지
#      ② Leaguepedia 가 왜 0건인지(원문 확인)
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import urllib.request, urllib.error, urllib.parse as up, json, re

          BROWSER = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                     "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36")

          def fetch(url, hd=None, timeout=30):
              h = {"User-Agent": BROWSER}
              h.update(hd or {})
              req = urllib.request.Request(url, headers=h)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")
              except Exception as e:
                  return None, f"{type(e).__name__} {e}"

          print("## 1. lolesports.com 내부 데이터\n")
          st, html = fetch("https://lolesports.com/en-us/schedule")
          print(f"- /en-us/schedule 상태 `{st}` · 본문 {len(html)}B")
          bid = re.search(r'"buildId":"([^"]+)"', html)
          print(f"- buildId: `{bid.group(1) if bid else '못 찾음'}`")
          nd = re.search(r'id="__NEXT_DATA__"[^>]*>(\{.*?\})</script>', html, re.S)
          if nd:
              try:
                  data = json.loads(nd.group(1))
                  props = (data.get("props") or {}).get("pageProps") or {}
                  print(f"- __NEXT_DATA__ pageProps 키: `{list(props.keys())[:12]}`")
                  blob = json.dumps(props, ensure_ascii=False)
                  print(f"- pageProps 크기 {len(blob)}B · 'LCK' 등장 {blob.count('LCK')}회")
              except Exception as e:
                  print(f"- __NEXT_DATA__ 파싱 실패: `{e}`")
          else:
              print("- __NEXT_DATA__ 없음")

          if bid:
              print("\n| _next/data 경로 | 결과 | 비고 |")
              print("|---|---|---|")
              for path in ("en-us/schedule.json", "ko-kr/schedule.json", "en-us.json"):
                  u = f"https://lolesports.com/_next/data/{bid.group(1)}/{path}"
                  st, body = fetch(u)
                  ok = st == 200 and body.lstrip().startswith("{")
                  note = f"{len(body)}B · 'LCK' {body.count('LCK')}회" if ok else (body or "")[:90]
                  print(f"| `{path}` | {'✅' if ok else '❌'} {st} | {note} |")

          print("\n## 2. Leaguepedia 원문 확인\n")
          q = {"action": "cargoquery", "format": "json", "limit": "3",
               "tables": "Tournaments", "fields": "Tournaments.OverviewPage,Tournaments.League",
               "where": "Tournaments.League LIKE '%Champions Korea%'"}
          st, body = fetch("https://lol.fandom.com/api.php?" + up.urlencode(q),
                           {"Accept": "application/json"})
          print(f"- 상태 `{st}`\n\n```\n{body[:700]}\n```")
          PY
