name: Analyzer build & release

# desktop/ 소스를 Windows에서 PyInstaller로 빌드 → GitHub Release 게시 → version.txt 갱신.
# 기존 PC 빌드와 동일하게 무서명. 비밀값은 GitHub Secrets에서 빌드 시점에만 생성.
# 필요 Secrets: CREDENTIALS_JSON_B64, DISCORD_WEBHOOK_URL, PATCH_WEBHOOK_URL, DISCORD_IPC_CLIENT_ID
on:
  workflow_dispatch:
    inputs:
      version:
        description: '버전 (예: 82.47)'
        required: true

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          allow-prereleases: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.21.0

      - name: Write credentials.json.json
        shell: pwsh
        env:
          CREDENTIALS_JSON_B64: ${{ secrets.CREDENTIALS_JSON_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CREDENTIALS_JSON_B64)) { throw "CREDENTIALS_JSON_B64 secret missing" }
          [IO.File]::WriteAllBytes("$PWD/credentials.json.json", [Convert]::FromBase64String($env:CREDENTIALS_JSON_B64))

      - name: Write app_secrets.py
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PATCH_WEBHOOK_URL: ${{ secrets.PATCH_WEBHOOK_URL }}
          DISCORD_IPC_CLIENT_ID: ${{ secrets.DISCORD_IPC_CLIENT_ID }}
        run: |
          @"
          DISCORD_WEBHOOK_URL = "$env:DISCORD_WEBHOOK_URL"
          PATCH_WEBHOOK_URL = "$env:PATCH_WEBHOOK_URL"
          DISCORD_IPC_CLIENT_ID = "$env:DISCORD_IPC_CLIENT_ID"
          "@ | Out-File -FilePath app_secrets.py -Encoding utf8

      - name: Sync CURRENT_VERSION in source
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          (Get-Content squad_analyzer.py -Raw) -replace 'CURRENT_VERSION = "[^"]*"', "CURRENT_VERSION = `"$v`"" |
            Set-Content squad_analyzer.py -Encoding utf8

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm squad_analyzer.spec

      - name: Stage release assets
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/squad_analyzer.exe")) { throw "dist/squad_analyzer.exe not found" }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "dist/squad_analyzer.exe" "release/squad_analyzer.exe"
          Compress-Archive -Path "dist/squad_analyzer.exe" -DestinationPath "release/squad_analyzer.zip" -Force
          $h = (Get-FileHash "release/squad_analyzer.exe" -Algorithm SHA256).Hash
          "SHA256: $h" | Out-File -FilePath release/notes.txt -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: v${{ github.event.inputs.version }}
          body_path: desktop/release/notes.txt
          files: |
            desktop/release/squad_analyzer.exe
            desktop/release/squad_analyzer.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version.txt on main
        shell: pwsh
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git pull origin main
          "${{ github.event.inputs.version }}" | Out-File -FilePath version.txt -Encoding ascii -NoNewline
          git add version.txt
          if (git status --porcelain version.txt) {
            git commit -m "ci: bump version.txt to ${{ github.event.inputs.version }}"
            git push origin main
          } else { Write-Host "version.txt unchanged" }
