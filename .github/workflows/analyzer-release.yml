name: Analyzer build & release

# desktop/ 소스를 Windows에서 PyInstaller로 빌드 → GitHub Release 게시 → version.txt 갱신.
# 기존 PC 빌드와 동일하게 무서명. 비밀값은 GitHub Secrets에서 빌드 시점에만 생성.
# 필요 Secrets(2개): APP_SECRETS_B64 (app_secrets.py 전체 base64), CREDENTIALS_JSON_B64
on:
  workflow_dispatch:
    inputs:
      version:
        description: '버전 (예: 82.47)'
        required: true
      notes:
        description: '패치노트 (디스코드 패치노트 채널에 그대로 발송됨. 줄바꿈은 \n)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # ⚠️ 정확 버전 고정. '3.14'로 두면 러너가 최신 패치로 떠서 빌드가 조용히 바뀐다 —
          #    3.14.7은 Tcl/Tk 9(zipfs 내장 경로)라 PyInstaller 6.21이 Tcl 데이터를 통째로 빠뜨렸고,
          #    v83.5가 "성공"으로 릴리스됐지만 실행 즉시 죽었다(2026-08-16 사장님 제보).
          #    올릴 때는 PyInstaller의 Tcl9 지원을 확인하고 아래 _tcl_data 게이트로 검증할 것.
          python-version: '3.14.6' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.21.0

      - name: Write secret files
        shell: pwsh
        env:
          CREDENTIALS_JSON_B64: ${{ secrets.CREDENTIALS_JSON_B64 }}
          APP_SECRETS_B64: ${{ secrets.APP_SECRETS_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CREDENTIALS_JSON_B64)) { throw "CREDENTIALS_JSON_B64 secret missing" }
          if ([string]::IsNullOrWhiteSpace($env:APP_SECRETS_B64)) { throw "APP_SECRETS_B64 secret missing" }
          # 붙여넣기 중 섞인 공백·줄바꿈 제거 후 디코드 (등록 실수 방어)
          $cred = ($env:CREDENTIALS_JSON_B64 -replace '\s','')
          $apps = ($env:APP_SECRETS_B64 -replace '\s','')
          [IO.File]::WriteAllBytes("$PWD/credentials.json.json", [Convert]::FromBase64String($cred))
          [IO.File]::WriteAllBytes("$PWD/app_secrets.py", [Convert]::FromBase64String($apps))

      - name: Sync CURRENT_VERSION in source
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          (Get-Content squad_analyzer.py -Raw) -replace 'CURRENT_VERSION = "[^"]*"', "CURRENT_VERSION = `"$v`"" |
            Set-Content squad_analyzer.py -Encoding utf8

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm squad_analyzer.spec

      - name: Stage release assets
        shell: pwsh
        env:
          # 노트를 인라인 보간(${{ }})으로 스크립트에 박으면 큰따옴표가 문자열을 끊어 ParserError.
          # (2026-08-26 v83.32 1차 실패 — 노트에 "…" 인용이 들어가자 빌드 성공 후 이 단계에서 죽음)
          NOTES_IN: ${{ github.event.inputs.notes }}
        run: |
          # onedir 빌드(spec 기준): dist/squad_analyzer/ 에 exe + _internal — 자동업데이터가 기대하는 구조 그대로 zip
          if (-not (Test-Path "dist/squad_analyzer/squad_analyzer.exe")) { throw "dist/squad_analyzer/squad_analyzer.exe not found" }
          if (-not (Test-Path "dist/squad_analyzer/_internal")) { throw "_internal folder not found" }
          # 🧯 [2026-08-16] Tcl/Tk 데이터 게이트 — v83.5는 이게 빠진 채 '성공'으로 릴리스돼 전원 실행 불가였다.
          #    PyInstaller는 Tcl 수집 실패를 경고로만 남기므로 여기서 강제로 실패시킨다.
          if (-not (Test-Path "dist/squad_analyzer/_internal/_tcl_data")) { throw "_tcl_data missing - Tcl/Tk not bundled (v83.5 regression)" }
          if (-not (Test-Path "dist/squad_analyzer/_internal/_tk_data")) { throw "_tk_data missing - Tcl/Tk not bundled" }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "dist/squad_analyzer" -DestinationPath "release/squad_analyzer.zip" -Force
          $h = (Get-FileHash "release/squad_analyzer.zip" -Algorithm SHA256).Hash
          # 패치노트(입력) → 릴리스 본문 상단. 분석기가 이 본문을 그대로 디스코드 패치노트로 발송한다.
          # '---' 아래(SHA256 등 기술 푸터)는 분석기가 잘라내므로 노출되지 않음.
          $n = $env:NOTES_IN
          $body = if ([string]::IsNullOrWhiteSpace($n)) { "" } else { $n.Replace('\n', [Environment]::NewLine) }
          $body + [Environment]::NewLine + "---" + [Environment]::NewLine + "SHA256(zip): $h" |
            Out-File -FilePath release/notes.txt -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: v${{ github.event.inputs.version }}
          body_path: desktop/release/notes.txt
          files: |
            desktop/release/squad_analyzer.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version.txt on main
        shell: pwsh
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git pull origin main
          "${{ github.event.inputs.version }}" | Out-File -FilePath version.txt -Encoding ascii -NoNewline
          git add version.txt
          if (git status --porcelain version.txt) {
            git commit -m "ci: bump version.txt to ${{ github.event.inputs.version }}"
            git push origin main
          } else { Write-Host "version.txt unchanged" }

      # 🔔 [2026-07-30 사장님 지시] 릴리스했으면 패치노트도 반드시 나가야 한다.
      #    notes 입력은 GitHub 릴리스 본문에만 들어가 디스코드로는 안 나갔고, 그걸 착각해
      #    수동 발송을 여러 번 빠뜨렸다. 빌드가 성공하면 여기서 자동으로 보낸다.
      - name: Post patch note to Discord
        if: ${{ inputs.notes != '' }}
        working-directory: .
        env:
          APP_SECRETS_B64: ${{ secrets.APP_SECRETS_B64 }}
          IN_VER: ${{ inputs.version }}
          IN_ANALYZER: ${{ inputs.notes }}
        run: python3 tooling/post_patch_note.py
