<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>브장신 배구</title>
<meta name="description" content="브장신 병아리 둘이 네트를 사이에 두고 맞붙는 2D 배구 — 점프·강타로 15점을 먼저! CPU 3단계, 한 기기 2인 대전, 클랜원과 온라인 랭크 대전.">
<meta name="theme-color" content="#4aa8e8">
<style>
:root{--sky1:#59b4f0;--sky2:#c9ecff;--bg:#e9f5ff;--panel:#ffffff;--line:#9cc8ee;--txt:#14284a;--sub:#3a557f;--mut:#6a82a8;--gold:#ffb81f;--gold-d:#b06f00;--red:#e8456a;--blue:#3b7be8;--ink:#1b1405;--hd:#2e86d6;--hdt:#fff}
@media (prefers-color-scheme:dark){:root{--sky1:#16204a;--sky2:#3a4f96;--bg:#0c1126;--panel:#171f44;--line:#33427f;--txt:#eef1ff;--sub:#bcc6ee;--mut:#8592c4;--gold:#ffcc3d;--hd:#1f2a5e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:"Malgun Gothic","Apple SD Gothic Neo",-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:1200px;margin:0 auto}
header{flex:none;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--hd);color:var(--hdt)}
header a,header button{flex:none;width:38px;height:38px;border-radius:12px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.15);color:#fff;font-size:17px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;padding:0}
header h1{margin:0;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#scoreBar{flex:none;display:flex;align-items:center;justify-content:center;gap:14px;padding:8px 10px 2px;font-weight:900}
.sc{display:flex;align-items:center;gap:8px;min-width:0}.sc b{font-size:clamp(28px,6vw,46px);font-variant-numeric:tabular-nums;line-height:1;min-width:1.3em;text-align:center}
.sc small{font-size:12px;color:var(--sub);white-space:nowrap}.sc.me b{color:var(--blue)}.sc.op b{color:var(--red)}
#vs{font-size:14px;color:var(--mut)}
#stageWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 8px}
#box{position:relative;width:min(100%,calc((100dvh - 205px) * 432 / 264));aspect-ratio:432/264;border-radius:18px;overflow:hidden;border:3px solid var(--line);box-shadow:0 8px 28px rgba(20,40,90,.28);background:#7cc8f5}
#cv{display:block;width:100%;height:100%}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:14px;background:rgba(10,24,60,.56);color:#fff;backdrop-filter:blur(2px)}
.ov.show{display:flex}
.ov h2{margin:0;font-size:clamp(22px,5.4vw,40px);text-shadow:0 3px 0 rgba(0,0,0,.35)}
.ov p{margin:0;font-size:clamp(12px,2.2vw,15px);opacity:.92;line-height:1.5}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.btn{border:2px solid #fff;background:linear-gradient(180deg,#6aa8ff,#3b6fe0);color:#fff;border-radius:14px;padding:9px 16px;font-size:clamp(14px,2.6vw,18px);font-weight:900;cursor:pointer;box-shadow:0 4px 0 #1f3fa0;min-width:92px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1f3fa0}
.btn.gold{background:linear-gradient(180deg,#ffd75e,#f09a12);color:var(--ink);box-shadow:0 4px 0 #8a5a00}
.btn.alt{background:linear-gradient(180deg,#8b98c9,#5b6aa3);box-shadow:0 4px 0 #333f70}
.rec{font-size:clamp(11px,2vw,13px);opacity:.85}
#pad{flex:none;display:none;justify-content:space-between;align-items:center;padding:6px 14px calc(12px + env(safe-area-inset-bottom));gap:10px}
#pad.on{display:flex}
.cl{display:flex;gap:10px}.cl button{width:76px;height:76px;border-radius:50%;border:3px solid var(--line);background:var(--panel);color:var(--txt);font-size:26px;font-weight:900;box-shadow:0 5px 0 var(--line);touch-action:none}
.cl button.big{width:84px;height:84px;font-size:15px}.cl button.act{background:linear-gradient(180deg,#ffd75e,#f09a12);border-color:#fff;color:var(--ink);box-shadow:0 5px 0 #8a5a00}.cl button.down{transform:translateY(3px);filter:brightness(.92)}
#hint{flex:none;text-align:center;font-size:12.5px;color:var(--mut);padding:0 12px calc(10px + env(safe-area-inset-bottom))}
@media (pointer:coarse){#hint{display:none}}
/* ---- 온라인 ---- */
#netBar{flex:none;display:none;align-items:center;justify-content:center;gap:10px;padding:0 10px;font-size:12px;color:var(--sub);min-height:22px}
#app.net #netBar{display:flex}#app.net #box{width:min(100%,calc((100dvh - 232px) * 432 / 264))}
#netBar b{color:var(--txt)}#netBar .ok{color:#1f9d55}#netBar .warn{color:#d9791a}#netBar .bad{color:#d6334f}
#nbClaim{width:auto;height:auto;padding:3px 10px;border-radius:99px;background:var(--red);color:#fff;font-size:12px;border:0;cursor:pointer;font-weight:900}
.tb{display:inline-flex;align-items:center;gap:3px;padding:0 8px;border-radius:99px;font-size:12px;font-weight:900;color:#fff;background:var(--tc,#7c8aa8);white-space:nowrap;line-height:1.55;vertical-align:middle}
.tb.big{font-size:17px;padding:2px 14px}
.sc small{display:inline-flex;align-items:center;gap:4px;max-width:34vw;min-width:0}.sc small .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#onl{display:none;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px 14px calc(18px + env(safe-area-inset-bottom));-webkit-user-select:text;user-select:text;width:100%;max-width:760px;margin:0 auto}
#app.onl #onl{display:block}#app.onl #scoreBar,#app.onl #stageWrap,#app.onl #pad,#app.onl #hint,#app.onl #netBar{display:none}
.oc{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.oc h3{margin:0 0 8px;font-size:15px}.oc p{margin:4px 0;font-size:13px;color:var(--sub);line-height:1.55}
.me-card{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.me-card .rt{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.me-card .nm{font-weight:900;font-size:16px}.stats{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-top:6px}.stats b{color:var(--txt)}
.bar{height:8px;border-radius:99px;background:rgba(120,140,190,.25);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--gold)}
.orow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.obtn{border:2px solid var(--line);background:linear-gradient(180deg,#6aa8ff,#3b6fe0);color:#fff;border-radius:14px;padding:10px 16px;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 3px 0 #1f3fa0;font-family:inherit}
.obtn:active{transform:translateY(2px);box-shadow:0 1px 0 #1f3fa0}.obtn.gold{background:linear-gradient(180deg,#ffd75e,#f09a12);color:var(--ink);box-shadow:0 3px 0 #8a5a00}.obtn.alt{background:linear-gradient(180deg,#8b98c9,#5b6aa3);box-shadow:0 3px 0 #333f70}.obtn[disabled]{opacity:.5;cursor:default}
.oin{border:2px solid var(--line);background:var(--bg);color:var(--txt);border-radius:12px;padding:9px 12px;font-size:16px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;width:7.5em;text-align:center;font-family:inherit}
.otabs{display:flex;gap:6px;margin:0 0 10px}.otabs button{flex:1;border:2px solid var(--line);background:var(--panel);color:var(--sub);border-radius:12px;padding:8px 4px;font-weight:900;font-size:14px;cursor:pointer;font-family:inherit}.otabs button.on{background:var(--hd);color:#fff;border-color:var(--hd)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{font-size:11px;color:var(--mut);text-align:left;padding:4px 6px;font-weight:700}.tbl td{padding:6px;border-top:1px solid var(--line);vertical-align:middle}.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.me td{background:rgba(255,184,31,.18)}.tbl td.nmc{max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win{color:#1f9d55;font-weight:900}.lose{color:#d6334f;font-weight:900}.dim{color:var(--mut)}
.note{background:rgba(255,184,31,.18);border:2px solid var(--gold);border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:10px}
.search{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--blue);animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.codeBig{font-size:clamp(34px,10vw,56px);font-weight:900;letter-spacing:.25em;text-shadow:0 3px 0 rgba(0,0,0,.4);padding-left:.25em}
#ovOn{gap:6px;padding:8px}#ovOn h2{font-size:clamp(20px,5vw,32px)}#onBody{display:flex;flex-direction:column;align-items:center;gap:5px;max-width:100%}
.rrow{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap}.rbig{font-size:clamp(22px,6vw,34px);font-weight:900;font-variant-numeric:tabular-nums}
.dl{font-weight:900;font-size:clamp(16px,4vw,22px);padding:1px 10px;border-radius:99px}.dl.up{background:#1f9d55}.dl.dn{background:#d6334f}.dl.zz{background:#6a82a8}
.promo{font-size:clamp(14px,3.6vw,20px);font-weight:900;animation:pr 1.1s ease-out both}@keyframes pr{0%{transform:scale(.3);opacity:0}55%{transform:scale(1.25);opacity:1}100%{transform:scale(1)}}
.promo.up{color:#ffe27a}.promo.dn{color:#ffb0c0}
</style>
</head>
<body>
<div id="app">
  <header>
    <a href="index.html#games" title="미니게임 목록" aria-label="미니게임 목록으로">‹</a>
    <h1>🏐 브장신 배구</h1>
    <button id="sndBtn" title="소리 켜고 끄기" aria-label="소리 켜고 끄기">🔊</button>
    <button id="menuBtn" title="메뉴" aria-label="메뉴로 나가기">☰</button>
  </header>
  <div id="scoreBar" aria-live="polite"><div class="sc me"><small id="n0">나</small><b id="s0">0</b></div><span id="vs">VS</span><div class="sc op"><b id="s1">0</b><small id="n1">CPU</small></div></div>
  <div id="netBar" aria-live="polite"><span id="nbState">연결 중…</span><span id="nbPing"></span><button id="nbClaim" hidden>기권승 요청</button></div>
  <div id="onl" aria-label="온라인 대전"></div>
  <div id="stageWrap"><div id="box">
    <canvas id="cv" width="864" height="528" role="img" aria-label="병아리 둘이 네트를 사이에 두고 배구를 하는 화면"></canvas>
    <div class="ov show" id="ovMenu">
      <h2>🏐 브장신 배구</h2>
      <p>병아리를 움직여 공을 상대 땅에 떨어뜨리면 1점!<br><b>15점</b>을 먼저 내면 이겨요.</p>
      <div class="btns"><button class="btn" data-start="cpu" data-level="easy">쉬움</button><button class="btn" data-start="cpu" data-level="normal">보통</button><button class="btn gold" data-start="cpu" data-level="hard">어려움</button></div>
      <div class="btns"><button class="btn alt" data-start="2p">👥 2인 대전 (한 기기)</button><button class="btn gold" id="goOnline">🌐 온라인 대전</button></div>
      <p class="rec" id="rec"></p>
      <p class="rec">이동 ←→ / A D · 점프 ↑ / W · 때리기 Space(공중에서 누르면 <b>강타</b>, ↓ 같이 누르면 내려찍기) · 2P는 방향키 + Enter</p>
    </div>
    <div class="ov" id="ovOver"><h2 id="overT">승리!</h2><p id="overP"></p><div class="btns"><button class="btn gold" id="again">한 판 더</button><button class="btn alt" id="toMenu">메뉴</button></div></div>
    <div class="ov" id="ovWait"><h2 id="waitT">상대를 기다려요</h2><p id="waitP"></p><div class="codeBig" id="waitCode" hidden></div><div class="btns"><button class="btn alt" id="waitBack" hidden>돌아가기</button><button class="btn alt" id="waitCancel">나가기</button></div></div>
    <div class="ov" id="ovOn"><div id="onBody"></div><div class="btns" id="onBtns"></div></div>
    <div class="ov" id="ovPause" style="background:rgba(10,24,60,.4)"><h2>⏸ 잠깐 멈춤</h2><div class="btns"><button class="btn gold" id="resume">계속하기</button><button class="btn alt" id="toMenu2">메뉴</button></div></div>
  </div></div>
  <div id="pad" aria-label="터치 조작">
    <div class="cl"><button id="bl" aria-label="왼쪽으로 이동">◀</button><button id="br" aria-label="오른쪽으로 이동">▶</button></div>
    <div class="cl"><button id="bh" class="act big" aria-label="때리기. 공중에서 누르면 강타">때리기</button><button id="bj" class="big" aria-label="점프">점프</button></div>
  </div>
  <div id="hint">키보드: ←→ 이동 · ↑ 점프 · Space 때리기(공중=강타) · ↓ 같이 누르면 내려찍기 · P 일시정지</div>
</div>
<script src="brjvolley.js?v=3"></script>
<script src="brjvolley_net.js?v=1"></script>
<script>
(function(){
'use strict';
const BV=window.BrjVolley, W=BV.W, H=BV.H, GROUND=BV.GROUND, NET_X=BV.NET_X, NET_TOP=BV.NET_TOP;
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');
const ls={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
// ---------- 상태 ----------
let G=null, MODE='menu', LEVEL='normal', P2=false, paused=false, parts=[], texts=[], shake=0, flash=0, clouds=[], banner=null, acc=0, last=0, tNow=0, ballAng=0, trail=[];
const keys={}, pend={}, tpend={}, touch={l:false,r:false,u:false,hit:false}, hitEdge=[false,false];
const REC=(()=>{try{return JSON.parse(ls.get('brjvolley_rec')||'{}')||{};}catch(e){return {};}})();
function saveRec(){ ls.set('brjvolley_rec',JSON.stringify(REC)); }
function recText(){ const L={easy:'쉬움',normal:'보통',hard:'어려움'}; const p=['easy','normal','hard'].filter(k=>REC[k]&&(REC[k].w||REC[k].l)).map(k=>`${L[k]} ${REC[k].w||0}승 ${REC[k].l||0}패`); return p.length?'내 기록: '+p.join(' · ')+(REC.best?` · 최고 연승 ${REC.best}`:''):'아직 기록이 없어요. 첫 판을 시작해 보세요!'; }
// ---------- 그림 ----------
const IM={}; function ld(n){ if(IM[n]) return IM[n]; const i=new Image(); i.src='img/brjhunt/'+n+'.webp'; IM[n]=i; return i; }
['chick_idle','chick_atk1','chick_atk2','chick_hit','chick_skill'].forEach(ld);
const TINT={}; function tinted(n){   // 상대 병아리는 색을 돌려 구분한다(필터를 못 쓰는 브라우저는 그대로 + 머리띠)
  if(TINT[n]) return TINT[n]; const im=ld(n); if(!im.complete||!im.naturalWidth) return im;
  try{ const c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight; const x=c.getContext('2d'); if(!('filter' in x)) return (TINT[n]=im); x.filter='hue-rotate(165deg) saturate(1.25)'; x.drawImage(im,0,0); return (TINT[n]=c); }catch(e){ return (TINT[n]=im); }
}
// ---------- 소리(직접 합성) ----------
let AC=null, MUTED=ls.get('brjvolley_mute')==='1';
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function tone(f0,f1,d,type,vol){ if(MUTED) return; const a=ac(); if(!a) return; const t=a.currentTime, o=a.createOscillator(), g=a.createGain(); o.type=type||'square'; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+d); g.gain.setValueAtTime(vol||.12,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d+.02); }
const SND={hit:()=>tone(420,300,.09,'triangle',.16),dig:()=>tone(300,200,.12,'triangle',.18),spike:()=>{tone(900,120,.2,'sawtooth',.14);tone(160,60,.18,'square',.12);},wall:()=>tone(240,200,.05,'sine',.08),net:()=>tone(180,120,.08,'sine',.1),bounce:()=>tone(140,70,.12,'sine',.18),point:()=>{tone(523,523,.1,'square',.1);setTimeout(()=>tone(659,659,.1,'square',.1),100);setTimeout(()=>tone(784,784,.18,'square',.1),200);},lose:()=>{tone(392,392,.12,'square',.1);setTimeout(()=>tone(294,294,.2,'square',.1),130);},win:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,f,.16,'square',.11),i*120));},serve:()=>tone(660,880,.08,'sine',.1)};
const snd=n=>{ try{ SND[n]&&SND[n](); }catch(e){} };
// ---------- 입력 ----------
const K1={l:['ArrowLeft','KeyA'],r:['ArrowRight','KeyD'],u:['ArrowUp','KeyW'],d:['ArrowDown','KeyS'],hit:['Space','KeyZ','KeyF']};
const K2={l:['ArrowLeft'],r:['ArrowRight'],u:['ArrowUp'],d:['ArrowDown'],hit:['Enter','NumpadEnter','Slash']};
const K1B={l:['KeyA'],r:['KeyD'],u:['KeyW'],d:['KeyS'],hit:['Space','KeyF']};   // 2인용일 때 1P 는 글자 키만
const down=(list)=>list.some(c=>keys[c]||pend[c]);   // 한 프레임보다 짧게 톡 눌러도 한 번은 먹는다(pend)
function in1(){ const K=P2?K1B:K1; return {l:down(K.l)||touch.l||tpend.l,r:down(K.r)||touch.r||tpend.r,u:down(K.u)||touch.u||tpend.u,d:down(K.d),hit:down(K.hit)||touch.hit||tpend.hit}; }
function in2(){ return {l:down(K2.l),r:down(K2.r),u:down(K2.u),d:down(K2.d),hit:down(K2.hit)}; }
window.addEventListener('keydown',e=>{
  if((MODE==='play'||MODE==='net')&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  if(e.target&&e.target.id==='codeIn') return;
  keys[e.code]=true; pend[e.code]=true;
  if(e.code==='KeyP'||e.code==='Escape'){ if(MODE==='play') setPause(!paused); }
  if(MODE==='menu'&&(e.code==='Enter')) { /* 메뉴에서는 버튼으로 */ }
  ac();
});
window.addEventListener('keyup',e=>{ keys[e.code]=false; });
window.addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; touch.l=touch.r=touch.u=touch.hit=false; if(MODE==='play'&&!paused) setPause(true); });
function bindPad(id,key){ const b=$(id); const on=e=>{ e.preventDefault(); touch[key]=true; tpend[key]=true; b.classList.add('down'); ac(); }, off=e=>{ e.preventDefault(); touch[key]=false; b.classList.remove('down'); };
  b.addEventListener('pointerdown',on); ['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,off)); b.addEventListener('contextmenu',e=>e.preventDefault()); }
bindPad('bl','l'); bindPad('br','r'); bindPad('bj','u'); bindPad('bh','hit');
if(window.matchMedia&&matchMedia('(pointer:coarse)').matches) $('pad').classList.add('on');
// ---------- 흐름 ----------
function show(id,on){ $(id).classList.toggle('show',!!on); }
function start(mode,level){
  $('app').classList.remove('net','onl'); P2=mode==='2p'; LEVEL=level||'normal'; MYSIDE=0; G=BV.create({seed:(Date.now()&0xffff)||7,level:P2?null:LEVEL,target:15}); G.reset();
  MODE='play'; paused=false; parts=[]; texts=[]; trail=[]; banner=null; shake=0; flash=0;
  $('n0').textContent=P2?'1P':'나'; $('n1').textContent=P2?'2P':'CPU·'+({easy:'쉬움',normal:'보통',hard:'어려움'}[LEVEL]);

              me:{leave:'나가서 기권패로 처리됐어요.',silent:'내 화면이 오래 멈춰 있어서(연결이 끊겼거나 다른 탭·창으로 넘어간 경우) 기권 처리됐어요. 대전 중에는 이 탭을 계속 열어 두세요.',claim:'내 화면이 오래 응답이 없어서 상대가 기권승을 요청했어요.',_:'기권 처리됐어요.'}};
  const sub=info.forfeit?(SUBS[info.forfeit]||{})[why]||(SUBS[info.forfeit]||{})._||'':'';
  let h=`<h2>${title}</h2>`; if(sub) h+=`<p>${sub}</p>`;
  if(info.forfeit&&r&&nz(r.ps)+nz(r.os)>0&&!over) h+=`<p class="rec">그때까지 점수 ${nz(r.ps)} : ${nz(r.os)}</p>`;
  if(over) h+=`<div class="rbig">${s.score[side]} : ${s.score[1-side]}</div>`;
  if(!ranked) h+=`<p>🤝 친선 대전이라 레이팅과 전적은 그대로예요.</p>`;
  else if(r&&r.rating!=null){
    // 서버가 주는 값(rating_before · tier_before · promoted · placing …)을 우선 쓰고, 없으면 대전 전에 알던 값과 비교한다
    const lastTok=String(r.tier_before||'').trim().split(/\s+/).pop(), b=r.rating_before!=null?{rating:r.rating_before,tier_name:r.tier_before,tier_step:lastTok,placing:/배치/.test(String(r.tier_before||''))}:(PRE||{});
    const bT=TI(b), aT=TI(Object.assign({},r)), d=r.delta!=null?nz(r.delta):nz(r.rating)-nz(b.rating);
    const plcBefore=bT.idx<0, plcAfter=aT.idx<0, aPlaced=nz(r.placed);
    const prom=typeof r.promoted==='number'?r.promoted:(!plcBefore&&!plcAfter?Math.sign(aT.key-bT.key):0);
    h+=`<div class="rrow"><span class="rbig" id="rbigR">${fmt(b.rating!=null?b.rating:r.rating)}</span><span class="dl ${d>0?'up':d<0?'dn':'zz'}">${sgn(d)}</span></div>`;
    h+=`<div class="rrow">${badge(b)}<span>→</span>${plcAfter?`<span class="tb" style="--tc:#7c8aa8">🎯 배치 중 (${aPlaced}/5)</span>`:badge(r)}</div>`;

    else if(prom>0) h+=`<div class="promo up">⬆ 승급! ${esc(aT.e)} ${esc(aT.n)}${aT.step_s?' '+aT.step_s:''}</div>`;
    else if(prom<0) h+=`<div class="promo dn">⬇ 강등… ${esc(aT.e)} ${esc(aT.n)}${aT.step_s?' '+aT.step_s:''}</div>`;
    else if(plcAfter) h+=`<p>랭크 대전 ${aPlaced}/5판 — 5판을 채우면 티어가 정해져요.</p>`;
    RESANIM={from:nz(b.rating!=null?b.rating:r.rating),to:nz(r.rating)};
  }else if(ranked) h+=`<p>${info.forfeit?'':'결과가 서버에 반영되는 중이에요. '}전적 탭에서 확인해 주세요.</p>`;
  done(h,ranked);
  if(RESANIM){ const {from,to}=RESANIM; RESANIM=null; const t0=performance.now(); clearInterval(RESIV); const iv=RESIV=setInterval(()=>{ const e=document.getElementById('rbigR'); const k=Math.min(1,(performance.now()-t0)/900); if(!e||k>=1){ if(e) e.textContent=fmt(to); clearInterval(iv); return; } e.textContent=fmt(Math.round(from+(to-from)*(1-Math.pow(1-k,3)))); },30); }
  if(ranked){ const j=await vcall('/vb/status'); if(j&&j.ok){ ON.me=j.me||ON.me; ON.online=j.online; ON.waiting=j.waiting; } }
}
